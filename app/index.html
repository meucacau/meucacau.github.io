      var removed = idx !== -1 ? STATE.accounts.splice(idx, 1)[0] : null;
      var dashSnap = removeAccountFromDashboard_(STATE.dashboard, rawId);
      pendingAccountArchives_[rawId] = true;
      var archivedRealId = null;
      render();
      afterMutation_(resolveRealId_(rawId).then(function (realId) {
        archivedRealId = realId;
        pendingAccountArchives_[realId] = true;
        return run('archiveAccount', realId);
      })).catch(function (err) {
        delete pendingAccountArchives_[rawId];
        if (archivedRealId) delete pendingAccountArchives_[archivedRealId];
        if (removed) STATE.accounts.splice(idx, 0, removed);
        restoreAccountToDashboard_(STATE.dashboard, dashSnap);
        render();
        showToast(err.message, true);
      });
    });
    document.getElementById('add-account').onclick = function () { openAccountModal(); };
  }


  function openAccountModal(existing) {
    var isEdit = !!existing;
    // Editar o saldo SEMPRE significa "saldo atual", e a diferença sempre vira um
    // lançamento de ajuste (ver payload.currentBalance abaixo) — mesmo numa conta sem
    // nenhum lançamento ainda. Antes, nesse caso, o app mexia direto em InitialBalance:
    // o saldo mudava sem nada no extrato explicando quando nem por quê. Agora toda
    // alteração de saldo de conta é rastreável por um lançamento com data e hora (o
    // saldo inicial de uma conta nova também — ver appendBalanceTransaction_/Accounts.js).
    var editingCurrentBalance = isEdit;
    // Conta nova já nasce com uma cor da paleta (sorteada aqui, antes de qualquer round-
    // trip — listAccounts() faz o mesmo sorteio no servidor pra conta legada que ainda
    // não tinha índice salvo, então uma conta existente sempre chega aqui com
    // existing.colorIndex já preenchido).
    var colorIndex = isEdit ? existing.colorIndex : Math.floor(Math.random() * ACCOUNT_COLOR_PALETTE_.length);
    openModal(
      '<h2>' + (isEdit ? 'Editar conta' : 'Nova conta') + '</h2>' +
      '<div class="field"><label>Nome</label><div style="display:flex;gap:8px;align-items:center">' +
        '<input id="m-name" style="flex:1;margin-bottom:0" value="' + (isEdit ? escapeHtml(existing.name) : '') + '">' +
        '<button type="button" id="m-color-btn" style="flex:0 0 auto;width:26px;height:26px;border-radius:50%;padding:0;border:1px solid var(--border)"></button>' +
      '</div></div>' +
      '<div class="field"><label>Tipo</label><div id="m-type-field" class="capsule-field"></div>' +
        (isEdit && existing.hasTransactions ? '<div class="muted">Essa conta já tem lançamentos, por isso o tipo não pode mais ser alterado.</div>' : '') +
      '</div>' +
      '<div class="field"><label>' + (editingCurrentBalance ? 'Saldo atual' : 'Saldo inicial') + '</label><input id="m-balance" type="text"></div>' +
      (editingCurrentBalance ? '<div class="muted" style="font-size:12px;margin-top:-8px;margin-bottom:12px">Mudar esse valor cria um lançamento de ajuste na data de hoje, cobrindo a diferença.</div>' : '') +
      '<div id="m-cc-fields" style="display:none">' +
        '<div class="field"><label>Dia de fechamento</label><input id="m-closing" type="number" min="1" max="31" value="' + (isEdit && existing.closingDay ? existing.closingDay : '') + '"></div>' +
        '<div class="field"><label>Dia de vencimento</label><input id="m-due" type="number" min="1" max="31" value="' + (isEdit && existing.dueDay ? existing.dueDay : '') + '"></div>' +
      '</div>' +
      '<div id="m-inv-fields" style="display:none">' +
        '<div class="field"><label>Data</label><input id="m-inv-date" type="date" value="' + (isEdit && existing.investmentDate ? existing.investmentDate : '') + '"></div>' +
        '<div class="field"><label>Descrição</label><input id="m-inv-desc" value="' + (isEdit && existing.description ? escapeHtml(existing.description) : '') + '"></div>' +
        '<div class="field"><label>Vencimento</label><input id="m-inv-maturity" type="date" value="' + (isEdit && existing.maturityDate ? existing.maturityDate : '') + '"></div>' +
      '</div>' +
      '<button id="m-submit">Salvar</button>'
    );

    setupMoneyInput(document.getElementById('m-balance'), isEdit ? existing.balance : 0);

    var colorBtn = document.getElementById('m-color-btn');
    function updateColorBtn_() {
      var c = ACCOUNT_COLOR_PALETTE_[colorIndex];
      colorBtn.classList.toggle('acc-color-swatch', !!c);
      if (c) {
        colorBtn.style.setProperty('--acc-color-light', c.light);
        colorBtn.style.setProperty('--acc-color-dark', c.dark);
        colorBtn.style.background = '';
        colorBtn.style.border = '1px solid var(--border)';
        colorBtn.style.color = '';
        colorBtn.textContent = '';
      } else {
        colorBtn.style.background = 'transparent';
        colorBtn.style.border = '1px dashed var(--text-muted)';
        colorBtn.style.color = 'var(--text-muted)';
        colorBtn.style.fontSize = '14px';
        colorBtn.style.lineHeight = '1';
        colorBtn.textContent = '×';
      }
    }
    updateColorBtn_();
    colorBtn.onclick = function () {
      var currentName = document.getElementById('m-name').value.trim();
      openColorPickerPopover_(colorBtn, colorIndex, currentName, function (newIndex) {
        colorIndex = newIndex;
        updateColorBtn_();
      });
    };

    function syncTypeFields() {
      var type = typeField.getValue();
      document.getElementById('m-cc-fields').style.display = type === 'credit_card' ? 'block' : 'none';
      document.getElementById('m-inv-fields').style.display = type === 'investment' ? 'block' : 'none';
    }
    var typeField = createCapsuleField(document.getElementById('m-type-field'), {
      items: Object.keys(ACCOUNT_TYPE_LABELS).map(function (t) { return { value: t, label: ACCOUNT_TYPE_LABELS[t] }; }),
      selectedValue: isEdit ? existing.type : 'checking',
      disabled: isEdit && existing.hasTransactions,
      onChange: syncTypeFields
    });
    syncTypeFields();

    document.getElementById('m-submit').onclick = function () {
      var type = typeField.getValue();
      var name = document.getElementById('m-name').value.trim();
      if (!name) { errorPopover(document.getElementById('m-submit'), 'Nome da conta é obrigatório.'); return; }
      var duplicate = STATE.accounts.some(function (a) { return (!isEdit || a.id !== existing.id) && namesMatch(a.name, name); });
      if (duplicate) { errorPopover(document.getElementById('m-submit'), 'Já existe uma conta com esse nome.'); return; }
      var balanceValue = document.getElementById('m-balance').getValue();
      if (isEdit && type !== 'credit_card' && balanceValue < 0) {
        errorPopover(document.getElementById('m-submit'), 'Saldo não pode ser negativo nesse tipo de conta.');
        return;
      }
      var payload = {
        name: name,
        type: type,
        colorIndex: colorIndex,
        closingDay: type === 'credit_card' ? (document.getElementById('m-closing').value || null) : null,
        dueDay: type === 'credit_card' ? (document.getElementById('m-due').value || null) : null,
        description: type === 'investment' ? document.getElementById('m-inv-desc').value : '',
        investmentDate: type === 'investment' ? (document.getElementById('m-inv-date').value || null) : null,
        maturityDate: type === 'investment' ? (document.getElementById('m-inv-maturity').value || null) : null
      };
      if (editingCurrentBalance) payload.currentBalance = balanceValue;
      else payload.initialBalance = balanceValue;
      closeModal();

      if (isEdit) {
        var acc = STATE.accounts.find(function (a) { return a.id === existing.id; });
        var prevSnapshot = acc ? Object.assign({}, acc) : null;
        var prevBalance = acc ? acc.balance : existing.balance;
        if (acc) {
          acc.name = payload.name;
          acc.type = payload.type;
          acc.colorIndex = payload.colorIndex;
          // Saldo inicial não muda numa edição — a diferença vira lançamento de
          // consolidação no servidor, que aparece no Extrato no próximo refresh.
          acc.balance = Number(payload.currentBalance) || 0;
          acc.closingDay = payload.closingDay ? Number(payload.closingDay) : null;
          acc.dueDay = payload.dueDay ? Number(payload.dueDay) : null;
          acc.description = payload.description;
          acc.investmentDate = payload.investmentDate;
          acc.maturityDate = payload.maturityDate;
        }
        // Prévia do lançamento de consolidação no Extrato — mesma ideia do saldo inicial
        // de conta nova (applyBalanceTxPreview_) — sem isso, só aparecia depois do
        // refresh coalescido.
        var diffCents = Math.round((Number(payload.currentBalance) || 0) * 100) - Math.round(prevBalance * 100);
        var consolidationTempId = diffCents !== 0
          ? applyBalanceTxPreview_(existing.id, diffCents > 0 ? 'income' : 'expense', Math.abs(diffCents) / 100, ACCOUNT_CONSOLIDATION_DESCRIPTION_)
          : null;
        render();
        // resolveRealId_: existing.id pode ainda ser temporário numa corrida bem estreita
        // (editar uma conta na fração de segundo entre criá-la e o servidor confirmar).
        afterMutation_(resolveRealId_(existing.id).then(function (realId) {
          return run('updateAccount', Object.assign({ id: realId }, payload));
        }).then(function (result) {
          resolveBalanceTxPreview_(consolidationTempId, result.transaction);
          // Protege contra o refresh coalescido revertendo essa edição por trás se a
          // leitura dele ainda não alcançou (ver reapplyPendingEdits_) — não inclui
          // saldo/saldo inicial de propósito (dependem de soma de lançamentos, mais
          // arriscado garantir bater exatamente).
          pendingAccountEdits_[existing.id] = {
            name: payload.name, type: payload.type, colorIndex: payload.colorIndex,
            closingDay: payload.closingDay ? Number(payload.closingDay) : null,
            dueDay: payload.dueDay ? Number(payload.dueDay) : null,
            description: payload.description, investmentDate: payload.investmentDate, maturityDate: payload.maturityDate
          };
          return result.account;
        })).catch(function (err) {
          resolveBalanceTxPreview_(consolidationTempId, null);
          if (acc && prevSnapshot) Object.assign(acc, prevSnapshot);
          render();
          showToast(err.message, true);
        });
      } else {
        var tempId = 'tmp-' + Math.random().toString(36).slice(2);
        STATE.accounts.push({
          id: tempId, name: payload.name, type: payload.type, colorIndex: payload.colorIndex,
          // InitialBalance fica 0 no servidor: o saldo inicial entra como lançamento
          // "Início da conta - Saldo inicial" (ver Accounts.js), que é o que forma o saldo.
          initialBalance: 0,
          balance: Number(payload.initialBalance) || 0,
          closingDay: payload.closingDay ? Number(payload.closingDay) : null,
          dueDay: payload.dueDay ? Number(payload.dueDay) : null,
          description: payload.description, investmentDate: payload.investmentDate, maturityDate: payload.maturityDate,
          // Já nasce com lançamento (o de saldo inicial) sempre que o saldo não é zero.
          archived: false, hasTransactions: (Number(payload.initialBalance) || 0) !== 0
        });
        // Prévia do lançamento "Início da conta" no Extrato — sem isso, só aparecia
        // depois do refresh coalescido, alguns segundos depois de criar a conta (o
        // resto da conta já aparecia na hora; só esse lançamento atrasava).
        var openingAmount = Number(payload.initialBalance) || 0;
        var openingTempId = openingAmount !== 0
          ? applyBalanceTxPreview_(tempId, openingAmount > 0 ? 'income' : 'expense', Math.abs(openingAmount), ACCOUNT_OPENING_DESCRIPTION_)
          : null;
        render();
        var accCreation_ = run('createAccount', payload).then(function (created) {
          // Troca o ID temporário pelo real assim que o servidor confirma ESSA conta —
          // sem esperar o refresh coalescido (que só dispara quando a última criação em
          // voo termina), senão criar várias contas rápido deixa as anteriores com IDs
          // temporários por mais tempo, arriscando esbarrar em algo que precise do ID real.
          var realAccountId = adoptRealId_(STATE.accounts, tempId, created.account.ID);
          resolveBalanceTxPreview_(openingTempId, created.transaction);
          return realAccountId;
        });
        pendingCreations_[tempId] = accCreation_;
        afterMutation_(accCreation_).catch(function (err) {
          var idx = STATE.accounts.findIndex(function (a) { return a.id === tempId; });
          if (idx !== -1) STATE.accounts.splice(idx, 1);
          render();
          showToast(err.message, true);
        }).finally(function () { delete pendingCreations_[tempId]; });
      }
    };
  }

  // ---------- categories ----------
  function byNamePt_(a, b) { return a.name.localeCompare(b.name, 'pt-BR'); }

  function categoryBlockHtml(c) {
    var children = STATE.categories.filter(function (x) { return x.parentId === c.id; }).sort(byNamePt_);
    return '<div class="row" data-row-cat="' + escapeHtml(c.id) + '"><span>' + categoryIconHtml_(c) + escapeHtml(c.name) + '</span>' +
      '<span class="row-actions">' + rowRemoveButtonHtml_('data-archive', c.id, 'Arquivar') + '</span></div>' +
      children.map(function (ch) {
        return '<div class="row" style="padding-left:16px" data-row-cat="' + escapeHtml(ch.id) + '"><span class="muted">↳ ' + categoryIconHtml_(ch) + escapeHtml(ch.name) + '</span>' +
          '<span class="row-actions">' + rowRemoveButtonHtml_('data-archive', ch.id, 'Arquivar') + '</span></div>';
      }).join('');
  }

  function renderCategories() {
    var root = document.getElementById('view-root');
    var groups = [
      { kind: 'expense', label: 'Despesas' },
      { kind: 'income', label: 'Receitas' }
    ].map(function (g) {
      return { label: g.label, topCats: STATE.categories.filter(function (c) { return !c.parentId && c.kind === g.kind; }).sort(byNamePt_) };
    }).filter(function (g) { return g.topCats.length > 0; });

    var html = groups.map(function (g) {
      return '<div class="card"><h2>' + g.label + '</h2>' + g.topCats.map(categoryBlockHtml).join('') + '</div>';
    }).join('') || '<div class="card"><div class="empty-state">Nenhuma categoria cadastrada.</div></div>';

    root.innerHTML = html +
      '<div style="text-align:left;margin-bottom:16px"><button id="add-category">Nova categoria</button></div>';
    wireRowRemoveButtons_(root, '[data-archive]', 'Arquivar esta categoria?', function (btn) {
      var rawId = btn.dataset.archive;
      // Arquivar uma categoria de topo arquiva as subcategorias junto no servidor (ver
      // archiveCategory/Categories.js) — a lista local tira as duas coisas de uma vez pra
      // a tela não ficar mostrando filhas soltas até o refresh.
      var removed = STATE.categories.filter(function (c) { return c.id === rawId || c.parentId === rawId; });
      STATE.categories = STATE.categories.filter(function (c) { return removed.indexOf(c) === -1; });
      render();
      afterMutation_(resolveRealId_(rawId).then(function (realId) {
        return run('archiveCategory', realId);
      })).catch(function (err) {
        STATE.categories = STATE.categories.concat(removed);
        render();
        showToast(err.message, true);
      });
    });
    root.querySelectorAll('[data-row-cat]').forEach(function (rowEl) {
      wireRowTooltip_(rowEl, 'categoria', function () {
        var cat = STATE.categories.find(function (c) { return c.id === rowEl.dataset.rowCat; });
        if (cat) openCategoryModal(cat);
      });
    });
    document.getElementById('add-category').onclick = function () { openCategoryModal(); };
  }

  function openCategoryModal(existing) {
    var isEdit = !!existing;
    var kind = isEdit ? existing.kind : 'expense';
    var parent = isEdit && existing.parentId ? STATE.categories.find(function (c) { return c.id === existing.parentId; }) : null;
    // Tipo/categoria pai só podem ser escolhidos na criação — mudar depois abriria
    // questões chatas (lançamentos já feitos com o kind antigo, subcategorias órfãs).
    var contextLine = isEdit
      ? '<div class="muted" style="margin-bottom:12px">' + (kind === 'income' ? 'Receita' : 'Despesa') +
        (parent ? ' · subcategoria de ' + categoryIconHtml_(parent) + escapeHtml(parent.name) : '') + '</div>'
      : '';
    openModal(
      '<h2>' + (isEdit ? 'Editar categoria' : 'Nova categoria') + '</h2>' +
      contextLine +
      '<div class="field"><label>Nome</label>' +
        '<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">' +
          '<button type="button" id="m-icon-preview" class="secondary" title="Escolher ícone" style="flex:0 0 auto;width:38px;height:38px;padding:0;display:flex;align-items:center;justify-content:center;margin:0"></button>' +
          '<input id="m-name" style="flex:1;margin:0" value="' + (isEdit ? escapeHtml(existing.name) : '') + '">' +
        '</div>' +
      '</div>' +
      (isEdit ? '' :
        '<div class="field"><label>Tipo</label><div class="kind-toggle" id="m-kind-toggle">' +
          '<button type="button" data-k="expense" class="active">Despesa</button>' +
          '<button type="button" data-k="income">Receita</button>' +
        '</div></div>' +
        '<div class="field"><label>Categoria pai (opcional)</label><div id="m-parent-field" class="capsule-field"></div></div>') +
      '<div class="field"><label>Palavras-chave (opcional)</label><input id="m-keywords" value="' + (isEdit ? escapeHtml(existing.keywords || '') : '') + '" placeholder="ex: airbnb, booking.com">' +
        '<div class="muted" style="font-size:12px;margin-top:-8px;margin-bottom:12px">Separadas por vírgula. Se o texto de um lançamento (ou de um "para confirmar") contiver uma delas, essa categoria já vem selecionada.</div>' +
      '</div>' +
      '<div class="field"><label>Descrição (opcional)</label>' +
        '<textarea id="m-description" rows="2" placeholder="Quais tipos de lançamento devem ser feitos nessa categoria?">' +
          (isEdit ? escapeHtml(existing.description || '') : '') +
        '</textarea>' +
        '<div class="muted" style="font-size:12px;margin-top:-8px;margin-bottom:12px">Aparece como dica ao passar o mouse na categoria.</div>' +
      '</div>' +
      '<button id="m-submit">Salvar</button>'
    );
    // '' = sem override manual -- segue casando pelo nome (e pelo pai, se for
    // subcategoria) toda vez que ele mudar. Só vira um valor de verdade quando o
    // usuário escolhe explicitamente no seletor (ver openCategoryIconPicker_).
    var chosenIconKey = isEdit ? (existing.icon || '') : '';
    function currentPreviewKey_() {
      if (chosenIconKey) return chosenIconKey;
      var nameNow = document.getElementById('m-name').value;
      return resolveCategoryIconKey_({ name: nameNow, parentId: parent ? parent.id : null, icon: '' });
    }
    function updateIconPreview_() {
      document.getElementById('m-icon-preview').innerHTML = categoryIconSvgBare_(currentPreviewKey_());
    }
    updateIconPreview_();
    document.getElementById('m-name').addEventListener('input', function () {
      if (!chosenIconKey) updateIconPreview_(); // já escolhido à mão -- digitar o nome não deve mais mudar sozinho
    });
    document.getElementById('m-icon-preview').onclick = function () {
      openCategoryIconPicker_(document.getElementById('m-icon-preview'), currentPreviewKey_(), function (pickedKey) {
        chosenIconKey = pickedKey || '';
        updateIconPreview_();
      });
    };

    var parentField;
    function refreshParentOptions() {
      parentField = createCapsuleField(document.getElementById('m-parent-field'), {
        pinned: { value: '', label: 'Nenhuma (categoria de topo)' },
        items: rankedParentCategoryItems(kind),
        selectedValue: ''
      });
    }
    if (!isEdit) {
      document.querySelectorAll('#m-kind-toggle button').forEach(function (b) {
        b.onclick = function () {
          kind = b.dataset.k;
          document.querySelectorAll('#m-kind-toggle button').forEach(function (x) { x.classList.toggle('active', x === b); });
          refreshParentOptions();
        };
      });
      refreshParentOptions();
    }
    document.getElementById('m-submit').onclick = function () {
      var name = document.getElementById('m-name').value.trim();
      if (!name) { errorPopover(document.getElementById('m-submit'), 'Nome da categoria é obrigatório.'); return; }
      var duplicateCat = STATE.categories.some(function (c) { return (!isEdit || c.id !== existing.id) && namesMatch(c.name, name); });
      if (duplicateCat) { errorPopover(document.getElementById('m-submit'), 'Já existe uma categoria com esse nome.'); return; }
      var keywords = document.getElementById('m-keywords').value;
      var description = capitalizeFirst_(document.getElementById('m-description').value.trim());
      closeModal();

      if (isEdit) {
        var cat = STATE.categories.find(function (c) { return c.id === existing.id; });
        var prevSnapshot = cat ? Object.assign({}, cat) : null;
        if (cat) { cat.name = name; cat.keywords = keywords; cat.description = description; cat.icon = chosenIconKey; }
        render();
        afterMutation_(run('updateCategory', { id: existing.id, name: name, keywords: keywords, description: description, icon: chosenIconKey })).catch(function (err) {
          if (cat && prevSnapshot) Object.assign(cat, prevSnapshot);
          render();
          showToast(err.message, true);
        });
        return;
      }

      var chosenParentId = parentField.getValue() || null;
      // Se o pai escolhido ainda é um ID temporário (acabou de ser criado e o servidor
      // não confirmou ainda), espera essa criação terminar em vez de mandar o ID
      // temporário — ver pendingCreations_/resolveRealId_.
      resolveRealId_(chosenParentId).then(function (realParentId) {
        var payload = { name: name, kind: kind, parentId: realParentId, keywords: keywords, description: description, icon: chosenIconKey };
        var tempId = 'tmp-' + Math.random().toString(36).slice(2);
        STATE.categories.push({ id: tempId, name: payload.name, kind: payload.kind, parentId: payload.parentId, keywords: keywords, description: description, icon: chosenIconKey, archived: false });
        render();
        var catCreation_ = run('createCategory', payload).then(function (created) {
          // Troca o ID temporário pelo real assim que o servidor confirma — sem esperar
          // o refreshAll() completo, senão dá pra escolher essa categoria (ex: numa
          // Previsão mensal) enquanto ainda só existe o ID temporário, e o servidor
          // rejeita com "categoria não encontrada".
          return adoptRealId_(STATE.categories, tempId, created.ID);
        });
        pendingCreations_[tempId] = catCreation_;
        afterMutation_(catCreation_).catch(function (err) {
          var idx = STATE.categories.findIndex(function (c) { return c.id === tempId; });
          if (idx !== -1) STATE.categories.splice(idx, 1);
          render();
          showToast(err.message, true);
        }).finally(function () { delete pendingCreations_[tempId]; });
      });
    };
  }

  // ---------- budgets ----------
  function byBudgetCategoryNamePt_(a, b) { return a.categoryName.localeCompare(b.categoryName, 'pt-BR'); }
  function daysInMonth_(ym) {
    var parts = ym.split('-');
    return new Date(Number(parts[0]), Number(parts[1]), 0).getDate();
  }
  function ymdFromDate_(date) {
    return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
  }
  /** Inverso de ymdFromDate_ -- "YYYY-MM-DD" vira Date à meia-noite local. */
  function parseYmd_(ymd) {
    var parts = ymd.split('-');
    return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  }
  /**
   * `months` meses de calendário antes de `date` (não `months*30` dias) — usado pra
   * janela rolante de Lançamento recorrente em meses. Monta o 1º dia do mês-alvo primeiro
   * (em vez de só Date.setMonth numa data já com dia 31) e SÓ DEPOIS aplica o dia
   * original, limitado ao que existir no mês-alvo — sem isso, "31 de março menos 1 mês"
   * estouraria pro dia 1-3 de março de novo (fevereiro não tem dia 31), andando pro lado
   * errado.
   */
  function subtractMonths_(date, months) {
    var target = new Date(date.getFullYear(), date.getMonth() - months, 1);
    var lastDayOfTarget = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
    target.setDate(Math.min(date.getDate(), lastDayOfTarget));
    return target;
  }
  var BUDGET_SUGGESTION_MAX = 3;
  var BUDGET_SUGGESTION_WINDOW_DAYS = 30;
  var BUDGET_SUGGESTION_MIN_TRANSACTIONS = 3;
  /**
   * Até BUDGET_SUGGESTION_MAX sugestões de NOVO orçamento: categorias/subs de despesa
   * que ainda não estão em nenhum orçamento, têm pelo menos BUDGET_SUGGESTION_MIN_
   * TRANSACTIONS lançamentos nos últimos BUDGET_SUGGESTION_WINDOW_DAYS dias corridos, e
   * não foram descartadas há menos de 30 dias (STATE.budgetSuggestionDismissals já vem
   * filtrado — ver listBudgetSuggestionDismissals, Budgets.js; só as de tipo 'new'
   * importam aqui, 'increase' é outra coisa — ver computeBudgetPeriodIncreaseSuggestions_).
   * Ordenadas por quantidade de lançamentos, desempatando por maior valor total gasto.
   *
   * Valor sugerido = valor médio dos lançamentos × (30 ÷ intervalo médio ENTRE eles),
   * arredondado pra CIMA no múltiplo de R$50 mais próximo (pedido explícito do usuário).
   * "Intervalo médio entre lançamentos" pra N datas ordenadas é sempre (última - primeira)
   * ÷ (N-1) -- a soma dos intervalos consecutivos é uma soma telescópica que se reduz
   * exatamente a isso, então não tem ambiguidade em "como calcular a média" aqui. Com
   * N>=3 (mínimo exigido), N-1>=2, nunca divide por zero; se as N caíram todas no MESMO
   * dia (intervalo real = 0), trata como 1 dia pra não estourar a razão 30/intervalo pra
   * infinito.
   */
  function computeBudgetSuggestions_() {
    var budgetedIds = {};
    STATE.budgets.filter(function (b) { return !b.archived; }).forEach(function (b) {
      b.categoryIds.forEach(function (id) { budgetedIds[id] = true; });
    });
    var dismissedIds = {};
    STATE.budgetSuggestionDismissals.filter(function (d) { return d.type === 'new'; })
      .forEach(function (d) { dismissedIds[d.categoryId] = true; });

    var todayObj = parseYmdLocal_(todayYmd());
    var cutoffYmd = ymdFromDate_(new Date(todayObj.getFullYear(), todayObj.getMonth(), todayObj.getDate() - (BUDGET_SUGGESTION_WINDOW_DAYS - 1)));

    var byCategory = {}; // categoryId -> lançamentos de despesa dentro da janela, qualquer ordem
    STATE.allTransactions.forEach(function (t) {
      // Fora os "Não considerar em análises?" (pedido explícito do usuário): uma compra pontual
      // marcada não deve nem disparar nem distorcer a sugestão de um orçamento novo.
      // Fora também os vinculados a um Lançamento recorrente (pedido explícito do usuário): já têm o
      // próprio acompanhamento, não devem sugerir/inflar um orçamento.
      if (t.kind !== 'expense' || !t.categoryId || !t.date || t.date < cutoffYmd || t.excludeFromAnalysis || t.forecastId) return;
      (byCategory[t.categoryId] = byCategory[t.categoryId] || []).push(t);
    });

    return Object.keys(byCategory)
      .filter(function (id) { return byCategory[id].length >= BUDGET_SUGGESTION_MIN_TRANSACTIONS && !budgetedIds[id] && !dismissedIds[id]; })
      .map(function (id) {
        var cat = STATE.categories.find(function (c) { return c.id === id; });
        if (!cat) return null;
        var txs = byCategory[id].slice().sort(function (a, b) { return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
        var n = txs.length;
        var total = txs.reduce(function (sum, t) { return sum + t.amount; }, 0);
        var avgValue = total / n;
        var spanDays = (parseYmdLocal_(txs[n - 1].date) - parseYmdLocal_(txs[0].date)) / 86400000;
        var avgIntervalDays = Math.max(1, spanDays / (n - 1));
        // Arredonda pros centavos ANTES de dividir por 50: sem isso, o ida-e-volta
        // divisão/multiplicação de ponto flutuante podia devolver algo como
        // 1000.0000000000001 pra um total que já era um múltiplo exato de 50,
        // empurrando o teto pro múltiplo SEGUINTE à toa (1050 em vez de 1000).
        var projected = Math.round(avgValue * (BUDGET_SUGGESTION_WINDOW_DAYS / avgIntervalDays) * 100) / 100;
        var suggestedAmount = Math.ceil(projected / 50) * 50;
        return { categoryId: id, categoryName: cat.name, count: n, total: total, suggestedAmount: suggestedAmount };
      })
      .filter(Boolean)
      .sort(function (a, b) {
        if (b.count !== a.count) return b.count - a.count;
        return b.total - a.total;
      })
      .slice(0, BUDGET_SUGGESTION_MAX);
  }

  // ---------- sugestão de trocar Manual<->Automático de um orçamento já existente (ver grilling) ----------
  var BUDGET_MODE_FIT_WINDOW_DAYS_ = 180;
  var BUDGET_MODE_FIT_MIN_TRANSACTIONS_ = 4;
  var BUDGET_MODE_FIT_CONCENTRATION_THRESHOLD_ = 0.5;
  var BUDGET_MODE_FIT_PERIOD_CANDIDATES_ = [90, 180, 365];
  /**
   * Sinal de "ritmo" das categorias de um orçamento nos últimos BUDGET_MODE_FIT_WINDOW_
   * DAYS_ dias -- frequência (quantos lançamentos) e concentração (quanto do total é 1
   * lançamento só). Ritmo REGULAR (Alimentação, transporte por app): muitos lançamentos,
   * nenhum dominando o total -- Automático (que deriva o teto do histórico recente) dá
   * conta bem. Ritmo CONCENTRADO/ocasional (Viagens, reforma): poucos lançamentos, ou 1
   * sozinho responde pela maior parte do total -- Automático não serve bem, o teto vira
   * refém de quando esse 1 lançamento caiu dentro ou fora da janela (grillado com o
   * usuário: o problema de fundo que motivou toda essa sugestão).
   */
  function categoryModeFitSignal_(categoryIds) {
    var todayStr = todayYmd();
    var fromDate = parseYmdLocal_(todayStr);
    fromDate.setDate(fromDate.getDate() - (BUDGET_MODE_FIT_WINDOW_DAYS_ - 1));
    var fromYmd = ymdFromDate_(fromDate);
    var amounts = STATE.allTransactions
      .filter(function (t) { return t.kind === 'expense' && !t.excludeFromAnalysis && !t.forecastId && categoryIds.indexOf(t.categoryId) !== -1 && t.date >= fromYmd && t.date <= todayStr; })
      .map(function (t) { return netAmountOfPassive_(t); })
      .filter(function (a) { return a > 0; });
    var count = amounts.length;
    var total = amounts.reduce(function (sum, a) { return sum + a; }, 0);
    var maxSingle = count ? Math.max.apply(null, amounts) : 0;
    var concentration = total > 0 ? maxSingle / total : 0;
    return {
      count: count,
      lowFrequency: count < BUDGET_MODE_FIT_MIN_TRANSACTIONS_,
      highConcentration: total > 0 && concentration >= BUDGET_MODE_FIT_CONCENTRATION_THRESHOLD_
    };
  }
  /** Dias desde o lançamento de despesa mais ANTIGO dessas categorias até hoje -- só pra
   *  decidir o período sugerido de uma troca pra Manual (ver budgetModeSwitchSuggestion_):
   *  histórico mais longo que a janela de observação sugere um período maior que os 180
   *  dias padrão. */
  function categoryExpenseHistorySpanDays_(categoryIds) {
    var oldest = null;
    STATE.allTransactions.forEach(function (t) {
      if (t.kind !== 'expense' || t.excludeFromAnalysis || t.forecastId || categoryIds.indexOf(t.categoryId) === -1 || !t.date) return;
      if (!oldest || t.date < oldest) oldest = t.date;
    });
    if (!oldest) return 0;
    return Math.round((parseYmdLocal_(todayYmd()) - parseYmdLocal_(oldest)) / 86400000);
  }
  /** O candidato de BUDGET_MODE_FIT_PERIOD_CANDIDATES_ mais próximo do histórico
   *  disponível -- só entra em jogo quando esse histórico já passa da janela padrão de
   *  180 dias (senão fica nos próprios 180). */
  function suggestedManualPeriodDays_(historySpanDays) {
    if (historySpanDays <= BUDGET_MODE_FIT_WINDOW_DAYS_) return BUDGET_MODE_FIT_WINDOW_DAYS_;
    return BUDGET_MODE_FIT_PERIOD_CANDIDATES_.reduce(function (best, c) {
      return Math.abs(c - historySpanDays) < Math.abs(best - historySpanDays) ? c : best;
    });
  }
  /**
   * Sugestão de trocar o MODO de um orçamento já existente (Manual<->Automático), grillado
   * com o usuário. Automático cuja categoria na verdade tem ritmo concentrado/ocasional
   * vira sugestão pra Manual, com valor+período derivados do próprio histórico da
   * categoria (mesma convenção de arredondar pra cima em R$50 de todo teto derivado deste
   * arquivo). Manual cuja categoria na verdade tem ritmo regular o bastante pro Automático
   * dar conta sozinho vira sugestão pra Automático, sem valor/período -- só uma prévia de
   * qual seria o primeiro teto (evita surpresa). null quando não há sugestão: ritmo já
   * bate com o modo atual, dado de menos pra arriscar (Automático sem nenhum lançamento no
   * período), sugestão descartada há menos de 30 dias (mesmo mecanismo/janela de
   * computeBudgetSuggestions_), ou (pro lado Automático) o X ainda não determinável.
   */
  function budgetModeSwitchSuggestion_(b) {
    var wantedType = b.periodMode === 'auto' ? 'switch-manual' : 'switch-auto';
    var dismissed = STATE.budgetSuggestionDismissals.some(function (d) { return d.type === wantedType && d.budgetId === b.id; });
    if (dismissed) return null;
    var signal = categoryModeFitSignal_(b.categoryIds);
    if (b.periodMode === 'auto') {
      if (!signal.count || (!signal.lowFrequency && !signal.highConcentration)) return null;
      var historySpan = categoryExpenseHistorySpanDays_(b.categoryIds);
      var periodDays = suggestedManualPeriodDays_(historySpan);
      var fromDate = parseYmdLocal_(todayYmd());
      fromDate.setDate(fromDate.getDate() - (periodDays - 1));
      var rawAmount = spentForBudgetInRange_(b.categoryIds, ymdFromDate_(fromDate), todayYmd(), true);
      return {
        type: 'switch', direction: 'to-manual', budgetId: b.id, forcesManual: true,
        suggestedAmount: Math.ceil(rawAmount / 50) * 50, suggestedIntervalDays: periodDays
      };
    }
    if (signal.lowFrequency || signal.highConcentration) return null;
    var windowDays = budgetAutoWindowDays_();
    if (!windowDays) return null;
    var preview = computeBudgetAutoProgress_(b.categoryIds, windowDays);
    return { type: 'switch', direction: 'to-auto', budgetId: b.id, forcesManual: false, previewLimit: preview.shimBudget.amount };
  }
  /** Texto inline mostrado na linha do orçamento (ver renderBudgets). */
  function budgetModeSwitchMessage_(modeSwitch) {
    if (modeSwitch.direction === 'to-manual') {
      return 'Gasto ocasional — considerar Manual (' + fmtMoneyNoCents_(modeSwitch.suggestedAmount) + ' a cada ' + modeSwitch.suggestedIntervalDays + ' dias)?';
    }
    return 'Gasto regular — considerar Automático (previsão inicial: ' + fmtMoneyNoCents_(modeSwitch.previewLimit) + ')?';
  }
  /** Descarta uma sugestão de troca de modo (mesmo padrão otimista de sempre) -- chamada
   *  tanto pelo "Ignorar" inline na linha (ver renderBudgets) quanto por "Descartar
   *  sugestão" dentro do modal (ver openBudgetModal). */
  function dismissBudgetModeSwitchClient_(budgetId, direction) {
    var entry = { type: direction === 'to-manual' ? 'switch-manual' : 'switch-auto', budgetId: budgetId, dismissedAt: new Date().toISOString() };
    STATE.budgetSuggestionDismissals.push(entry);
    render();
    afterMutation_(run('dismissBudgetModeSwitchSuggestion', { budgetId: budgetId, direction: direction })).catch(function (err) {
      STATE.budgetSuggestionDismissals = STATE.budgetSuggestionDismissals.filter(function (d) { return dismissalKey_(d) !== dismissalKey_(entry); });
      render();
      showToast(err.message, true);
    });
  }

  // 95% (não mais 80%) é o corte entre "dentro do limite" e os avisos -- é também o
  // valor de referência do aviso "Gastar no máximo até" (ver computeBudgetAdvisory_),
  // não o limite cheio (100%).
  var BUDGET_WARNING_RATIO_ = 0.95;
  function statusForRatio_(ratio) {
    return ratio < BUDGET_WARNING_RATIO_ ? 'ok' : (ratio <= 1.0 ? 'atencao' : 'estourado');
  }
  /** Valor esperado (b.amount) projetado pro tamanho de um mês específico: b.amount × (dias do mês ÷ b.intervalDays). */
  function scaledLimitForMonth_(b, ym) {
    return b.amount * (daysInMonth_(ym) / b.intervalDays);
  }
  /**
   * Data efetiva de um lançamento PRA FINS DE ORÇAMENTO -- normalmente a própria data
   * (t.date), MAS pra parcelas 2+ de uma compra parcelada, usa o dia 1 do mês da FATURA
   * dela (t.billMonth) em vez da data da compra. Toda parcela nasce com a MESMA t.date
   * (a da compra em si, ver createTransaction/Transactions.js) -- sem isso, uma compra
   * em 6x contava o valor inteiro de uma vez só na data da compra e nunca mais aparecia
   * depois no orçamento (pedido do usuário: cada parcela deveria contar no período em
   * que ela é de fato cobrada). A 1ª parcela continua na data da compra mesmo (pedido
   * explícito) -- só a 2ª em diante usa a fatura. Só afeta ORÇAMENTOS -- Extrato/Início/
   * resto do app continuam usando t.date puro (escopo confirmado com o usuário).
   */
  function budgetEffectiveDate_(t) {
    if (t.installmentSeq && t.installmentSeq > 1 && t.billMonth) return t.billMonth + '-01';
    return t.date;
  }
  /**
   * Soma de despesas nas categorias/subcategorias do orçamento dentro de [fromYmd,
   * toYmd], inclusive. categoryIds é uma lista ESTÁTICA e explícita (ver createBudget) —
   * diferente do modelo antigo (uma categoria de topo somava as subs dela
   * dinamicamente), uma subcategoria só conta se estiver explicitamente na lista.
   * netAmountOfPassive_ desconta reembolso já vinculado -- vale pra TODO orçamento
   * (manual ou Automático, grillado com o usuário: era uma inconsistência não descontar
   * antes). excludeFlagged (opcional): ignora lançamentos marcados como fora das análises
   * (ExcludeFromAnalysis) -- os chamadores de orçamento passam true.
   *
   * SEMPRE ignora lançamentos vinculados a um Lançamento recorrente (t.forecastId), sem
   * parâmetro pra desligar (pedido explícito do usuário: "todos os orçamentos e
   * sugestões de orçamentos devem ignorar lançamentos vinculados a lançamentos
   * recorrentes") -- esses já são acompanhados pelo próprio recorrente, não pelo
   * orçamento. Antes só a barra "Não orçamentado" fazia isso, via um parâmetro
   * excludeForecastLinked (removido); ser incondicional aqui é o que mantém o MESMO
   * número na barra, no menu de segurar, na lista de Planejamento, no modal e na
   * projeção de saldo (todos passam por esta função/transactionsForBudgetInRange_).
   */
  function spentForBudgetInRange_(categoryIds, fromYmd, toYmd, excludeFlagged) {
    return STATE.allTransactions.reduce(function (sum, t) {
      if (t.kind !== 'expense' || categoryIds.indexOf(t.categoryId) === -1) return sum;
      if (excludeFlagged && t.excludeFromAnalysis) return sum;
      if (t.forecastId) return sum;
      var effDate = budgetEffectiveDate_(t);
      if (!effDate || effDate < fromYmd || effDate > toYmd) return sum;
      return sum + netAmountOfPassiveForBudget_(t);
    }, 0);
  }
  /** [fromYmd, toYmd] da janela "Últimos N dias" de um orçamento -- terminando hoje,
   *  compartilhado entre computeBudgetRollingProgress_ e computeBudgetAdvisory_ (que
   *  precisa da mesma janela pra achar os lançamentos mais antigos DENTRO dela). */
  function budgetRollingWindow_(b) {
    var today = new Date();
    var fromDate = new Date(today);
    fromDate.setDate(fromDate.getDate() - (b.intervalDays - 1));
    return { fromYmd: ymdFromDate_(fromDate), toYmd: ymdFromDate_(today) };
  }
  /** Progresso "Últimos N dias" (janela móvel terminando hoje) — proporção simples, sem
   *  projeção de ritmo. excludeFlagged (opcional): ver
   *  spentForBudgetInRange_ -- usado pelos orçamentos Automático (ver
   *  computeBudgetAutoProgress_), que passam um "b" provisório (categoryIds +
   *  intervalDays=X + amount=teto derivado), não uma linha de verdade da planilha --
   *  reaproveita essa função sem precisar duplicá-la. */
  function computeBudgetRollingProgress_(b, excludeFlagged) {
    var window_ = budgetRollingWindow_(b);
    var spent = spentForBudgetInRange_(b.categoryIds, window_.fromYmd, window_.toYmd, excludeFlagged);
    var ratio = b.amount > 0 ? spent / b.amount : (spent > 0 ? Infinity : 0);
    return { spent: spent, limit: b.amount, status: statusForRatio_(ratio) };
  }

  // ---------- orçamento "Automático" (período/teto derivados, ver grilling) ----------
  /** Dias distintos (YYYY-MM-DD) com pelo menos 1 lançamento real, ordenados. */
  function distinctActiveTransactionDates_() {
    var seen = {};
    STATE.allTransactions.forEach(function (t) { if (t.date) seen[t.date] = true; });
    return Object.keys(seen).sort();
  }
  var ENGAGEMENT_GAP_MAX_DAYS_ = 7;
  var ENGAGEMENT_STABLE_RUN_DAYS_ = 28; // 4 semanas
  /**
   * Data Y (início do engajamento real, base de todo orçamento Automático) -- grillado
   * em detalhe com o usuário. Um "dia ativo" é qualquer data com pelo menos 1
   * lançamento; um intervalo de mais de ENGAGEMENT_GAP_MAX_DAYS_ (7) dias entre 2 dias
   * ativos consecutivos marca um possível "falso início" (usuário testou o app, sumiu,
   * só engajou de verdade depois). Y trava no primeiro dia ativo que começa um trecho
   * de pelo menos ENGAGEMENT_STABLE_RUN_DAYS_ (28) dias sem nenhum buraco desses --
   * escaneia o histórico INTEIRO (não só o começo), mas só até achar esse 1º trecho
   * estável; qualquer coisa depois disso (uma viagem, um esquecimento) não move mais Y.
   *
   * Não fica guardado em nenhum lugar -- recalculado do zero a cada render a partir de
   * STATE.allTransactions (que já vem completo do bootstrap), então automaticamente
   * fica coerente com o histórico atual sempre, inclusive depois de uma importação de
   * documento antiga (ver DocumentImport.js) sem precisar de nenhum gatilho explícito.
   */
  function computeEngagementStartDate_(activeDates) {
    for (var i = 0; i < activeDates.length; i++) {
      var start = parseYmdLocal_(activeDates[i]);
      var stableEnd = start;
      var broke = false;
      for (var j = i; j < activeDates.length - 1; j++) {
        var gapDays = (parseYmdLocal_(activeDates[j + 1]) - parseYmdLocal_(activeDates[j])) / 86400000;
        if (gapDays > ENGAGEMENT_GAP_MAX_DAYS_) { broke = true; break; }
        stableEnd = parseYmdLocal_(activeDates[j + 1]);
        if ((stableEnd - start) / 86400000 >= ENGAGEMENT_STABLE_RUN_DAYS_ - 1) return activeDates[i];
      }
      if (!broke) return activeDates.length ? activeDates[i] : null; // chegou no fim do histórico sem nenhum buraco -- aceita (autocorrige sozinho se um buraco aparecer depois, ver comentário acima)
    }
    return null; // sem dia ativo nenhum ainda
  }
  /**
   * X (dias): a janela usada por TODO orçamento Automático (não é por orçamento) --
   * cresce em passos de 15 dias conforme o tempo desde Y passa, capado em 360 (pedido
   * explícito do usuário: quanto maior, melhor, pra suavizar sazonalidade). null quando
   * Y não pode ser determinado ainda, OU quando ainda não se passaram os 30 dias
   * mínimos desde Y pro primeiro passo de 15 -- os dois casos viram "histórico
   * insuficiente" pra quem chama (ver buildBudgetTimelineHtml).
   */
  function budgetAutoWindowDays_() {
    var y = computeEngagementStartDate_(distinctActiveTransactionDates_());
    if (!y) return null;
    var daysSinceY = Math.floor((parseYmdLocal_(todayYmd()) - parseYmdLocal_(y)) / 86400000);
    var x = Math.min(360, 15 * Math.floor(daysSinceY / 30));
    return x > 0 ? x : null;
  }
  /**
   * Progresso de um orçamento em modo Automático: teto = gasto líquido (reembolso
   * descontado, fora-da-curva excluído) dos X dias imediatamente ANTERIORES à janela
   * atual; gasto = a mesma soma, só que nos últimos X dias (incluindo hoje). Devolve um
   * "b" provisório (categoryIds + intervalDays=X + amount=teto) pra
   * computeBudgetRollingProgress_/computeBudgetAdvisory_ (que só enxergam esses 3
   * campos) calcularem o resto -- textos e critérios continuam os mesmos de qualquer
   * orçamento "Últimos dias", só a origem do período/teto é diferente (pedido explícito
   * do usuário).
   */
  /** [fromYmd,toYmd] dos X dias imediatamente ANTERIORES à janela atual de um
   *  orçamento Automático -- mesmo período que embasa o teto (ver
   *  computeBudgetAutoProgress_), extraído à parte pra também dar pra abrir o Extrato
   *  filtrado nele (ver viewBudgetPreviousPeriodTransactions_/setupBudgetBarMenus_). */
  function budgetAutoPreviousWindow_(windowDays) {
    var today = parseYmdLocal_(todayYmd());
    var previousTo = new Date(today);
    previousTo.setDate(previousTo.getDate() - windowDays);
    var previousFrom = new Date(previousTo);
    previousFrom.setDate(previousFrom.getDate() - (windowDays - 1));
    return { fromYmd: ymdFromDate_(previousFrom), toYmd: ymdFromDate_(previousTo) };
  }
  /** Gasto líquido (reembolso descontado, fora-da-curva excluído) dos X dias
   *  ANTERIORES à janela atual -- o mesmo número que embasa o teto (ver
   *  computeBudgetAutoProgress_ logo abaixo), extraído à parte pra também dar pra
   *  mostrar no card de resumo do dropdown (ver setupBudgetBarMenus_), que precisa do
   *  valor BRUTO (não arredondado pro múltiplo de R$50 que vira o "limite"). */
  function budgetAutoPreviousSpent_(categoryIds, windowDays) {
    var w = budgetAutoPreviousWindow_(windowDays);
    return spentForBudgetInRange_(categoryIds, w.fromYmd, w.toYmd, true);
  }
  function computeBudgetAutoProgress_(categoryIds, windowDays) {
    var previousSum = budgetAutoPreviousSpent_(categoryIds, windowDays);
    // Arredonda pra cima em múltiplos de R$50 -- mesma convenção de todo outro teto
    // DERIVADO (não digitado pelo usuário) deste arquivo, ver computeBudgetSuggestions_/
    // nextBudgetIncreaseInterval_ (removida) -- só um número bruto ficaria estranho
    // como "limite" mostrado na barra.
    var limit = Math.ceil(previousSum / 50) * 50;
    var shimBudget = { categoryIds: categoryIds, intervalDays: windowDays, amount: limit };
    var progress = computeBudgetRollingProgress_(shimBudget, true);
    return { shimBudget: shimBudget, progress: progress };
  }

  // ---------- lançamento "fora da curva" (ver grilling) ----------
  var OUTLIER_MULTIPLIER_ = 5;
  /** Mediana do valor (líquido de reembolso, se despesa) dos lançamentos de uma
   *  categoria+tipo nos últimos X dias (mesmo X derivado de Y, ver
   *  budgetAutoWindowDays_) -- ignora lançamentos já marcados como fora da curva (não
   *  faria sentido a mediana ser puxada por um outlier já confirmado). null sem
   *  histórico suficiente (menos de BUDGET_SUGGESTION_MIN_TRANSACTIONS na janela) ou sem
   *  X ainda determinável -- não arrisca falso positivo por falta de dado. */
  function categoryRecentMedian_(categoryId, kind) {
    var windowDays = budgetAutoWindowDays_();
    if (!windowDays || !categoryId) return null;
    var todayStr = todayYmd();
    var fromDate = parseYmdLocal_(todayStr);
    fromDate.setDate(fromDate.getDate() - (windowDays - 1));
    var fromYmd = ymdFromDate_(fromDate);
    var amounts = STATE.allTransactions
      .filter(function (t) { return t.kind === kind && t.categoryId === categoryId && !t.excludeFromAnalysis && t.date >= fromYmd && t.date <= todayStr; })
      .map(function (t) { return kind === 'expense' ? netAmountOfPassive_(t) : t.amount; })
      .sort(function (a, b) { return a - b; });
    if (amounts.length < BUDGET_SUGGESTION_MIN_TRANSACTIONS) return null;
    var mid = Math.floor(amounts.length / 2);
    return amounts.length % 2 ? amounts[mid] : (amounts[mid - 1] + amounts[mid]) / 2;
  }
  /** true quando `amount` é candidato a "fora da curva" pra essa categoria+tipo --
   *  OUTLIER_MULTIPLIER_ (5x) a mediana recente, grillado com o usuário. Só dispara a
   *  SUGESTÃO (toggle "Não considerar em análises?" pré-marcado, ver openTransactionModal/
   *  wireOutlierCheck_) -- nunca marca sozinho sem o usuário confirmar. */
  function isLikelyOutlier_(amount, categoryId, kind) {
    var median = categoryRecentMedian_(categoryId, kind);
    return median !== null && amount >= median * OUTLIER_MULTIPLIER_;
  }

  /** categoryIds cobertos por algum orçamento REAL ativo (exclui a própria linha de
   *  "não orçamentado" -- ela nunca tem categoryIds próprios, mas a exclusão explícita
   *  deixa a intenção clara mesmo assim). Mesma regra de "já orçamentado" de
   *  computeBudgetSuggestions_, extraída aqui pra não duplicar a lógica. */
  function unbudgetedCoverageIds_() {
    var covered = {};
    STATE.budgets.filter(function (b) { return !b.archived && !b.isUnbudgetedCatchAll; })
      .forEach(function (b) { b.categoryIds.forEach(function (id) { covered[id] = true; }); });
    return covered;
  }

  /** categoryIds de despesa NÃO cobertos por nenhum orçamento real -- usado tanto pro
   *  progresso da barra (ela mesma um orçamento Automático, ver
   *  computeBudgetAutoProgress_/buildBudgetTimelineHtml) quanto pra abrir "ver
   *  lançamentos" (viewUnbudgetedCatchAllTransactions_) filtrado certo. */
  function unbudgetedExpenseCategoryIds_() {
    var covered = unbudgetedCoverageIds_();
    return STATE.categories.filter(function (c) { return c.kind === 'expense' && !covered[c.id]; })
      .map(function (c) { return c.id; });
  }

  /** Navega pro Extrato filtrado nas categorias de despesa NÃO cobertas por nenhum
   *  orçamento real, nos últimos X dias (mesma janela Automático que a própria barra
   *  usa, ver budgetAutoWindowDays_) -- mesmo mecanismo de viewBudgetTransactions_, só
   *  que com uma lista de categorias INVERTIDA (tudo que não está coberto, em vez das
   *  categorias de um orçamento específico), já que txMatchesFilters só sabe filtrar
   *  por inclusão. useEffectiveDate:true -- mesma data EFETIVA usada pra somar "gasto"
   *  (parcela 2+ conta no mês da FATURA, não da compra, ver budgetEffectiveDate_).
   */
  function viewUnbudgetedCatchAllTransactions_(windowDays, monthYm) {
    var categoryIds = unbudgetedExpenseCategoryIds_();
    // monthYm (opcional): mês escolhido no seletor de período -- Extrato no mês inteiro, em
    // vez dos últimos X dias (ver budgetSelectedPeriod_).
    var range = monthYm ? budgetMonthRange_(monthYm) : budgetRollingWindow_({ intervalDays: windowDays });
    STATE.txFilters = { categoryIds: categoryIds, dateFrom: range.fromYmd, dateTo: range.toYmd, useEffectiveDate: true };
    STATE.currentView = 'transactions';
    delete scrollPositions_.transactions;
    render();
  }
  /** Extrato filtrado nos X dias ANTERIORES à janela atual de um orçamento Automático
   *  (o período que embasa o teto, ver budgetAutoPreviousWindow_) -- clique na 2ª linha
   *  do card de resumo do dropdown (ver setupBudgetBarMenus_), tanto pra um orçamento
   *  Automático de verdade (categoryIds = b.categoryIds) quanto pra "Não orçamentado"
   *  (categoryIds = unbudgetedExpenseCategoryIds_()), mesmo padrão de
   *  viewUnbudgetedCatchAllTransactions_ acima. */
  function viewBudgetPreviousPeriodTransactions_(categoryIds, windowDays) {
    var range = budgetAutoPreviousWindow_(windowDays);
    STATE.txFilters = { categoryIds: categoryIds.slice(), dateFrom: range.fromYmd, dateTo: range.toYmd, useEffectiveDate: true };
    STATE.currentView = 'transactions';
    delete scrollPositions_.transactions;
    render();
  }

  /** Mesmo filtro de spentForBudgetInRange_ (inclusive a data EFETIVA de
   *  budgetEffectiveDate_, não t.date puro), mas devolve os lançamentos em si (mais
   *  antigo primeiro, pela data efetiva) em vez de só a soma -- computeBudgetAdvisory_
   *  precisa saber QUAIS lançamentos, não só quanto, pra achar o mais antigo (e agrupar/
   *  remover a partir dele). Os objetos devolvidos mantêm o .date ORIGINAL intacto (a
   *  data da compra) -- quem usa esse resultado pra fazer conta de data deve chamar
   *  budgetEffectiveDate_ de novo, não ler .date direto (ver computeBudgetAdvisory_). */
  function transactionsForBudgetInRange_(categoryIds, fromYmd, toYmd, excludeFlagged) {
    return STATE.allTransactions
      .filter(function (t) {
        if (t.kind !== 'expense' || categoryIds.indexOf(t.categoryId) === -1) return false;
        if (excludeFlagged && t.excludeFromAnalysis) return false;
        if (t.forecastId) return false; // sempre, igual spentForBudgetInRange_
        var effDate = budgetEffectiveDate_(t);
        return !!effDate && effDate >= fromYmd && effDate <= toYmd;
      })
      .sort(function (a, b) {
        var da = budgetEffectiveDate_(a), db = budgetEffectiveDate_(b);
        return da < db ? -1 : (da > db ? 1 : 0);
      });
  }
  /**
   * Texto de aviso do orçamento "Últimos dias" (sempre visível abaixo da barra, ver
   * buildBudgetTimelineHtml/budgetAdvisoryHtml_) -- grilled/alinhado em detalhe com o
   * usuário:
   *
   * "Dentro"/"Próximo" do limite (progress.status 'ok'/'atencao'): o valor que ainda
   * dá pra gastar é sempre X = 95% do limite − gasto de HOJE (não muda com o
   * agrupamento abaixo, é só o retrato agora). A DATA usa o lançamento mais antigo da
   * janela; se houver outros lançamentos até 2 dias depois dele, agrupa todos (soma só
   * pra identificar o grupo, não entra em X) e usa a data do MAIS RECENTE do grupo —
   * sem isso, uma categoria com lançamentos frequentes tornaria a data "até quando"
   * muito instável (trocaria de novo 1 dia depois, ao lançamento seguinte sair
   * sozinho). Sem nenhum lançamento na janela, não tem o que calcular: só "Sem
   * lançamentos ainda".
   *
   * "Acima do limite" (status 'estourado'): em vez de olhar só o mais antigo, remove
   * os lançamentos mais antigos um a um (sem agrupar -- aqui já estamos somando vários
   * de qualquer jeito, então a mesma instabilidade não se aplica) até a soma cair de
   * volta abaixo de 95% do limite; a data usada é a do ÚLTIMO lançamento removido
   * (o mais recente do grupo removido) mais o intervalo do orçamento.
   */
  /** Mediana do valor dos lançamentos do orçamento na janela [fromYmd,toYmd] -- só usada
   *  pra decidir se "gastar no máximo X" ainda faz sentido (ver computeBudgetAdvisory_/
   *  computeBudgetMonthAdvisory_): se X for menor que a metade do tamanho TÍPICO de um
   *  lançamento dessa categoria, sugerir "gastar no máximo" é enganoso (o usuário
   *  provavelmente nem consegue ficar abaixo disso numa única compra normal) -- melhor
   *  já avisar "evitar gastos". null quando não há lançamento nenhum na janela (sem
   *  evidência de tamanho típico, não força "evitar gastos" só por falta de dado).
   */
  function medianTransactionAmountForBudget_(categoryIds, fromYmd, toYmd, excludeFlagged) {
    var amounts = transactionsForBudgetInRange_(categoryIds, fromYmd, toYmd, excludeFlagged).map(function (t) { return netAmountOfPassiveForBudget_(t); }).sort(function (a, b) { return a - b; });
    if (!amounts.length) return null;
    var mid = Math.floor(amounts.length / 2);
    return amounts.length % 2 ? amounts[mid] : (amounts[mid - 1] + amounts[mid]) / 2;
  }
  /** "Gastar no máximo X" só faz sentido se X ainda comportar uma compra típica dessa
   *  categoria -- ver medianTransactionAmountForBudget_. */
  function shouldAvoidInsteadOfCap_(remainingToWarning, categoryIds, fromYmd, toYmd, excludeFlagged) {
    var median = medianTransactionAmountForBudget_(categoryIds, fromYmd, toYmd, excludeFlagged);
    return median !== null && remainingToWarning < median * 0.5;
  }
  /** excludeFlagged (opcional): os orçamentos passam true -- ignoram lançamentos fora das
   *  análises ao decidir o texto também, não só a barra em si (senão o aviso podia
   *  apontar pra um lançamento que nem contou na soma mostrada). Vinculados a um
   *  recorrente são sempre ignorados (ver spentForBudgetInRange_). */
  function computeBudgetAdvisory_(b, progress, excludeFlagged) {
    var window_ = budgetRollingWindow_(b);
    var warningLimit = progress.limit * BUDGET_WARNING_RATIO_;

    if (progress.status === 'estourado') {
      var oldestFirst = transactionsForBudgetInRange_(b.categoryIds, window_.fromYmd, window_.toYmd, excludeFlagged);
      var remaining = progress.spent;
      var lastRemovedDate = null;
      for (var i = 0; i < oldestFirst.length && remaining >= warningLimit; i++) {
        remaining -= netAmountOfPassiveForBudget_(oldestFirst[i]);
        lastRemovedDate = budgetEffectiveDate_(oldestFirst[i]);
      }
      // Não deveria acontecer (spent > limit > 0 implica ter pelo menos 1 lançamento),
      // mas sem lançamento nenhum pra apontar não tem "até quando" pra mostrar -- sem
      // spentLine aqui (ver comentário em buildBudgetTimelineHtml), '' cai no mesmo
      // "não mostra nada" de um mês passado sem conselho.
      if (!lastRemovedDate) return '';
      var exitDateOver = parseYmdLocal_(lastRemovedDate);
      exitDateOver.setDate(exitDateOver.getDate() + b.intervalDays);
      return 'Evitar gastos até ' + fmtBudgetAdvisoryDate_(exitDateOver);
    }

    var oldest = transactionsForBudgetInRange_(b.categoryIds, window_.fromYmd, window_.toYmd, excludeFlagged)[0];
    if (!oldest) return 'Sem lançamentos ainda';
    var oldestEffDate = budgetEffectiveDate_(oldest);
    var groupEndYmd = ymdFromDate_((function () { var d = parseYmdLocal_(oldestEffDate); d.setDate(d.getDate() + 2); return d; })());
    var group = transactionsForBudgetInRange_(b.categoryIds, oldestEffDate, groupEndYmd, excludeFlagged);
    var mostRecentInGroup = group[group.length - 1];
    var exitDate = parseYmdLocal_(budgetEffectiveDate_(mostRecentInGroup));
    exitDate.setDate(exitDate.getDate() + b.intervalDays);
    var untilText = fmtBudgetAdvisoryDate_(exitDate);

    if (progress.status === 'ok') {
      var remainingToWarning = warningLimit - progress.spent;
      if (!shouldAvoidInsteadOfCap_(remainingToWarning, b.categoryIds, window_.fromYmd, window_.toYmd, excludeFlagged)) {
        return 'Gastar no máximo ' + fmtMoneyNoCents_(remainingToWarning) + ', até ' + untilText;
      }
    }
    return 'Evitar gastos até ' + untilText;
  }
  /**
   * Igual computeBudgetAdvisory_ (mesmas fórmulas: 95% do limite, "Gastar no máximo"/
   * "Evitar gastos"), só que pro card do MÊS ATUAL específico (ver
   * buildBudgetTimelineHtml) -- diferente da janela rolante, um mês de calendário não
   * "libera espaço" aos poucos conforme lançamentos antigos saem de um range; ele só
   * reseta de vez quando o mês vira. Por isso o texto aqui NÃO tem data "até quando"
   * (pedido explícito do usuário: o "até o último dia do mês" era redundante, já que a
   * barra toda é o mês selecionado) -- só "Gastar no máximo R$ X" ou "Evitar gastos".
   * Isso também elimina o caso "sem lançamentos ainda" da versão rolante (dá pra
   * calcular mesmo com gasto zero). Só chamada pro mês ATUAL -- um mês passado já
   * fechado não tem mais o que evitar (ver buildBudgetTimelineHtml).
   */
  function computeBudgetMonthAdvisory_(b, ym, progress, excludeFlagged) {
    if (progress.status === 'ok') {
      var remainingToWarning = progress.limit * BUDGET_WARNING_RATIO_ - progress.spent;
      var fromYmd = ym + '-01', toYmd = ym + '-' + String(daysInMonth_(ym)).padStart(2, '0');
      if (!shouldAvoidInsteadOfCap_(remainingToWarning, b.categoryIds, fromYmd, toYmd, excludeFlagged)) {
        return 'Gastar no máximo ' + fmtMoneyNoCents_(remainingToWarning);
      }
    }
    return 'Evitar gastos';
  }
  /** Envolve o início do texto (sempre "Gastar no máximo" ou "Evitar gastos") num
   *  <strong> -- pedido explícito do usuário, pra destacar essas duas frases agora que
   *  o texto passou a ficar sempre visível (não mais escondido atrás de hover num
   *  tooltip). "Sem lançamentos ainda" (só na versão rolante) não bate com nenhum dos
   *  dois, então sai sem negrito nenhum. */
  var BUDGET_ADVISORY_LEAD_INS_ = ['Gastar no máximo', 'Evitar gastos'];
  function budgetAdvisoryHtml_(text) {
    for (var i = 0; i < BUDGET_ADVISORY_LEAD_INS_.length; i++) {
      var leadIn = BUDGET_ADVISORY_LEAD_INS_[i];
      if (text.indexOf(leadIn) === 0) {
        return '<strong>' + escapeHtml(leadIn) + '</strong>' + escapeHtml(text.slice(leadIn.length));
      }
    }
    return escapeHtml(text);
  }
  /**
   * Mesmo intervalo de datas que a barra do orçamento em Início está mostrando AGORA
   * (ver STATE.budgetViewPeriod/buildBudgetTimelineHtml) — "Últimos dias" (janela
   * rolante) ou um mês específico — pra "Ver lançamentos" abrir o Extrato com uma soma
   * que bate com o valor exibido na barra que foi clicada.
   */
  function budgetProgressDateRange_(b) {
    var period = budgetSelectedPeriod_();
    if (period === 'rolling') {
      var today = new Date();
      var fromDate = new Date(today);
      fromDate.setDate(fromDate.getDate() - (b.intervalDays - 1));
      return { fromYmd: ymdFromDate_(fromDate), toYmd: ymdFromDate_(today) };
    }
    return budgetMonthRange_(period);
  }
  /** [fromYmd,toYmd] do mês de calendário inteiro (ym = 'YYYY-MM'). */
  function budgetMonthRange_(ym) {
    return { fromYmd: ym + '-01', toYmd: ym + '-' + String(daysInMonth_(ym)).padStart(2, '0') };
  }
  /** Período que o seletor do card de Orçamentos (Início) está mostrando AGORA: 'rolling'
   *  ("Últimos dias") ou 'YYYY-MM'. Um mês que deixou de ser uma das opções (ex: o único
   *  lançamento dele foi removido) cai de volta em 'rolling'. Uma fonte só pra barra, o
   *  "Ver lançamentos" e o resumo do menu de segurar, que precisam sempre concordar. */
  function budgetSelectedPeriod_() {
    var period = STATE.budgetViewPeriod;
    if (period !== 'rolling' && budgetMonthOptions_(STATE.dashboard.month).indexOf(period) === -1) return 'rolling';
    return period;
  }
  /** "Ver lançamentos" de um orçamento: Extrato filtrado pelas categorias dele + o
   *  mesmo período que a barra está exibindo agora. Automático (b.periodMode==='auto')
   *  em "Últimos dias" usa sempre os últimos X dias derivados de Y (ver
   *  budgetAutoWindowDays_) em vez do intervalDays dele; num MÊS escolhido no seletor
   *  usa o mês inteiro, igual os manuais. */
  function viewBudgetTransactions_(b) {
    var range = (b.periodMode === 'auto' && budgetSelectedPeriod_() === 'rolling')
      ? budgetRollingWindow_({ intervalDays: budgetAutoWindowDays_() || 1 })
      : budgetProgressDateRange_(b);
    // useEffectiveDate:true -- o gasto mostrado na barra (spentForBudgetInRange_ etc.)
    // já soma pela data EFETIVA (parcela 2+ conta no mês da FATURA, não da compra, ver
    // budgetEffectiveDate_); sem isso aqui, uma parcela cuja fatura cai neste período mas
    // cuja compra foi antes (ou vice-versa) aparecia (ou não) na lista sem bater com o
    // total que a barra mostra (bug relatado pro orçamento de "não orçamentado", mesma
    // causa se aplicava aqui).
    STATE.txFilters = { categoryIds: b.categoryIds.slice(), dateFrom: range.fromYmd, dateTo: range.toYmd, useEffectiveDate: true };
    STATE.currentView = 'transactions';
    delete scrollPositions_.transactions; // chega com filtro novo — não faz sentido herdar scroll de uma navegação anterior
    render();
  }
  /** Progresso (spent/limit/status) do orçamento b no período que a tela está exibindo
   *  agora (STATE.budgetViewPeriod) -- mesma lógica de período que buildBudgetTimelineHtml
   *  usa pra desenhar a barra, só que sob demanda pra UM orçamento (usada por
   *  setupBudgetBarMenus_, que precisa recalcular na hora de abrir o menu -- pode ter
   *  passado tempo/mudado STATE.allTransactions desde o render da barra). Não vale a
   *  pena buildBudgetTimelineHtml chamar isso (ela já calcula period/pins UMA VEZ fora
   *  do loop de todos os orçamentos; isso aqui recalcularia por orçamento).
   */
  function budgetProgressForCurrentPeriod_(b) {
    var period = budgetSelectedPeriod_();
    var referenceFraction = (period !== 'rolling' && period === STATE.dashboard.month) ? computeMonthPinsAndReference_(period).referenceFraction : null;
    if (b.periodMode === 'auto') {
      var windowDays = budgetAutoWindowDays_();
      if (!windowDays) return { spent: 0, limit: 0, status: 'ok' };
      return period === 'rolling'
        ? computeBudgetAutoProgress_(b.categoryIds, windowDays).progress
        : computeBudgetAutoMonthProgress_(b.categoryIds, windowDays, period, referenceFraction);
    }
    if (period === 'rolling') return computeBudgetRollingProgress_(b, true);
    return computeBudgetMonthProgress_(b, period, referenceFraction);
  }
  /**
   * Card de resumo "Automático"/"Manual" do dropdown de segurar uma barra de orçamento
   * (pedido explícito do usuário, substituiu a cápsula solta "R$X de R$Y" -- unificado
   * entre os 2 tipos): título + linhas separadas por uma borda fina. Cada linha ou é só
   * informativa (div, ex: o teto) ou clicável (button -- mesma ação de filtrar o
   * Extrato que "Ver lançamentos" fazia, por isso ele saiu do menu). rows =
   * [{text, onClick?}].
   */
  function buildBudgetMenuSummaryCard_(title, rows) {
    var card = document.createElement('div');
    card.className = 'budget-menu-summary';
    var titleEl = document.createElement('div');
    titleEl.className = 'budget-menu-summary-title';
    titleEl.textContent = title;
    card.appendChild(titleEl);
    rows.forEach(function (row) {
      var rowEl = document.createElement(row.onClick ? 'button' : 'div');
      rowEl.className = 'budget-menu-summary-row' + (row.onClick ? ' clickable' : '');
      if (row.onClick) { rowEl.type = 'button'; rowEl.onclick = row.onClick; }
      rowEl.textContent = row.text;
      card.appendChild(rowEl);
    });
    return card;
  }
  /**
   * Segurar uma barra de orçamento (Início) revela um dropdown com o card de resumo
   * (ver buildBudgetMenuSummaryCard_ acima -- a 1ª linha, clicável, cobre o que "Ver
   * lançamentos" fazia antes) + "Editar orçamento" pras barras de orçamento de verdade
   * -- mesma formatação/animação do menu do "+" (ver setupHoldToReveal_/

  /**

   * janela -- a mesma conta de budgetMonthlyAmount_ e do "R$ X / mês" de Planejamento),
   * e o gasto usa as mesmas exclusões do Automático (fora das análises e vinculado a

  /** Pinos de Hoje/Pendência mais antiga + a fração de referência, pro mês de calendário informado. */

    var pendingThisMonth = STATE.pendingEntries.filter(function (p) {
      return p.date && p.date.indexOf(targetYm) === 0;

      return (a.date + (a.time || '00:00')).localeCompare(b.date + (b.time || '00:00'));

      pendenciasFraction = (pDay - 1 + (Number(pTime[0]) * 60 + Number(pTime[1])) / 1440) / daysInMo;

    var referenceFraction = Math.max(pendenciasFraction !== null ? pendenciasFraction : todayFraction, 1 / (daysInMo * 1440));

    // depende da largura real do rótulo, então quem decide é placeTimePinLabels_ depois

      (pendenciasDate ? '<div class="time-pin" style="left:' + (pendenciasFraction * 100) + '%" data-tooltip="Mais antigo para confirmar, ' + escapeHtml(fmtDayMonth(pendenciasDate)) + '"></div>' : '');

  /**

    if (!activeBudgets.length && !newBudgetSuggestions.length && !showCatchAll) return '';

    // Automático (b.periodMode==='auto') em "Últimos dias" usa sempre a janela móvel de X
    // dias derivada de Y (mesmo período que a barra catch-all); num MÊS escolhido no
    // seletor, o mês inteiro contra o teto derivado proporcional (ver
    // computeBudgetAutoMonthProgress_) -- antes o Automático ignorava o seletor de mês, e
    // quem só tem orçamentos Automático via as barras "não mudarem" (bug relatado). Sem
    // histórico suficiente ainda (autoWindowDays null), mostra um aviso no lugar da barra.
    var barsHtml = activeBudgets.map(function (b) {
      if (b.periodMode === 'auto' && !autoWindowDays) {
        return '<div class="budget-timebar-track" data-budget-bar="' + b.id + '" style="display:flex;align-items:center;padding:8px 12px">' +
          '<span class="budget-timebar-name" style="flex:1">' + budgetIconHtml_(b) + escapeHtml(b.categoryName) + '</span>' +
          '<span class="muted" style="font-size:12px">Histórico insuficiente</span>' +
        '</div>';
      }
      var progress, adviceHtml = null;
      if (b.periodMode === 'auto' && period === 'rolling') {
        var auto = computeBudgetAutoProgress_(b.categoryIds, autoWindowDays);
        progress = auto.progress;
        adviceHtml = budgetAdvisoryHtml_(computeBudgetAdvisory_(auto.shimBudget, progress, true));
      } else if (b.periodMode === 'auto') {
        progress = computeBudgetAutoMonthProgress_(b.categoryIds, autoWindowDays, period, isCurrentMonth ? pins.referenceFraction : null);
        if (isCurrentMonth) adviceHtml = budgetAdvisoryHtml_(computeBudgetMonthAdvisory_(b, period, progress, true));
      } else if (period === 'rolling') {
        progress = computeBudgetRollingProgress_(b, true);
        adviceHtml = budgetAdvisoryHtml_(computeBudgetAdvisory_(b, progress, true));
      } else {
        progress = computeBudgetMonthProgress_(b, period, isCurrentMonth ? pins.referenceFraction : null);
        if (isCurrentMonth) adviceHtml = budgetAdvisoryHtml_(computeBudgetMonthAdvisory_(b, period, progress, true));
      }
      // "Últimos dias" e o mês ATUAL mostram o aviso de ritmo (adviceHtml); um mês PASSADO
      // (sem aviso, já fechado) mostra "R$ gasto de R$ limite" (pedido explícito do
      // usuário, ver budgetSpentOfLimitText_) -- o mesmo número que o popover de segurar a
      // barra também traz.
      if (!adviceHtml && period !== 'rolling') adviceHtml = escapeHtml(budgetSpentOfLimitText_(progress));
      var valueHtml = adviceHtml ? '<span class="budget-timebar-value">' + adviceHtml + '</span>' : '';
      var fillFraction = progress.limit > 0 ? Math.min(1, progress.spent / progress.limit) : (progress.spent > 0 ? 1 : 0);
      return '<div class="budget-timebar-track" data-budget-bar="' + b.id + '">' +
        '<div class="budget-timebar-fill status-' + progress.status + '" style="width:' + (fillFraction * 100) + '%"></div>' +
        '<div class="budget-timebar-label" style="' + budgetBarTextStyle_() + '">' +
          '<span class="budget-timebar-name">' + budgetIconHtml_(b) + escapeHtml(b.categoryName) + '</span>' +
          valueHtml +
        '</div>' +
      '</div>';
    }).join('');

    // Barra própria (não um orçamento real por baixo) pontilhada em azul e em itálico --
    // progresso usa os mesmos dados já apurados pela sugestão (gasto na janela ÷ valor
    // sugerido), mesma lógica de uma barra real "Últimos dias", só com o valor sugerido
    // no lugar do limite configurado.
    var newSuggestionsHtml = newBudgetSuggestions.map(function (s) {
      var ratio = s.suggestedAmount > 0 ? s.total / s.suggestedAmount : (s.total > 0 ? Infinity : 0);
      var status = statusForRatio_(ratio);
      var fillFraction = Math.min(1, s.suggestedAmount > 0 ? s.total / s.suggestedAmount : (s.total > 0 ? 1 : 0));
      return '<div class="budget-timebar-track suggestion suggestion-new" data-budget-suggestion="' + s.categoryId + '">' +
        '<div class="budget-timebar-fill status-' + status + '" style="width:' + (fillFraction * 100) + '%"></div>' +
        '<div class="budget-timebar-label" style="' + budgetBarTextStyle_() + '">' +
          '<span class="budget-timebar-name">' + categoryIconHtml_(s.categoryId) + escapeHtml(s.categoryName) + '</span>' +
          '<span class="budget-timebar-value">' + escapeHtml(fmtMoneyNoCents_(s.suggestedAmount)) + '</span>' +
        '</div>' +
      '</div>';
    }).join('');

    // Barra própria pras despesas que não caem em nenhum orçamento real (segue o seletor
    // de período, ver catchAllProgress acima; as sugestões acima é que continuam sempre
    // no período atual). Sem ícone (não é uma categoria só) e sem borda pontilhada/
    // itálico (não é uma sugestão pra confirmar ou descartar -- ela mesma já é "de
    // verdade", só que auto-gerenciada). Mesmo texto de aviso de ritmo que as demais
    // barras Automático mostram, não "X de Y" -- pedido explícito do usuário, pra ficar
    // visualmente igual às outras. Mês passado: sem texto (nada mais a "evitar"), igual
    // aos orçamentos manuais.
    var catchAllFillFraction = catchAllProgress ? (catchAllProgress.limit > 0 ? Math.min(1, catchAllProgress.spent / catchAllProgress.limit) : (catchAllProgress.spent > 0 ? 1 : 0)) : 0;
    var catchAllAdviceHtml = '';
    if (showCatchAll) {
      var catchAllCategoryIds = unbudgetedExpenseCategoryIds_();
      if (period === 'rolling') {
        catchAllAdviceHtml = budgetAdvisoryHtml_(computeBudgetAdvisory_({ categoryIds: catchAllCategoryIds, intervalDays: autoWindowDays }, catchAllProgress, true));
      } else if (isCurrentMonth) {
        catchAllAdviceHtml = budgetAdvisoryHtml_(computeBudgetMonthAdvisory_({ categoryIds: catchAllCategoryIds }, period, catchAllProgress, true));
      } else {
        catchAllAdviceHtml = escapeHtml(budgetSpentOfLimitText_(catchAllProgress)); // mês passado, igual às demais barras
      }
    }
    var catchAllHtml = !showCatchAll ? '' :
      '<div class="budget-timebar-track" data-budget-catchall="' + catchAllBudget.id + '">' +
        '<div class="budget-timebar-fill status-' + catchAllProgress.status + '" style="width:' + (catchAllFillFraction * 100) + '%"></div>' +
        '<div class="budget-timebar-label" style="' + budgetBarTextStyle_() + '">' +
          '<span class="budget-timebar-name">Não orçamentado</span>' +
          (catchAllAdviceHtml ? '<span class="budget-timebar-value">' + catchAllAdviceHtml + '</span>' : '') +
        '</div>' +
      '</div>';

    return '<div class="card">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">' +
        '<h2 style="margin-bottom:0">Orçamentos</h2>' +
        selectorHtml +
      '</div>' +
      (pins ? '<div class="budget-timeline-header">' + pins.pinsHtml + '</div>' : '') +
      barsHtml + newSuggestionsHtml + catchAllHtml +
    '</div>';
  }

  // ---------- gráfico de tendência de saldo ----------
  var BALANCE_TREND_PAST_MONTHS = 6;
  var BALANCE_TREND_FUTURE_MONTHS = 12;

  /** "Outubro" — nome completo capitalizado, sem ano; usado no eixo do gráfico (mês atual usa "Hoje" à parte). */
  function fmtMonthFullNoYear_(ym) {
    var name = MONTH_NAMES_PT[Number(ym.split('-')[1]) - 1];
    return name.charAt(0).toUpperCase() + name.slice(1);
  }
  function shiftYm_(ym, delta) {
    var parts = ym.split('-');
    var d = new Date(Number(parts[0]), Number(parts[1]) - 1 + delta, 1);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }
  /** Próximos `count` meses (YYYY-MM), a partir do atual (inclusive) — pro seletor de mês de um Plano. */
  function upcomingMonthOptions_(count) {
    var currentYm = ymdFromDate_(new Date()).slice(0, 7);
    var months = [];
    for (var i = 0; i < count; i++) months.push(shiftYm_(currentYm, i));
    return months;
  }

  /** Contas que entram na Projeção do saldo — investimento só quando o toggle "Incluir
   *  investimentos" estiver ligado (ver buildBalanceTrendHtml_). */
  function trendAccounts_() {
    return STATE.accounts.filter(function (a) {
      return STATE.trendIncludeInvestments || a.type !== 'investment';
    });
  }

  /** Saldo total (ver trendAccounts_) considerando só lançamentos com data ≤ ymd. */
  function totalBalanceAsOfYmd_(ymd) {
    return trendAccounts_()
      .reduce(function (sum, a) {
        var txSum = STATE.allTransactions.reduce(function (s, t) {
          if (t.accountId !== a.id || !t.date || t.date > ymd) return s;
          return s + (t.kind === 'income' || t.kind === 'transfer_in' ? 1 : -1) * t.amount;
        }, 0);
        return sum + a.initialBalance + txSum;
      }, 0);
  }

  /**
   * Delta recorrente esperado (receita - despesa) pro mês ym, só com o que está
   * explicitamente em Planejamento (Lançamentos recorrentes + Orçamentos escalados pro
   * mês) — por decisão explícita do usuário, sem nenhuma média histórica de gasto fora
   * desses dois mecanismos: aqui o objetivo é refletir só o plano, não o hábito real.
   * TODO orçamento entra, inclusive o de uma categoria que também tem lançamento
   * recorrente (pedido explícito do usuário, 2026-09-30): os orçamentos ignoram os
   * lançamentos vinculados a um recorrente (ver spentForBudgetInRange_), então cada um
   * cobre só o gasto FORA do recorrente e o recorrente entra à parte -- nada é contado
   * 2x. Antes, esses orçamentos ficavam de fora da projeção "pra não contar 2x" (o
   * orçamento então ainda somava o gasto do recorrente), o que passou a subestimar o gasto.
   */
  /**
   * Impacto médio mensal de um lançamento recorrente: em dias, escalado pelo tamanho do
   * mês igual a Orçamentos (R$100 a cada 15 dias ~R$200/mês); em meses de verdade, é só
   * expectedAmount/intervalDays (R$600 a cada 3 meses = R$200/mês, sem depender de
   * quantos dias tem o mês projetado — 3 MESES não é 90 dias).
   */
  function forecastMonthlyAverage_(f, ym) {
    return f.intervalUnit === 'months'
      ? f.expectedAmount / f.intervalDays
      : f.expectedAmount * (daysInMonth_(ym) / f.intervalDays);
  }
  function recurringMonthlyDeltaForMonth_(ym) {
    var activeForecasts = STATE.forecasts.filter(function (f) { return !f.archived; });
    var income = activeForecasts.filter(function (f) { return f.kind === 'income'; })
      .reduce(function (sum, f) { return sum + forecastMonthlyAverage_(f, ym); }, 0);
    var expense = activeForecasts.filter(function (f) { return f.kind === 'expense'; })
      .reduce(function (sum, f) { return sum + forecastMonthlyAverage_(f, ym); }, 0);
    // !b.isUnbudgetedCatchAll -- mesmo filtro usado em TODA outra listagem de orçamentos
    // reais deste arquivo (buildBudgetTimelineHtml, renderBudgets, openBudgetModal);
    // faltava só aqui. Inofensivo por ora (b.amount da linha de "não orçamentado" nunca é
    // escrito, fica 0 pra sempre -- contribuiria 0 de qualquer jeito), mas sem o filtro
    // essa linha ficaria incluída "por acidente" se algum dia passasse a valer alguma
    // coisa, sem que ninguém tivesse pedido isso pra projeção de saldo.
    var autoWindowDaysForTrend_ = budgetAutoWindowDays_();
    var budgetsExpense = STATE.budgets.filter(function (b) { return !b.archived && !b.isUnbudgetedCatchAll; })
      .reduce(function (sum, b) {
        // Automático não tem b.amount/b.intervalDays reais (placeholders, ver
        // openBudgetModal) -- escala o teto DERIVADO (mesmo cálculo da barra) pro
        // tamanho do mês em vez deles, mesma ideia da lista de Planejamento (ver
        // renderBudgets). Sem histórico suficiente ainda, soma 0.
        if (b.periodMode === 'auto') {
          if (!autoWindowDaysForTrend_) return sum;
          var auto = computeBudgetAutoProgress_(b.categoryIds, autoWindowDaysForTrend_);
          return sum + auto.shimBudget.amount * (daysInMonth_(ym) / autoWindowDaysForTrend_);
        }
        return sum + scaledLimitForMonth_(b, ym);
      }, 0);
    return income - expense - budgetsExpense;
  }

  /**
   * Gasto mensal médio: soma de TODAS as despesas (sem filtro de categoria) dos últimos
   * 3 meses corridos (dia de hoje pra trás, ex: hoje 12/set -> desde 12/jun -- não
   * alinhado a mês de calendário, pedido explícito do usuário) dividida por 3; se o
   * histórico de despesas for mais curto que isso mas tiver pelo menos 1 mês, usa o que
