  /**
   * Chips dos filtros ativos no cabeçalho do card, só quando ele está COLAPSADO --
   * expandido, os próprios campos abaixo já mostram o que está selecionado, então um
   * chip ali seria redundante (pedido explícito do usuário). Uma linha só: mede depois
   * de renderizar e, se não couber tudo, tira chips do FIM (nunca do começo) e troca o
   * que sobrou por "..." -- nunca quebra linha (pedido explícito do usuário).
   */
  function renderTxFilterChips_() {
    var container = document.getElementById('tx-filters-chips');
    if (!container) return;
    if (STATE.txFiltersExpanded) { container.innerHTML = ''; return; }
    var f = STATE.txFilters;
    // { text, isSearch } -- o de busca precisa de um max-width+ellipsis PRÓPRIO (ver
    // .tx-filter-chip-search), já que sozinho pode ser bem mais comprido que qualquer
    // nome de conta/categoria e dominar a linha inteira.
    var chips = [];
    if (f.accountId) {
      var acc = STATE.accounts.find(function (a) { return a.id === f.accountId; });
      if (acc) chips.push({ text: acc.name });
    }
    var chipCatIds = f.categoryIds || [];
    var everyCategory = STATE.categories.length > 0 && STATE.categories.every(function (c) { return chipCatIds.indexOf(c.id) !== -1; });
    if (everyCategory) {
      chips.push({ text: 'Todas as categorias' }); // opção "Todas" do filtro -- 50 chips não cabem e não dizem nada
    } else {
      chipCatIds.forEach(function (id) {
        var cat = STATE.categories.find(function (c) { return c.id === id; });
        if (cat) chips.push({ text: cat.name });
      });
    }
    if (f.text) chips.push({ text: f.text, isSearch: true });
    if (f.dateFrom || f.dateTo) {
      var dateLabel = f.dateFrom && f.dateTo ? fmtDate(f.dateFrom) + '–' + fmtDate(f.dateTo)
        : f.dateFrom ? 'A partir de ' + fmtDate(f.dateFrom) : 'Até ' + fmtDate(f.dateTo);
      chips.push({ text: dateLabel });
    }
    if (!chips.length) { container.innerHTML = ''; return; }
    // Mesma formatação/cor/tamanho da cápsula SELECIONADA quando o card está expandido
    // (pedido explícito do usuário) -- .capsule.active, só sem cursor:pointer (não são
    // clicáveis, ver CSS #tx-filters-chips .capsule).
    container.innerHTML = chips.map(function (c) {
      return '<span class="capsule active' + (c.isSearch ? ' tx-filter-chip-search' : '') + '">' + escapeHtml(c.text) + '</span>';
    }).join('');

    if (container.scrollWidth <= container.clientWidth) return;
    var realChips = Array.prototype.slice.call(container.children);
    var ellipsis = document.createElement('span');
    ellipsis.className = 'capsule';
    ellipsis.textContent = '...';
    container.appendChild(ellipsis);
    while (container.scrollWidth > container.clientWidth && realChips.length) {
      realChips.pop().remove();
    }
  }

  function txMatchesFilters(t, f) {
    if (f.accountId && t.accountId !== f.accountId) return false;
    if (f.categoryIds && f.categoryIds.length && f.categoryIds.indexOf(t.categoryId) === -1) return false;
    if (f.text) {
      var needle = f.text.trim().toLowerCase();
      // (Number||0).toLocaleString('pt-BR') em vez de fmtMoney: fmtMoney usa o formato de
      // moeda do Intl, que insere um espaço NÃO separável entre "R$" e o número — um
      // espaço comum digitado na busca nunca bateria com aquele caractere diferente.
      var haystack = ((t.counterparty || '') + ' ' + (t.description || '') + ' ' + (Number(t.amount) || 0).toLocaleString('pt-BR')).toLowerCase();
      if (needle && haystack.indexOf(needle) === -1) return false;
    }
    // useEffectiveDate (só usado por viewBudgetTransactions_/viewUnbudgetedCatchAllTransactions_,
    // nunca pelos filtros manuais do Extrato -- ali De/Até é sempre a data CRUA de
    // propósito, é o que o usuário vê no extrato do banco) -- compara De/Até contra
    // budgetEffectiveDate_ (parcela 2+ conta no mês da FATURA) em vez de t.date puro,
    // pra bater com a mesma soma que os orçamentos usam (spentForBudgetInRange_ etc.).
    var effDate = f.useEffectiveDate ? budgetEffectiveDate_(t) : t.date;
    if (f.dateFrom && effDate < f.dateFrom) return false;
    if (f.dateTo && effDate > f.dateTo) return false;
    return true;
  }

  /** STATE.pendingTransactions (prévias otimistas) + STATE.allTransactions, já filtrados
   *  por STATE.txFilters e sem quem está sendo excluído agora (STATE.deletingIds) --
   *  exatamente o conjunto que o Extrato exibe. Compartilhado por loadTxList (a lista em
   *  si), o calendário do Extrato (soma diária) e scrollToTxDay_ (achar em qual página
   *  um dia cai), pra não recalcular esse filtro 3 vezes com pequenas variações. */
  function currentFilteredTransactionsCombined_() {
    var pending = STATE.pendingTransactions.filter(function (t) { return txMatchesFilters(t, STATE.txFilters); });
    var txs = STATE.allTransactions.filter(function (t) { return txMatchesFilters(t, STATE.txFilters); });
    return pending.concat(txs).filter(function (t) { return STATE.deletingIds.indexOf(t.id) === -1; });
  }

  function txFiltersActive_(f) {
    return !!(f.accountId || (f.categoryIds && f.categoryIds.length) || f.text || f.dateFrom || f.dateTo);
  }

  /**
   * "R$ X no total · R$ Y por dia · R$ Z por lançamento" no cabeçalho do calendário,
   * só quando há filtro ativo (pedido explícito do usuário) -- mesma lista da própria
   * grade do calendário (currentFilteredTransactionsCombined_: pendências + confirmados,
   * ver renderTxCalendarWeeks_), todo o histórico filtrado, não só as semanas visíveis
   * no momento, e mesma convenção de sinal (receita soma, despesa subtrai -- ver
   * computeCalendarDayNets_).
   * "Por dia": se De E Até estiverem os dois preenchidos, usa esse intervalo exato
   * (inclui dias sem lançamento nenhum, uma média "por dia do período" de verdade);
   * senão cai pro intervalo entre o lançamento filtrado mais antigo e o mais novo.
   */
  function buildTxCalendarFilteredStatsHtml_() {
    var f = STATE.txFilters;
    if (!txFiltersActive_(f)) return '';
    var combined = currentFilteredTransactionsCombined_();
    var total = 0, count = 0, minDate = null, maxDate = null;
    combined.forEach(function (t) {
      // Mesma regra dos dias do calendário (computeCalendarDayNets_): fora os "Não considerar
      // em análises?" -- o cabeçalho passa a bater com a soma das células (pedido explícito).
      if (!t.date || t.excludeFromAnalysis) return;
      if (!minDate || t.date < minDate) minDate = t.date;
      if (!maxDate || t.date > maxDate) maxDate = t.date;
      if (t.kind === 'income') { total += t.amount; count++; }
      else if (t.kind === 'expense') { total -= t.amount; count++; }
    });
    if (!count) return '';
    var days = (f.dateFrom && f.dateTo)
      ? Math.round((parseYmdLocal_(f.dateTo) - parseYmdLocal_(f.dateFrom)) / 86400000) + 1
      : Math.round((parseYmdLocal_(maxDate) - parseYmdLocal_(minDate)) / 86400000) + 1;
    days = Math.max(1, days);
    // Nunca "-R$" -- cor verde/vermelha no valor (igual toda quantia com sinal do app,
    // ver .amount-income/.amount-expense) no lugar do sinal (pedido explícito do
    // usuário); >=0 cai no verde, mesmo desempate de computeCalendarDayNets_ (net===0
    // também é "positivo"). "·" com mais respiro ao redor (pedido explícito do usuário).
    var cls = total < 0 ? 'amount-expense' : 'amount-income';
    var sep = '<span style="margin:0 6px">·</span>';
    // Reembolsos ainda NÃO recebidos (Shares incompletas) das despesas desse mesmo
    // período filtrado -- só aparece "se houver" (pedido explícito do usuário). Cor
    // NEUTRA (var(--text), não --income/--expense) de propósito: não é dinheiro já
    // ganho nem gasto ainda, só uma expectativa de recebimento.
    var pendingRefund = 0;
    combined.forEach(function (t) {
      if (t.kind !== 'expense') return;
      sharesOfPassive_(t.id).forEach(function (s) { pendingRefund += remainingForShare_(s); });
    });
    var refundHtml = pendingRefund >= 0.01
      ? sep + '<span style="color:var(--text)">' + escapeHtml(fmtMoneyNoCents_(pendingRefund)) + '</span> a receber de reembolsos'
      : '';
    return '<span class="' + cls + '">' + escapeHtml(fmtMoneyNoCents_(Math.abs(total))) + '</span> no total' + sep +
      '<span class="' + cls + '">' + escapeHtml(fmtMoneyNoCents_(Math.abs(total / days))) + '</span> por dia' + sep +
      '<span class="' + cls + '">' + escapeHtml(fmtMoneyNoCents_(Math.abs(total / count))) + '</span> por lançamento' + refundHtml;
  }

  function renderTxCalendarFilteredStats_() {
    var el = document.getElementById('tx-calendar-filtered-stats');
    if (el) el.innerHTML = buildTxCalendarFilteredStatsHtml_();
  }

  /** Agrupa por data preservando a ordem de chegada (o array já vem do mais recente pro
   *  mais antigo — ver listTransactions, Transactions.js) e, DENTRO de cada dia, ordena por
   *  horário crescente (do mais cedo pro mais tarde) — o oposto da ordem entre os dias. */
  function groupTransactionsByDate_(list) {
    var order = [];
    var byDate = {};
    list.forEach(function (t) {
      if (!byDate[t.date]) { byDate[t.date] = []; order.push(t.date); }
      byDate[t.date].push(t);
    });
    order.forEach(function (date) {
      byDate[date].sort(function (a, b) {
        var aTime = a.time || '', bTime = b.time || '';
        if (aTime !== bTime) return aTime < bTime ? -1 : 1;
        return 0;
      });
    });
    return order.map(function (date) { return { date: date, items: byDate[date] }; });
  }

  function renderTxList(combined) {
    var list = document.getElementById('tx-list');
    if (!list) return;
    // Ordena por data (mais recente primeiro, igual ao que o servidor devolve) ANTES de
    // agrupar — groupTransactionsByDate_ respeita a ordem de PRIMEIRA APARIÇÃO, e como as
    // prévias otimistas entram na frente no concat, o grupo da data delas ia parar no
    // TOPO. Quando o dado real chegava e a lista voltava a ficar ordenada, esse grupo
    // "pulava" pro lugar cronológico certo — numa data antiga, isso é literalmente o card
    // aparecer e sumir de vista alguns segundos depois (bug reportado).
    combined.sort(function (a, b) {
      var da = a.date || '', db = b.date || '';
      if (da !== db) return da < db ? 1 : -1;
      return 0;
    });
    var groups = groupTransactionsByDate_(combined);

    // Data de algo recém-criado (prévia otimista ou lançamento que acabou de confirmar,
    // ver recentlyCreatedTxIds_) entra na tela mesmo caindo além do limite de paginação —
    // senão salvar um lançamento numa data antiga não mostra nada, já que o grupo dele
    // fica lá embaixo no histórico.
    var mustShowDates = {};
    combined.forEach(function (t) {
      if (t.pending || recentlyCreatedTxIds_[t.id]) mustShowDates[t.date] = true;
    });

    // Corta em grupos INTEIROS (nunca no meio de um dia) assim que passar do limite
    // visível — sem isso, anos de histórico renderizam milhares de linhas de DOM de uma
    // vez, o que pesa tanto pra montar quanto pra filtrar de novo a cada tecla digitada.
    var visibleGroups = [];
    var shown = 0;
    for (var i = 0; i < groups.length; i++) {
      if (shown >= STATE.txVisibleCount && !mustShowDates[groups[i].date]) continue;
      visibleGroups.push(groups[i]);
      shown += groups[i].items.length;
    }
    var hasMore = visibleGroups.length < groups.length;

    var groupsHtml = visibleGroups.map(function (g) {
      var rows = g.items.map(function (t) { return extratoRowHtml(t); }).join('');
      // id="tx-day-..." -- âncora pro clique num dia do calendário (ver scrollToTxDay_).
      return '<div class="tx-day" id="tx-day-' + g.date + '"><div class="tx-day-label">' + escapeHtml(fmtCardDate_(g.date)) + '</div>' +
        '<div class="card tx-day-card">' + rows + '</div></div>';
    }).join('');

    list.innerHTML = (groupsHtml || '<div class="card"><div class="empty-state">Nenhum lançamento encontrado.</div></div>') +
      (hasMore ? '<button type="button" class="secondary" id="tx-load-more" style="width:100%">Carregar mais</button>' : '');

    list.querySelectorAll('.amount-expense[data-tooltip], .amount-income[data-tooltip], .tx-flag-icon[data-tooltip]').forEach(wireTooltipTrigger_);

    list.querySelectorAll('[data-tx]').forEach(function (el) {
      el.onclick = function () {
        var t = combined.find(function (x) { return x.id === el.dataset.tx; });
        if (t) openTransactionDetailModal(t);
      };
    });
    var loadMoreBtn = document.getElementById('tx-load-more');
    if (loadMoreBtn) loadMoreBtn.onclick = function () {
      STATE.txVisibleCount += TX_PAGE_SIZE;
      loadTxList();
    };
  }

  /** Editar data/horário/valor/categoria/conta/contraparte/referente de um lançamento existente (não transferência). */
  /** Aplica os campos editados de volta no próprio objeto (mesma referência usada por
   *  STATE.allTransactions e STATE.dashboard.recentTransactions), pra refletir na hora. */
  /**
   * Marcar/desmarcar "Não considerar em análises?" num lançamento do MÊS ATUAL: ajusta na hora os
   * agregados de STATE.dashboard que alimentam a rosca "Gastos por categoria" e os totais do mês
   * (o servidor já os calcula SEM os marcados, ver getDashboardData; sem esse ajuste a rosca só
   * acompanharia a mudança depois do refresh completo). Marcar tira o valor BRUTO do agregado
   * (é o que o servidor soma; o desconto de reembolso é aplicado por cima, ver
   * netExpensesByCategory_), desmarcar devolve. Mesmo padrão de applyOptimisticEntry.
   */
  function applyOptimisticDashboardFlagChange_(tx, newFlag) {
    var d = STATE.dashboard;
    if (!d || !tx || !!tx.excludeFromAnalysis === !!newFlag) return;
    if (!tx.date || tx.date.indexOf(d.month) !== 0) return;
    var sign = newFlag ? -1 : 1;
    if (tx.kind === 'expense') {
      var name = topLevelCategoryName(tx.categoryId);
      var bucket = d.expensesByCategory.find(function (e) { return e.category === name; });
      if (bucket) bucket.amount += sign * tx.amount;
      else if (sign > 0) d.expensesByCategory.push({ category: name, amount: tx.amount });
      d.totalExpenseMonth += sign * tx.amount;
    } else if (tx.kind === 'income') {
      d.totalIncomeMonth += sign * tx.amount;
    }
  }
  // excludeFromAnalysis TEM que estar aqui: tudo que depende da flag (cor/valor do
  // calendário, médias, orçamentos Automático, projeção de saldo) é calculado no cliente a
  // partir de STATE.allTransactions -- sem ela na lista, marcar/desmarcar "Não considerar em
  // análises?" só surtia efeito depois do updateTransaction terminar E do refreshAll (uma
  // leitura completa do servidor, vários segundos) reler a planilha (bug relatado: "leva
  // bastante tempo pra atualizar os outros valores").
  var OPTIMISTIC_TX_EDIT_KEYS_ = ['date', 'time', 'accountId', 'categoryId', 'amount', 'counterparty', 'description', 'forecastId', 'forecastCycleMonth', 'excludeFromAnalysis'];
  function applyOptimisticTxEdit_(target, payload) {
    OPTIMISTIC_TX_EDIT_KEYS_.forEach(function (k) {
      if (payload[k] !== undefined) target[k] = payload[k];
    });
  }

  function removeTransactionOptimistically_(id) {
    STATE.deletingIds.push(id);
    render();
    // Sucesso não precisa desmarcar/re-renderizar aqui: applyBootstrapData já limpa
    // deletingIds inteiro assim que o refreshAll do afterMutation_ trouxer dado de
    // verdade (sem esse lançamento). Mesmo motivo do atraso de pendingTransactions no
    // Extrato: removendo 2 lançamentos rápido, o primeiro resolvia e desmarcava
    // deletingIds ANTES do refresh compartilhado (que só dispara quando o SEGUNDO,
    // ainda em voo, termina) — reaparecendo por alguns segundos até o refresh de
    // verdade confirmar que ele já tinha sido removido.
    // resolveRealId_: o lançamento pode ter sido criado agora e ainda estar com ID
    // temporário (a prévia do Extrato já é clicável — ver editable em
    // applyOptimisticEntry); espera a criação DELE confirmar pra mandar o ID real.
    afterMutation_(resolveRealId_(id).then(function (realId) {
      return run('deleteTransaction', realId);
    })).catch(function (err) {
      STATE.deletingIds = STATE.deletingIds.filter(function (x) { return x !== id; });
      showToast(err.message, true);
      refreshAll().then(render);
    });
  }

  /** Remove TODAS as parcelas de um grupo de uma vez (a ação padrão — ver
   *  openTransactionDetailModal) — mesmo padrão otimista de removeTransactionOptimistically_,
   *  só que escondendo todas as linhas do grupo, não uma só. */
  function removeInstallmentGroupOptimistically_(groupId) {
    var ids = STATE.allTransactions.filter(function (x) { return x.installmentGroupId === groupId; }).map(function (x) { return x.id; });
    ids.forEach(function (id) { STATE.deletingIds.push(id); });
    render();
    afterMutation_(run('deleteInstallmentGroup', groupId)).catch(function (err) {
      STATE.deletingIds = STATE.deletingIds.filter(function (x) { return ids.indexOf(x) === -1; });
      showToast(err.message, true);
      refreshAll().then(render);
    });
  }

  /** Clique num lançamento do Extrato ou dos Últimos lançamentos: editar campos ou remover. */
  function openTransactionDetailModal(t) {
    var isTransfer = t.kind === 'transfer_out' || t.kind === 'transfer_in';

    if (isTransfer) {
      // updateTransfer (Transactions.js) sempre mexe nas DUAS pernas juntas — por isso
      // precisa achar a irmã aqui antes de mais nada. Não deveria faltar em uso normal
      // (deleteTransaction sempre remove as 2 juntas — ver deleteTransfer), mas se
      // faltar por qualquer inconsistência, degrada com segurança pra só remover em vez
      // de arriscar editar com metade do estado.
      var sibling = STATE.allTransactions.find(function (x) { return x.transferGroupId === t.transferGroupId && x.id !== t.id; });
      if (!sibling) {
        openModal(
          '<h2>Transferência</h2>' +
          '<div class="muted" style="margin-bottom:16px">' + escapeHtml(t.description || 'Transferência') + '<br>' +
            fmtDate(t.date) + (t.time ? ' ' + t.time : '') + ' · ' + fmtMoney(t.amount) +
          '</div>' +
          '<div class="muted" style="margin-bottom:16px;color:var(--expense)">Não foi possível encontrar a outra perna dessa transferência — edição desabilitada por segurança.</div>' +
          '<button class="danger" id="e-remove" style="width:100%">Remover</button>'
        );
        document.getElementById('e-remove').onclick = function () {
          confirmPopover(document.getElementById('e-remove'), 'Remover esta transferência?', function () {
            closeModal();
            removeTransactionOptimistically_(t.id);
          });
        };
        return;
      }

      var outLeg = t.kind === 'transfer_out' ? t : sibling;
      var inLeg = t.kind === 'transfer_in' ? t : sibling;
      var accountItems = rankedAccountItems();
      var fromField, toField;

      function updateTransferBillFieldE_() {
        var toId = toField.getValue();
        var toAcc = STATE.accounts.find(function (a) { return a.id === toId; });
        var field = document.getElementById('e-transfer-bill-field');
        if (!field) return;
        if (toAcc && toAcc.type === 'credit_card') {
          var cc = STATE.dashboard && STATE.dashboard.creditCardSummaries.find(function (c) { return c.accountId === toId; });
          var bills = cc ? cc.bills : [];
          var currentBillMonth = inLeg.billMonth;
          var selectable = bills.filter(function (b) { return b.status === 'fechada' || b.status === 'atrasada' || b.billMonth === currentBillMonth; });
          field.innerHTML = '<div class="field"><label>Fatura paga por essa transferência</label><select id="e-transfer-bill">' +
            '<option value="">Não vinculada a nenhuma fatura</option>' +
            selectable.map(function (b) {
              return '<option value="' + b.billMonth + '"' + (b.billMonth === currentBillMonth ? ' selected' : '') + '>' +
                fmtMonthYear(b.billMonth) + ' · ' + fmtMoney(b.remaining) + ' (' + STATUS_LABELS[b.status] + ')</option>';
            }).join('') +
            '</select></div>';
        } else {
          field.innerHTML = '';
        }
      }

      openModal(
        '<h2>Editar transferência</h2>' +
        '<div class="field" style="display:flex;gap:8px">' +
          '<div style="flex:1"><label>Data</label><input type="date" id="e-date" value="' + t.date + '"></div>' +
          '<div style="flex:1"><label>Horário</label><input type="time" id="e-time" value="' + (t.time || '') + '"></div>' +
        '</div>' +
        '<div class="field"><label>De</label><div id="e-from-field" class="capsule-field"></div></div>' +
        '<div class="field"><label>Para</label><div id="e-to-field" class="capsule-field"></div></div>' +
        '<div class="field"><label>Valor</label><input type="text" id="e-amount"></div>' +
        '<div class="field"><label>Descrição</label><input id="e-desc" value="' + escapeHtml(t.description || '') + '"></div>' +
        '<div id="e-transfer-bill-field"></div>' +
        '<div style="display:flex;gap:8px;align-items:center">' +
          '<button class="danger" id="e-remove" style="flex:1">Remover</button>' +
          '<button id="m-submit" style="flex:1">Salvar</button>' +
          '<button type="button" class="secondary" id="e-save-copy" style="flex:0 0 auto;padding:4px 10px;font-size:12px">Salvar cópia</button>' +
        '</div>'
      );
      setupMoneyInput(document.getElementById('e-amount'), t.amount);
      fromField = createCapsuleField(document.getElementById('e-from-field'), {
        items: accountItems, selectedValue: outLeg.accountId
      });
      toField = createCapsuleField(document.getElementById('e-to-field'), {
        items: accountItems, selectedValue: inLeg.accountId, onChange: updateTransferBillFieldE_
      });
      updateTransferBillFieldE_();

      document.getElementById('e-remove').onclick = function () {
        confirmPopover(document.getElementById('e-remove'), 'Remover esta transferência?', function () {
          closeModal();
          removeTransactionOptimistically_(t.id);
        });
      };

      document.getElementById('m-submit').onclick = function () {
        var submitBtn = document.getElementById('m-submit');
        var amount = document.getElementById('e-amount').getValue();
        if (!amount || amount <= 0) { errorPopover(submitBtn, 'O valor precisa ser maior que zero.'); return; }
        var fromId = fromField.getValue();
        var toId = toField.getValue();
        if (!fromId || !toId) { errorPopover(submitBtn, 'Contas de origem e destino são obrigatórias.'); return; }
        if (fromId === toId) { errorPopover(submitBtn, 'Conta de origem e destino não podem ser a mesma.'); return; }
        var billSelect = document.getElementById('e-transfer-bill');
        var date = document.getElementById('e-date').value;
        var time = document.getElementById('e-time').value;
        var description = capitalizeFirst_(document.getElementById('e-desc').value);
        var payload = {
          transferGroupId: t.transferGroupId, date: date, time: time,
          fromAccountId: fromId, toAccountId: toId, amount: amount, description: description,
          billMonth: billSelect ? billSelect.value : ''
        };
        closeModal();

        // Otimista nas DUAS pernas — cada uma com sua própria conta, o resto (data/
        // horário/valor/descrição) igual, mesma convenção de applyOptimisticTxEdit_.
        [outLeg, inLeg].forEach(function (leg) {
          var legAccountId = leg === outLeg ? fromId : toId;
          [STATE.allTransactions, STATE.dashboard ? STATE.dashboard.recentTransactions : []].forEach(function (list) {
            var found = list && list.find(function (x) { return x.id === leg.id; });
            if (found) applyOptimisticTxEdit_(found, { date: date, time: time, accountId: legAccountId, amount: amount, description: description });
          });
        });
        render();

        afterMutation_(run('updateTransfer', payload)).catch(function (err) {
          showToast(err.message, true);
          refreshAll().then(render);
        });
      };

      // "Salvar cópia": mesma ideia da versão não-transferência (ver mais abaixo) —
      // cria uma transferência NOVA com o que estiver no formulário, sem fechar o modal.
      document.getElementById('e-save-copy').onclick = function () {
        var copyBtn = document.getElementById('e-save-copy');
        var amount = document.getElementById('e-amount').getValue();
        if (!amount || amount <= 0) { errorPopover(copyBtn, 'O valor precisa ser maior que zero.'); return; }
        var fromId = fromField.getValue();
        var toId = toField.getValue();

  /**

  function loadTxList() {

  /** Rola até o card do dia clicado no calendário (ver renderTxCalendar_). Se esse dia
   *  cair além da paginação atual do Extrato (STATE.txVisibleCount), estende a página
   *  o suficiente pra incluir o grupo dele antes de rolar -- senão o elemento nem
   *  existiria ainda no DOM. Não faz nada se o dia não tiver nenhum lançamento filtrado
   *  (não deveria acontecer -- o calendário só deixa clicar em dia com dado). */
  function scrollToTxDay_(date) {
    var existing = document.getElementById('tx-day-' + date);
    if (!existing) {
      var combined = currentFilteredTransactionsCombined_();
      combined.sort(function (a, b) { var da = a.date || '', db = b.date || ''; if (da !== db) return da < db ? 1 : -1; return 0; });
      var groups = groupTransactionsByDate_(combined);
      var idx = groups.findIndex(function (g) { return g.date === date; });
      if (idx === -1) return;
      var neededCount = 0;
      for (var i = 0; i <= idx; i++) neededCount += groups[i].items.length;
      if (STATE.txVisibleCount < neededCount) {
        STATE.txVisibleCount = neededCount;
        loadTxList();
      }
      existing = document.getElementById('tx-day-' + date);
    }
    if (!existing) return;
    // O card do calendário é sticky (fica por cima ao rolar) -- scrollIntoView sozinho
    // alinharia o topo do dia exatamente com o topo da viewport, ficando ESCONDIDO atrás
    // do calendário (bug relatado). scroll-margin-top reserva esse tanto de espaço,
    // medido AGORA (a altura muda se o calendário estiver colapsado/expandido).
    var calendarCard = document.querySelector('.tx-calendar-card');
    existing.style.scrollMarginTop = (calendarCard ? calendarCard.getBoundingClientRect().height : 0) + 8 + 'px';
    existing.scrollIntoView({ behavior: 'smooth', block: 'start' });
    // Borda que pisca por 1s no card do dia (pedido explícito do usuário) -- remove
    // primeiro (+ força reflow com offsetWidth) antes de reaplicar, senão clicar em outro
    // dia (ou no mesmo) enquanto a animação anterior ainda roda não reinicia nada -- a
    // classe já estava lá, o navegador não vê mudança nenhuma pra reagir.
    existing.classList.remove('tx-day-flash');
    void existing.offsetWidth;
    existing.classList.add('tx-day-flash');
    setTimeout(function () { existing.classList.remove('tx-day-flash'); }, 2000);
  }

  // ---------- calendário do Extrato ----------
  /** Percentil p (0 a 1) de uma lista de números -- nearest-rank simples (é uma escala
   *  visual, não um relatório estatístico, não precisa de interpolação fina). */
  function computePercentile_(values, p) {
    if (!values.length) return 0;
    var sorted = values.slice().sort(function (a, b) { return a - b; });
    // "Nearest rank" padrão: rank 1-indexado = ceil(p*N), convertido pra índice 0.
    // Math.floor(p*N) direto (sem o ceil e o -1) parece igual à primeira vista, mas
    // quando p*N cai num número inteiro EXATO (ex: p=0.95, N=20 -> 19) ele aponta pro
    // ÚLTIMO elemento (o próprio máximo) em vez do penúltimo -- na prática, o P95 nunca
    // excluía nada (bug achado pelo teste automatizado: 20 valores normais + 1 outlier
    // continuava devolvendo o outlier como "referência").
    var idx = Math.min(sorted.length - 1, Math.max(0, Math.ceil(p * sorted.length) - 1));
    return sorted[idx];
  }

  /**
   * Faixa de datas (YYYY-MM-DD) que o calendário exibe, dado o filtro atual (f), as datas
   * dos lançamentos filtrados e hoje. Sem filtro de data: do lançamento filtrado mais
   * antigo até o mais novo, sempre incluindo hoje (a grade alcança o presente mesmo sem
   * lançamento nenhum ainda). COM De/Até: a faixa é exatamente essa -- antes o calendário
   * ignorava as datas do filtro e seguia até hoje (semanas e semanas de dias vazios fora
   * do período pedido, bug relatado). Só De: do De até hoje; só Até: do lançamento mais
   * antigo até o Até. Lançamento filtrado cuja data crua cai FORA de De/Até (só acontece
   * com useEffectiveDate: parcela 2+ cuja fatura cai no período mas a compra foi antes,
   * ver txMatchesFilters) estica a faixa o mínimo pra incluí-lo -- o Extrato lista esse
   * dia, então o calendário precisa continuar mostrando ele.
   */
  function calendarDateRangeForFilter_(f, txDates, todayStr) {
    var minDate = f.dateFrom || (f.dateTo && f.dateTo < todayStr ? f.dateTo : todayStr);
    var maxDate = f.dateTo || (f.dateFrom && f.dateFrom > todayStr ? f.dateFrom : todayStr);
    txDates.forEach(function (d) {
      if (!d) return;
      if (d < minDate) minDate = d;
      if (d > maxDate) maxDate = d;
    });
    // De depois de Até (filtro impossível, lista vazia): não deixa a faixa invertida.
    if (minDate > maxDate) maxDate = minDate;
    return { minDate: minDate, maxDate: maxDate };
  }
  function computeCalendarDateRange_() {
    var txDates = currentFilteredTransactionsCombined_().map(function (t) { return t.date; });
    return calendarDateRangeForFilter_(STATE.txFilters, txDates, todayYmd());
  }

  /** Domingo da semana de uma data (Date.getDay(): 0 = domingo). */
  function startOfWeekSunday_(dateObj) {
    var d = new Date(dateObj);
    d.setDate(d.getDate() - d.getDay());
    return d;
  }

  /** Colunas de semana (domingo a sábado) cobrindo [minDate, maxDate] inteiros -- cada
   *  coluna é um array de 7 strings YYYY-MM-DD. Começa no domingo da semana de minDate e
   *  termina no sábado da semana de maxDate, mesmo que isso extrapole um pouco o
   *  intervalo pedido (a semana nunca se quebra no meio). */
  function buildWeekColumns_(minDate, maxDate) {
    var cursor = startOfWeekSunday_(parseYmdLocal_(minDate));
    var end = startOfWeekSunday_(parseYmdLocal_(maxDate));
    end.setDate(end.getDate() + 6); // sábado da última semana
    var columns = [];
    while (cursor <= end) {
      var week = [];
      for (var i = 0; i < 7; i++) {
        week.push(ymdFromDate_(cursor));
        cursor.setDate(cursor.getDate() + 1);
      }
      columns.push(week);
    }
    return columns;
  }

  /** { 'YYYY-MM-DD': saldo líquido } de todos os dias com pelo menos 1 lançamento
   *  filtrado (todo o histórico, não só um mês -- ver buildWeekCalendarHtml_).
   *  Transferência não conta (nem soma nem subtrai): o pedido do usuário foi "receitas -
   *  despesas", e transferência não é nem uma coisa nem outra (dinheiro só muda de
   *  conta, dentro do mesmo patrimônio). combined já vem filtrado por STATE.txFilters --
   *  ver currentFilteredTransactionsCombined_. */
  /** excludeFromAnalysis (ver grilling) fica de fora da cor do calendário -- um
   *  lançamento "fora da curva" (quitação pontual de dívida, ajuste de conciliação de
   *  saldo) senão distorceria a escala de cor inteira (ver computePercentile_,
   *  renderTxCalendarWeeks_), fazendo todo dia normal parecer insignificante por
   *  comparação. O dia continua contando normalmente no Extrato/Dashboard -- só sai
   *  daqui, do cálculo do calendário. */
  function computeCalendarDayNets_(combined) {
    var nets = {};
    combined.forEach(function (t) {
      if (!t.date || t.excludeFromAnalysis) return;
      if (t.kind === 'income') nets[t.date] = (nets[t.date] || 0) + t.amount;
      else if (t.kind === 'expense') nets[t.date] = (nets[t.date] || 0) - t.amount;
    });
    return nets;
  }

  /** { 'YYYY-MM-DD': true } dos dias que TÊM lançamento filtrado (receita/despesa) mas só
   *  "Não considerar em análises?" -- ficam de fora de computeCalendarDayNets_ (sem valor nem
   *  cor), mas o dia continua existindo: aparece neutro e clicável (ver buildWeekCalendarHtml_)
   *  pra dar pra chegar no card dele no Extrato. Dia que também tem lançamento normal não
   *  entra aqui (já está em nets). */
  function computeCalendarFlaggedOnlyDays_(combined, nets) {
    var days = {};
    combined.forEach(function (t) {
      if (!t.date || !t.excludeFromAnalysis || nets.hasOwnProperty(t.date)) return;
      if (t.kind === 'income' || t.kind === 'expense') days[t.date] = true;
    });
    return days;
  }

  function hexToRgb_(hex) {
    var clean = hex.replace('#', '');
    if (clean.length === 3) clean = clean.split('').map(function (c) { return c + c; }).join('');
    var num = parseInt(clean, 16);
    return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
  }
  /** Interpola de hexA (t=0) pra hexB (t=1) -- usado pelo gradiente contínuo do
   *  calendário (ver buildWeekCalendarHtml_): tonalidade quase sem intensidade (ver
   *  --income-tint/--expense-tint) até a cor de destaque cheia (--income/--expense, o
   *  mesmo tom já usado em botões/status no resto do app). Devolve os 3 componentes (não
   *  só a string "rgb(...)") porque quem chama também precisa deles pra escolher a cor
   *  do texto por cima (ver contrastTextColor_) sem reprocessar a string. */
  function lerpRgb_(hexA, hexB, t) {
    var a = hexToRgb_(hexA), b = hexToRgb_(hexB);
    return {
      r: Math.round(a.r + (b.r - a.r) * t),
      g: Math.round(a.g + (b.g - a.g) * t),
      b: Math.round(a.b + (b.b - a.b) * t)
    };
  }
  function lerpColor_(hexA, hexB, t) {
    var c = lerpRgb_(hexA, hexB, t);
    return 'rgb(' + c.r + ',' + c.g + ',' + c.b + ')';
  }
  /** Preto ou branco -- o que tiver mais contraste contra um fundo rgb(r,g,b) (luminância
   *  perceptual padrão, pesos de conversão pra escala de cinza). Usado no lugar de
   *  contorno de texto (ver .mini-cal-day, Stylesheet.html) -- um gradiente contínuo
   *  varia demais (quase branco a bem escuro) pra qualquer contorno de cor FIXA dar
   *  contraste sempre; preto/branco sólido escolhido por célula, sim (pedido explícito
   *  do usuário -- o contorno tava "com gosma"/"texto gordo"). */
  function contrastTextColor_(r, g, b) {
    var luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return luminance > 0.5 ? '#1c1e21' : '#ffffff';
  }

  /**
   * Grade inteira do calendário (uma coluna por semana de weekColumns, domingo a
   * sábado em linha) -- pedido explícito do usuário: semanas em coluna, rolagem
   * horizontal contínua no lugar do par de meses com setas/swipe. Legenda "D S T Q Q S
   * S" é responsabilidade de quem monta o container (ver renderTxCalendarWeeks_).
   *
   * Cor: gradiente contínuo (não mais preenchimento por altura) -- verde claro→escuro
   * pro saldo positivo, vermelho claro→escuro pro negativo, interpolado (lerpColor_)
   * entre --income-tint/--expense-tint (quase sem intensidade) e --income/--expense
   * (intensidade máxima, o mesmo tom de botões/status no resto do app). posRef/negRef
   * são o P75 (ver computePercentile_) dos saldos positivos e das MAGNITUDES dos
   * negativos entre TODOS os dias com dado do histórico filtrado (não só as semanas
   * visíveis no momento -- pedido explícito do usuário, pra a mesma cor sempre
   * significar a mesma coisa não importa pra onde rolou; ver renderTxCalendarWeeks_).
   * Dia sem nenhum lançamento filtrado fica com --border (discreto, mas diferente do
   * fundo -- pedido explícito do usuário, só pra mostrar os limites da grade) em vez de
   * entrar no gradiente.
   *
   * Dia 1 de cada mês: em vez do número do dia, mostra o nome completo do mês (fonte
   * bem reduzida pra caber no mesmo quadrado de sempre -- pedido explícito do usuário,
   * mesmo que fique pequena); o valor do dia (se houver) continua aparecendo embaixo
   * normalmente.
   *
   * Texto: preto ou branco sólido (ver contrastTextColor_), decidido por CÉLULA pela
   * luminância do fundo dela -- não dá pra usar uma cor de texto FIXA (nem com contorno)
   * quando o próprio fundo varia de quase branco a bem escuro no mesmo gradiente; a
   * versão anterior (var(--text) + contorno var(--text-muted)) lia como "com
   * gosma"/"texto gordo" (pedido explícito do usuário). Sem contorno nenhum -- contraste
   * alto e sólido já basta.
   */
  function buildWeekCalendarHtml_(weekColumns, nets, posRef, negRef, flaggedOnlyDays) {
    flaggedOnlyDays = flaggedOnlyDays || {};
    var incomeTint = getComputedStyle(document.documentElement).getPropertyValue('--income-tint').trim();
    var incomeDark = getComputedStyle(document.documentElement).getPropertyValue('--income').trim();
    var expenseTint = getComputedStyle(document.documentElement).getPropertyValue('--expense-tint').trim();
    var expenseDark = getComputedStyle(document.documentElement).getPropertyValue('--expense').trim();

    var legendHtml = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map(function (l) {
      return '<div class="week-cal-legend-cell">' + l + '</div>';
    }).join('');

    var weeksHtml = weekColumns.map(function (week) {
      var cellsHtml = week.map(function (dateStr) {
        var dayNum = Number(dateStr.slice(8, 10));
        var isDay1 = dayNum === 1;
        var monthLabelHtml = isDay1
          ? '<span class="week-cal-month-label">' + escapeHtml(capitalizeFirst_(MONTH_NAMES_PT[Number(dateStr.slice(5, 7)) - 1])) + '</span>'
          : '';
        var numOrMonthHtml = isDay1 ? monthLabelHtml : '<span class="mini-cal-day-num">' + dayNum + '</span>';
        var day1Class = isDay1 ? ' week-cal-day1' : '';
        var todayClass = dateStr === todayYmd() ? ' week-cal-today' : '';

        if (!nets.hasOwnProperty(dateStr)) {
          // Só lançamentos "fora das análises": mesmo cinza neutro do dia vazio, sem valor nem cor,
          // mas clicável (data-date + tooltip) -- o wiring de renderTxCalendarWeeks_ pega por [data-date].
          if (flaggedOnlyDays[dateStr]) {
            return '<div class="mini-cal-day' + day1Class + todayClass + '" data-date="' + dateStr + '" data-tooltip="Clique para ver lançamentos deste dia" style="background:var(--border);color:var(--text)">' + numOrMonthHtml + '</div>';
          }
          return '<div class="mini-cal-day mini-cal-day-empty' + day1Class + todayClass + '" style="background:var(--border);color:var(--text)">' + numOrMonthHtml + '</div>';
        }

        var net = nets[dateStr];
        var fraction, rgb;
        if (net >= 0) {
          fraction = posRef > 0 ? Math.min(1, net / posRef) : (net > 0 ? 1 : 0);
          rgb = lerpRgb_(incomeTint, incomeDark, fraction);
        } else {
          fraction = negRef > 0 ? Math.min(1, -net / negRef) : 1;
          rgb = lerpRgb_(expenseTint, expenseDark, fraction);
        }
        var bgColor = 'rgb(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ')';
        var textColor = contrastTextColor_(rgb.r, rgb.g, rgb.b);
        // 5+ dígitos (ex: R$ 12.345) não cabem no quadrado -- abrevia mantendo o "R$ "
        // (pedido explícito do usuário) em milhares ("Nk"); com exatamente 5 dígitos
        // (10.000 a 99.999) usa 1 casa decimal também (ex: "R$ 33.2k"), 6+ fica sem
        // decimal. Sem sinal de "-" pro negativo -- a cor já mostra se é negativo ou
        // positivo, o "-" só duplicaria a informação.
        var absAmount = Math.abs(net);
        var digitCount = String(Math.round(absAmount)).length;
        var isLong = digitCount >= 5;
        var valueClass = isLong ? 'mini-cal-day-value mini-cal-day-value-long' : 'mini-cal-day-value';
        var valueText = isLong
          ? 'R$ ' + (digitCount === 5 ? (absAmount / 1000).toFixed(1) : Math.round(absAmount / 1000)) + 'k'
          : fmtMoneyNoCents_(absAmount);

        return '<div class="mini-cal-day' + day1Class + todayClass + '" data-date="' + dateStr + '" data-tooltip="Clique para ver lançamentos deste dia" style="background:' + bgColor + ';color:' + textColor + '">' +
          numOrMonthHtml +
          '<span class="' + valueClass + '">' + escapeHtml(valueText) + '</span>' +
        '</div>';
      }).join('');
      return '<div class="week-cal-column">' + cellsHtml + '</div>';
    }).join('');

    return '<div class="week-cal-legend">' + legendHtml + '</div><div class="week-cal-weeks">' + weeksHtml + '</div>';
  }

  // ---------- calendário do Extrato em barras ----------
  // Formato atual do calendário. 'grid' = a grade de quadrados por semana (buildWeekCalendarHtml_
  // e cia., mantida intacta -- tag git reserva-calendario-grade); trocar esta constante volta
  // pra ela. 'bars' = gráfico de barras finas por dia (buildDayBarsHtml_).
  var TX_CALENDAR_FORMAT_ = 'bars';
  var TX_CALENDAR_MODES_ = [
    { key: 'expense', label: 'Despesas' },
    { key: 'income', label: 'Receitas' }
  ];
  var DAY_BARS_HEIGHT_PX_ = 116;

  /** { 'YYYY-MM-DD': valor } por dia, conforme o modo: despesas (soma) ou receitas (soma).
   *  Mesmas regras de sempre do calendário: transferência não conta e "Não considerar em
   *  análises" fica de fora. Só os dias que têm algo do tipo pedido aparecem. */
  function computeCalendarDayTotals_(combined, mode) {
    var kind = mode === 'income' ? 'income' : 'expense';
    var totals = {};
    combined.forEach(function (t) {
      if (!t.date || t.excludeFromAnalysis || t.kind !== kind) return;
      totals[t.date] = (totals[t.date] || 0) + t.amount;
    });
    return totals;
  }

  /** Valor que enche a altura do gráfico: o P75 (mesmo critério que dá o tom máximo de
   *  verde/vermelho da grade, ver renderTxCalendarWeeks_) dos totais diários -- em módulo,
   *  pra a escala não depender do sinal. Dia acima disso é cortado no
   *  topo (marcado, ver buildDayBarsHtml_), pra um dia de salário não achatar todos os outros. */
  function computeDayBarsRef_(totals, targets) {
    var abs = Object.keys(totals).map(function (k) { return Math.abs(totals[k]); }).filter(function (v) { return v > 0; });
    var ref = computePercentile_(abs, 0.75);
    // A escala sobe pra caber a linha da meta do mês (pedido explícito). A da semana não
    // entra (perto do fim do mês dispara: sobra grande ÷ poucos dias). O que passar do topo
    // fica preso nele (ver buildDayBarsHtml_).
    if (targets) {
      var targetAbs = Object.keys(targets.month).map(function (d) { return Math.abs(targets.month[d]); }).filter(function (v) { return v > 0; });
      ref = Math.max(ref, computePercentile_(targetAbs, 0.75));
    }
    // Topo da escala em múltiplo de 50 (é o "R$ X" escrito no eixo, ver buildDayBarsHtml_).
    return ref > 0 ? Math.ceil(ref / 50 - 1e-9) * 50 : 0;
  }

  /**
   * Metas diárias (linhas do Resumo em barras), por dia:
   *  - month[d]: teto do dia segundo o mês de d: teto mensal ÷ dias do mês.
   *  - week[d]: "o que sobra" no trecho da semana (domingo a sábado, cortado no dia 1 do
   *    mês) que contém d: (teto do mês − gasto do mês até a véspera do trecho) ÷ dias que
   *    restam no mês a partir do início do trecho, nunca abaixo de 0. Passou do ritmo, a
   *    linha da semana cai.
   * monthlyLimitFn(ym) dá o teto do mês; spentByDay { ymd: gasto orçamentário }; today (ymd)
   * separa o que já aconteceu do que é projeção. Função pura -- ver computeDayBarsTargets_
   * pra de onde vêm.
   */
  function dayBarsTargetLines_(days, monthlyLimitFn, spentByDay, today) {
    var month = {}, week = {};
    // "O que sobra" do trecho (semana cortada no dia 1) que contém o dia d.
    var segmentCache = {};
    function segmentCeiling(d) {
      var ym = d.slice(0, 7);
      var sunday = parseYmdLocal_(d);
      sunday.setDate(sunday.getDate() - sunday.getDay());
      var segStart = ymdFromDate_(sunday);
      if (segStart < ym + '-01') segStart = ym + '-01';
      var key = ym + '|' + segStart;
      if (segmentCache[key] !== undefined) return segmentCache[key];
      var dim = daysInMonth_(ym);
      var limit = monthlyLimitFn(ym);
      var startDay = Number(segStart.slice(8, 10));
      var spentBefore = 0;
      for (var i = 1; i < startDay; i++) {
        var ymd = ym + '-' + String(i).padStart(2, '0');
        // Dia ainda por vir: conta como gasto no ritmo do teto (senão toda semana futura
        // herdaria a "sobra" de dias que nem aconteceram).
        spentBefore += ymd <= today ? (spentByDay[ymd] || 0) : limit / dim;
      }
      return (segmentCache[key] = Math.max(0, (limit - spentBefore) / (dim - startDay + 1)));
    }
    // Teto ÚNICO da semana de calendário (domingo a sábado): média, pelos 7 dias, do "o que
    // sobra" do trecho de cada dia -- numa semana que vira o mês (ex: 27/9 a 3/10) mistura os
    // dois meses ponderando pelos dias de cada um, e o total esperado da semana não muda.
    var weekCache = {};
    function weekCeiling(d) {
      var sunday = parseYmdLocal_(d);
      sunday.setDate(sunday.getDate() - sunday.getDay());
      var key = ymdFromDate_(sunday);
      if (weekCache[key] !== undefined) return weekCache[key];
      var sum = 0;
      for (var i = 0; i < 7; i++) {
        sum += segmentCeiling(ymdFromDate_(sunday));
        sunday.setDate(sunday.getDate() + 1);
      }
      return (weekCache[key] = sum / 7);
    }
    days.forEach(function (d) {
      var ym = d.slice(0, 7);
      month[d] = monthlyLimitFn(ym) / daysInMonth_(ym);
      week[d] = weekCeiling(d);
    });
    return { month: month, week: week };
  }

  // Folga do amarelo: passou da meta em até 10% do valor esperado até hoje.
  var DAY_BARS_WARN_TOLERANCE_ = 0.10;

  /**
   * Cor de cada linha de meta: 'ok' (dentro do teto), 'warn' (passou em até 10%) ou 'bad'
   * (passou mais que isso); null = trecho que ainda nem começou (fica neutra). Vale por
   * trecho: o mês inteiro (linha pontilhada) e cada pedaço de semana (linha tracejada,
   * cortado no dia 1). Compara o REAL com o ESPERADO só dos dias até hoje -- o trecho em
   * andamento é julgado pelo ritmo até agora e pode mudar de cor até fechar. Gasto
   * orçamentário (targets.spent, mesma base da meta) contra a soma das metas por dia.
   * Devolve também out.avg: a média REAL por dia dos dias do trecho até hoje -- o "resultado"
   * que o tooltip mostra ao lado do teto, na cor do veredito. null quando o trecho ainda nem
   * começou. Função pura.
   */
  function dayBarsTargetStatus_(days, targets, today) {
    var out = { month: {}, week: {}, avg: { month: {}, week: {} } };
    var groups = { month: {}, week: {} };
    days.forEach(function (d) {
      var sunday = parseYmdLocal_(d);
      sunday.setDate(sunday.getDate() - sunday.getDay());
      var ym = d.slice(0, 7);
      var weekKey = ymdFromDate_(sunday); // semana inteira, mesmo virando o mês
      (groups.month[ym] = groups.month[ym] || []).push(d);
      (groups.week[weekKey] = groups.week[weekKey] || []).push(d);
    });
    var spent = targets.spent || {};
    function judge(list, targetByDay) {
      var expected = 0, actual = 0, elapsed = 0;
      list.forEach(function (d) {
        if (d > today) return;
        elapsed++;
        expected += targetByDay[d];
        actual += spent[d] || 0;
      });
      if (!elapsed) return { status: null, avg: null };
      var over = actual - expected;
      var status = over <= 0.005 ? 'ok' : (over <= DAY_BARS_WARN_TOLERANCE_ * Math.abs(expected) + 0.005 ? 'warn' : 'bad');
      return { status: status, avg: actual / elapsed };
    }
    ['month', 'week'].forEach(function (kind) {
      Object.keys(groups[kind]).forEach(function (key) {
        var verdict = judge(groups[kind][key], targets[kind]);
        groups[kind][key].forEach(function (d) { out[kind][d] = verdict.status; out.avg[kind][d] = verdict.avg; });
      });
    });
    return out;
  }

  /** Lê o STATE e monta as metas do Resumo (null = sem linha): só no modo Despesas; some com filtro de conta ou de texto (não dá pra mapear em orçamento) e quando
   *  não há teto nenhum (sem orçamento / sem histórico pra Automático). Filtro de categoria
   *  mantém só os orçamentos que tocam alguma das categorias filtradas (o "não orçamentado"
   *  entra se alguma delas não tem orçamento) e as receitas recorrentes dessas categorias.
   *  O teto diário é constante por orçamento (taxa) -- o de hoje, igual às barras de
   *  Orçamentos (ver computeBudgetAutoMonthProgress_). Gasto = o mesmo dos orçamentos
   *  (data efetiva, fora das análises e vinculados a recorrente de fora, líquido de
   *  reembolso). */
  function computeDayBarsTargets_(days, mode) {
    if (mode === 'income') return null;
    var f = STATE.txFilters || {};
    if (f.accountId || f.text) return null;
    var filterIds = f.categoryIds || [];
    function hit(ids) { return !filterIds.length || ids.some(function (id) { return filterIds.indexOf(id) !== -1; }); }
    var w = budgetAutoWindowDays_();
    var ymNow = todayYmd().slice(0, 7);
    var dimNow = daysInMonth_(ymNow);
    var budgets = STATE.budgets.filter(function (b) { return !b.archived && !b.isUnbudgetedCatchAll && hit(b.categoryIds); });
    var daily = budgets.reduce(function (sum, b) { return sum + budgetMonthlyAmount_(b, ymNow, w) / dimNow; }, 0);
    var covered = {};
    budgets.forEach(function (b) { b.categoryIds.forEach(function (id) { covered[id] = true; }); });
    var catchIds = unbudgetedExpenseCategoryIds_();
    if (w && catchIds.length && hit(catchIds)) {
      daily += computeBudgetAutoProgress_(catchIds, w).shimBudget.amount / w;
      catchIds.forEach(function (id) { covered[id] = true; });
    }
    if (daily <= 0) return null;
    var spentByDay = {};
    STATE.allTransactions.forEach(function (t) {
      if (t.kind !== 'expense' || !covered[t.categoryId] || t.excludeFromAnalysis || t.forecastId) return;
      var eff = budgetEffectiveDate_(t);
      if (eff) spentByDay[eff] = (spentByDay[eff] || 0) + netAmountOfPassiveForBudget_(t);
    });
    var lines = dayBarsTargetLines_(days, function (ym) { return daily * daysInMonth_(ym); }, spentByDay, todayYmd());
    lines.spent = spentByDay; // pra dayBarsTargetStatus_ julgar na mesma base da meta
    return lines;
  }

  // Ícones do resultado no tooltip (Lucide, mesmo traço do "party-popper" de "Meta atingida!"; o
  // app nunca usa emoji em texto): dentro do teto = festa, até 10% acima = alerta, bem acima = sirene.
  var DAY_BARS_ICON_STYLE_ = 'style="vertical-align:-0.15em;margin-right:4px" aria-hidden="true"';
  var DAY_BARS_RESULT_ICONS_ = {
    ok: null, // BALANCE_GOAL_REACHED_ICON_ (definido junto da meta de saldo)
    warn: '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ' + DAY_BARS_ICON_STYLE_ + '>' +
      '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
    bad: '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ' + DAY_BARS_ICON_STYLE_ + '>' +
      '<path d="M7 18v-6a5 5 0 1 1 10 0v6"/><path d="M5 21a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1a1 1 0 0 0 1 1z"/>' +
      '<path d="M21 12h1"/><path d="M18.5 4.5 18 5"/><path d="M2 12h1"/><path d="M12 2v1"/><path d="m4.929 4.929.707.707"/><path d="M12 12v6"/></svg>'
  };

  /** Texto do veredito de um trecho: diferença POR DIA entre o teto e a média real, sem
   *  centavos. scope = 'nesta semana' ou 'em outubro' ("Sobrou R$ 26 por dia nesta semana!" /
   *  "Gastou R$ 50 a mais por dia em outubro"). null quando o trecho ainda nem começou. */
  function dayBarsResultText_(ceiling, avg, tone, scope) {
    if (avg === null || avg === undefined || !tone) return null;
    if (tone === 'ok') {
      var under = Math.round(ceiling - avg);
      return under > 0 ? 'Sobrou ' + fmtMoneyNoCents_(under) + ' por dia ' + scope + '!' : 'No teto ' + scope;
    }
    return 'Gastou ' + fmtMoneyNoCents_(Math.max(1, Math.round(avg - ceiling))) + ' a mais por dia ' + scope;
  }

  /**
   * Barras finas, uma por dia (eixo horizontal = dias do período, vertical = total do dia,
   * de 0 até ref -- ver computeDayBarsRef_). Barras em cinza esmaecido (o destaque são as
   * linhas de meta, coloridas pelo veredito). Dia com algo (inclusive só "fora das análises",
   * sem barra) é clicável e leva ao card dele no Extrato. Rótulos: número do dia embaixo de
   * cada barra e o nome do mês na coluna do dia 1. Sem linhas de grade (pedido explícito); a
   * divisão fica por conta de linhas verticais (CSS): semana começa no domingo, com um
   * respiro a mais entre sábado e domingo, e o dia 1 abre o mês.
   */
  function buildDayBarsHtml_(days, totals, ref, mode, flaggedOnlyDays, targets) {
    flaggedOnlyDays = flaggedOnlyDays || {};
    var today = todayYmd();
    var modeLabel = mode === 'income' ? 'Receitas' : 'Despesas';
    var cellsHtml = days.map(function (dateStr) {
      var dayNum = Number(dateStr.slice(8, 10));
      var isDay1 = dayNum === 1;
      var has = totals.hasOwnProperty(dateStr);
      var clickable = has || flaggedOnlyDays[dateStr];
      var barHtml = '';
      // Linhas do tooltip: { label, value, tone } (rótulo à esquerda, valor em negrito à direita),
      // { gap: true } (meia linha), { title } (semana/mês, centralizado) e { trio } e { result, tone } (veredito: ícone + texto em negrito na cor do veredito).
      var rows = [];
      if (has) {
        var value = totals[dateStr];
        var fraction = ref > 0 ? Math.min(1, Math.abs(value) / ref) : (value !== 0 ? 1 : 0);
        // Barra que não coube na escala ganha um triângulo no topo (mesma cor), pra mostrar
        // que ela continua (ver .day-bar-over no CSS).
        var over = ref > 0 && Math.abs(value) > ref ? ' day-bar-over' : '';
        if (fraction > 0) {
          barHtml = '<div class="day-bar' + over + '" style="height:' + (fraction * 100).toFixed(1) + '%;--bar-color:var(--text-muted)"></div>';
        }
        rows.push({ label: modeLabel, value: fmtMoneyNoCents_(Math.abs(value)) });
      } else if (flaggedOnlyDays[dateStr]) {
        rows.push({ label: 'Só lançamentos fora das análises' });
      }
      var targetHtml = '';
      if (targets && ref > 0) {
        var pct = function (v) { return (Math.min(1, Math.abs(v) / ref) * 100).toFixed(1); };
        // A cor vem do veredito do trecho (ver dayBarsTargetStatus_); sem veredito, fica a cor
        // neutra de sempre.
        var st = targets.status || { month: {}, week: {} };
        var tone = function (v) { return v ? ' day-bar-target-' + v : ''; };
        targetHtml = '<div class="day-bar-target day-bar-target-month' + tone(st.month[dateStr]) + '" style="bottom:' + pct(targets.month[dateStr]) + '%"></div>' +
          '<div class="day-bar-target day-bar-target-week' + tone(st.week[dateStr]) + '" style="bottom:' + pct(targets.week[dateStr]) + '%"></div>';
        if (clickable) {
          var avg = (targets.status && targets.status.avg) || { month: {}, week: {} };
          var monthName = MONTH_NAMES_PT[Number(dateStr.slice(5, 7)) - 1];
          var weekStart = parseYmdLocal_(dateStr);
          weekStart.setDate(weekStart.getDate() - weekStart.getDay());
          var weekEnd = new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + 6);
          [['week', 'Semana (' + weekStart.getDate() + ' a ' + weekEnd.getDate() + ')', 'nesta semana'],
           ['month', capitalizeFirst_(monthName), 'em ' + monthName.toLowerCase()]].forEach(function (seg) {
            var kind = seg[0], ceiling = targets[kind][dateStr], a = avg[kind][dateStr], verdict = st[kind][dateStr];
            rows.push({ gap: true });
            rows.push({ title: seg[1] });
            // Média à esquerda, "média × teto" no centro, Teto à direita.
            rows.push({ trio: (a === null || a === undefined ? '—' : fmtMoneyNoCents_(a)) + ' × ' + fmtMoneyNoCents_(ceiling) });
            var result = dayBarsResultText_(ceiling, a, verdict, seg[2]);
            if (result) rows.push({ result: result, tone: verdict });
          });
        }
      }
      var isSunday = parseYmdLocal_(dateStr).getDay() === 0;
      var classes = 'day-bar-cell' + (isDay1 ? ' day-bar-day1' : '') + (isSunday ? ' day-bar-sun' : '') + (clickable ? ' day-bar-clickable' : '') + (dateStr === today ? ' day-bar-today' : '');
      var attrs = '';
      if (clickable) {
        // data-tooltip = texto puro (alternativa); data-tooltip-html = o que aparece de verdade:
        // data em negrito (mesmo formato do conector entre dias do Extrato), meia linha de
        // espaço depois de Despesas e, por trecho (semana, mês): amostra do traço, teto, média e
        // veredito. Textos à esquerda e números em negrito à direita, sem ":".
        var plain = [fmtCardDate_(dateStr, true)].concat(rows.filter(function (r) { return !r.gap; }).map(function (r) {
          if (r.title !== undefined) return r.title;
          if (r.trio !== undefined) return 'Média ' + r.trio + ' Teto';
          return r.result !== undefined ? r.result : (r.value === undefined ? r.label : r.label + ' ' + r.value);
        })).join('\n');
        var tipIcon = function (t) { return t === 'ok' ? BALANCE_GOAL_REACHED_ICON_ : DAY_BARS_RESULT_ICONS_[t]; };
        var rich = '<div class="tt-date">' + escapeHtml(fmtCardDate_(dateStr, true)) + '</div>' + rows.map(function (r) {
          if (r.gap) return '<div class="tt-gap"></div>';
          if (r.title !== undefined) return '<div class="tt-title">' + escapeHtml(r.title) + '</div>';
          if (r.trio !== undefined) return '<div class="tt-trio"><span>Média</span><span class="tt-val">' + escapeHtml(r.trio) + '</span><span>Teto</span></div>';
          if (r.result !== undefined) return '<div class="tt-result tt-' + r.tone + '">' + tipIcon(r.tone) + escapeHtml(r.result) + '</div>';
          return '<div class="tt-row"><span>' + escapeHtml(r.label) + '</span>' +
            (r.value === undefined ? '' : '<span class="tt-val">' + escapeHtml(r.value) + '</span>') + '</div>';
        }).join('');
        attrs = ' data-date="' + dateStr + '" data-tooltip="' + escapeHtml(plain) + '" data-tooltip-html="' + escapeHtml(rich) + '"';
      }
      return '<div class="' + classes + '"' + attrs + '>' +
        '<div class="day-bar-col" style="height:' + DAY_BARS_HEIGHT_PX_ + 'px">' + barHtml + targetHtml + '</div>' +
        '<div class="day-bar-num">' + dayNum + '</div>' +
        '<div class="day-bar-month">' + (isDay1 ? '<span>' + escapeHtml(capitalizeFirst_(MONTH_NAMES_PT[Number(dateStr.slice(5, 7)) - 1])) + '</span>' : '') + '</div>' +
      '</div>';
    }).join('');

    // Eixo mínimo: "R$ 0" na base e "R$ <topo da escala>" no topo, girados. A coluna do eixo
    // vai de cima a baixo do gráfico (também ao lado da linha dos dias e dos meses) e cola à
    // esquerda quando o gráfico rola, com fundo: nada passa por baixo dela (ver .day-bar-axis).
    var axisHtml = ref > 0
      ? '<div class="day-bar-axis"><div class="day-bar-axis-scale" style="height:' + DAY_BARS_HEIGHT_PX_ + 'px"><span>R$ ' + Math.round(ref).toLocaleString('pt-BR') + '</span><span>R$ 0</span></div></div>'
      : '';
    return '<div class="day-bars-plot" style="--bars-h:' + DAY_BARS_HEIGHT_PX_ + 'px">' + axisHtml + cellsHtml + '</div>';
  }

  /** Datas (YYYY-MM-DD) de minDate a maxDate inclusive, uma por dia. */
  function buildDayList_(minDate, maxDate) {
    var days = [];
    var cursor = parseYmdLocal_(minDate);
    var end = parseYmdLocal_(maxDate);
    while (cursor <= end) {
      days.push(ymdFromDate_(cursor));
      cursor.setDate(cursor.getDate() + 1);
    }
    return days;
  }

  /** Seletor Despesas | Receitas do Resumo: cápsulas no canto direito do cabeçalho do card. */
  function renderTxCalendarModeSelector_() {
    var host = document.getElementById('tx-calendar-mode');
    if (!host) return;
    host.hidden = TX_CALENDAR_FORMAT_ !== 'bars';
    host.innerHTML = TX_CALENDAR_MODES_.map(function (m) {
      return '<button type="button" class="capsule' + (STATE.txCalendarMode === m.key ? ' active' : '') + '" data-mode="' + m.key + '">' + m.label + '</button>';
    }).join('');
    host.querySelectorAll('button').forEach(function (btn) {
      btn.onclick = function (ev) {
        ev.stopPropagation(); // o cabeçalho inteiro recolhe/expande o card
        STATE.txCalendarMode = btn.dataset.mode;
        renderTxCalendarModeSelector_();
        renderTxCalendarWeeks_();
      };
    });
  }

  /**
   * Arrastar com o mouse rola a faixa de semanas horizontalmente -- pedido explícito do
   * usuário, pra poder tirar a barra de rolagem visível (ver #tx-calendar-weeks-wrap,
   * Stylesheet.html). O touch já rola nativamente sozinho (overflow-x:auto de sempre),
   * não precisa de nada daqui. Chamada 1 vez só, não a cada renderTxCalendarWeeks_ (ver
   * renderTransactions) -- o container persiste entre filtros, só o conteúdo dele é
   * redesenhado.
   *
   * document.onmousemove/onmouseup (não addEventListener) de propósito: continuam
   * rastreando o arrasto mesmo se o cursor sair da área do calendário no meio do gesto,
   * e reatribuir a PROPRIEDADE (em vez de empilhar com addEventListener) não deixa
   * listener nenhum pra trás se a tela do Extrato for montada de novo (trocar de aba e
   * voltar, por exemplo) -- mesma razão de todo onclick deste app usar a propriedade, não
   * addEventListener.
   *
   * Não conflita com hover/clique nos dias: enquanto arrasta de verdade (passou de
   * DRAG_THRESHOLD_PX_ de movimento), a classe week-cal-dragging desliga pointer-events
   * dos quadrados (ver Stylesheet.html) -- nem dispara tooltip ao passar por cima, nem o
   * clique sintetizado que o navegador manda logo depois do mouseup (em cima de
   * QUALQUER coisa que esteja sob o cursor) chega a abrir o dia por baixo do dedo/cursor
   * sem querer. Só um clique de verdade (sem mover o suficiente pra contar como arrasto)
   * continua abrindo o dia normalmente.
   */
  function setupCalendarDragScroll_(container) {
    var DRAG_THRESHOLD_PX_ = 4;
    // Inércia CONTÍNUA, sem desaceleração (pedido explícito do usuário -- correção de
    // uma rodada anterior que tinha tirado a inércia inteira por engano: era só a
    // DESACELERAÇÃO/fricção que devia sumir). GLIDE_MAX_PX_MS_ é o teto BAIXO de
    // velocidade (~550px/s) -- acima dele, em vez de desacelerar até parar, o planador
    // anda numa velocidade CONSTANTE (capada nesse teto) até bater no início/fim do
    // calendário. GLIDE_MIN_PX_MS_ é o piso pra sequer começar a planar -- um solte
    // devagar simplesmente para na hora, sem planador nenhum.
    var GLIDE_MAX_PX_MS_ = 0.55;
    var GLIDE_MIN_PX_MS_ = 0.15;
    var isDown = false, hasDragged = false, startX = 0, startScrollLeft = 0;
    var samples = []; // {t,x} dos últimos ~80ms de movimento -- mede a velocidade de saída
    var glideFrame = null;

    function cancelGlide_() {
      if (glideFrame) { cancelAnimationFrame(glideFrame); glideFrame = null; }
    }
    // velocityPxMs: px/ms de deslocamento do CURSOR (não do scrollLeft, que anda ao
    // contrário -- ver document.onmousemove) no instante em que soltou.
    function startGlide_(velocityPxMs) {
      if (Math.abs(velocityPxMs) < GLIDE_MIN_PX_MS_) return;
      var v = Math.max(-GLIDE_MAX_PX_MS_, Math.min(GLIDE_MAX_PX_MS_, velocityPxMs));
      var lastT = performance.now();
      var step = function (now) {
        var dt = now - lastT;
        lastT = now;
        container.scrollLeft -= v * dt; // velocidade CONSTANTE -- sem fricção/decaimento por frame
        var atStart = container.scrollLeft <= 0;
        var atEnd = container.scrollLeft >= container.scrollWidth - container.clientWidth;
        if ((v > 0 && atStart) || (v < 0 && atEnd)) { glideFrame = null; return; } // só para ao bater na borda
        glideFrame = requestAnimationFrame(step);
      };
      glideFrame = requestAnimationFrame(step);
    }

    container.onmousedown = function (e) {
      cancelGlide_();
      isDown = true;
      hasDragged = false;
      startX = e.clientX;
      startScrollLeft = container.scrollLeft;
      samples = [{ t: performance.now(), x: e.clientX }];
    };
    document.onmousemove = function (e) {
      if (!isDown) return;
      var dx = e.clientX - startX;
      if (!hasDragged) {
        if (Math.abs(dx) < DRAG_THRESHOLD_PX_) return;
        hasDragged = true;
        container.classList.add('week-cal-dragging');
      }
      container.scrollLeft = startScrollLeft - dx;
      var now = performance.now();
      samples.push({ t: now, x: e.clientX });
      // Só os últimos ~80ms contam pra medir a velocidade de saída -- movimento de bem
      // antes no mesmo gesto (começou devagar, acelerou no fim, por exemplo) não deveria
      // puxar a média pra baixo.
      while (samples.length > 2 && now - samples[0].t > 80) samples.shift();
    };
    document.onmouseup = function () {
      isDown = false;
      if (!hasDragged) return;
      // Só solta pointer-events no próximo tick -- o clique sintetizado do navegador
      // (que chega logo depois do mouseup, ainda de forma síncrona) precisa encontrar
      // pointer-events:none ainda ativo pra ser ignorado (ver comentário acima da função).
      setTimeout(function () { container.classList.remove('week-cal-dragging'); }, 0);
      if (samples.length >= 2) {
        var first = samples[0], last = samples[samples.length - 1];
        var dt = last.t - first.t;
        if (dt > 0) startGlide_((last.x - first.x) / dt);
      }
    };
  }

  /** Redesenha a grade inteira de semanas (chamada toda vez que o conteúdo precisa ser
   *  reconstruído -- filtro mudou, ou o card acabou de nascer) e restaura (ou define, na
   *  1ª vez) a posição de rolagem horizontal -- ver STATE.txCalendarScrollLeft. Religa
   *  clique/tooltip nos dias com dado a cada chamada (mesmo padrão de todo outro wiring
   *  pós-innerHTML deste app). */
  function renderTxCalendarWeeks_() {
    var container = document.getElementById('tx-calendar-weeks-wrap');
    if (!container) return;
    var combined = currentFilteredTransactionsCombined_();
    var nets = computeCalendarDayNets_(combined);
    var range = computeCalendarDateRange_();
    if (TX_CALENDAR_FORMAT_ === 'bars') {
      var totals = computeCalendarDayTotals_(combined, STATE.txCalendarMode);
      var days = buildDayList_(range.minDate, range.maxDate);
      var targets = computeDayBarsTargets_(days, STATE.txCalendarMode);
      if (targets) targets.status = dayBarsTargetStatus_(days, targets, todayYmd());
      container.innerHTML = buildDayBarsHtml_(days, totals, computeDayBarsRef_(totals, targets), STATE.txCalendarMode, computeCalendarFlaggedOnlyDays_(combined, nets), targets);
      container.querySelectorAll('.day-bar-cell[data-date]').forEach(function (el) {
        wireDayCell_(el, function () { scrollToTxDay_(el.dataset.date); });
      });
      container.onscroll = function () { STATE.txCalendarScrollLeft = container.scrollLeft; };
      container.scrollLeft = STATE.txCalendarScrollLeft !== null ? STATE.txCalendarScrollLeft : container.scrollWidth;
      return;
    }
    var weekColumns = buildWeekColumns_(range.minDate, range.maxDate);
    var allValues = Object.keys(nets).map(function (k) { return nets[k]; });
    var posRef = computePercentile_(allValues.filter(function (v) { return v > 0; }), 0.75);
    var negRef = computePercentile_(allValues.filter(function (v) { return v < 0; }).map(function (v) { return -v; }), 0.75);

    container.innerHTML = buildWeekCalendarHtml_(weekColumns, nets, posRef, negRef, computeCalendarFlaggedOnlyDays_(combined, nets));

    container.querySelectorAll('.mini-cal-day[data-date]').forEach(function (el) {
      wireDayCell_(el, function () { scrollToTxDay_(el.dataset.date); });
    });
    container.onscroll = function () { STATE.txCalendarScrollLeft = container.scrollLeft; };
    container.scrollLeft = STATE.txCalendarScrollLeft !== null ? STATE.txCalendarScrollLeft : container.scrollWidth;
  }

  /** Chamada pelo primeiro render do Extrato e sempre que os filtros mudam (ver
   *  applyTxFilters_, que zera STATE.txCalendarScrollLeft antes -- filtro novo volta a
   *  rolar pras semanas mais recentes; qualquer outro re-render preserva a posição em
   *  que o usuário já estava). */
  function renderTxCalendar_() {
    renderTxCalendarModeSelector_();
    renderTxCalendarWeeks_();
    renderTxCalendarFilteredStats_();
  }

  /** Card colapsável (mesmo mecanismo do de Filtrar lançamentos) e sticky -- só ele, não
   *  o de filtro (pedido explícito do usuário). Chamada uma vez só por renderTransactions
   *  (o "miolo", #tx-calendar-weeks-wrap, é redesenhado à parte por renderTxCalendar_).
   *  overflow-x:auto nele mesmo (não um viewport à parte) -- é o único elemento que
   *  precisa rolar; a legenda "D S T Q Q S S" fica sticky dentro dele (ver .week-cal-legend,
   *  Stylesheet.html), não precisa de nenhum wrapper extra. */
  function buildTxCalendarHtml_() {
    var expanded = STATE.txCalendarExpanded;
    // Título + valores filtrados lado a lado (mesma estrutura do cabeçalho de "Filtrar
    // lançamentos" -- ver renderTransactions_ -- só que sem cápsulas, é texto corrido).
    return '<div class="card tx-calendar-card">' +
      '<div id="tx-calendar-header" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:8px">' +
        '<div style="display:flex;align-items:center;gap:8px;min-width:0;flex:1">' +
          '<h2 style="margin:0;flex-shrink:0">Resumo</h2>' +
          '<div id="tx-calendar-filtered-stats" style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0;font-size:12px;color:var(--text-muted)"></div>' +
        '</div>' +
        '<div id="tx-calendar-mode" class="capsule-field"></div>' +
        '<span id="tx-calendar-chevron" style="display:inline-block;color:var(--text-muted);transition:transform 200ms ease;flex-shrink:0;' +
          'transform:rotate(' + (expanded ? '180deg' : '0deg') + ')">▾</span>' +
      '</div>' +
      '<div id="tx-calendar-collapse" style="display:grid;grid-template-rows:' + (expanded ? '1fr' : '0fr') + ';transition:grid-template-rows 200ms ease">' +
        '<div style="overflow:hidden;min-height:0">' +
          '<div id="tx-calendar-weeks-wrap" style="display:flex;overflow-x:auto;padding-top:12px"></div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  /**
   * Fluxo de importação de documento (ex: fatura RecargaPay — ver DocumentImport.js):
   * fase 1 sobe o PDF e roda OCR (previewDocumentImport), sem criar nada ainda; fase 2
   * (renderDocumentImportPreview_) mostra o que foi identificado e só cria as pendências
   * (confirmDocumentImportBatch, em lotes — ver ali pro motivo) quando o usuário confirma.
   * Cada pendência criada ainda passa pela revisão manual de sempre — a importação só
   * pré-preenche.
   */
  function openDocumentImportModal() {
    openModal(
      '<h2>Importar documento</h2>' +
      '<div class="muted" style="margin-bottom:12px">Envie o PDF — o app identifica automaticamente o tipo de documento e o mês de referência.</div>' +
      '<div class="field"><input type="file" id="doc-file" accept="application/pdf"></div>' +
      '<div id="doc-status" class="muted" style="margin-bottom:12px;min-height:18px"></div>' +
      '<div style="display:flex;gap:8px">' +
        '<button class="secondary" id="doc-cancel" style="flex:1">Cancelar</button>' +
        '<button id="doc-process" style="flex:1" disabled>Processar</button>' +
      '</div>'
    );

    document.getElementById('doc-cancel').onclick = closeModal;
    var fileInput = document.getElementById('doc-file');
    var processBtn = document.getElementById('doc-process');
    fileInput.onchange = function () { processBtn.disabled = !fileInput.files.length; };

    processBtn.onclick = function () {
      var file = fileInput.files[0];
      if (!file) return;
      processBtn.disabled = true;
      fileInput.disabled = true;
      document.getElementById('doc-status').textContent = 'Lendo o documento (pode levar alguns segundos)…';

      var reader = new FileReader();
      reader.onload = function (e) {
        var base64 = e.target.result.split(',')[1];
        run('previewDocumentImport', base64, file.name).then(function (result) {
          if (!result.ok) {
            document.getElementById('doc-status').textContent = '';
            errorPopover(processBtn, result.error);
            processBtn.disabled = false;
            fileInput.disabled = false;
            return;
          }
          renderDocumentImportPreview_(result);
        }).catch(function (err) {
          document.getElementById('doc-status').textContent = '';
          errorPopover(processBtn, err.message);
          processBtn.disabled = false;
          fileInput.disabled = false;
        });
      };
      reader.onerror = function () {
        document.getElementById('doc-status').textContent = '';
        errorPopover(processBtn, 'Não foi possível ler o arquivo.');
        processBtn.disabled = false;
        fileInput.disabled = false;
      };
      reader.readAsDataURL(file);
    };
  }

  function renderDocumentImportPreview_(result) {
    var installmentCount = result.items.filter(function (it) { return it.installments; }).length;
    var transferCount = result.items.filter(function (it) { return it.kind === 'transfer'; }).length;
    var summaryParts = [result.items.length + (result.items.length === 1 ? ' lançamento identificado' : ' lançamentos identificados')];
    if (installmentCount) summaryParts.push(installmentCount + ' parcelado(s)');
    if (transferCount) summaryParts.push(transferCount + ' transferência(s)');

    var mismatchHtml = '';
    if (result.accountMismatch) {
      var mm = result.accountMismatch;
      mismatchHtml =
        '<div style="background:var(--expense);color:#fff;padding:10px;border-radius:8px;margin-bottom:12px;font-size:13px">' +
          UI_ICON_WARN_ + ' A conta "' + escapeHtml(mm.accountName) + '" está com fechamento dia ' + mm.currentClosingDay +
          ' / vencimento dia ' + mm.currentDueDay + ', mas o documento mostra fechamento dia ' + mm.detectedClosingDay +
          ' / vencimento dia ' + mm.detectedDueDay + '.' +
          '<label style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px">' +
            '<input type="checkbox" id="doc-fix-account" checked style="width:auto;margin:0"> Atualizar a conta pro que o documento mostra' +
          '</label>' +
        '</div>';
    }

    var warningsHtml = result.warnings.length
      ? '<div class="muted" style="margin-bottom:12px;font-size:13px">' + result.warnings.map(escapeHtml).join('<br>') + '</div>'
      : '';

    openModal(
      '<h2>Confirmar importação</h2>' +
      '<div class="muted" style="margin-bottom:12px">Detectei: <strong>' + escapeHtml(result.documentLabel) +
        (result.referenceLabel ? ' · ' + escapeHtml(result.referenceLabel) : '') + '</strong><br>Conta: ' + escapeHtml(result.accountName) + '</div>' +
      mismatchHtml +
      '<div style="margin-bottom:12px">' + escapeHtml(summaryParts.join(' · ')) + '</div>' +
      warningsHtml +
      '<div id="doc-confirm-progress" style="display:none;margin-bottom:12px">' +
        '<div style="background:var(--border);border-radius:999px;height:8px;overflow:hidden;margin-bottom:6px">' +
          '<div id="doc-confirm-progress-fill" style="background:var(--primary);height:100%;width:0%;transition:width 0.2s"></div>' +
        '</div>' +
        '<div id="doc-confirm-status" class="muted" style="font-size:12px"></div>' +
      '</div>' +
      '<div style="display:flex;gap:8px">' +
        '<button class="secondary" id="doc-cancel2" style="flex:1">Cancelar</button>' +
        '<button id="doc-confirm" style="flex:1">Enviar para confirmar</button>' +
      '</div>'
    );

    document.getElementById('doc-cancel2').onclick = closeModal;
    document.getElementById('doc-confirm').onclick = function () {
      var confirmBtn = document.getElementById('doc-confirm');
      var cancelBtn = document.getElementById('doc-cancel2');
      var progressWrap = document.getElementById('doc-confirm-progress');
      var progressFill = document.getElementById('doc-confirm-progress-fill');
      var statusEl = document.getElementById('doc-confirm-status');
      confirmBtn.disabled = true;
      cancelBtn.disabled = true;
      progressWrap.style.display = 'block';
      progressFill.style.width = '100%'; // uma chamada só agora — sem etapas intermediárias pra medir, só indica "em andamento"
      statusEl.textContent = 'Enviando ' + result.items.length + ' para confirmar…';

      var fixEl = document.getElementById('doc-fix-account');
      var payload = {
        accountId: result.accountId, applyAccountFix: fixEl ? fixEl.checked : false,
        accountMismatch: result.accountMismatch, fileId: result.fileId
      };

      run('confirmDocumentImportBatch', payload, result.items, true).then(function (summary) {
        statusEl.textContent = 'Atualizando…';
        return refreshAll().then(render).then(function () {
          closeModal();
          var msg = summary.created + ' para confirmar.';
          if (summary.skipped) msg += ' ' + summary.skipped + ' já existiam e foram puladas.';
          showToast(msg);
        });
      }).catch(function (err) {
        confirmBtn.disabled = false;
        cancelBtn.disabled = false;
        errorPopover(confirmBtn, err.message);
      });
    };
  }

  // ---------- accounts ----------
  function accountRowHtml(a) {
    var investInfo = '';
    if (a.type === 'investment' && (a.investmentDate || a.maturityDate || a.description)) {
      var parts = [];
      if (a.investmentDate || a.maturityDate) {
        parts.push((a.investmentDate ? fmtDate(a.investmentDate) : '?') + ' → ' + (a.maturityDate ? fmtDate(a.maturityDate) : '?'));
      }
      if (a.description) parts.push(escapeHtml(a.description));
      investInfo = ' · ' + parts.join(' · ');
    }
    return '<div class="row" data-row-account="' + escapeHtml(a.id) + '"><span>' + accountNameHtml_(a.name, a.colorIndex) + '<br><span class="muted">' + fmtMoney(a.balance) + investInfo + '</span></span>' +
      '<span class="row-actions">' + rowRemoveButtonHtml_('data-archive', a.id, 'Arquivar') + '</span></div>';
  }

  function renderAccounts() {
    var root = document.getElementById('view-root');
    var groups = Object.keys(ACCOUNT_TYPE_LABELS).map(function (type) {
      return { label: ACCOUNT_TYPE_LABELS[type], accounts: STATE.accounts.filter(function (a) { return a.type === type; }) };
    }).filter(function (g) { return g.accounts.length > 0; });

    var html = groups.map(function (g) {
      return '<div class="card"><h2>' + g.label + '</h2>' + g.accounts.map(accountRowHtml).join('') + '</div>';
    }).join('') || '<div class="card"><div class="empty-state">Nenhuma conta cadastrada.</div></div>';

    root.innerHTML = html + '<div style="text-align:left;margin-bottom:16px"><button id="add-account">Nova conta</button></div>';

    root.querySelectorAll('[data-row-account]').forEach(function (rowEl) {
      wireRowTooltip_(rowEl, 'conta', function () {
        var acc = STATE.accounts.find(function (a) { return a.id === rowEl.dataset.rowAccount; });
        if (acc) openAccountModal(acc);
      });
    });
    wireRowRemoveButtons_(root, '[data-archive]', 'Arquivar esta conta?', function (btn) {
      var rawId = btn.dataset.archive;
      var idx = STATE.accounts.findIndex(function (a) { return a.id === rawId; });
