   * houver, dividido pelo tanto de meses reais que isso cobre; null se nem 1 mês de
   * histórico existir (base insuficiente pra uma média confiável). Usado tanto pra
   * colorir a curva/pontos do gráfico de projeção quanto pras linhas horizontais de "X
   * meses de gasto médio" (ver mesesGarantidosLevelForValue_/drawMesesGarantidosThresholds_)
   * -- null em qualquer um dos dois casos significa "não recolore nem desenha as linhas".
   */
  function computeMonthlyExpenseStats_() {
    // Fora os "Não considerar em análises?" (pedido explícito do usuário): é uma MÉDIA -- uma
    // compra pontual grande distorceria as linhas de "X meses de gasto médio" e a cor da
    // curva/ponto Hoje. Também não conta pra decidir se já há histórico suficiente.
    var expenseDates = STATE.allTransactions
      .filter(function (t) { return t.kind === 'expense' && t.date && !t.excludeFromAnalysis; })
      .map(function (t) { return t.date; });
    if (!expenseDates.length) return null;
    var earliestYmd = expenseDates.reduce(function (min, d) { return d < min ? d : min; });

    var today = new Date();
    var todayYmd = ymdFromDate_(today);
    var threeMonthsAgoYmd = ymdFromDate_(subtractMonths_(today, 3));
    var oneMonthAgoYmd = ymdFromDate_(subtractMonths_(today, 1));

    var windowStartYmd;
    if (earliestYmd <= threeMonthsAgoYmd) windowStartYmd = threeMonthsAgoYmd;
    else if (earliestYmd <= oneMonthAgoYmd) windowStartYmd = earliestYmd;
    else return null;

    var windowDays = (today - parseYmd_(windowStartYmd)) / (1000 * 60 * 60 * 24);
    var windowMonths = windowDays / 30.4368; // média de dias por mês do calendário gregoriano
    var sum = STATE.allTransactions
      .filter(function (t) { return t.kind === 'expense' && !t.excludeFromAnalysis && t.date >= windowStartYmd && t.date <= todayYmd; })
      .reduce(function (s, t) { return s + t.amount; }, 0);

    return { average: sum / windowMonths, windowMonths: windowMonths };
  }

  /**
   * BALANCE_TREND_PAST_MONTHS meses fechados (saldo real reconstruído) + hoje (saldo real
   * atual) + BALANCE_TREND_FUTURE_MONTHS meses projetados (saldo atual + delta recorrente
   * acumulado + efeito pontual de Planos a partir do mês em que cada um acontece,
   * carregado adiante pros meses seguintes já que é uma mudança permanente de saldo).
   * isDeclining considera só o delta recorrente, NUNCA os Planos — um Plano é um evento
   * pontual e não deve mexer na leitura de tendência de crescimento/queda (ver aviso em
   * buildBalanceTrendHtml_/renderBalanceTrendChart_).
   */
  function computeBalanceTrend_() {
    var currentYm = ymdFromDate_(new Date()).slice(0, 7);

    var pastMonths = [];
    for (var i = BALANCE_TREND_PAST_MONTHS; i >= 1; i--) pastMonths.push(shiftYm_(currentYm, -i));
    var pastValues = pastMonths.map(function (ym) {
      return totalBalanceAsOfYmd_(ym + '-' + String(daysInMonth_(ym)).padStart(2, '0'));
    });

    var currentBalance = trendAccounts_()
      .reduce(function (sum, a) { return sum + a.balance; }, 0);

    var planImpactByMonth = {};
    // Quantos Planos (não a soma dos valores, isso já é planImpactByMonth) cada mês tem
    // -- mostrado dentro do próprio ponto do gráfico agora que a caixa fixa foi
    // desligada (ver drawBalanceTrendPlanCountLabels_).
    var planCountByMonth = {};
    STATE.plans.forEach(function (p) {
      var sign = p.kind === 'expense' ? -1 : 1;
      planImpactByMonth[p.month] = (planImpactByMonth[p.month] || 0) + sign * p.amount;
      planCountByMonth[p.month] = (planCountByMonth[p.month] || 0) + 1;
    });

    var futureMonths = [], futureValues = [];
    var running = currentBalance;
    var recurringTotal = 0;
    for (var j = 1; j <= BALANCE_TREND_FUTURE_MONTHS; j++) {
      var ym = shiftYm_(currentYm, j);
      var delta = recurringMonthlyDeltaForMonth_(ym);
      recurringTotal += delta;
      running += delta + (planImpactByMonth[ym] || 0);
      futureMonths.push(ym);
      futureValues.push(running);
    }

    // Meta de saldo (ver computeBalanceGoalStatus_): derivada do saldo PLOTADO (currentBalance
    // já segue "Incluir investimentos", ver trendAccounts_) e do próximo ponto projetado. A
    // meta GUARDADA é sempre sem investimentos; com "Incluir investimentos" ligado a linha
    // desenhada sobe o mesmo valor dos investimentos (ver effectiveBalanceGoal_) -- assim a
    // meta anda junto com a curva, que também sobe esse valor, e o estado dela ("quase lá",
    // "atingida") é o mesmo nos dois modos.
    var goal = effectiveBalanceGoal_(STATE.balanceGoal, trendInvestmentsTotal_(), STATE.trendIncludeInvestments);
    var goalStatus = goal ? computeBalanceGoalStatus_(goal, currentBalance, futureValues[0]) : null;

    return {
      months: pastMonths.concat([currentYm], futureMonths),
      values: pastValues.concat([currentBalance], futureValues),
      splitIndex: pastMonths.length,
      goal: goal,
      goalStatus: goalStatus,
      isDeclining: recurringTotal < 0,
      // Ritmo médio recorrente por mês (SEM Planos, que são pontuais) — o texto
      // "+R$X/mês" na ponta da projeção (ver drawBalanceTrendRateLabel_) mostra isso.
      avgMonthlyDelta: recurringTotal / BALANCE_TREND_FUTURE_MONTHS,
      planImpactByMonth: planImpactByMonth,
      planCountByMonth: planCountByMonth,
      // { average, windowMonths } ou null -- ver computeMonthlyExpenseStats_/
      // mesesGarantidosLevelForValue_/drawMesesGarantidosThresholds_.
      monthlyExpenseStats: computeMonthlyExpenseStats_()
    };
  }

  /** "R$ 1.234" — mesmo estilo de fmtMoney, sem centavos (só o gráfico de projeção usa). */
  function fmtMoneyNoCents_(value) {
    return Math.round(value).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
  }
  /** "+R$ 500" / "-R$ 300" / "R$ 0" — fmtMoneyNoCents_ já traz o "-" de negativos; só falta o "+" de positivos. */
  function fmtSignedMoneyNoCents_(value) {
    var rounded = Math.round(value);
    return rounded > 0 ? '+' + fmtMoneyNoCents_(rounded) : fmtMoneyNoCents_(rounded);
  }

  // ---------- meta de saldo do gráfico de projeção (ver grilling) ----------
  /** Soma dos saldos de HOJE das contas de investimento -- o valor que "Incluir
   *  investimentos" adiciona à curva (todo ponto da projeção, ver trendAccounts_/
   *  computeBalanceTrend_: os investimentos entram parados, sem rendimento projetado). */
  function trendInvestmentsTotal_() {
    return STATE.accounts.filter(function (a) { return a.type === 'investment'; })
      .reduce(function (sum, a) { return sum + a.balance; }, 0);
  }
  /**
   * Meta a DESENHAR/comparar, a partir da GUARDADA (base = SEM investimentos, pedido
   * explícito do usuário): com "Incluir investimentos" ligado, sobe o mesmo valor dos
   * investimentos; desligado, é a própria base. null sem meta. Arredondada a centavos.
   * O valor mostrado ao editar a meta (ver openBalanceGoalPopover_) é este mesmo -- por
   * isso ele também muda sozinho ao ligar/desligar o toggle.
   */
  function effectiveBalanceGoal_(baseGoal, investmentsTotal, includeInvestments) {
    if (!baseGoal) return null;
    return Math.round((baseGoal + (includeInvestments ? investmentsTotal : 0)) * 100) / 100;
  }
  /** Inverso de effectiveBalanceGoal_: o que o usuário digitou no modo atual vira o valor
   *  GUARDADO (sem investimentos). Pode dar <= 0 se ele digitou, com os investimentos
   *  incluídos, uma meta menor que os próprios investimentos (quem chama recusa). */
  function storedBalanceGoalFromTyped_(typedAmount, investmentsTotal, includeInvestments) {
    return Math.round((typedAmount - (includeInvestments ? investmentsTotal : 0)) * 100) / 100;
  }
  /**
   * Estado da meta, SEMPRE derivado (nada gravado, mesma convenção de tudo que é
   * "completo"/"líquido" no app): 'reached' quando o saldo de hoje já alcançou/passou a
   * meta; 'almost' quando ainda não, mas o PRÓXIMO ponto projetado (que já inclui
   * recorrentes e Planos -- o que se enxerga na curva) alcança; senão 'active'. Compara em
   * centavos pra um resíduo de ponto flutuante nunca decidir por 1 centavo.
   */
  function computeBalanceGoalStatus_(goal, currentBalance, nextProjectedBalance) {
    var goalCents = Math.round(goal * 100);
    if (Math.round(currentBalance * 100) >= goalCents) return 'reached';
    if (nextProjectedBalance !== null && nextProjectedBalance !== undefined && Math.round(nextProjectedBalance * 100) >= goalCents) return 'almost';
    return 'active';
  }
  function balanceGoalLabelText_(status) {
    if (status === 'reached') return 'Meta atingida!';
    if (status === 'almost') return 'Meta atual - quase lá!';
    return 'Meta atual';
  }
  // Lucide "party-popper" -- o símbolo no lugar do emoji de "Meta atingida!" (o app
  // nunca usa emoji em texto, só ícone SVG; ver categoryIconSvg_).
  var BALANCE_GOAL_REACHED_ICON_ = '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.15em;margin-right:4px" aria-hidden="true">' +
    '<path d="M5.8 11.3 2 22l10.7-3.79"/><path d="M4 3h.01"/><path d="M22 8h.01"/><path d="M15 2h.01"/><path d="M22 20h.01"/>' +
    '<path d="m22 2-2.24.75a2.9 2.9 0 0 0-1.96 3.12c.1.86-.57 1.63-1.45 1.63h-.38c-.86 0-1.6.6-1.76 1.44L14 10"/>' +
    '<path d="m22 13-.82-.33c-.86-.34-1.82.2-1.98 1.11c-.11.7-.72 1.22-1.43 1.22H17"/>' +
    '<path d="m11 2 .33.82c.34.86-.2 1.82-1.11 1.98C9.52 4.9 9 5.52 9 6.23V7"/>' +
    '<path d="M11 13c1.93 1.93 2.83 4.17 2 5-.83.83-3.07-.07-5-2-1.93-1.93-2.83-4.17-2-5 .83-.83 3.07.07 5 2Z"/></svg>';
  function balanceGoalLabelHtml_(status) {
    var text = escapeHtml(balanceGoalLabelText_(status));
    return status === 'reached' ? BALANCE_GOAL_REACHED_ICON_ + text : text;
  }
  /** Conteúdo do hover no rótulo da meta -- mesma forma do hover das linhas de "X meses
   *  de gasto médio" (valor em cima, detalhe em itálico menor embaixo). "Faltam" arredonda
   *  pra CIMA e "acima da meta" pra BAIXO, pra nunca prometer mais nem menos do que é. */
  function buildBalanceGoalTooltipHtml_(goal, currentBalance) {
    var diff = goal - currentBalance;
    var detail;
    if (diff > 0) detail = 'Faltam ' + fmtMoneyNoCents_(Math.ceil(diff));
    else if (Math.floor(-diff) > 0) detail = fmtMoneyNoCents_(Math.floor(-diff)) + ' acima da meta';
    else detail = 'Exatamente na meta';
    return escapeHtml('Meta: ' + fmtMoneyNoCents_(goal)) + '<br>' +
      '<span style="font-style:italic;font-size:11px">' + escapeHtml(detail) + '</span>';
  }

  // Valor local otimista enquanto uma gravação da meta está em voo (ver
  // applyBootstrapData/saveBalanceGoalClient_): { value } (número ou null) ou null.
  var pendingBalanceGoal_ = null;
  /** value: número em R$ (cria/troca a meta) ou null (exclui). Otimista, mesmo padrão de
   *  sempre: aplica na hora, manda pro servidor, desfaz + toast se falhar. */
  function saveBalanceGoalClient_(value) {
    var prev = STATE.balanceGoal;
    var token = { value: value };
    pendingBalanceGoal_ = token;
    STATE.balanceGoal = value;
    render();
    function release_() { if (pendingBalanceGoal_ === token) pendingBalanceGoal_ = null; }
    var mutation = value === null ? run('removeBalanceGoal') : run('setBalanceGoal', { amount: value });
    afterMutation_(mutation.then(function (r) { release_(); return r; }, function (err) { release_(); throw err; })).catch(function (err) {
      STATE.balanceGoal = prev;
      render();
      showToast(err.message, true);
    });
  }
  /** Popover pequeno do botão "Adicionar meta"/"Editar meta": campo em R$ + Salvar (+
   *  Excluir quando já existe meta, direto, sem confirmar -- é só um número). */
  function openBalanceGoalPopover_(anchorEl) {
    closeActiveConfirmPopover_();
    var hasGoal = !!STATE.balanceGoal;
    // Valor mostrado = o da linha desenhada agora (com os investimentos somados quando o
    // toggle está ligado); ao salvar, volta pro valor guardado (sem investimentos) -- ver
    // effectiveBalanceGoal_/storedBalanceGoalFromTyped_.
    var investmentsTotal = trendInvestmentsTotal_();
    var includeInvestments = !!STATE.trendIncludeInvestments;
    var pop = document.createElement('div');
    pop.id = 'confirm-popover';
    pop.className = 'confirm-popover';
    pop.innerHTML =
      '<div style="width:200px">' +
        '<label style="display:block;margin-bottom:4px;font-size:12px">Meta de saldo' + (includeInvestments ? ' (com investimentos)' : '') + '</label>' +
        '<input id="balance-goal-input" type="text">' +
        '<div id="balance-goal-error" style="color:var(--expense);font-size:12px;margin-top:6px;display:none"></div>' +
      '</div>' +
      '<div class="confirm-popover-actions">' +
        (hasGoal ? '<button type="button" class="secondary" data-act="delete">Excluir</button>' : '') +
        '<button type="button" data-act="ok">Salvar</button>' +
      '</div>';
    positionPopover(anchorEl, pop);
    var input = pop.querySelector('#balance-goal-input');
    setupMoneyInput(input, effectiveBalanceGoal_(STATE.balanceGoal, investmentsTotal, includeInvestments) || 0);
    var stopListening;
    function cleanup() { pop.remove(); stopListening(); activeConfirmPopoverCleanup_ = null; }
    stopListening = dismissOnOutsideClick(pop, cleanup);
    activeConfirmPopoverCleanup_ = cleanup;
    function save_() {
      var amount = input.getValue();
      var errEl = pop.querySelector('#balance-goal-error');
      if (!amount || amount <= 0) {
        errEl.textContent = 'Informe um valor maior que zero.';
        errEl.style.display = 'block';
        return;
      }
      var stored = storedBalanceGoalFromTyped_(amount, investmentsTotal, includeInvestments);
      if (stored <= 0) {
        errEl.textContent = 'Com os investimentos incluídos, a meta precisa ser maior que eles (' + fmtMoneyNoCents_(investmentsTotal) + ').';
        errEl.style.display = 'block';
        return;
      }
      cleanup();
      saveBalanceGoalClient_(stored);
    }
    pop.querySelector('[data-act="ok"]').onclick = save_;
    var deleteBtn = pop.querySelector('[data-act="delete"]');
    if (deleteBtn) deleteBtn.onclick = function () { cleanup(); saveBalanceGoalClient_(null); };
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); save_(); }
      else if (e.key === 'Escape') { cleanup(); }
    });
    input.focus();
    input.select();
  }

  function buildBalanceTrendHtml_() {
    return '<div class="card" style="position:relative">' +
      // position:relative + z-index:1 -- .balance-trend-canvas-wrap logo abaixo é
      // position:relative e a margem negativa dele (ver #balance-trend-warning:empty
      // + .balance-trend-canvas-wrap, Stylesheet.html) sobrepõe visualmente o rodapé
      // desta linha de título; sem essa camada por cima, o CANVAS ficava por cima do
      // próprio botão "Incluir investimentos", capturando o clique antes dele chegar
      // no botão (bug relatado: "deixou de ser clicável"). flex-wrap: com o botão novo
      // de meta ao lado, em tela estreita os botões quebram de linha em vez de espremer.
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;position:relative;z-index:1">' +
        '<h2 style="margin-bottom:0">Projeção do saldo</h2>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">' +
          '<button type="button" class="capsule" id="trend-goal-btn">' + (STATE.balanceGoal ? 'Editar meta' : 'Adicionar meta') + '</button>' +
          '<button type="button" class="capsule' + (STATE.trendIncludeInvestments ? ' active' : '') + '" ' +
            'id="trend-include-investments">Incluir investimentos</button>' +
        '</div>' +
      '</div>' +
      '<div id="balance-trend-warning"></div>' +
      '<div class="balance-trend-canvas-wrap"><canvas id="chart-balance-trend"></canvas></div>' +
    '</div>';
  }

  // "ym" (ou null) do mês com Plano cuja caixa fixa está escondida agora por causa do
  // hover do tooltip normal (ver o "external" do tooltip em renderBalanceTrendChart_ e
  // drawBalanceTrendPlanLabels_, que lê isso pra já nascer com a opacidade certa quando
  // o redesenho acontece enquanto esse hover ainda está em andamento).
  var balanceTrendTooltipHoveredYm_ = null;

  /**
   * Tooltip 100% HTML (em vez do canvas nativo do Chart.js): é a única forma de misturar
   * negrito/itálico/cores DIFERENTES dentro do mesmo tooltip (o tooltip nativo só permite
   * uma fonte só pro título e uma só pro corpo inteiro). position:relative no .card (ver
   * buildBalanceTrendHtml_) é o que faz canvas.offsetLeft/Top baterem certo com o próprio
   * .card, que é onde esse div é anexado (mesmo padrão do exemplo oficial do Chart.js).
   */
  function getOrCreateBalanceTooltip_(chart) {
    var el = chart.canvas.parentNode.querySelector('.balance-trend-tooltip');
    if (!el) {
      el = document.createElement('div');
      // .balance-trend-box (Stylesheet.html) traz o visual comum (fundo/borda/sombra/
      // fonte); só o que é específico do TOOLTIP de hover fica inline aqui.
      el.className = 'balance-trend-tooltip balance-trend-box';
      el.style.pointerEvents = 'none';
      el.style.transition = 'opacity .1s ease';
      el.style.whiteSpace = 'nowrap';
      chart.canvas.parentNode.appendChild(el);
    }
    return el;
  }

  /** Uma linha "±R$X · rótulo" por Plano do mês, colorida por tipo -- compartilhada
   *  pelo tooltip de hover (buildBalanceTooltipHtml_) e pela caixa sempre visível
   *  (buildPlanAnnotationBoxHtml_), pra garantir o mesmo texto/formatação nas duas. */
  function buildPlanLinesHtml_(ym) {
    return STATE.plans.filter(function (p) { return p.month === ym; }).map(function (p) {
      var signedAmount = p.kind === 'expense' ? -p.amount : p.amount;
      var planColor = signedAmount < 0 ? 'var(--expense)' : 'var(--income)';
      return '<div><span style="color:' + planColor + '">' + escapeHtml(fmtSignedMoneyNoCents_(signedAmount)) + '</span> · ' + escapeHtml(p.label) + '</div>';
    }).join('');
  }

  function buildBalanceTooltipHtml_(trend, idx) {
    var ym = trend.months[idx];
    var html = '<div style="margin-bottom:2px">' + escapeHtml(fmtMonthYear(ym)) + '</div>' +
      '<div style="font-weight:700;margin-bottom:2px">' + escapeHtml(fmtMoneyNoCents_(trend.values[idx])) + '</div>';
    if (idx !== trend.splitIndex) {
      var diff = trend.values[idx] - trend.values[trend.splitIndex];
      var diffColor = diff > 0 ? 'var(--income)' : (diff < 0 ? 'var(--expense)' : 'var(--text)');
      html += '<div><span style="color:' + diffColor + '">' + escapeHtml(fmtSignedMoneyNoCents_(diff)) + '</span> em relação a hoje</div>';
    }
    html += buildPlanLinesHtml_(ym);
    if (idx >= trend.splitIndex) {
      html += '<div style="font-style:italic;color:var(--text-muted);font-size:11px;margin-top:4px">Clique para adicionar um plano</div>';
    }
    return html;
  }

  // ---------- anotações do gráfico de tendência (taxa mensal + Planos) ----------
  /**
   * Empacota "chips" de rótulo ao longo do eixo X sem sobrepor uns aos outros NEM a
   * própria curva do gráfico: pra cada item {x, width, height, preferredY}, testa
   * fileiras cada vez mais longe da linha — em paralelo, ACIMA e ABAIXO — até achar
   * uma onde não bate em outro rótulo já colocado desse MESMO lado nem cruza a curva
   * (curvePoints: pontos {x,y} em PIXEL, um por mês, ordenados; a curva de verdade do
   * Chart.js tem uma leve tensão entre eles, mas a interpolação LINEAR usada aqui pra
   * amostrar alguns X ao longo da largura do rótulo já é o bastante pra decidir "passa
   * perto demais"). Função PURA (só números, sem canvas/DOM).
   *
   * opts.minX/maxX clampam o X de cada item ANTES de decidir fileira/lado (o item
   * devolvido já vem com esse x FINAL, clampado) — clampar só DEPOIS de decidir (como a
   * versão anterior fazia, no lugar que chama esta função) podia empurrar dois itens de
   * fileiras/lados DIFERENTES pro mesmo X na borda do gráfico, sobrepondo os dois
   * mesmo já tendo sido "separados" (bug relatado: caixas de Plano perto da borda
   * direita sobrepondo uma à outra).
   *
   * A checagem de colisão compara o retângulo de CADA item já posicionado (esquerda/
   * direita/topo/base de verdade), não um índice de "fileira" só com esquerda/direita
   * (como numa versão anterior desta função) -- "fileira 0" de um item cujo dot está
   * bem no topo da curva e "fileira 0" de outro cujo dot está bem embaixo (comum perto
   * de um Plano grande, que costuma criar quedas/picos no valor) são posições verticais
   * bem diferentes; bucketar só por índice de fileira podia achar as duas "livres"
   * (nenhum conflito NAQUELE índice) mesmo quando os retângulos de verdade se
   * sobrepunham (bug relatado: caixas de Plano perto uma da outra sobrepondo mesmo já
   * "separadas").
   */
  function layoutTimelineLabels_(items, curvePoints, opts) {
    var placedAbove = [], placedBelow = [];

    function curveYAtX(x) {
      if (!curvePoints.length) return null;
      if (x <= curvePoints[0].x) return curvePoints[0].y;
      var last = curvePoints[curvePoints.length - 1];
      if (x >= last.x) return last.y;
      for (var i = 0; i < curvePoints.length - 1; i++) {
        var p0 = curvePoints[i], p1 = curvePoints[i + 1];
        if (x >= p0.x && x <= p1.x) {
          var t = p1.x === p0.x ? 0 : (x - p0.x) / (p1.x - p0.x);
          return p0.y + t * (p1.y - p0.y);
        }
      }
      return null;
    }
    function boxHitsCurve(left, right, centerY, height) {
      var top = centerY - height / 2 - opts.curveMargin, bottom = centerY + height / 2 + opts.curveMargin;
      var STEPS = 8;
      for (var s = 0; s <= STEPS; s++) {
        var y = curveYAtX(left + (right - left) * (s / STEPS));
        if (y !== null && y >= top && y <= bottom) return true;
      }
      return false;
    }
    function boxHitsPlaced(placed, left, right, top, bottom) {
      return placed.some(function (b) {
        return left < b.right + opts.gapBetweenItems && right > b.left - opts.gapBetweenItems &&
          top < b.bottom && bottom > b.top;
      });
    }
    // Primeira fileira desse lado (a partir do preferredY do PRÓPRIO item) que não bate
    // em NENHUM retângulo já colocado nesse lado nem na curva — não achar NENHUMA até
    // maxRows (precisaria de dezenas de Planos empilhados) aceita a última tentativa
    // mesmo assim, com risco residual de sobreposição, em vez de nunca devolver nada.
    // centerY já sai clampado a [minY,maxY] AQUI DENTRO, antes de checar colisão --
    // clampar só depois (como uma versão anterior fazia, no lugar que chama esta
    // função) tinha o mesmo problema do X (ver comentário da função): um item preso
    // perto do topo/fundo do gráfico podia ser aceito numa fileira "livre" e só DEPOIS
    // ser empurrado de volta pra dentro da área, encostando em outro item que só
    // parecia distante antes do clamp (bug relatado, reproduzido com um Plano bem no
    // fundo do gráfico -- valor bem baixo -- perto de outro).
    function findRow(placed, left, right, preferredY, height, sign) {
      var row = 0;
      while (row <= opts.maxRows) {
        var rawCenterY = preferredY + sign * (opts.rowGap + row * (height + opts.rowGap) + height / 2);
        var centerY = Math.min(Math.max(rawCenterY, opts.minY + height / 2), opts.maxY - height / 2);
        var top = centerY - height / 2, bottom = centerY + height / 2;
        if (!boxHitsPlaced(placed, left, right, top, bottom) && !boxHitsCurve(left, right, centerY, height)) {
          return { row: row, centerY: centerY };
        }
        row++;
      }
      var fallbackRaw = preferredY + sign * (opts.rowGap + opts.maxRows * (height + opts.rowGap) + height / 2);
      var fallbackY = Math.min(Math.max(fallbackRaw, opts.minY + height / 2), opts.maxY - height / 2);
      return { row: opts.maxRows, centerY: fallbackY };
    }

    return items.map(function (item) {
      var x = Math.min(Math.max(item.x, opts.minX + item.width / 2), opts.maxX - item.width / 2);
      var left = x - item.width / 2, right = x + item.width / 2;
      var above = findRow(placedAbove, left, right, item.preferredY, item.height, -1);
      var below = findRow(placedBelow, left, right, item.preferredY, item.height, 1);
      // Fileira mais próxima da linha decide o lado — empate vai pra "acima" (leitura
      // mais natural, mesmo critério de qualquer callout).
      var side = above.row <= below.row ? 'above' : 'below';
      var chosen = side === 'above' ? above : below;
      var placed = side === 'above' ? placedAbove : placedBelow;

      var centerY = chosen.centerY; // já clampado dentro de findRow
      placed.push({ left: left, right: right, top: centerY - item.height / 2, bottom: centerY + item.height / 2 });
      // Object.assign (não uma lista fixa de campos) -- repassa QUALQUER coisa que o
      // chamador tenha posto no item original (ex: "el", o <div> da caixa de Plano),
      // além dos campos que essa função de fato calcula (x já clampado, side/row/centerY).
      return Object.assign({}, item, { x: x, side: side, row: chosen.row, centerY: centerY });
    });
  }

  /** "+R$3.150/mês" (ou "-R$..."), na ponta direita da projeção, rotacionado pra
   *  acompanhar a inclinação REAL do gráfico ali (ângulo em PIXELS entre "Hoje" e o
   *  último mês projetado — em valor de dado distorceria com a proporção do gráfico).
   *  O deslocamento "pra cima" é aplicado DEPOIS de rotacionar — perpendicular à
   *  própria linha, não vertical na tela — assim ele continua afastado dela em
   *  qualquer inclinação, em vez de voltar a ficar em cima quando ela for íngreme. */
  function drawBalanceTrendRateLabel_(chart, opts) {
    var trend = opts.trend;
    var xScale = chart.scales.x, yScale = chart.scales.y;
    var lastIdx = trend.months.length - 1;
    var startX = xScale.getPixelForValue(trend.splitIndex), startY = yScale.getPixelForValue(trend.values[trend.splitIndex]);
    var endX = xScale.getPixelForValue(lastIdx), endY = yScale.getPixelForValue(trend.values[lastIdx]);
    var angle = Math.atan2(endY - startY, endX - startX);
    var GAP = 10; // um pouco mais perto da curva, a pedido do usuário (era 16)

    var ctx = chart.ctx;
    ctx.save();
    ctx.font = '600 12px ' + opts.fontFamily;
    ctx.translate(endX, endY);
    ctx.rotate(angle);
    ctx.translate(0, -GAP);
    ctx.textAlign = 'right'; // cresce pra ESQUERDA a partir da ponta — não vaza pra fora da direita do gráfico
    ctx.textBaseline = 'bottom';
    // Cor agora inteiramente determinada pela região (2-/2-6/6+ meses de gasto médio,
    // ver mesesGarantidosLevelForValue_) do ÚLTIMO ponto da projeção -- não mais se o
    // saldo está subindo ou descendo (pedido explícito do usuário). Sem gasto médio
    // confiável (feature inativa), cai de volta na lógica antiga (queda=vermelho,
    // crescimento=verde) -- ainda melhor que uma cor sem sentido nenhum nesse caso.
    var lastLevel = mesesGarantidosLevelForValue_(trend.values[lastIdx], trend.monthlyExpenseStats);
    if (lastLevel === 'danger') ctx.fillStyle = opts.expenseColor;
    else if (lastLevel === 'warning') ctx.fillStyle = opts.warningColor;
    else if (lastLevel === 'normal') ctx.fillStyle = opts.incomeColor;
    else ctx.fillStyle = trend.avgMonthlyDelta < 0 ? opts.expenseColor : opts.incomeColor;
    ctx.fillText(fmtSignedMoneyNoCents_(trend.avgMonthlyDelta) + '/mês', 0, 0);
    ctx.restore();
  }

  /** Linha em ângulo reto com UM canto arredondado, do círculo do mês até a borda da
   *  caixa mais próxima dele (a de baixo se ela está ACIMA da linha, a de cima se está
   *  ABAIXO) — nunca atravessa a própria caixa. boxHeight é o tamanho de verdade da
   *  caixa (um <div>, ver buildPlanAnnotationBoxHtml_/drawBalanceTrendPlanLabels_), não
   *  um valor fixo, já que o número de Planos por mês muda a altura dela. Sempre branca
   *  (pedido explícito do usuário), pra se destacar tanto da curva quanto do fundo do
   *  card — as bordas laterais da caixa ficaram de fora de propósito (usuário optou por
   *  manter a geometria como está, só trocando a cor, depois de eu explicar que hoje a
   *  caixa fica sempre em cima/embaixo do círculo, nunca ao lado, então uma linha
   *  lateral só apareceria no caso raríssimo do mês na ponta do gráfico). O contorno
   *  escuro semi-transparente antes da linha branca é necessário pra ela não ficar
   *  invisível no tema claro (o card e a própria caixa são brancos ali; só no tema
   *  escuro o branco puro já teria contraste sozinho) — no tema escuro esse contorno
   *  quase não aparece (fundo já escuro), então o efeito visual pretendido (linha
   *  branca) fica igual nos dois temas. */
  function drawElbowConnector_(ctx, x1, y1, x2, y2, boxHeight, side) {
    var edgeY = side === 'above' ? y2 + boxHeight / 2 : y2 - boxHeight / 2;
    var vDir = edgeY > y1 ? 1 : -1;
    var hDir = x2 > x1 ? 1 : (x2 < x1 ? -1 : 0);
    var r = Math.min(6, Math.abs(x2 - x1) || 6);
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    if (hDir === 0) {
      ctx.lineTo(x1, edgeY);
    } else {
      ctx.lineTo(x1, edgeY - vDir * r);
      ctx.quadraticCurveTo(x1, edgeY, x1 + hDir * r, edgeY);
      ctx.lineTo(x2, edgeY);
    }
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.28)';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }

  /** Mês + uma linha por Plano (ver buildPlanLinesHtml_) -- mesmo conteúdo do tooltip de
   *  hover (buildBalanceTooltipHtml_), só sem o saldo do mês, sem "em relação a hoje" e
   *  sem "Clique para adicionar um plano" (não fazem sentido numa caixa sempre visível,
   *  ancorada num mês específico que já tem Plano). */
  function buildPlanAnnotationBoxHtml_(ym) {
    return '<div style="margin-bottom:2px">' + escapeHtml(fmtMonthYear(ym)) + '</div>' + buildPlanLinesHtml_(ym);
  }

  /**
   * Número de Planos daquele mês desenhado DENTRO do próprio ponto do gráfico (ponto já
   * vem maior nesses meses, ver pointRadius em renderBalanceTrendChart_) -- substitui a
   * caixa fixa (drawBalanceTrendPlanLabels_, desligada por poluir o gráfico) como forma
   * de sinalizar "esse mês tem Plano(s)". Halo escuro atrás do número branco (mesma
   * técnica de drawElbowConnector_) -- sem isso o branco quase some no ponto amarelo
   * claro do tema escuro (--warning).
   */
  function drawBalanceTrendPlanCountLabels_(chart, opts) {
    var trend = opts.trend;
    var xScale = chart.scales.x, yScale = chart.scales.y;
    var ctx = chart.ctx;
    ctx.save();
    ctx.font = '700 10px ' + opts.fontFamily;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    trend.months.forEach(function (ym, idx) {
      var count = trend.planCountByMonth[ym];
      if (!count) return;
      var x = xScale.getPixelForValue(idx), y = yScale.getPixelForValue(trend.values[idx]);
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.strokeText(String(count), x, y + 0.5);
      ctx.fillStyle = '#fff';
      ctx.fillText(String(count), x, y + 0.5);
    });
    ctx.restore();
  }

  // Mais estreito que o tooltip de hover de propósito -- uma caixa LARGA cobre mais
  // trecho horizontal do gráfico, aumentando a chance de esbarrar num pico/vale da
  // curva bem ali (ela quebra linha em vez de esticar, ver buildPlanAnnotationBoxHtml_).
  var PLAN_BOX_MAX_WIDTH_PX_ = 160;

  /**
   * Uma caixa (mesma formatação do tooltip de hover, ver .balance-trend-box) por MÊS
   * com Plano -- não mais uma por PLANO: quando um mês tinha vários Planos, cada um
   * virava um chip separado que se espalhava pelo gráfico (bug relatado: "aparecendo
   * separadamente"). Agora todos os Planos do mesmo mês entram JUNTOS numa caixa só,
   * ligada ao círculo do mês por drawElbowConnector_ — nunca em cima da linha do
   * gráfico, de outra caixa, ou fora da área dele (ver layoutTimelineLabels_ pro
   * empacotamento vertical; o clamp horizontal aqui só entra em ação pros meses bem na
   * ponta esquerda/direita). É um <div> de verdade (não mais desenhado no canvas) --
   * um chip desenhado no canvas ficava CORTADO se a posição calculada caísse fora do
   * retângulo do próprio <canvas> (bug relatado: "cortando o gráfico"); um <div>
   * simplesmente não tem esse problema, e de quebra já sai com a MESMA formatação do
   * tooltip de graça (box-shadow, borda etc. são difíceis de replicar fielmente à mão
   * no canvas).
   */
  function drawBalanceTrendPlanLabels_(chart, opts) {
    var trend = opts.trend;
    var xScale = chart.scales.x, yScale = chart.scales.y;
    var area = chart.chartArea;
    var ctx = chart.ctx;
    var parent = chart.canvas.parentNode;

    // Redesenhado do zero a cada chamada (inclusive em re-renders só de hover, já que
    // afterDatasetsDraw roda de novo a cada um) -- mais simples e barato que tentar
    // reaproveitar caixas de uma rodada anterior.
    parent.querySelectorAll('.balance-trend-plan-box').forEach(function (el) { el.remove(); });
    // Preserva o estado atual de "hover em andamento" através do redesenho (ver
    // balanceTrendTooltipHoveredYm_) -- sem isso, hover num mês com Plano, seguido de
    // qualquer outro motivo de redesenho (ex: "Incluir investimentos"), fazia a caixa
    // fixa "piscar" visível de novo por baixo do tooltip antes de sumir de novo.

    // Um ponto {x,y} em PIXEL por mês — layoutTimelineLabels_ usa isso pra nunca deixar
    // uma caixa cair em cima da curva de verdade (não só longe do CÍRCULO do mês dela).
    var curvePoints = trend.months.map(function (ym, idx) {
      return { x: xScale.getPixelForValue(idx), y: yScale.getPixelForValue(trend.values[idx]) };
    });

    var items = [];
    trend.months.forEach(function (ym, idx) {
      if (!trend.planImpactByMonth[ym]) return;
      var dotX = xScale.getPixelForValue(idx);
      var dotY = yScale.getPixelForValue(trend.values[idx]);
      var el = document.createElement('div');
      el.className = 'balance-trend-plan-box balance-trend-box';
      el.dataset.ym = ym;
      el.style.pointerEvents = 'none';
      el.style.maxWidth = PLAN_BOX_MAX_WIDTH_PX_ + 'px';
      el.style.transition = 'opacity 150ms ease';
      el.style.opacity = ym === balanceTrendTooltipHoveredYm_ ? '0' : '1';
      el.innerHTML = buildPlanAnnotationBoxHtml_(ym);
      parent.appendChild(el);
      items.push({
        x: dotX, dotX: dotX, dotY: dotY, preferredY: dotY, el: el,
        width: el.offsetWidth, height: el.offsetHeight
      });
    });
    if (!items.length) return;

    var placed = layoutTimelineLabels_(items, curvePoints, {
      minX: area.left + 4, maxX: area.right - 4, minY: area.top + 4, maxY: area.bottom - 4,
      rowGap: 10, gapBetweenItems: 8, curveMargin: 6, maxRows: 8
    });
    placed.forEach(function (item) {
      // item.x já vem clampado por layoutTimelineLabels_ (minX/maxX acima) -- não
      // clampar de novo aqui, só usar.
      var labelTopY = item.centerY - item.height / 2;

      drawElbowConnector_(ctx, item.dotX, item.dotY, item.x, item.centerY, item.height, item.side);

      item.el.style.left = (chart.canvas.offsetLeft + item.x - item.width / 2) + 'px';
      item.el.style.top = (chart.canvas.offsetTop + labelTopY) + 'px';
    });
  }

  /** 'danger' (valor abaixo de 2 meses de gasto médio), 'warning' (entre 2 e 6) ou
   *  'normal' (6 ou mais) -- null quando não há gasto médio confiável (ver
   *  computeMonthlyExpenseStats_), significando "não recolorir". */
  function mesesGarantidosLevelForValue_(value, monthlyExpenseStats) {
    if (!monthlyExpenseStats || monthlyExpenseStats.average <= 0) return null;
    var avg = monthlyExpenseStats.average;
    if (value < avg * 2) return 'danger';
    if (value < avg * 6) return 'warning';
    return 'normal';
  }
  /** O nível mais urgente dos dois -- usado pra colorir um SEGMENTO da curva (que liga
   *  dois pontos, cada um podendo estar num nível diferente): se qualquer uma das
   *  pontas já está em alerta, o segmento inteiro reflete isso, em vez de só a ponta
   *  final (mais conservador -- avisa AO SE APROXIMAR de um ponto ruim, não só depois). */
  function mesesGarantidosWorseLevel_(a, b) {
    var RANK = { danger: 2, warning: 1, normal: 0 };
    if (!a) return b;
    if (!b) return a;
    return RANK[a] >= RANK[b] ? a : b;
  }
  // level null (sem gasto médio confiável -- feature inteira inativa) cai em
  // neutralColor (lineColor, a cor padrão de sempre); 'normal' (6+ meses de gasto
  // médio) é diferente disso -- É uma leitura confirmada de saúde financeira, por isso
  // ganha a MESMA cor verde do texto de tendência positiva (incomeColor), não a cor
  // neutra.
  function mesesGarantidosColor_(level, expenseColor, warningColor, incomeColor, neutralColor) {
    if (level === 'danger') return expenseColor;
    if (level === 'warning') return warningColor;
    if (level === 'normal') return incomeColor;
    return neutralColor;
  }

  /** As duas linhas horizontais (2 e 6 meses de gasto médio) a desenhar -- [] quando não
   *  há gasto médio confiável (ver computeMonthlyExpenseStats_). */
  function mesesGarantidosThresholds_(trend) {
    if (!trend.monthlyExpenseStats || trend.monthlyExpenseStats.average <= 0) return [];
    var avg = trend.monthlyExpenseStats.average;
    return [
      { months: 2, value: avg * 2, level: 'danger' },
      { months: 6, value: avg * 6, level: 'warning' }
    ];
  }

  /** "R$1.200 em despesas por mês" + "média calculada pelos últimos N meses" (em
   *  itálico, fonte menor), tudo numa linha só, sem quebra -- conteúdo do hover em cada
   *  linha de "X meses de gasto médio" (ver drawMesesGarantidosThresholds_). N é
   *  arredondado só pra exibição -- o cálculo em si usa o valor fracionário (ver
   *  computeMonthlyExpenseStats_). */
  /** Conteúdo do hover nas linhas de "X meses de gasto médio" -- o mesmo texto nas duas
   *  (2 e 6 meses), já que não depende de qual delas foi hover (pedido explícito do
   *  usuário): só o valor do gasto médio + o período usado no cálculo, em 2 linhas. */
  function buildMesesGarantidosTooltipHtml_(stats) {
    var roundedWindow = Math.max(1, Math.round(stats.windowMonths));
    return escapeHtml(fmtMoneyNoCents_(stats.average) + ' em despesas por mês') + '<br>' +
      '<span style="font-style:italic;font-size:11px">média calculada pelos últimos ' + roundedWindow + ' meses</span>';
  }

  /**
   * As duas linhas pontilhadas de "X meses de gasto médio" (ver mesesGarantidosThresholds_),
   * cada uma com um rótulo na ponta direita. Desenhada em beforeDatasetsDraw (não
   * afterDatasetsDraw, como as outras anotações desse plugin) de propósito: a curva --
   * já recolorida por mesesGarantidosLevelForValue_ -- deve ficar POR CIMA da linha de
   * referência tracejada, não escondida por ela, quando as duas se cruzam. O rótulo é
   * um <div> de verdade (não texto de canvas) só por ele precisar ser hoverável
   * (tooltip via mouseenter/mouseleave, reaproveitando o mesmo elemento de
   * getOrCreateBalanceTooltip_ usado pelo hover de ponto -- os dois nunca disputam o
   * mesmo elemento ao mesmo tempo, já que o rótulo fica por cima do canvas naquele
   * pedaço e captura o mouse antes dele chegar ao canvas).
   *
   * Reaproveita o MESMO elemento (por data-months) entre chamadas em vez de
   * destruir/recriar -- diferente de drawBalanceTrendPlanLabels_, que reconstrói do
   * zero a cada vez (lá tudo bem, nada fica "hover" nas caixas). Aqui, redesenhar do
   * zero a cada chamada (e afterDatasetsDraw roda de novo a QUALQUER redraw do
   * gráfico, inclusive por hover num PONTO em outro lugar da curva) destruía o <div>
   * que estava com o mouse em cima -- a troca de elemento sob um cursor parado não
   * gera mouseleave/mouseenter nenhum, então o tooltip ficava aberto pra sempre até
   * fechar o app inteiro (bug relatado). Reaproveitar o elemento existente elimina
   * essa troca de identidade: o hover continua sendo do MESMO <div> do começo ao fim.
   */
  function drawMesesGarantidosThresholds_(chart, opts) {
    var trend = opts.trend;
    var parent = chart.canvas.parentNode;
    var thresholds = mesesGarantidosThresholds_(trend);
    var visibleMonths = {};
    thresholds.forEach(function (t) { visibleMonths[t.months] = true; });
    parent.querySelectorAll('.balance-trend-threshold-label').forEach(function (el) {
      if (!visibleMonths[el.dataset.months]) el.remove();
    });
    if (!thresholds.length) return;

    var yScale = chart.scales.y;
    var area = chart.chartArea;
    var ctx = chart.ctx;

    thresholds.forEach(function (t) {
      var y = yScale.getPixelForValue(t.value);
      var label = parent.querySelector('.balance-trend-threshold-label[data-months="' + t.months + '"]');
      if (y < area.top - 0.5 || y > area.bottom + 0.5) { if (label) label.remove(); return; } // fora da faixa visível do eixo -- não desenha
      var color = t.level === 'danger' ? opts.expenseColor : opts.warningColor;

      ctx.save();
      ctx.setLineDash([5, 4]);
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(area.left, y);
      ctx.lineTo(area.right, y);
      ctx.stroke();
      ctx.restore();

      if (!label) {
        label = document.createElement('div');
        label.className = 'balance-trend-threshold-label';
        label.dataset.months = t.months;
        label.textContent = t.months + ' meses de gasto médio';
        parent.appendChild(label);
        label.addEventListener('mouseenter', function () {
          var tooltipEl = getOrCreateBalanceTooltip_(chart);
          tooltipEl.innerHTML = buildMesesGarantidosTooltipHtml_(trend.monthlyExpenseStats);
          tooltipEl.style.opacity = 1;
          var cardRect = parent.getBoundingClientRect();
          var labelRect = label.getBoundingClientRect();
          var tw = tooltipEl.offsetWidth, th = tooltipEl.offsetHeight;
          var desiredTop = labelRect.top - th - 8;
          if (desiredTop < 8) desiredTop = labelRect.bottom + 8;
          var clamped = clampToViewport_(labelRect.right - tw, desiredTop, tw, th);
          tooltipEl.style.left = (clamped.left - cardRect.left) + 'px';
          tooltipEl.style.top = (clamped.top - cardRect.top) + 'px';
        });
        label.addEventListener('mouseleave', function () {
          getOrCreateBalanceTooltip_(chart).style.opacity = 0;
        });
      }
      label.style.color = color;
      label.style.left = (chart.canvas.offsetLeft + area.right - label.offsetWidth) + 'px';
      label.style.top = (chart.canvas.offsetTop + y - label.offsetHeight - 4) + 'px';
    });
  }

  /**
   * A linha horizontal da meta de saldo (ver computeBalanceGoalStatus_) + rótulo na ponta
   * direita: sólida (as de "X meses de gasto médio" são pontilhadas, dá pra bater o olho e
   * distinguir), neutra (verde quando atingida). Chamada DEPOIS de
   * drawMesesGarantidosThresholds_ (mesmo beforeDatasetsDraw), porque o rótulo precisa
   * saber onde os rótulos dessas linhas ficaram pra não cair em cima de um deles -- se cair,
   * vai pra BAIXO da própria linha. O eixo Y já foi estendido pra sempre incluir a meta
   * (ver suggestedMin/suggestedMax em renderBalanceTrendChart_), então ela sempre cabe.
   * Mesmo padrão de elemento REAPROVEITADO entre chamadas de drawMesesGarantidosThresholds_
   * (hover num <div> destruído a cada redraw nunca gera mouseleave); por isso o conteúdo do
   * tooltip fica em label._goalCtx, sempre atualizado -- o handler é criado UMA vez só e não
   * pode congelar o valor do 1º desenho (o saldo muda com "Incluir investimentos").
   */
  function drawBalanceGoalLine_(chart, opts) {
    var trend = opts.trend;
    var parent = chart.canvas.parentNode;
    var label = parent.querySelector('.balance-trend-goal-label');
    if (!trend.goal) { if (label) label.remove(); return; }

    var area = chart.chartArea;
    var y = chart.scales.y.getPixelForValue(trend.goal);
    if (!isFinite(y)) { if (label) label.remove(); return; }
    var reached = trend.goalStatus === 'reached';
    var color = reached ? opts.incomeColor : opts.mutedColor;

    var ctx = chart.ctx;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(area.left, y);
    ctx.lineTo(area.right, y);
    ctx.stroke();
    ctx.restore();

    if (!label) {
      label = document.createElement('div');
      label.className = 'balance-trend-goal-label';
      parent.appendChild(label);
      label.addEventListener('mouseenter', function () {
        var info = label._goalCtx;
        var tooltipEl = getOrCreateBalanceTooltip_(info.chart);
        tooltipEl.innerHTML = info.html;
        tooltipEl.style.opacity = 1;
        var cardRect = parent.getBoundingClientRect();
        var labelRect = label.getBoundingClientRect();
        var tw = tooltipEl.offsetWidth, th = tooltipEl.offsetHeight;
        var desiredTop = labelRect.top - th - 8;
        if (desiredTop < 8) desiredTop = labelRect.bottom + 8;
        var clamped = clampToViewport_(labelRect.right - tw, desiredTop, tw, th);
        tooltipEl.style.left = (clamped.left - cardRect.left) + 'px';
        tooltipEl.style.top = (clamped.top - cardRect.top) + 'px';
      });
      label.addEventListener('mouseleave', function () {
        getOrCreateBalanceTooltip_(label._goalCtx.chart).style.opacity = 0;
      });
    }
    label._goalCtx = { chart: chart, html: buildBalanceGoalTooltipHtml_(trend.goal, trend.values[trend.splitIndex]) };
    label.style.color = color;
    label.innerHTML = balanceGoalLabelHtml_(trend.goalStatus);

    var left = chart.canvas.offsetLeft + area.right - label.offsetWidth;
    var aboveTop = chart.canvas.offsetTop + y - label.offsetHeight - 4;
    var belowTop = chart.canvas.offsetTop + y + 4;
    var thresholdLabels = Array.prototype.slice.call(parent.querySelectorAll('.balance-trend-threshold-label'));
    function overlapsThreshold_(top) {
      return thresholdLabels.some(function (el) {
        return left < el.offsetLeft + el.offsetWidth && left + label.offsetWidth > el.offsetLeft &&
          top < el.offsetTop + el.offsetHeight && top + label.offsetHeight > el.offsetTop;
      });
    }
    var top = (overlapsThreshold_(aboveTop) && !overlapsThreshold_(belowTop)) ? belowTop : aboveTop;
    label.style.left = left + 'px';
    label.style.top = top + 'px';
  }

  /**
   * Bonequinho minimalista andando no lugar, virado pra direita (o futuro), em cima do
   * ponto "Hoje" do gráfico de projeção -- pedido explícito do usuário: minúsculo,
   * monocromático, mesma cor do ponto. TODO traço/preenchimento é currentColor (a cor
   * real vai no <div> de fora, ver drawBalanceTrendWalker_), e o balanço de pernas/braços
   * é CSS puro (@keyframes balance-walker-swing/-bob, Stylesheet.html) -- nada de
   * requestAnimationFrame nem de redesenhar o gráfico por causa da animação. Silhueta
   * CHEIA (corpo/membros grossos, tipo pictograma de placa -- escolhida pelo usuário entre
   * 6 alternativas), levemente inclinada pra frente; quadril em (5.5,11.6) e ombro em
   * (6.4,7.2) são as origens de giro das pernas/braços (transform-origin no CSS, mesmas
   * coordenadas).
   */
  var BALANCE_WALKER_W_ = 12;
  var BALANCE_WALKER_H_ = 20;
  function buildBalanceWalkerHtml_() {
    return '<svg viewBox="0 0 12 20" width="12" height="20" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true">' +
      '<g class="balance-walker-body">' +
        '<circle cx="7" cy="3" r="2.6" fill="currentColor" stroke="none"/>' +
        '<line x1="5.6" y1="12" x2="6.5" y2="6.4" stroke-width="3.4"/>' +
        '<line class="balance-walker-arm balance-walker-arm-a" x1="6.4" y1="7.2" x2="6.4" y2="11.2" stroke-width="2.1"/>' +
        '<line class="balance-walker-arm balance-walker-arm-b" x1="6.4" y1="7.2" x2="6.4" y2="11.2" stroke-width="2.1"/>' +
        '<line class="balance-walker-leg balance-walker-leg-a" x1="5.5" y1="11.6" x2="5.5" y2="18.6" stroke-width="2.7"/>' +
        '<line class="balance-walker-leg balance-walker-leg-b" x1="5.5" y1="11.6" x2="5.5" y2="18.6" stroke-width="2.7"/>' +
      '</g></svg>';
  }
  /** Canto superior esquerdo (px, relativo ao .balance-trend-canvas-wrap) do bonequinho:
   *  centralizado no ponto, pés 1px acima da borda do círculo dele (pointRadius já é o
   *  raio de verdade -- 3px normal, 10px num mês com Plano, ver renderBalanceTrendChart_). */
  function balanceWalkerPlacement_(pointX, pointY, pointRadius, canvasOffsetLeft, canvasOffsetTop) {
    return {
      left: canvasOffsetLeft + pointX - BALANCE_WALKER_W_ / 2,
      top: canvasOffsetTop + pointY - pointRadius - 1 - BALANCE_WALKER_H_
    };
  }
  /** Posiciona (criando na 1ª vez) o bonequinho em cima do ponto "Hoje" (opts.trend.
   *  splitIndex) -- DOM à parte (não desenhado no canvas) só pra a animação ser CSS. O
   *  elemento é REAPROVEITADO entre redesenhos (hover, resize): só left/top/cor mudam,
   *  nunca o innerHTML, senão a animação reiniciaria a cada movimento do mouse. Lê x/y do
   *  próprio elemento do ponto (não do getPixelForValue) pra acompanhar a animação de
   *  entrada do gráfico e o aumento do ponto no hover, em vez de aparecer já no destino. */
  function drawBalanceTrendWalker_(chart, opts) {
    var parent = chart.canvas.parentNode;
    var walker = parent.querySelector('.balance-trend-walker');
    var point = chart.getDatasetMeta(0).data[opts.trend.splitIndex];
    if (!point || !isFinite(point.x) || !isFinite(point.y)) { if (walker) walker.style.visibility = 'hidden'; return; }
    if (!walker) {
      walker = document.createElement('div');
      walker.className = 'balance-trend-walker';
      walker.innerHTML = buildBalanceWalkerHtml_();
      parent.appendChild(walker);
    }
    var radius = (point.options && point.options.radius) || 3;
    var pos = balanceWalkerPlacement_(point.x, point.y, radius, chart.canvas.offsetLeft, chart.canvas.offsetTop);
    walker.style.visibility = 'visible';
    walker.style.color = opts.walkerColor;
    walker.style.left = pos.left + 'px';
    walker.style.top = pos.top + 'px';
  }

  var BALANCE_TREND_ANNOTATIONS_PLUGIN_ = {
    id: 'balanceTrendAnnotations',
    beforeDatasetsDraw: function (chart) {
      var opts = chart.options.plugins && chart.options.plugins.balanceTrendAnnotations;
      if (!opts) return;
      drawMesesGarantidosThresholds_(chart, opts);
      drawBalanceGoalLine_(chart, opts);
    },
    afterDatasetsDraw: function (chart) {
      var opts = chart.options.plugins && chart.options.plugins.balanceTrendAnnotations;
      if (!opts) return;
      drawBalanceTrendWalker_(chart, opts);
      drawBalanceTrendRateLabel_(chart, opts);
      drawBalanceTrendPlanCountLabels_(chart, opts);
      // drawBalanceTrendPlanLabels_(chart, opts); -- caixa fixa de Plano desligada por
      // pedido do usuário (poluía o gráfico); código mantido de propósito (ver a função
      // logo acima) caso ele volte atrás no futuro -- só reativar esta linha.
    }
  };

  var balanceTrendAnimated_ = false;
  /** Chamar depois do innerHTML que inclui buildBalanceTrendHtml_ já estar no DOM (Início e Planejamento). */
  function renderBalanceTrendChart_() {
    // Toggle fica aqui (e não em quem monta o innerHTML) porque as DUAS telas que mostram
    // o gráfico — Início e Planejamento — chamam esta função logo depois de inserir o HTML.
    var includeBtn = document.getElementById('trend-include-investments');
    if (includeBtn) {
      includeBtn.onclick = function () {
        STATE.trendIncludeInvestments = !STATE.trendIncludeInvestments;
        render();
      };
    }
    var goalBtn = document.getElementById('trend-goal-btn');
    if (goalBtn) goalBtn.onclick = function () { openBalanceGoalPopover_(goalBtn); };

    var canvas = document.getElementById('chart-balance-trend');
    if (!canvas || !window.Chart) return;
    // O gráfico inteiro é destruído e recriado a cada render (ver existingChart.destroy()
    // abaixo) -- zera aqui pra não herdar um hover de uma instância anterior (ex: o
    // usuário estava hover num mês com Plano, trocou de aba e voltou; sem isso a caixa
    // daquele mês nasceria escondida à toa, já que o mouse não está mais lá de verdade).
    balanceTrendTooltipHoveredYm_ = null;
    var trend = computeBalanceTrend_();

    var warningEl = document.getElementById('balance-trend-warning');
    if (warningEl) {
      warningEl.innerHTML = trend.isDeclining
        ? '<div class="warning-banner"><strong>Tendência de queda.</strong> No ritmo atual de Orçamentos e Lançamentos recorrentes, seu saldo tende a diminuir nos próximos meses. Considere revisar esses valores em Planejamento pra manter o saldo estável.</div>'
        : '';
    }

    var fontFamily = getComputedStyle(document.body).fontFamily;
    var textColor = getComputedStyle(document.body).color;
    var gridColor = getComputedStyle(document.documentElement).getPropertyValue('--border').trim();
    var lineColor = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim();
    var incomeColor = getComputedStyle(document.documentElement).getPropertyValue('--income').trim();
    var expenseColor = getComputedStyle(document.documentElement).getPropertyValue('--expense').trim();
    var warningColor = getComputedStyle(document.documentElement).getPropertyValue('--warning').trim();
    var mutedColor = getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim();
    // Meta sempre visível (pedido explícito do usuário): suggestedMin/suggestedMax só
    // ESTENDEM o eixo além dos dados, nunca o encolhem -- a meta pode estar bem acima OU
    // bem abaixo da curva, e nos dois casos a linha precisa caber.
    var goalAxisBounds = trend.goal ? { suggestedMin: trend.goal, suggestedMax: trend.goal } : {};
    var historicalData = trend.values.map(function (v, idx) { return idx <= trend.splitIndex ? v : null; });
    var projectedData = trend.values.map(function (v, idx) { return idx >= trend.splitIndex ? v : null; });
    // Maior o bastante pra caber o número de Planos desenhado dentro (ver
    // drawBalanceTrendPlanCountLabels_) agora que a caixa fixa foi desligada -- era 5
    // antes (só um pouco maior que o ponto normal, sem número dentro).
    var pointRadius = trend.months.map(function (ym) { return trend.planImpactByMonth[ym] ? 10 : 3; });
    // 19 meses não cabem legíveis todos de uma vez — mostra "Hoje" + a cada LABEL_STEP
    // meses pra cada lado, sempre ancorado no mês atual (nunca pode pular o "Hoje").
    var LABEL_STEP = 3;

    // Recolore curva/pontos conforme "meses garantidos" (ver mesesGarantidosLevelForValue_)
    // -- caem pra lineColor (cor neutra, feature inativa) quando trend.monthlyExpenseStats
    // é null (histórico insuficiente, ver computeMonthlyExpenseStats_); 6+ meses (normal)
    // usa incomeColor (verde), não a cor neutra -- é uma leitura de saúde financeira
    // confirmada. Mesma função nos dois datasets (Histórico/Projeção) e nos dois campos
    // de ponto (background/border): "toda curva e pontos do gráfico" não distingue as
    // duas fases nem preenchimento/borda.
    var mesesGarantidosPointColor_ = function (ctx) {
      var v = ctx.parsed ? ctx.parsed.y : null;
      if (v === null || v === undefined) return lineColor;
      return mesesGarantidosColor_(mesesGarantidosLevelForValue_(v, trend.monthlyExpenseStats), expenseColor, warningColor, incomeColor, lineColor);
    };
    /**
     * Cor (ou gradiente) de um SEGMENTO (a curva entre 2 pontos adjacentes). Quando as
     * duas pontas estão no MESMO nível, cor sólida. Quando cruzam 1 ou 2 fronteiras
     * (2 e/ou 6 meses de gasto médio) NO MEIO do segmento, monta um CanvasGradient com
     * um "degrau" (2 stops na mesma posição, cores diferentes) bem na fração exata onde
     * o VALOR cruza cada fronteira -- pedido explícito do usuário: antes o segmento
     * inteiro herdava a cor do lado pior, mesmo a parte que já estava numa faixa melhor.
     * A fração usa interpolação linear em cima do VALOR (não da posição ao longo da
     * curva com tension, que é uma Bézier) -- aproximação pequena o bastante pra não
     * incomodar visualmente, e a mesma técnica que exemplos oficiais do Chart.js usam
     * pra colorir por faixa de valor.
     */
    var mesesGarantidosSegmentColor_ = function (ctx) {
      var v0 = ctx.p0.parsed.y, v1 = ctx.p1.parsed.y;
      var stats = trend.monthlyExpenseStats;
      var level0 = mesesGarantidosLevelForValue_(v0, stats);
      var level1 = mesesGarantidosLevelForValue_(v1, stats);
      if (level0 === level1) return mesesGarantidosColor_(level0, expenseColor, warningColor, incomeColor, lineColor);
      var boundaries = [stats.average * 2, stats.average * 6]
        .map(function (b) { return (b - v0) / (v1 - v0); })
        .filter(function (t) { return t > 0 && t < 1; })
        .sort(function (a, b) { return a - b; });
      var stops = [0].concat(boundaries).concat([1]);
      var gradient = ctx.chart.ctx.createLinearGradient(ctx.p0.x, ctx.p0.y, ctx.p1.x, ctx.p1.y);
      for (var i = 0; i < stops.length - 1; i++) {
        var midValue = v0 + ((stops[i] + stops[i + 1]) / 2) * (v1 - v0);
        var color = mesesGarantidosColor_(mesesGarantidosLevelForValue_(midValue, stats), expenseColor, warningColor, incomeColor, lineColor);
        gradient.addColorStop(stops[i], color);
        gradient.addColorStop(stops[i + 1], color);
      }
      return gradient;
    };

    var existingChart = Chart.getChart(canvas);
    if (existingChart) existingChart.destroy();
    // O gráfico é recriado a cada render() (qualquer botão da tela), e a animação de
    // entrada (linha e bonequinho subindo de baixo) repetia toda vez (bug relatado). Só a
    // PRIMEIRA vez da sessão anima; depois já nasce no lugar.
    var animateEntry = !balanceTrendAnimated_;
    balanceTrendAnimated_ = true;
    new Chart(canvas.getContext('2d'), {
      type: 'line',
      data: {
        labels: trend.months,
        datasets: [
          { label: 'Histórico', data: historicalData, borderColor: lineColor, backgroundColor: 'transparent', tension: 0.2, pointRadius: pointRadius, hitRadius: 10, segment: { borderColor: mesesGarantidosSegmentColor_ }, pointBackgroundColor: mesesGarantidosPointColor_, pointBorderColor: mesesGarantidosPointColor_ },
          { label: 'Projeção', data: projectedData, borderColor: lineColor, borderDash: [6, 4], backgroundColor: 'transparent', tension: 0.2, pointRadius: pointRadius, hitRadius: 10, segment: { borderColor: mesesGarantidosSegmentColor_ }, pointBackgroundColor: mesesGarantidosPointColor_, pointBorderColor: mesesGarantidosPointColor_ }
        ]
      },
      plugins: [BALANCE_TREND_ANNOTATIONS_PLUGIN_],
      options: {
        // maintainAspectRatio (o padrão do Chart.js) exige que o CONTAINER do canvas já
        // tenha uma altura que não dependa do próprio canvas -- o .card é height:auto
        // (soma dos filhos, incluindo o próprio canvas), então canvas->resize mudava a
        // altura do .card, que disparava outro resize, numa realimentação que nunca
        // convergia (bug relatado: "o gráfico fica encolhendo até zerar, reseta, repete
        // em loop infinito"). .balance-trend-canvas-wrap (Stylesheet.html) quebra esse
        // ciclo dando ao canvas um container com aspect-ratio em CSS (altura vem só da
        // LARGURA, nunca do próprio conteúdo) -- maintainAspectRatio:false deixa o canvas
        // preencher 100% desse container em vez de calcular a própria altura de novo.
        maintainAspectRatio: false,
        animation: animateEntry ? {} : false,
        // Espaço extra em cima: sem isso, o texto "+R$X/mês" e os chips de Plano perto
        // do topo do gráfico (ver drawBalanceTrendRateLabel_/drawBalanceTrendPlanLabels_)
        // ficavam espremidos contra a borda do card ou cortados.
        layout: { padding: { top: 36 } },
        // Rege o onClick abaixo (e o hover VISUAL do próprio Chart.js) — continua
        // "index"/intersect:false de propósito, pra clicar em QUALQUER lugar da coluna
        // de um mês (não só bem em cima do pontinho) abrir "Novo plano" nele. O tooltip
        // abaixo tem a SUA PRÓPRIA config (mode/intersect), independente desta — só ele
        // fica mais estrito.
        interaction: { mode: 'index', intersect: false },
        // Clicar num mês atual/futuro abre "Novo plano" já fixado nele (ver "Clique para
        // adicionar um plano" no tooltip); meses passados já têm saldo real, não faz
        // sentido criar um Plano neles (o próprio servidor rejeitaria).
        onClick: function (evt, elements) {
          if (!elements.length) return;
          var idx = elements[0].index;
          if (idx < trend.splitIndex) return;
          openPlanModal(null, { fixedMonth: trend.months[idx] });
        },
        plugins: {
          balanceTrendAnnotations: {
            trend: trend, fontFamily: fontFamily, incomeColor: incomeColor, expenseColor: expenseColor, warningColor: warningColor, mutedColor: mutedColor,
            // Mesma cor do ponto "Hoje" (mesma função de mesesGarantidosPointColor_, só que
            // fixa no valor de hoje) -- ver drawBalanceTrendWalker_.
            walkerColor: mesesGarantidosColor_(mesesGarantidosLevelForValue_(trend.values[trend.splitIndex], trend.monthlyExpenseStats), expenseColor, warningColor, incomeColor, lineColor)
          },
          legend: { display: false },
          tooltip: {
            enabled: false,
            // mode/intersect PRÓPRIOS do tooltip (sobrepõem o "interaction" geral acima,
            // só pra ele): só aparece perto de um PONTO de verdade (hitRadius:10 nos
            // datasets acima), não em qualquer lugar da coluna do mês — pedido explícito,
            // pra não abrir sozinho enquanto o mouse só passa por cima do gráfico.
            mode: 'nearest',
            intersect: true,
            external: function (context) {
              var tooltipEl = getOrCreateBalanceTooltip_(context.chart);
              var parent = context.chart.canvas.parentNode;
              // Hover num mês que TAMBÉM tem uma caixa de Plano fixa: esconde ela com
              // fade out (em vez de sobrepor com o tooltip normal, que mostra a mesma
              // informação e mais) e mostra o tooltip normal no lugar -- pedido
              // explícito do usuário. requestAnimationFrame garante que o navegador
              // pinte a opacidade ANTERIOR pelo menos uma vez antes de mudar (sem isso,
              // criar a caixa e já a esconder no mesmo tick faz a transição não animar,
              // já que drawBalanceTrendPlanLabels_ redesenha as caixas do zero a cada
              // hover -- ver comentário lá).
              var newHoveredYm = context.tooltip.opacity === 0 ? null
                : trend.months[context.tooltip.dataPoints[0].dataIndex];
              if (newHoveredYm !== balanceTrendTooltipHoveredYm_) {
                balanceTrendTooltipHoveredYm_ = newHoveredYm;
                requestAnimationFrame(function () {
                  parent.querySelectorAll('.balance-trend-plan-box').forEach(function (box) {
                    box.style.opacity = box.dataset.ym === balanceTrendTooltipHoveredYm_ ? '0' : '1';
                  });
                });
              }
              if (context.tooltip.opacity === 0) {
                tooltipEl.style.opacity = 0;
                return;
              }
              var idx = context.tooltip.dataPoints[0].dataIndex;
              tooltipEl.innerHTML = buildBalanceTooltipHtml_(trend, idx);
              tooltipEl.style.opacity = 1;

              // clampToViewport_ trabalha em coordenadas de VIEWPORT; esse tooltip é
              // position:absolute relativo ao .card (não a document.body, ver
              // getOrCreateBalanceTooltip_), então precisa converter pra lá e de volta.
              var cardRect = context.chart.canvas.parentNode.getBoundingClientRect();
              var canvasBox = context.chart.canvas;
              var tw = tooltipEl.offsetWidth, th = tooltipEl.offsetHeight;
              var pointX = cardRect.left + canvasBox.offsetLeft + context.tooltip.caretX;
              var pointY = cardRect.top + canvasBox.offsetTop + context.tooltip.caretY;
              var desiredTop = pointY - th - 10;
              if (desiredTop < 8) desiredTop = pointY + 10; // não cabe em cima -> abre embaixo do ponto
              var clamped = clampToViewport_(pointX - tw / 2, desiredTop, tw, th);

              tooltipEl.style.left = (clamped.left - cardRect.left) + 'px';
              tooltipEl.style.top = (clamped.top - cardRect.top) + 'px';
            }
          }
        },
        scales: {
          x: {
            ticks: {
              color: textColor,
              maxRotation: 0,
              autoSkip: false,
              font: function (ctx) { return { family: fontFamily, weight: ctx.index === trend.splitIndex ? 'bold' : 'normal' }; },
              callback: function (value, index) {
                if ((index - trend.splitIndex) % LABEL_STEP !== 0) return '';
                return index === trend.splitIndex ? 'Hoje' : fmtMonthFullNoYear_(trend.months[index]);
              }
            },
            grid: { color: gridColor }
          },
          y: Object.assign({
            ticks: { color: textColor, font: { family: fontFamily }, callback: function (v) { return fmtMoneyNoCents_(v); } },
            grid: { color: gridColor }
          }, goalAxisBounds)
        }
      }
    });
  }

  /** Todas as previsões (não arquivadas) cadastradas numa categoria específica. */
  function forecastsForCategory(categoryId) {
    return STATE.forecasts.filter(function (f) { return !f.archived && f.categoryId === categoryId; });
  }
  /**
   * O lançamento real (se algum) já vinculado a essa previsão dentro do período rolante
   * terminando hoje: intervalDays dias (mesma lógica de "Últimos dias" que Orçamentos já
   * usa, ver computeBudgetRollingProgress_) ou intervalDays MESES de calendário de
   * verdade (não intervalDays×30 dias) quando intervalUnit==='months' — um Lançamento
   * recorrente Mensal volta a ficar pendente se não tiver nenhum vínculo desde o mesmo dia
   * do mês passado, não importa quantos dias tem o mês atual. Ignora STATE.deletingIds
   * (removido pelo usuário, mas o servidor ainda não confirmou) -- mesma convenção de
   * renderDashboard/loadTxList: sem isso, remover o lançamento vinculado deixava o
   * recorrente marcado como cumprido por alguns segundos a mais, até o refresh de
   * verdade tirar a linha de STATE.allTransactions (bug relatado).
   */
  function forecastLinkedTransactionInPeriod_(forecast) {
    var today = new Date();
    var fromDate = forecast.intervalUnit === 'months'
      ? subtractMonths_(today, forecast.intervalDays)
      : (function () { var d = new Date(today); d.setDate(d.getDate() - (forecast.intervalDays - 1)); return d; })();
    var fromYmd = ymdFromDate_(fromDate);
    var todayYmd = ymdFromDate_(today);
    return STATE.allTransactions.find(function (t) {
      return t.forecastId === forecast.id && t.date && t.date >= fromYmd && t.date <= todayYmd &&
        STATE.deletingIds.indexOf(t.id) === -1;
    }) || null;
  }
  function isForecastFulfilledInPeriod_(forecast) {
    return !!forecastLinkedTransactionInPeriod_(forecast);
  }
  /** Média dos até 6 lançamentos reais mais recentes vinculados a essa previsão, ou null se nenhum ainda. */
  function forecastSuggestedAmount(forecast) {
    var linked = STATE.allTransactions
      .filter(function (t) { return t.forecastId === forecast.id && !t.excludeFromAnalysis && STATE.deletingIds.indexOf(t.id) === -1; })
      .sort(function (a, b) { return a.date < b.date ? 1 : -1; })
      .slice(0, 6);
    if (!linked.length) return null;
    var avg = linked.reduce(function (sum, t) { return sum + t.amount; }, 0) / linked.length;
    return Math.round(avg * 100) / 100;
  }

  // ---------- sugestão de vincular lançamento a recorrente por valor+nome (ver grilling) ----------
  /** Nomes de "Pago a"/"Recebido de" conhecidos desse recorrente -- dos até 6
   *  lançamentos vinculados mais recentes (mesma janela de forecastSuggestedAmount,
   *  mesmos filtros: sem fora-da-curva, sem os que estão sendo excluídos agora), tanto o
   *  texto CRU quanto, se ele tiver um nome lembrado (ver "Lembrar nome?"/
   *  CounterpartyAliases), o nome lembrado também -- pra reconhecer tanto quem digita o
   *  nome já corrigido quanto quem ainda recebe a notificação crua. Devolve em minúsculo
   *  (comparação sempre exata, trim+case-insensitive, mesmo padrão de
   *  findCategoryIdForCounterpartyClient_ -- nunca por palavra-chave/substring).
   */
  function forecastCounterpartyNames_(forecast) {
    var linked = STATE.allTransactions
      .filter(function (t) { return t.forecastId === forecast.id && !t.excludeFromAnalysis && STATE.deletingIds.indexOf(t.id) === -1; })
      .sort(function (a, b) { return a.date < b.date ? 1 : -1; })
      .slice(0, 6);
    var names = {};
    linked.forEach(function (t) {
      var raw = (t.counterparty || '').trim().toLowerCase();
      if (!raw) return;
      names[raw] = true;
      var alias = STATE.counterpartyAliases.find(function (a) { return (a.rawText || '').trim().toLowerCase() === raw; });
      if (alias && alias.establishmentName) names[alias.establishmentName.trim().toLowerCase()] = true;
    });
    return Object.keys(names);
  }
  /** ±R$1 do valor esperado do recorrente (grillado com o usuário: sempre disponível,
   *  mesmo antes do 1º vínculo -- diferente do valor do último lançamento vinculado,
   *  que exigiria histórico). */
  function isForecastAmountMatch_(forecast, amount) {
    return amount !== null && amount !== undefined && Math.abs(amount - forecast.expectedAmount) <= 1;
  }
  function isForecastCounterpartyMatch_(forecast, counterpartyText) {
    var key = (counterpartyText || '').trim().toLowerCase();
    if (!key) return false;
    return forecastCounterpartyNames_(forecast).indexOf(key) !== -1;
  }
  /** Primeiro candidato (já filtrado por kind/categoria/não-cumprido, ver
   *  forecastLinkCandidates_) cujo valor esperado E nome de "Pago a"/"Recebido de"
   *  batem com o que o usuário está digitando -- as 2 condições precisam bater juntas
   *  (grillado com o usuário), nunca só uma. null sem nenhum candidato que bata com as 2. */
  function findForecastLinkSuggestion_(candidates, amount, counterpartyText) {
    var match = candidates.find(function (f) {
      return isForecastAmountMatch_(f, amount) && isForecastCounterpartyMatch_(f, counterpartyText);
    });
    return match ? match.id : null;
  }

  /**
   * Botão "Despesa/Receita recorrente?" (mesmo visual/padrão de "Reembolso?", ver
   * renderRefundButton_) -- usado pelos 3 menus de lançamento (novo/editar/revisar
   * pendência, ver chamadas). Só aparece quando a categoria escolhida já tem algum
   * lançamento recorrente candidato (candidates); criar um lançamento recorrente novo
   * agora só é feito pela aba Planejamento, não mais por aqui (por isso não tem mais
   * opção de "criar novo" no dropdown). candidates normalmente só lista os ainda não
   * cumpridos no período -- MAS mantém o que já estiver selecionado mesmo se ele acabou
   * de virar "cumprido" (o próprio lançamento sendo editado é o que cumpriu, ver
   * openTransactionDetailModal): sem essa exceção, editar um lançamento já vinculado
   * faria o próprio vínculo dele sumir da lista. opts = { fieldId, hiddenInputId,
   * getKind, getCategoryId, getSelected, setSelected } -- cada modal guarda o
   * "selecionado" (id do lançamento recorrente, ou "") do seu próprio jeito (variável
   * de closure), já que os 3 têm ciclos de vida diferentes (novo reseta ao trocar
   * Despesa/Receita, editar já nasce com t.forecastId, revisar pendência reseta ao
   * trocar de tipo). hiddenInputId vira um <input type=hidden> só pra
   * resolveForecastSelection_ (compartilhada com os 3) continuar lendo do DOM do jeito
   * que já lê (select ou hidden input, tanto faz — só o .value importa).
   */
  /** Recorrentes elegíveis pra vincular (mesmo kind, categoria se já escolhida, ainda
   *  não cumpridos no período -- ou já o selecionado, que continua na lista mesmo
   *  cumprido). Extraída de renderForecastToggleButton_ pra também alimentar a sugestão
   *  reativa por valor/nome (ver maybeSuggestForecastLinkT_/P_) -- a sugestão nunca
   *  propõe algo que nem apareceria no dropdown manual. */
  function forecastLinkCandidates_(kind, categoryId, selectedForecast) {
    // selectedForecast: a seleção do modal, PURA ("f1") ou COMPOSTA ("f1|2026-08", ver
    // parseForecastSelection_) -- só o id do recorrente importa aqui.
    var selectedForecastId = parseForecastSelection_(selectedForecast).forecastId;
    // Sem categoria selecionada ainda, lista todos os recorrentes do mesmo tipo (despesa/
    // receita) em vez de nenhum -- assim que uma categoria for escolhida, volta a
    // estreitar só pros recorrentes dela (pedido explícito do usuário, grillado: a lista
    // ampla é só um estado transitório de "ainda não decidi a categoria", não substitui o
    // filtro por categoria depois que ela existir).
    var candidateSource = categoryId ? forecastsForCategory(categoryId) :
      STATE.forecasts.filter(function (f) { return !f.archived && f.kind === kind; });
    return candidateSource.filter(function (f) {
      if (f.id === selectedForecastId) return true;
      // Mensal: candidato enquanto tiver QUALQUER mês em aberto (não só o atual, ver
      // forecastOpenCycleMonths_); os demais seguem a regra de sempre (período atual).
      if (isStrictMonthlyForecast_(f)) return forecastOpenCycleMonths_(f).length > 0;
      return !isForecastFulfilledInPeriod_(f);
    });
  }

  // ---------- vínculo a um MÊS específico de um recorrente mensal (ver grilling) ----------
  /** Recorrente mensal de calendário (intervalUnit 'months' + intervalDays 1) -- o único
   *  tipo em que cada ciclo é um mês de calendário FIXO (ver forecastCycleWindows_/
   *  isStrictMonthly), então dá pra vincular um lançamento a um mês PASSADO ainda não pago
   *  (o pagamento atrasado). Nos demais as janelas são móveis (mudam a cada dia): não
   *  existe "o ciclo de agosto" pra ancorar. */
  function isStrictMonthlyForecast_(f) {
    return f.intervalUnit === 'months' && f.intervalDays === 1;
  }
  /** Seleção de vínculo de um modal: só o id do recorrente ("f1", ciclo inferido pela data
   *  -- não-mensal ou sem mês escolhido) ou id + mês do ciclo ("f1|2026-08"). Uma string só
   *  pra os 3 modais (novo/editar/revisar pendência) e o <input hidden> que
   *  resolveForecastSelection_ lê continuarem guardando UM valor, como sempre. */
  function parseForecastSelection_(selection) {
    if (!selection) return { forecastId: '', cycleMonth: null };
    var parts = String(selection).split('|');
    return { forecastId: parts[0], cycleMonth: parts[1] || null };
  }
  function forecastSelectionValue_(forecastId, cycleMonth) {
    return cycleMonth ? forecastId + '|' + cycleMonth : forecastId;
  }
  /** Seleção EXPLÍCITA pra um recorrente + data: mensal -> "f1|YYYY-MM" do mês da data; os
   *  demais -> id puro. É o formato que o dropdown compara (uma opção por mês). */
  function forecastSelectionForDate_(forecastId, dateYmd) {
    var f = STATE.forecasts.find(function (x) { return x.id === forecastId; });
    if (!f || !isStrictMonthlyForecast_(f) || !dateYmd) return forecastId;
    return forecastSelectionValue_(forecastId, String(dateYmd).slice(0, 7));
  }
  /** Seleção EXPLÍCITA do vínculo que um lançamento já existente tem (ao abrir Editar): o
   *  mês do ciclo guardado nele, ou -- sem ele -- o mês da própria data. '' sem vínculo. */
  function forecastSelectionForTx_(t) {
    if (!t.forecastId) return '';
    return forecastSelectionForDate_(t.forecastId, t.forecastCycleMonth ? t.forecastCycleMonth + '-01' : t.date);
  }
  /** Meses (YYYY-MM) SEM pagamento de um recorrente mensal, do mais antigo pro mais novo,
   *  dentro das mesmas janelas das bolinhas (até FORECAST_CYCLE_MAX_DOTS_, limitadas pelo
   *  início do engajamento/criação do recorrente -- nunca um mês de antes dele existir).
   *  Mês IGNORADO ("Ignorar mês") também conta como em aberto: continua sem pagamento, e
   *  vincular um lançamento a ele é justamente a forma de "designorar" pagando. [] pros
   *  não-mensais. */
  function forecastOpenCycleMonths_(f) {
    if (!isStrictMonthlyForecast_(f)) return [];
    return forecastCycleWindows_(f, FORECAST_CYCLE_MAX_DOTS_)
      .filter(function (w) { return !forecastCycleLinkedTransaction_(f, w); })
      .map(function (w) { return { ym: w.fromYmd.slice(0, 7), isCurrent: w.isCurrent }; });
  }
  /**
   * Opções do dropdown de vínculo pra UM recorrente: mensal -> uma por mês em aberto (o
   * ATUAL primeiro, sem sufixo; depois os passados, do mais recente pro mais antigo, com
   * "(Agosto)" no fim -- pedido explícito do usuário) + o mês já selecionado, mesmo se
   * fechado (o próprio lançamento em edição é quem o cumpriu, ver forecastLinkCandidates_);
   * demais -> uma só, o id puro. { value, label, cycleMonth, forecast }.
   */
  function forecastLinkOptionsFor_(f, selection) {
    var base = f.label + ' (' + fmtMoney(f.expectedAmount) + ')';
    if (!isStrictMonthlyForecast_(f)) return [{ value: f.id, label: base, cycleMonth: null, forecast: f }];
    var currentYm = todayYmd().slice(0, 7);
    var months = forecastOpenCycleMonths_(f).map(function (c) { return c.ym; });
    var chosen = parseForecastSelection_(selection);
    if (chosen.forecastId === f.id && chosen.cycleMonth && months.indexOf(chosen.cycleMonth) === -1) months.push(chosen.cycleMonth);
    months.sort();
    var ordered = months.filter(function (ym) { return ym === currentYm; })
      .concat(months.filter(function (ym) { return ym !== currentYm; }).reverse());
    return ordered.map(function (ym) {
      return {
        value: forecastSelectionValue_(f.id, ym),
        label: base + (ym === currentYm ? '' : ' (' + fmtMonthFullNoYear_(ym) + ')'),
        cycleMonth: ym, forecast: f
      };
    });
  }
  /** Seleção padrão quando o app SUGERE o vínculo (valor+nome batem, ver
   *  findForecastLinkSuggestion_): mensal -> o mês ATUAL se estiver em aberto, senão o mais
   *  recente em aberto; demais -> id puro. */
  function defaultForecastSelection_(forecastId) {
    var f = STATE.forecasts.find(function (x) { return x.id === forecastId; });
    if (!f || !isStrictMonthlyForecast_(f)) return forecastId;
    var open = forecastOpenCycleMonths_(f);
    if (!open.length) return forecastId;
    var current = open.find(function (c) { return c.isCurrent; });
    return forecastSelectionValue_(f.id, (current || open[open.length - 1]).ym);
  }
  /** { forecastId, forecastCycleMonth } pro payload de criar/editar um lançamento a partir
   *  da seleção do modal + a data escolhida. O mês do ciclo só é GUARDADO quando difere do
   *  mês da própria data (senão a data já diz qual é o ciclo -- vazio, como sempre foi,
   *  robusto a editar a data depois). forecastId nulo/'' = desvinculado. */
  function forecastFieldsFromSelection_(selection, dateYmd) {
    var s = parseForecastSelection_(selection);
    var differs = !!(s.forecastId && s.cycleMonth && String(dateYmd || '').slice(0, 7) !== s.cycleMonth);
    return { forecastId: s.forecastId || null, forecastCycleMonth: differs ? s.cycleMonth : '' };
  }
  function renderForecastToggleButton_(opts) {
    var field = document.getElementById(opts.fieldId);
    if (!field) return;
