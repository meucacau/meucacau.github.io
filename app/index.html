    e.preventDefault(); // suprime o scroll vertical da página enquanto o gesto é reconhecidamente horizontal
    swipe_.dx = clampSwipeDx_(rawDx, swipe_.direction, swipe_.paneWidth);
    updateSwipeTransform_(swipe_);
  }

  /** Clampa a MAGNITUDE do arrasto em paneWidth, e nunca deixa cruzar de volta pro
   *  sinal oposto de "direction" — puxar além do ponto de partida só "some" o efeito
   *  (aba atual volta a ficar 100% no lugar), não passa a revelar o vizinho do OUTRO
   *  lado no meio do mesmo gesto. Função pura (só números), extraída pra dar pra testar
   *  isolada do touch de verdade. */
  function clampSwipeDx_(rawDx, direction, paneWidth) {
    var bounded = direction < 0 ? Math.max(rawDx, -paneWidth) : Math.min(rawDx, paneWidth);
    return direction < 0 ? Math.min(bounded, 0) : Math.max(bounded, 0);
  }

  function onSwipeTouchEnd_() {
    if (!swipe_ || swipe_.source !== 'touch') return;
    if (swipe_.phase === 'horizontal') {
      var committed = Math.abs(swipe_.dx) >= swipe_.paneWidth * SWIPE_COMMIT_FRACTION_;
      finishSwipeTransition_(swipe_, committed);
    }
    swipe_ = null;
  }

  /**
   * Scroll horizontal (trackpad/mouse com roda lateral) troca de aba do MESMO jeito que
   * o swipe no celular — mesmo empacotamento visual (beginSwipeTransition_/
   * updateSwipeTransform_/finishSwipeTransition_), só a "captura do gesto" é diferente:
   * wheel não tem um evento de início/fim próprio (ao contrário de touchstart/touchend),
   * então cada evento só entrega um INCREMENTO (deltaX/deltaY), acumulado aqui em
   * swipe_.dx, e o "soltar o dedo" é simulado por um temporizador de ociosidade — sem
   * NENHUM wheel novo por SWIPE_WHEEL_IDLE_MS_, considera o gesto encerrado (mesmo
   * princípio de "sem inércia detectável, acabou").
   *
   * deltaX do wheel é POSITIVO quando o trackpad rola o conteúdo pra ESQUERDA (revela o
   * que tem à DIREITA) — mesmo sentido de dx NEGATIVO no touch (dedo arrastando pra
   * esquerda) — por isso o sinal é invertido logo abaixo, pra reaproveitar
   * swipeTargetView_/clampSwipeDx_ sem duplicar a lógica de direção.
   *
   * wheelVerticalLock_: mesma ideia do phase='vertical' travado do touch (ver
   * onSwipeTouchMove_) — só que wheel não tem um touchstart pra decidir uma vez só por
   * gesto físico; sem esse travamento, a decisão "isso parece rolagem vertical" se
   * refazia a CADA evento, e um único evento ambíguo no MEIO de uma rolagem vertical
   * longa (ruído comum de trackpad, ex: o dedo escorrega um pouco) reabria a decisão e
   * podia sequestrar o resto da rolagem pro swipe horizontal -- a página parava de
   * rolar do nada (bug relatado). Agora, assim que UM evento do gesto atual sai como
   * ambíguo/vertical, o gesto INTEIRO (até o próximo silêncio de SWIPE_WHEEL_IDLE_MS_)
   * fica travado como vertical e é ignorado por completo, mesmo que um evento no meio
   * dele pareça horizontal.
   *
   * wheelPendingDx_/Dy_: a decisão em si (vertical vs horizontal) só acontece depois de
   * ACUMULAR pelo menos WHEEL_DECIDE_THRESHOLD_ num sentido -- mesmo princípio do
   * "undecided" com SWIPE_DECIDE_THRESHOLD_PX_ do touch, só que aqui soma vários eventos
   * pequenos em vez de comparar contra um ponto de início (wheel não tem posição
   * absoluta, só incrementos). Sem isso, o PRIMEIRO evento de um gesto novo (tipicamente
   * fraco/ambíguo, antes do trackpad "pegar tração") já travava tudo como vertical
   * sozinho (ver wheelVerticalLock_ acima).
   *
   * wheelLockOverrideDx_/Dy_/WHEEL_LOCK_OVERRIDE_THRESHOLD_ (ver declaração das
   * variáveis): destrava wheelVerticalLock_ se a evidência RECENTE virar clara e
   * SUSTENTADAMENTE horizontal, sem precisar de silêncio total antes -- ver o próprio
   * bloco `if (wheelVerticalLock_)` abaixo.
   */
  /** Tenta iniciar um gesto horizontal de verdade a partir de um dx já DECIDIDO (seja
   *  da decisão "do zero" ou de destravar wheelVerticalLock_ por evidência sustentada) --
   *  devolve false sem mexer em nada se estiver bloqueado ou não tiver vizinho pra esse
   *  lado (extraído pra não duplicar essa lógica nos dois lugares que precisam dela). */
  function startHorizontalWheelGesture_(e, decidedDx) {
    if (isSwipeBlocked_()) return false;
    var targetView = swipeTargetView_(STATE.currentView, decidedDx);
    if (!targetView) return false; // já na ponta, sem vizinho pra esse lado
    e.preventDefault();
    swipe_ = { source: 'wheel', phase: 'horizontal', direction: decidedDx < 0 ? -1 : 1, targetView: targetView, originalView: STATE.currentView, dx: 0, decided: false };
    hideTooltip_();
    beginSwipeTransition_(swipe_);
    // O acumulado que já decidiu o gesto (não só o último evento) vira o dx inicial --
    // perder essa parte faria um flick forte já de saída parecer mais fraco do que foi.
    swipe_.dx = clampSwipeDx_(decidedDx, swipe_.direction, swipe_.paneWidth);
    updateSwipeTransform_(swipe_);
    if (Math.abs(swipe_.dx) >= swipe_.paneWidth * SWIPE_COMMIT_FRACTION_) {
      swipe_.decided = true;
      finishSwipeTransition_(swipe_, true);
    }
    return true;
  }

  function onSwipeWheel_(e) {
    if (wheelVerticalLock_) {
      var lockDx = -e.deltaX, lockDy = e.deltaY;
      if (Math.abs(lockDy) >= Math.abs(lockDx)) {
        // Esse evento específico ainda parece vertical -- confirma o travamento e some
        // qualquer evidência de override que tivesse começado a acumular (precisa ser
        // uma sequência CONTÍNUA de eventos horizontais pra destravar, não só a soma
        // líquida de um vaivém).
        wheelLockOverrideDx_ = 0; wheelLockOverrideDy_ = 0;
        renewSwipeWheelIdle_();
        return;
      }
      wheelLockOverrideDx_ += lockDx;
      wheelLockOverrideDy_ += lockDy;
      if (Math.abs(wheelLockOverrideDx_) < WHEEL_LOCK_OVERRIDE_THRESHOLD_) {
        renewSwipeWheelIdle_(); // já parece horizontal, mas ainda não o bastante pra sobrepor o travamento
        return;
      }
      // Evidência horizontal sustentada o bastante -- destrava e trata o acumulado como
      // a decisão de um gesto horizontal novo (mesmo caminho da decisão "do zero").
      wheelVerticalLock_ = false;
      var overrideDx = wheelLockOverrideDx_;
      wheelLockOverrideDx_ = 0; wheelLockOverrideDy_ = 0;
      if (startHorizontalWheelGesture_(e, overrideDx)) renewSwipeWheelIdle_();
      return;
    }

    if (!swipe_) {
      wheelPendingDx_ += -e.deltaX;
      wheelPendingDy_ += e.deltaY;
      if (Math.abs(wheelPendingDx_) < WHEEL_DECIDE_THRESHOLD_ && Math.abs(wheelPendingDy_) < WHEEL_DECIDE_THRESHOLD_) {
        renewSwipeWheelIdle_(); // ainda indeciso, mas já conta como gesto "vivo" pro idle
        return;
      }
      var decidedDx = wheelPendingDx_, decidedDy = wheelPendingDy_;
      wheelPendingDx_ = 0; wheelPendingDy_ = 0;
      if (Math.abs(decidedDy) >= Math.abs(decidedDx)) {
        wheelVerticalLock_ = true;
        renewSwipeWheelIdle_();
        return;
      }
      if (startHorizontalWheelGesture_(e, decidedDx)) renewSwipeWheelIdle_();
      return;
    }
    if (swipe_.source !== 'wheel') return;
    var dxIncrement = -e.deltaX;

    // Uma vez decidido (ver abaixo), ignora o resto do arrasto/inércia pro dx/visual --
    // já está animando pra completar sozinho, não faz sentido continuar recalculando
    // a posição em cima de um painel que já vai ser substituído.
    if (!swipe_.decided) {
      // Ainda em andamento (arrastando/decidindo) -- sempre suprime o scroll vertical
      // nativo, senão a página rolaria por baixo do painel deslizando.
      e.preventDefault();
      swipe_.dx = clampSwipeDx_(swipe_.dx + dxIncrement, swipe_.direction, swipe_.paneWidth);
      updateSwipeTransform_(swipe_);

      // Assim que o arrasto já passou do ponto de troca, não vale a pena continuar
      // seguindo fielmente cada eventozinho da "cauda" de inércia do trackpad até ela
      // ficar em silêncio -- ela só empurra dx MAIS pra dentro do commit, nunca volta
      // atrás sozinha. Finaliza visualmente na hora (era isso que fazia parecer "uns 2
      // segundos pra completar o scroll" no relato original do usuário).
      if (Math.abs(swipe_.dx) >= swipe_.paneWidth * SWIPE_COMMIT_FRACTION_) {
        swipe_.decided = true;
        finishSwipeTransition_(swipe_, true);
      }
    } else if (Math.abs(dxIncrement) > Math.abs(e.deltaY)) {
      // Já decidido (a troca já aconteceu e já está animando/terminou) -- só ainda
      // suprime o scroll nativo se ESTE evento específico ainda parecer parte da MESMA
      // cauda horizontal. Sem esse "else if" (preventDefault incondicional aqui embaixo,
      // como antes), um scroll VERTICAL de verdade tentado logo depois de uma troca por
      // wheel ficava bloqueado até swipe_ ser liberado pelo silêncio total (até
      // SWIPE_WHEEL_IDLE_MS_ depois do último evento) -- bug relatado: "scroll vertical
      // não funciona" logo após usar o wheel pra trocar de aba.
      e.preventDefault();
    }

    renewSwipeWheelIdle_();
  }

  // swipe_/wheelVerticalLock_ só são liberados quando o wheel realmente fica em
  // silêncio por SWIPE_WHEEL_IDLE_MS_ -- mesmo depois de decidido, e SEM tentar
  // adivinhar se um evento que ainda chega é "a mesma cauda" ou "um flick novo" pelo
  // tamanho/formato dele. JÁ TENTAMOS duas vezes usar um sinal assim (comparar com o
  // evento anterior; depois exigir passar por um "vale" quase-zero antes de aceitar um
  // evento maior como novo) e as duas vezes voltou a quebrar com uso real: inércia de
  // trackpad de verdade nem sempre desacelera de forma limpa/monótona (tem ruído),
  // então um "vale" podia ser só um solavanco no meio da MESMA cauda -- e isso liberava
  // o gesto cedo demais, reabrindo exatamente os dois bugs que essa espera resolve (o
  // "scroll incompleto" revertendo sozinho, e mais de 1 troca a partir do mesmo
  // gesto). Manter o gesto vivo até o silêncio de verdade é a única versão que se
  // mostrou robusta nos testes reais: garante NO MÁXIMO 1 troca de aba por gesto
  // contínuo, por mais forte que ele seja, ao custo de exigir uma pausa de verdade
  // (por menor que seja) pra um PRÓXIMO gesto distinto começar -- pra trocar várias
  // abas rápido de propósito, usar o botão redondo das margens (ver
  // createMarginButton_), que não tem essa ambiguidade nenhuma.
  //
  // Isso NÃO contradiz o "já tentamos duas vezes" acima: aquelas tentativas comparavam
  // a FORMA/tamanho de um evento contra o anterior pra adivinhar "mesma cauda ou novo
  // flick" NO MEIO de um arrasto já em andamento -- exatamente o tipo de sinal frágil
  // que o comentário descarta. wheelLockOverrideDx_/Dy_ é uma coisa diferente: exige
  // SOMAR uma sequência CONTÍNUA e SUSTENTADA de eventos horizontais (zera a cada
  // evento que ainda pareça vertical) até cruzar um limite bem mais alto que o de
  // decisão normal -- não é "isso parece diferente do de antes", é "isso já acumulou
  // bastante evidência horizontal seguida". Uma rolagem vertical de verdade, contínua,
  // não deveria produzir essa sequência.
  function renewSwipeWheelIdle_() {
    if (swipeWheelIdleTimer_) clearTimeout(swipeWheelIdleTimer_);
    swipeWheelIdleTimer_ = setTimeout(function () {
      swipeWheelIdleTimer_ = null;
      wheelVerticalLock_ = false;
      wheelPendingDx_ = 0; wheelPendingDy_ = 0;
      wheelLockOverrideDx_ = 0; wheelLockOverrideDy_ = 0;
      if (!swipe_ || swipe_.source !== 'wheel') return;
      if (!swipe_.decided) {
        var committed = Math.abs(swipe_.dx) >= swipe_.paneWidth * SWIPE_COMMIT_FRACTION_;
        finishSwipeTransition_(swipe_, committed);
      }
      swipe_ = null;
    }, SWIPE_WHEEL_IDLE_MS_);
  }

  function beginSwipeTransition_(s) {
    var appEl = document.getElementById('app');
    var viewportW = document.documentElement.clientWidth;
    s.paneWidth = Math.min(viewportW, 720); // mesma largura de coluna que #app usa (max-width:720px)
    var paneLeft = (viewportW - s.paneWidth) / 2;
    // Copia o padding computado de #app em vez de repetir os valores dele à mão aqui —
    // sem isso, o conteúdo movido pro painel (que não tinha mais o padding que só #app
    // fornecia) ficava mais LARGO que o normal durante a troca — os cards pareciam
    // "crescer" e se deslocar (bug reportado).
    var appPadding = getComputedStyle(appEl).padding;

    s.overlay = document.createElement('div');
    s.overlay.id = 'swipe-overlay';
    s.overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;z-index:30;background:var(--bg);';
    document.body.appendChild(s.overlay);

    // Em janelas mais largas que a coluna de conteúdo (max-width:720px, ver #app),
    // sobra margem vazia dos dois lados. Sem um recorte do tamanho EXATO da coluna, o
    // painel novo (deslocado por paneWidth inteiro pra entrar do lado) acaba com uma
    // fatia sua já visível dentro dessa margem mesmo antes do arrasto começar de
    // verdade -- um "flash" da aba destino ocupando o espaço vazio (bug relatado). Esse
    // clip mantém a margem sempre só com o background plano de s.overlay por trás.
    s.clip = document.createElement('div');
    s.clip.style.cssText = 'position:absolute;top:0;left:' + paneLeft + 'px;width:' + s.paneWidth + 'px;height:100%;overflow:hidden;';
    s.overlay.appendChild(s.clip);

    var paneStyle = 'position:absolute;top:0;left:0;height:100%;width:' + s.paneWidth + 'px;overflow:hidden;padding:' + appPadding + ';';
    s.paneOld = document.createElement('div');
    s.paneOld.style.cssText = paneStyle;
    s.paneNew = document.createElement('div');
    s.paneNew.style.cssText = paneStyle;
    s.clip.appendChild(s.paneOld);
    s.clip.appendChild(s.paneNew);

    var outgoingViewRoot = document.getElementById('view-root');
    // Congela a posição visual de rolagem de ONDE a página estava — o painel não rola
    // com a janela (é position:absolute dentro de um overlay position:fixed), então sem
    // isso a aba de saída "pulava" pro topo dela mesma durante o arrasto mesmo que o
    // usuário estivesse rolado no meio de uma lista longa no momento do gesto.
    outgoingViewRoot.style.marginTop = (-window.scrollY) + 'px';
    outgoingViewRoot.id = 'view-root-outgoing'; // libera o id "view-root" pro novo, evita 2 elementos com o mesmo id ao mesmo tempo
    s.paneOld.appendChild(outgoingViewRoot);
    var incomingViewRoot = document.createElement('div');
    incomingViewRoot.id = 'view-root';
    appEl.appendChild(incomingViewRoot);

    STATE.currentView = s.targetView;
    render(); // desenha a aba de destino no #view-root novo -- já cuida de scroll/destaque da barra sozinho

    s.paneNew.appendChild(document.getElementById('view-root'));
    updateSwipeTransform_(s);
  }

  function updateSwipeTransform_(s) {
    s.paneOld.style.transform = 'translateX(' + s.dx + 'px)';
    var newOffset = s.direction < 0 ? s.paneWidth : -s.paneWidth;
    s.paneNew.style.transform = 'translateX(' + (newOffset + s.dx) + 'px)';
  }

  function finishSwipeTransition_(s, committed) {
    // Pode ser chamada com o gesto (wheel) ainda "vivo" (swipe_ !== null, só
    // decided=true) -- ver onSwipeWheel_: a cauda de inércia continua sendo absorvida
    // por ESTE mesmo gesto até o silêncio de verdade, em vez de precisar de um
    // cooldown à parte aqui.
    var finalDx = committed ? (s.direction < 0 ? -s.paneWidth : s.paneWidth) : 0;
    var transition = 'transform ' + SWIPE_ANIMATION_MS_ + 'ms ease-out';
    s.paneOld.style.transition = transition;
    s.paneNew.style.transition = transition;
    s.dx = finalDx;
    updateSwipeTransform_(s);

    setTimeout(function () {
      var appEl = document.getElementById('app');
      var newViewRoot = document.getElementById('view-root'); // ainda dentro de paneNew
      var oldViewRoot = document.getElementById('view-root-outgoing');
      if (committed) {
        destroyChartsWithin_(oldViewRoot);
        appEl.appendChild(newViewRoot); // tira do paneNew, devolve pro lugar de verdade -- já está com tudo certo (render() cuidou disso em beginSwipeTransition_)
        // render() (lá em beginSwipeTransition_) já tinha restaurado o scroll certo da
        // aba destino -- mas mover os dois view-root pra fora do fluxo normal de #app
        // durante a animação esvaziava a altura rolável da página inteira, e o
        // navegador forçava a JANELA de volta pro topo sozinho (não tinha mais onde
        // rolar). Refaz a restauração agora que #app tem conteúdo de novo (bug
        // relatado: "reseta a posição do scroll vertical ao alternar abas").
        var restoreNew = scrollPositions_[s.targetView] || { x: 0, y: 0 };
        window.scrollTo(restoreNew.x, restoreNew.y);
      } else {
        destroyChartsWithin_(newViewRoot);
        newViewRoot.remove();
        oldViewRoot.id = 'view-root';
        oldViewRoot.style.marginTop = ''; // desfaz o congelamento de scroll aplicado em beginSwipeTransition_
        appEl.appendChild(oldViewRoot); // devolve o ORIGINAL intacto -- não precisa re-renderizar, só recolocar no lugar
        // Desfaz só o que render() (chamado em beginSwipeTransition_) já tinha mudado --
        // STATE.currentView, scroll e destaque da barra -- sem reconstruir o conteúdo de
        // novo (o view-root antigo já está intacto e recolocado, ver acima).
        STATE.currentView = s.originalView;
        lastRenderedView_ = s.originalView;
        var restore = scrollPositions_[s.originalView] || { x: 0, y: 0 };
        window.scrollTo(restore.x, restore.y);
        syncTabbar_(s.originalView);
      }
      s.overlay.remove();
    }, SWIPE_ANIMATION_MS_);
  }

  /** Troca de aba PROGRAMÁTICA (atalho de teclado 1-9, botão redondo de margem, ver
   *  handleGlobalShortcutKey_/createMarginButton_) com a mesma animação de slide do
   *  swipe de verdade, só sem arrasto: começa em dx=0 (begin) e já entra direto
   *  commitada (finish). Não usa a variável swipe_ (não é um gesto de toque/wheel de
   *  verdade) -- a presença de #swipe-overlay já basta pro isSwipeBlocked_() bloquear
   *  qualquer coisa nova enquanto essa animação roda.
   *
   *  O reflow forçado entre begin/finish é essencial, não cosmético: no arrasto de
   *  verdade, dezenas de updateSwipeTransform_ já rodaram (uma por frame) ANTES do
   *  commit, então o navegador já tem o dx=0 pintado de verdade quando finish muda pra
   *  dx final -- a transition anima normalmente. Aqui não existe esse histórico: begin
   *  e finish rodam no MESMO tick de JS, então sem esse reflow no meio o navegador podia
   *  nunca chegar a pintar o dx=0 e simplesmente pular direto pro dx final (transition
   *  sem efeito nenhum) -- a troca "num flash" em vez de deslizar, diferente da
   *  animação do scroll de verdade (bug relatado). */
  function switchViewAnimated_(targetView) {
    if (targetView === STATE.currentView || isSwipeBlocked_()) return;
    var idx = SWIPE_TAB_ORDER_.indexOf(STATE.currentView);
    var targetIdx = SWIPE_TAB_ORDER_.indexOf(targetView);
    if (idx === -1 || targetIdx === -1) return;
    var s = { source: 'key', direction: targetIdx > idx ? -1 : 1, targetView: targetView, originalView: STATE.currentView, dx: 0 };
    beginSwipeTransition_(s);
    void s.paneOld.offsetWidth; // força o reflow -- ver comentário acima
    finishSwipeTransition_(s, true);
  }

  // ---------- clique nas margens vazias (troca de aba) ----------
  /**
   * Em janelas mais largas que a coluna de conteúdo (max-width:720px, ver #app), a
   * margem vazia dos dois lados também troca de aba, além do swipe/scroll de sempre.
   * Duas zonas fixas (#margin-zone-left/right), do tamanho exato de cada margem
   * (recalculado no resize, ver updateMarginZones_) -- só reagem se tiverem largura
   * suficiente pro botão (MARGIN_ZONE_MIN_WIDTH_PX_), senão ficam mortas
   * (pointer-events:none).
   *
   * Com hover (mouse/trackpad, ver HOVER_CAPABLE_): parado ali por
   * MARGIN_HOVER_DELAY_MS_ revela um botão redondo sob o cursor. Ele fica na tela até o
   * mouse se afastar DELE (não da margem) -- de propósito, pra dar pra clicar várias
   * vezes seguidas e trocar várias abas sem precisar de um novo hover a cada vez -- e
   * continua visível mesmo com uma troca em andamento (z-index acima do
   * #swipe-overlay). Sem hover (touch): não tem como "esperar em cima" antes de agir,
   * então um toque já cria o botão no local, aciona a troca de aba na hora, e o botão
   * só faz uma animação de nascer/"clicar"/sumir por cima disso, tudo em ~1s (ver
   * flashMarginButtonForTouch_) -- puramente cosmético, não precisa de um segundo toque
   * confirmando.
   */
  var MARGIN_HOVER_DELAY_MS_ = 200; // pedido explícito do usuário (era 500)
  var MARGIN_BUTTON_SIZE_PX_ = 44; // um pouco menor que o .fab (56px)
  var MARGIN_ZONE_MIN_WIDTH_PX_ = 56; // margem mais estreita que isso não cabe o botão com folga -- fica morta
  var marginRevealTimer_ = null;
  var marginLeaveTimer_ = null;
  var marginButtonEl_ = null; // o botão redondo hoje na tela, se algum

  /** Seta GROSSA de propósito (traço mais largo que os ícones de categoria) -- esse
   *  botão precisa comunicar o sentido num relance, sem ambiguidade. direction<0 =
   *  esquerda (aba anterior), direction>0 = direita (próxima). */
  function marginArrowSvg_(direction) {
    var d = direction < 0 ? 'M15 6l-6 6 6 6' : 'M9 6l6 6-6 6';
    return '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="3" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + d + '"/></svg>';
  }

  function removeMarginButton_() {
    if (marginLeaveTimer_) { clearTimeout(marginLeaveTimer_); marginLeaveTimer_ = null; }
    if (marginButtonEl_) { marginButtonEl_.remove(); marginButtonEl_ = null; }
  }

  /** Vizinho de verdade na direção do botão -- reavaliado a cada clique (não fixado na
   *  hora que o botão nasceu), pra continuar funcionando se o usuário já tiver trocado
   *  de aba clicando nele antes e quiser continuar na mesma direção. */
  function marginButtonTargetView_(direction) {
    return swipeTargetView_(STATE.currentView, direction < 0 ? 10 : -10);
  }

  /** Botão redondo, fundo transparente, borda sutil -- (x, y) em coordenadas de
   *  viewport (clientX/Y), já que é position:fixed. z-index acima do #swipe-overlay
   *  (30) de propósito: não deve sumir durante a animação de troca. */
  function createMarginButton_(x, y, direction) {
    removeMarginButton_();
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.id = 'margin-switch-btn';
    // Sem title de propósito -- não deve ter tooltip nenhum.
    btn.style.cssText = 'position:fixed;left:' + x + 'px;top:' + y + 'px;transform:translate(-50%,-50%);' +
      'width:' + MARGIN_BUTTON_SIZE_PX_ + 'px;height:' + MARGIN_BUTTON_SIZE_PX_ + 'px;border-radius:50%;' +
      'background:transparent;border:1px solid var(--border);color:var(--text);' +
      'display:flex;align-items:center;justify-content:center;padding:0;z-index:40;' +
      'opacity:0;transition:opacity 150ms ease,transform 150ms ease';
    btn.innerHTML = marginArrowSvg_(direction);
    document.body.appendChild(btn);
    // Força um reflow síncrono antes de mudar pra opacity:1 -- só um
    // requestAnimationFrame às vezes não bastava pro navegador "pintar" o opacity:0
    // primeiro, e sem esse estado inicial de verdade a transition não tinha o que
    // animar (pulava direto pro final, sem fade nenhum -- bug relatado).
    void btn.offsetWidth;
    btn.style.opacity = '1';

    btn.addEventListener('mouseenter', function () {
      if (marginLeaveTimer_) { clearTimeout(marginLeaveTimer_); marginLeaveTimer_ = null; }
    });
    btn.addEventListener('mouseleave', function () {
      marginLeaveTimer_ = setTimeout(removeMarginButton_, HOLD_REVEAL_LEAVE_GRACE_MS);
    });
    btn.onclick = function () {
      var target = marginButtonTargetView_(direction);
      if (target) switchViewAnimated_(target);
    };
    marginButtonEl_ = btn;
    return btn;
  }

  /** Sem hover pra revelar antes (touch): o próprio toque já cria o botão no ponto
   *  tocado, dispara a troca de aba na hora, e o botão só anima nascer -> "clicado" ->
   *  sumir por cima disso, tudo em ~1s -- puro efeito visual, não bloqueia nem espera
   *  confirmação. */
  function flashMarginButtonForTouch_(x, y, direction) {
    var btn = createMarginButton_(x, y, direction);
    btn.style.pointerEvents = 'none';
    var target = marginButtonTargetView_(direction);
    if (target) switchViewAnimated_(target);
    setTimeout(function () { if (btn.isConnected) btn.style.transform = 'translate(-50%,-50%) scale(0.85)'; }, 250);
    setTimeout(function () { if (btn.isConnected) btn.style.opacity = '0'; }, 650);
    setTimeout(function () { if (marginButtonEl_ === btn) removeMarginButton_(); }, 1000);
  }

  function updateMarginZones_() {
    var appEl = document.getElementById('app');
    if (!appEl) return;
    var viewportW = document.documentElement.clientWidth;
    var appRect = appEl.getBoundingClientRect();
    [{ id: 'margin-zone-left', width: appRect.left, left: 0 },
      { id: 'margin-zone-right', width: viewportW - appRect.right, left: appRect.right }
    ].forEach(function (z) {
      var el = document.getElementById(z.id);
      if (!el) return;
      var w = Math.max(0, z.width);
      el.style.width = w + 'px';
      el.style.left = z.left + 'px';
      el.style.bottom = '0px';
      el.style.pointerEvents = w >= MARGIN_ZONE_MIN_WIDTH_PX_ ? 'auto' : 'none';
    });
  }

  function setupMarginSwitchZones_() {
    [{ id: 'margin-zone-left', direction: -1 }, { id: 'margin-zone-right', direction: 1 }].forEach(function (spec) {
      var zone = document.createElement('div');
      zone.id = spec.id;
      zone.style.cssText = 'position:fixed;top:0';
      document.body.appendChild(zone);

      if (HOVER_CAPABLE_) {
        var lastX = null, lastY = null;
        zone.addEventListener('mouseenter', function (e) {
          lastX = e.clientX; lastY = e.clientY;
          if (marginButtonEl_) return; // já tem um botão vivo (de um hover anterior) -- não reagenda
          if (marginRevealTimer_) clearTimeout(marginRevealTimer_);
          marginRevealTimer_ = setTimeout(function () {
            marginRevealTimer_ = null;
            // Já na ponta (Início arrastando pra direita, Reembolsos pra esquerda) --
            // não tem vizinho nesse sentido, clicar não faria nada, então nem mostra
            // o botão (bug relatado).
            if (isSwipeBlocked_() || !marginButtonTargetView_(spec.direction)) return;
            createMarginButton_(lastX, lastY, spec.direction);
          }, MARGIN_HOVER_DELAY_MS_);
        });
        zone.addEventListener('mousemove', function (e) { lastX = e.clientX; lastY = e.clientY; });
        zone.addEventListener('mouseleave', function () {
          if (marginRevealTimer_) { clearTimeout(marginRevealTimer_); marginRevealTimer_ = null; }
        });
      } else {
        zone.addEventListener('touchstart', function (e) {
          if (isSwipeBlocked_() || e.touches.length !== 1 || !marginButtonTargetView_(spec.direction)) return;
          var t = e.touches[0];
          flashMarginButtonForTouch_(t.clientX, t.clientY, spec.direction);
        }, { passive: true });
      }
    });
    updateMarginZones_();
    window.addEventListener('resize', updateMarginZones_);
  }

  /**
   * Atalhos de teclado fora de qualquer modal (chamado de dentro do listener de
   * keydown em DOMContentLoaded, só quando #modal-backdrop NÃO está presente): 1-9
   * troca de aba (com a mesma animação de slide do swipe, ver switchViewAnimated_) na
   * ordem visual da barra (SWIPE_TAB_ORDER_ -- hoje só 1-6 têm aba correspondente, 7-9
   * não fazem nada); Space é como passar o mouse em cima do "+" (abre o menu de
   * atalhos); Enter é como clicar nele (Novo lançamento). Não dispara com o foco num
   * campo de texto -- digitar "1" ou um espaço na busca do Extrato, por exemplo, não
   * pode virar um atalho por baixo do usuário.
   */
  function handleGlobalShortcutKey_(e) {
    var active = document.activeElement;
    if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable)) return;
    if (isSwipeBlocked_()) return; // já tem gesto/animação em andamento, ou algum popover aberto (confirm-popover, etc.)

    if (e.key >= '1' && e.key <= '9') {
      var idx = Number(e.key) - 1;
      if (idx < SWIPE_TAB_ORDER_.length) { e.preventDefault(); switchViewAnimated_(SWIPE_TAB_ORDER_[idx]); }
      return;
    }
    if (e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      if (fabHold_) fabHold_.open();
      return;
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      var fab = document.getElementById('fab-add');
      if (fab) fab.click();
    }
  }

  document.addEventListener('touchstart', onSwipeTouchStart_, { passive: true });
  document.addEventListener('touchmove', onSwipeTouchMove_, { passive: false });
  document.addEventListener('touchend', onSwipeTouchEnd_, { passive: true });
  document.addEventListener('touchcancel', onSwipeTouchEnd_, { passive: true });
  document.addEventListener('wheel', onSwipeWheel_, { passive: false });

  // ---------- modal ----------
  function openModal(innerHtml) {
    var root = document.getElementById('modal-root');
    root.innerHTML = '<div class="modal-backdrop" id="modal-backdrop"><div class="modal">' + innerHtml + '</div></div>';
    document.getElementById('modal-backdrop').onclick = function (e) {
      if (e.target.id === 'modal-backdrop') closeModal();
    };
    // Espera o restante da função que chamou openModal terminar de montar campos
    // (ex: cápsulas) antes de focar, senão focaria algo que ainda vai ser substituído.
    setTimeout(function () {
      var field = document.querySelector('.modal input, .modal select, .modal textarea');
      if (field) field.focus();
    }, 0);
  }
  function closeModal() {
    document.getElementById('modal-root').innerHTML = '';
    // Ressincroniza o botão "para confirmar" (fora do #view-root, não é refeito por render()):
    // fechar o popup nunca deve deixá-lo escondido com itens ainda na fila.
    updateReviewButton_();
  }

  // ---------- ponte com o app Android (beta multiusuário) ----------
  /**
   * Dentro do app Android (WebView) existe window.FinancasApp: entrega o ID da planilha da
   * pessoa pra ele guardar sozinho, sem copiar/colar. Fora do app (PC, navegador) não faz nada.
   */
  function handOffSheetToAndroidApp_() {
    if (!(typeof FINANCAS_MULTIUSER !== 'undefined' && FINANCAS_MULTIUSER)) return;
    var bridge = window.FinancasApp;
    if (!bridge || (typeof bridge.setConnection !== 'function' && typeof bridge.setSheetId !== 'function')) return;
    run('getPhoneConnectionInfo').then(function (info) {
      // setConnection também entrega o e-mail (o app avisa se for outra conta que a do Google/Planilhas);
      // versões antigas do app só têm setSheetId.
      if (typeof bridge.setConnection === 'function') bridge.setConnection(info.sheetId, info.email || '');
      else bridge.setSheetId(info.sheetId);
    }).catch(function () { /* sem ponte ou sem rede: o código manual continua valendo */ });
  }

  // ---------- configurações ----------
  /** Ponte do app Android (só existe dentro do WebView do app, na versão que tem getStatus). */
  function androidBridge_() {
    var b = window.FinancasApp;
    return (b && typeof b.getStatus === 'function') ? b : null;
  }
  function androidStatus_() {
    var b = androidBridge_();
    if (!b) return null;
    try { return JSON.parse(b.getStatus()); } catch (e) { return null; }
  }
  function androidAccountMismatch_(s) {
    return !!(s && s.authEmail && s.webEmail && s.authEmail !== s.webEmail);
  }

  function settingsRow_(ok, title, help, buttonLabel, buttonId) {
    return '<div class="settings-row">' +
      '<div class="grow"><div>' + (ok ? '<span class="settings-ok">✓</span> ' : '') + escapeHtml(title) + '</div>' +
      (help ? '<div class="muted">' + escapeHtml(help) + '</div>' : '') + '</div>' +
      (buttonLabel ? '<button class="secondary" id="' + buttonId + '">' + escapeHtml(buttonLabel) + '</button>' : '') +
      '</div>';
  }

  /** Conteúdo da seção "Celular" (só no app Android). Refeito a cada mudança de estado. */
  function androidSectionHtml_(s) {
    var html = '';
    if (androidAccountMismatch_(s)) {
      html += '<div class="settings-warning">O Cacau está na conta ' + escapeHtml(s.webEmail) +
        ', mas a autorização da planilha é de ' + escapeHtml(s.authEmail) +
        '. Sem a mesma conta, o envio falha. Autorize de novo com a conta certa ou use "Sair da conta".</div>';
    }
    html += settingsRow_(s.authOk, 'Permitir gravar na planilha',
      s.authOk ? 'Autorizado' + (s.authEmail ? ' (' + s.authEmail + ')' : '') : 'Deixa o app anexar as notificações na sua planilha.',
      s.authOk ? '' : 'Autorizar', 'st-auth');
    html += settingsRow_(s.listening, 'Acesso às notificações',
      s.listening ? 'O app lê as notificações dos apps conectados.' : 'Ative "Cacau" na lista que abrir.',
      s.listening ? '' : 'Dar acesso', 'st-listen');
    html += settingsRow_(s.battery, 'Bateria sem restrição',
      s.battery ? 'O Android não vai parar o app em segundo plano.' : 'Recomendado, senão alguns celulares param de entregar notificações com a tela apagada.',
      s.battery ? '' : 'Ajustar', 'st-battery');
    html += settingsRow_(s.alertOn, 'Alerta diário às 8h',
      'Uma notificação por dia, só se houver algo a revisar.', s.alertOn ? 'Desligar' : 'Ligar', 'st-alert');
    html += settingsRow_(false, 'Apps conectados (' + s.watchedCount + ')',
      'De quais apps o Cacau lê as notificações.', 'Escolher', 'st-watched');
    html += '<div class="muted" style="margin-top:8px">Fila: ' + s.queue + ' item(ns) · Último envio: ' + escapeHtml(s.lastSendOk || '-') +
      (s.lastSendError ? '<br>Último erro: ' + escapeHtml(s.lastSendError) : '') + '</div>' +
      '<div class="settings-row"><div class="grow"></div><button class="secondary" id="st-send-now">Enviar fila agora</button></div>';
    html += '<details style="margin-top:6px"><summary class="muted">Diagnóstico</summary>' +
      '<div class="muted" style="margin:6px 0">Autorização: ' + escapeHtml(s.authState || '-') +
      '<br>Última checagem do alerta: ' + escapeHtml(s.lastAlertCheck || '-') +
      '<br>Versão do app: ' + escapeHtml(s.appVersion || '-') + '</div>' +
      '<div class="settings-row"><div class="grow"></div><button class="secondary" id="st-send-test">Enviar notificação de teste</button></div>' +
      '<pre class="settings-log" id="st-log"></pre></details>';
    return html;
  }

  function wireAndroidSection_(s) {
    var b = androidBridge_();
    function on(id, fn) { var el = document.getElementById(id); if (el) el.onclick = fn; }
    on('st-auth', function () { b.authorizeSheets(); });
    on('st-listen', function () { b.openNotificationSettings(); });
    on('st-battery', function () { b.openBatterySettings(); });
    on('st-alert', function () { b.setDailyAlert(!s.alertOn); });
    on('st-watched', function () { b.openWatchedApps(); });
    on('st-send-now', function () { b.sendNow(); showToast('Envio pedido'); });
    on('st-send-test', function () { b.sendTest(); showToast('Notificação de teste colocada na fila'); });
    var logEl = document.getElementById('st-log');
    if (logEl) {
      try { logEl.textContent = JSON.parse(b.getLog()).reverse().join('\n'); } catch (e) { logEl.textContent = ''; }
    }
  }

  /**
   * Atualiza a seção "Celular" enquanto a janela estiver aberta: o Android muda de tela pra pedir
   * permissão e ao voltar o estado já mudou. Só redesenha se o estado mudou (não apaga um clique).
   */
  var androidSectionKey_ = null;
  function refreshAndroidSection_() {
    var host = document.getElementById('st-android');
    if (!host) { androidSectionKey_ = null; return; } // janela fechada: para de olhar
    var s = androidStatus_();
    if (s) {
      var key = JSON.stringify(s);
      if (key !== androidSectionKey_) {
        androidSectionKey_ = key;
        host.innerHTML = androidSectionHtml_(s);
        wireAndroidSection_(s);
      }
    }
    setTimeout(refreshAndroidSection_, 1500);
  }

  // Aviso fixo enquanto faltar passo obrigatório da captura (só no app Android).
  var setupBannerTimer_ = null;
  function updateSetupBanner_() {
    clearTimeout(setupBannerTimer_);
    var banner = document.getElementById('setup-banner');
    var s = androidStatus_();
    if (!banner || !s) return;
    var missing = !s.authOk || !s.listening || androidAccountMismatch_(s);
    banner.hidden = !missing;
    if (missing) setupBannerTimer_ = setTimeout(updateSetupBanner_, 4000);
  }

  /**
   * Assistente de primeiro uso (só no app Android): mostra um passo por vez e avança sozinho
   * quando o Android confirma a permissão (a mesma checagem de 1,5 s da janela de configurações).
   * Só abre sozinho uma vez (o app guarda "onboardingSeen"); depois a faixa "Configurar" reabre.
   */
  var onboardingKey_ = null;
  var onboardingSkipped_ = {};
  function onboardingHtml_(s) {
    var steps = [
      { ok: s.authOk, title: 'Permitir gravar na planilha',
        help: 'O Google vai pedir sua autorização (pode aparecer um aviso de app não verificado: toque em "Avançado" e continue).',
        button: 'Autorizar', id: 'ob-auth', run: function (b) { b.authorizeSheets(); } },
      { ok: s.listening, title: 'Acesso às notificações',
        help: 'Ative a chave do "Cacau" na tela que abrir. É assim que o app lê os avisos do banco.',
        button: 'Dar acesso', id: 'ob-listen', run: function (b) { b.openNotificationSettings(); } },
      { ok: s.battery, optional: true, title: 'Bateria sem restrição (recomendado)',
        help: 'Toque em "Permitir". Sem isso alguns celulares param de entregar notificações com a tela apagada.',
        button: 'Permitir', id: 'ob-battery', run: function (b) { b.openBatterySettings(); } },
      { ok: s.alertOn, optional: true, title: 'Alerta diário às 8h (opcional)',
        help: 'Uma notificação por dia, só se houver algo a revisar. O Android vai pedir permissão para mostrar avisos.',
        button: 'Ligar', id: 'ob-alert', run: function (b) { b.setDailyAlert(true); } }
    ];
    var current = null;
    steps.forEach(function (st) { if (!st.ok && !(st.optional && onboardingSkipped_[st.id]) && !current) current = st; });
    var html = '';
    if (androidAccountMismatch_(s)) {
      html += '<div class="settings-warning">O Cacau está na conta ' + escapeHtml(s.webEmail) +
        ', mas a autorização foi dada com ' + escapeHtml(s.authEmail) + '. Autorize de novo com a conta certa.</div>';
    }
    steps.forEach(function (st, i) {
      var isCurrent = st === current;
      html += '<div class="settings-row"><div class="grow"><div>' +
        (st.ok ? '<span class="settings-ok">✓</span> ' : (i + 1) + '. ') + escapeHtml(st.title) + '</div>' +
        (isCurrent ? '<div class="muted">' + escapeHtml(st.help) + '</div>' : '') + '</div>' +
        (isCurrent ? (st.optional ? '<button class="secondary" id="' + st.id + '-skip">Pular</button>' : '') +
          '<button id="' + st.id + '">' + escapeHtml(st.button) + '</button>' : '') + '</div>';
    });
    if (current && current.id === 'ob-listen' && s.sdk >= 33) {
      html += '<div class="muted" style="margin:4px 0">Se a chave estiver cinza (app instalado fora da loja): abra as informações do app, ' +
        'toque nos três pontinhos e em "Permitir configurações restritas".</div>' +
        '<div class="settings-row"><div class="grow"></div><button class="secondary" id="ob-appinfo">Abrir informações do app</button></div>';
    }
    if (!current) {
      html += '<div class="settings-ok" style="margin:8px 0">Tudo pronto! As notificações dos seus apps de banco já vão para o Início.</div>';
    }
    html += '<div class="muted" style="margin-top:8px">Os apps conectados e outros ajustes ficam em Configurações (engrenagem no topo).</div>';
    return { html: html, current: current, steps: steps };
  }

  function refreshOnboarding_(once) {
    var host = document.getElementById('ob-steps');
    if (!host) { onboardingKey_ = null; return; } // janela fechada: para de olhar
    var s = androidStatus_();
    if (s) {
      var key = JSON.stringify(s);
      if (key !== onboardingKey_) {
        onboardingKey_ = key;
        var view = onboardingHtml_(s);
        host.innerHTML = view.html;
        var b = androidBridge_();
        view.steps.forEach(function (st) {
          var el = document.getElementById(st.id);
          if (el) el.onclick = function () { st.run(b); };
          var skip = document.getElementById(st.id + '-skip');
          if (skip) skip.onclick = function () { onboardingSkipped_[st.id] = true; onboardingKey_ = null; refreshOnboarding_(true); };
        });
        var appInfo = document.getElementById('ob-appinfo');
        if (appInfo) appInfo.onclick = function () { b.openAppInfo(); };
        var closeBtn = document.getElementById('ob-close');
        if (closeBtn) closeBtn.textContent = view.current ? 'Agora não' : 'Concluir';
      }
    }
    if (!once) setTimeout(refreshOnboarding_, 1500);
  }

  function openOnboardingModal_() {
    if (!androidBridge_()) return;
    openModal('<h2>Ativar a captura de notificações</h2>' +
      '<div class="muted" style="margin-bottom:8px">Poucos passos rápidos. O app lê os avisos dos seus apps de banco e deixa os lançamentos prontos para você confirmar.</div>' +
      '<div id="ob-steps"></div>' +
      '<button class="secondary" id="ob-close" style="width:100%;margin-top:8px">Agora não</button>');
    document.getElementById('ob-close').onclick = function () { closeModal(); updateSetupBanner_(); };
    onboardingKey_ = null;
    refreshOnboarding_();
  }

  /** Primeira abertura no app com algo obrigatório faltando: abre o assistente sozinho (uma vez). */
  function maybeStartOnboarding_() {
    var s = androidStatus_();
    if (!s || s.onboardingSeen) return;
    var b = androidBridge_();
    if (typeof b.markOnboardingSeen === 'function') b.markOnboardingSeen();
    if (!s.authOk || !s.listening || androidAccountMismatch_(s)) openOnboardingModal_();
  }

  function downloadCsv_(text, filename) {
    var blob = new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  /** Depois de trocar de planilha: um link (clique do usuário) reabre o app já na planilha nova. */
  function showSheetSwitched_(result) {
    var host = document.getElementById('st-sheet-actions');
    if (!host) return;
    host.innerHTML = '<div class="settings-ok" style="margin:8px 0">Pronto.</div>' +
      (result && result.url ? '<a href="' + escapeHtml(result.url) + '" target="_top">Abrir o app com a planilha nova</a>' : 'Recarregue a página.');
  }

  /** A coleta de uso só existe na versão do Apps Script; na web o módulo nem é carregado. */
  function analytics_() {
    return typeof CacauAnalytics !== 'undefined' ? CacauAnalytics : { enabled: function () { return false; }, optedOut: function () { return true; }, setOptOut: function () {} };
  }

  function openSettingsModal_() {
    var multiuser = typeof FINANCAS_MULTIUSER !== 'undefined' && FINANCAS_MULTIUSER;
    var inApp = !!androidBridge_();
    var webBackend = window.CacauBackend && typeof window.CacauBackend.switchSheet === 'function' ? window.CacauBackend : null;
    var theme = '';
    try { theme = localStorage.getItem('financas-theme') || ''; } catch (e) { theme = ''; }

    var html = '<h2>Configurações</h2>';

    if (multiuser) {
      html += '<div class="settings-section"><h3>Conta e planilha</h3>' +
        '<div class="muted">Conta: <b id="st-email">…</b></div>' +
        (inApp ? '' : '<div style="margin-top:6px"><a id="st-sheet-link" href="#" target="_blank" rel="noopener" hidden>Abrir a planilha no Google Planilhas</a></div>') +
        (webBackend ?
          '<div class="settings-row"><div class="grow muted">Escolher ou criar outra planilha (a atual não é apagada).</div><button class="secondary" id="st-switchsheet">Trocar de planilha</button></div>' :
        '<details style="margin-top:8px"><summary class="muted">Trocar de planilha</summary>' +
          '<div id="st-sheet-actions">' +
            '<div class="field" style="margin-top:8px"><label>Reconectar a uma planilha que você já tem</label>' +
            '<input type="text" id="st-reconnect-input" placeholder="Código ou link da planilha"></div>' +
            '<div class="settings-row"><div class="grow"></div><button class="secondary" id="st-reconnect">Reconectar</button></div>' +
            '<div class="muted">Ou comece do zero: cria uma planilha nova com as categorias padrão. A atual não é apagada.</div>' +
            '<div class="settings-row"><div class="grow"></div><button class="secondary" id="st-newsheet">Criar planilha nova</button></div>' +
          '</div></details>') +
        ((inApp || webBackend) ? '<div class="settings-row"><div class="grow muted">Entrar com outra conta Google.</div><button class="secondary" id="st-signout">Sair da conta</button></div>' : '') +
        '</div>';
    }

    html += '<div class="settings-section"><h3>Aparência</h3>' +
      '<div class="field"><label>Tema</label><select id="st-theme">' +
        '<option value="">Igual ao sistema</option>' +
        '<option value="light"' + (theme === 'light' ? ' selected' : '') + '>Claro</option>' +
        '<option value="dark"' + (theme === 'dark' ? ' selected' : '') + '>Escuro</option>' +
      '</select></div>' +
      '<div class="field" style="margin-top:10px"><label>Lado dos botões flutuantes (+)</label><select id="st-nav-side">' +
        '<option value="right"' + (navSide_() === 'right' ? ' selected' : '') + '>Direita</option>' +
        '<option value="left"' + (navSide_() === 'left' ? ' selected' : '') + '>Esquerda</option>' +
      '</select></div></div>';

    html += '<div class="settings-section"><h3>Preferências</h3>' +
      '<div class="field"><label>O card de Orçamentos abre em</label><select id="st-budget-view">' +
        '<option value="rolling"' + (STATE.budgetViewPreference !== 'current' ? ' selected' : '') + '>Últimos dias</option>' +
        '<option value="current"' + (STATE.budgetViewPreference === 'current' ? ' selected' : '') + '>Mês atual</option>' +
      '</select></div>' +
      '<div class="field" style="margin-top:10px"><label>Meta de saldo (sem contar investimentos)</label><input type="text" id="st-goal"></div>' +
      '<div class="settings-row"><div class="grow"></div>' +
        '<button class="secondary" id="st-goal-remove"' + (STATE.balanceGoal ? '' : ' disabled') + '>Remover meta</button>' +
        '<button id="st-goal-save">Salvar meta</button></div>' +
      (analytics_().enabled() ?
        '<div class="settings-row" style="margin-top:10px"><div class="grow"><div>Ajudar a melhorar o Cacau</div>' +
        '<div class="muted">Envia, de forma anônima, quais telas você usa e por quanto tempo. Nunca envia valores, nomes ou descrições dos seus lançamentos.</div></div>' +
        '<label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="st-analytics"' + (analytics_().optedOut() ? '' : ' checked') + '></label></div>' : '') +
      '</div>';

    if (inApp) {
      html += '<div class="settings-section"><h3>Celular</h3><div id="st-android"></div></div>';
    }

    html += '<div class="settings-section"><h3>Dados e ajuda</h3>' +
      (inApp ? '' : '<div class="settings-row"><div class="grow"><div>Baixar lançamentos</div><div class="muted">Arquivo CSV que abre no Excel ou Planilhas.</div></div><button class="secondary" id="st-csv">Baixar CSV</button></div>') +
      '<div class="muted" style="margin:6px 0">Seus lançamentos ficam só na planilha do seu Google Drive' +
      (analytics_().enabled() ? '; só o uso anônimo do app (telas e cliques, sem dados dos lançamentos) vai para a equipe, e você pode desligar em Preferências. ' : '. ') +
      'Para o app deixar de ter acesso à sua conta, <a href="https://myaccount.google.com/connections" target="_blank" rel="noopener">revogue o acesso na sua conta Google</a>. ' +
      'Dúvidas ou problemas: fale com quem te convidou para o beta.</div></div>';

    html += '<button class="secondary" id="st-close" style="width:100%;margin-top:8px">Fechar</button>';
    openModal(html);

    document.getElementById('st-close').onclick = function () { closeModal(); updateSetupBanner_(); };

    // Conta e planilha
    if (multiuser) {
      run('getPhoneConnectionInfo').then(function (info) {
        var emailEl = document.getElementById('st-email');
        if (!emailEl) return; // janela fechada enquanto carregava
        emailEl.textContent = info.email || 'sua conta';
        var link = document.getElementById('st-sheet-link');
        if (link) { link.href = info.sheetUrl; link.hidden = false; }
      }).catch(function () { /* o resto da janela funciona sem isso */ });
      var reconnectBtn = document.getElementById('st-reconnect');
      if (reconnectBtn) reconnectBtn.onclick = function () {
        var value = document.getElementById('st-reconnect-input').value;
        run('reconnectUserSpreadsheet', value).then(showSheetSwitched_).catch(function (err) {
          showToast((err && err.message) || String(err), true);
        });
      };
      var newSheetBtn = document.getElementById('st-newsheet');
      if (newSheetBtn) newSheetBtn.onclick = function (e) {
        confirmPopover(e.currentTarget, 'Criar uma planilha nova? A atual continua no seu Drive, só deixa de ser usada.', function () {
          run('recreateUserSpreadsheet').then(showSheetSwitched_).catch(function (err) {
            showToast((err && err.message) || String(err), true);
          });
        });
      };
      var switchBtn = document.getElementById('st-switchsheet');
      if (switchBtn) switchBtn.onclick = function () { webBackend.switchSheet(); };
      var signOut = document.getElementById('st-signout');
      if (signOut) signOut.onclick = function () {
        if (webBackend) webBackend.signOut(); else window.FinancasApp.signOut();
      };
    }

    // Aparência
    document.getElementById('st-theme').onchange = function (e) {
      var value = e.target.value;
      try {
        if (value) localStorage.setItem('financas-theme', value); else localStorage.removeItem('financas-theme');
      } catch (err) { /* segue sem salvar */ }
      if (value) document.documentElement.setAttribute('data-theme', value);
      else document.documentElement.removeAttribute('data-theme');
      updateThemeToggleIcon_();
      render();
    };

    document.getElementById('st-nav-side').onchange = function (e) { setNavSide_(e.target.value); };

    // Preferências
    document.getElementById('st-budget-view').onchange = function (e) {
      STATE.budgetViewPreference = e.target.value;
      saveBudgetViewPreference_(e.target.value);
    };
    var goalInput = document.getElementById('st-goal');
    setupMoneyInput(goalInput, STATE.balanceGoal || 0);
    var goalRemove = document.getElementById('st-goal-remove');
    document.getElementById('st-goal-save').onclick = function () {
      var amount = goalInput.getValue();
      if (!amount || amount <= 0) { showToast('Informe uma meta maior que zero.', true); return; }
      saveBalanceGoalClient_(amount);
      goalRemove.disabled = false;
      showToast('Meta salva');
    };
    goalRemove.onclick = function () {
      saveBalanceGoalClient_(null);
      goalRemove.disabled = true;
      var fresh = document.createElement('input'); // o campo de dinheiro não tem "zerar": troca por um novo
      fresh.type = 'text'; fresh.id = 'st-goal';
      goalInput.parentNode.replaceChild(fresh, goalInput);
      goalInput = fresh;
      setupMoneyInput(goalInput, 0);
      showToast('Meta removida');
    };

    var analyticsToggle = document.getElementById('st-analytics');
    if (analyticsToggle) analyticsToggle.onchange = function (e) {
      analytics_().setOptOut(!e.target.checked);
      showToast(e.target.checked ? 'Obrigado por ajudar!' : 'Coleta de uso desligada');
    };

    // Celular (só no app Android)
    if (inApp) { androidSectionKey_ = null; refreshAndroidSection_(); }

    // Dados
    var csvBtn = document.getElementById('st-csv');
    if (csvBtn) csvBtn.onclick = function () {
      csvBtn.disabled = true;
      run('exportTransactionsCsv').then(function (text) {
        downloadCsv_(text, 'financas-lancamentos-' + todayYmd() + '.csv');
      }).catch(function (err) {
        showToast('Não foi possível exportar: ' + ((err && err.message) || err), true);
      }).then(function () { csvBtn.disabled = false; });
    };
  }

  // ---------- seletor nativo de data/hora ----------
  // Clicar em qualquer parte do campo já foca o texto (padrão do navegador, pra
  // quem prefere digitar); aqui também abrimos o seletor nativo junto, já que o
  // mais comum é escolher visualmente em vez de digitar.
  function setupDateTimePickerAutoOpen_() {
    document.addEventListener('click', function (e) {
      var el = e.target;
      if (!el.matches || !el.matches('input[type="date"], input[type="time"]')) return;
      if (typeof el.showPicker !== 'function') return;
      try { el.showPicker(); } catch (err) { /* sem user-activation, campo desabilitado, etc. */ }
    });
  }

  // ---------- barra lateral de abas ----------
  var NAV_SIDE_KEY_ = 'financas-nav-side';
  // Toque/hover por mais que isso expande a barra (mostra os nomes); mais rápido é toque
  // simples e troca de aba. Mesmo tempo no mouse e no dedo. Ajustável aqui.
  var SIDEBAR_HOLD_MS_ = 100;

  /** Lado da barra de abas: 'right' (padrão, favorece destros no celular) ou 'left'. */
  function navSide_() {
    try { return localStorage.getItem(NAV_SIDE_KEY_) === 'left' ? 'left' : 'right'; } catch (e) { return 'right'; }
  }
  function applyNavSide_() {
    document.documentElement.setAttribute('data-nav-side', navSide_());
  }
  function setNavSide_(side) {
    try { localStorage.setItem(NAV_SIDE_KEY_, side === 'left' ? 'left' : 'right'); } catch (e) { /* segue sem salvar */ }
    applyNavSide_();
  }

  /** Marca a aba ativa na barra (a ativa mostra o nome; as outras só o ícone, com o nome no
   *  tooltip). Contas e Categorias moram no "Mais": quando uma delas está ativa, o botão
   *  "Mais" assume o ícone e o nome dela. */
  function syncTabbar_(view) {
    document.querySelectorAll('.tab-btn[data-view]').forEach(function (btn) {
      var active = btn.dataset.view === view;
      btn.classList.toggle('active', active);
      if (active) btn.removeAttribute('data-tooltip');
      else btn.setAttribute('data-tooltip', btn.getAttribute('aria-label') || '');
    });
    var more = document.getElementById('tab-more');
    if (!more) return;
    if (more.dataset.defaultHtml === undefined) more.dataset.defaultHtml = more.innerHTML;
    var inner = document.querySelector('.tabbar-more .tab-btn[data-view="' + view + '"]');
    more.classList.toggle('active', !!inner);
    more.innerHTML = inner ? inner.innerHTML : more.dataset.defaultHtml;
    if (inner) more.removeAttribute('data-tooltip'); else more.setAttribute('data-tooltip', 'Mais');
    if (inner) closeTabbarMore_();
    measureTabLabels_();
  }
  /** Largura exata de cada nome (--tw): o CSS anima o nome de 0 até ela. */
  function measureTabLabels_() {
    document.querySelectorAll('.tab-btn .tab-label').forEach(function (l) {
      var text = l.firstElementChild || l; // o <span> interno tem a largura natural do nome
      l.style.setProperty('--tw', Math.ceil(text.getBoundingClientRect().width) + 'px');
    });
  }
  function closeTabbarMore_() {
    var panel = document.getElementById('tabbar-more');
    var more = document.getElementById('tab-more');
    if (panel) panel.classList.remove('open');
    if (more) more.setAttribute('aria-expanded', 'false');
  }

  function setupSidebar_() {
    var nav = document.querySelector('nav.tabbar');
    if (!nav) return;
    var panel = document.getElementById('tabbar-more');
    var more = document.getElementById('tab-more');
    function goTo_(view) {
      hideTooltip_();
      closeTabbarMore_();
      // Ignora clique no meio da breve animação de acomodação do swipe entre abas
      // (#swipe-overlay ainda presente) -- nesse instante #view-root não está no
      // lugar de sempre dentro de #app (ver finishSwipeTransition_), e um render()
      // aqui bagunçaria a troca em andamento.
      if (document.getElementById('swipe-overlay')) return;
      STATE.currentView = view;
      render();
    }
    document.querySelectorAll('.tab-btn[data-view]').forEach(function (btn) {
      wireDayCell_(btn, function () { goTo_(btn.dataset.view); }, true);
    });
    if (more && panel) {
      wireDayCell_(more, function () {
        hideTooltip_();
        var open = !panel.classList.contains('open');
        // alinha a borda direita do painel com a do botão "Mais"
        panel.style.right = Math.max(8, document.documentElement.clientWidth - more.getBoundingClientRect().right) + 'px';
        panel.classList.toggle('open', open);
        more.setAttribute('aria-expanded', open ? 'true' : 'false');
      }, true);
      // Toque fora do painel "Mais" fecha.
      document.addEventListener('mousedown', function (e) {
        if (panel.classList.contains('open') && !panel.contains(e.target) && !more.contains(e.target)) closeTabbarMore_();
      }, true);
      document.addEventListener('touchstart', function (e) {
        if (panel.classList.contains('open') && !panel.contains(e.target) && !more.contains(e.target)) closeTabbarMore_();
      }, { capture: true, passive: true });
    }
    syncTabbar_(STATE.currentView);
  }

  // ---------- boot ----------
  document.addEventListener('DOMContentLoaded', function () {
    applyNavSide_();
    setupSidebar_();
    setupFabSpeedDial_();
    setupReviewButton_();
    setupMarginSwitchZones_();
    setupScrollToTopButton_();
    setupDateTimePickerAutoOpen_();
    document.getElementById('theme-toggle').onclick = toggleTheme_;
    updateThemeToggleIcon_();
    var settingsBtn = document.getElementById('settings-btn');
    if (settingsBtn) settingsBtn.onclick = openSettingsModal_;
    var setupBannerBtn = document.getElementById('setup-banner-btn');
    if (setupBannerBtn) setupBannerBtn.onclick = openOnboardingModal_;
    updateSetupBanner_();
    maybeStartOnboarding_();
    handOffSheetToAndroidApp_();

    // Com um modal aberto: Enter aciona o Salvar (de qualquer campo, ou sem foco em
    // nenhum) e Esc fecha o modal, de onde quer que o foco esteja. Sem modal nenhum
    // aberto: ver handleGlobalShortcutKey_ (1-9 troca de aba, Space/Enter no "+").
    document.addEventListener('keydown', function (e) {
      // O popup de reembolso (#refund-modal-root) tem o PRÓPRIO listener de
      // Enter/Esc (ver openRefundModal_), registrado ANTES deste (script roda antes do
      // DOMContentLoaded) — sem esse retorno cedo, os DOIS disparavam juntos no mesmo
      // keydown: Enter acionava Vincular/Concluído no popup E Salvar do lançamento por
      // baixo; Esc fechava o popup E o modal do lançamento junto.
      if (document.getElementById('refund-modal-root')) return;
      if (e.key === 'Escape') {
        var popover = document.getElementById('confirm-popover');
        if (popover) { popover.remove(); e.preventDefault(); return; }
        if (document.getElementById('modal-backdrop')) { e.preventDefault(); closeModal(); }
        return;
      }
      if (!document.getElementById('modal-backdrop')) { handleGlobalShortcutKey_(e); return; }
      if (e.key !== 'Enter') return;
      var submitBtn = document.getElementById('m-submit');
      if (!submitBtn) return;
      e.preventDefault();
      submitBtn.click();
    });

    bootstrap();

    // Atualiza a posição do pino "Hoje" na linha do tempo de orçamento de hora em hora.
    setInterval(function () {
      if (STATE.currentView === 'dashboard') render();
    }, 60 * 60 * 1000);
  });
</script>

  
</body>
</html>
