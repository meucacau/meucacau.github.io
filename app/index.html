  function categoryLabelHtml(id) {
    if (!id) return escapeHtml('Sem categoria');
    var c = STATE.categories.find(function (x) { return x.id === id; });
    if (!c) return escapeHtml('Sem categoria');
    var icon = categoryIconHtml_(c);
    if (!c.parentId) return icon + escapeHtml(c.name);
    var parent = STATE.categories.find(function (x) { return x.id === c.parentId; });
    return icon + (parent ? escapeHtml(parent.name) + ' › ' : '') + escapeHtml(c.name);
  }

  /** Ícone pra um Orçamento -- que pode cobrir VÁRIAS categorias ao mesmo tempo (ver
   *  b.categoryIds/joinBudgetCategoryNames_), então não dá pra resolver um ícone único
   *  "correto" sempre. No caso comum (uma categoria de topo + todas as subcategorias
   *  dela, ou uma categoria só) qualquer id da lista resolve pro mesmo ícone do pai;
   *  no caso raro de categorias de topo DIFERENTES misturadas, usa a primeira como
   *  representante -- simples e nunca errado, só não cobre as outras. */
  function budgetIconHtml_(b) {
    return categoryIconHtml_(b.categoryIds && b.categoryIds[0]);
  }

  /** Popover com a grade dos ~40 ícones disponíveis pro seletor manual (ver
   *  openCategoryModal). currentKey só destaca qual já está selecionado -- não muda
   *  nada sozinho. onPick(key) é chamado com a chave escolhida, ou null se o usuário
   *  clicou em "usar sugestão automática" (limpa um override salvo antes, voltando a
   *  casar pelo nome sempre que ele mudar). */
  function openCategoryIconPicker_(anchorEl, currentKey, onPick) {
    closeActiveConfirmPopover_();
    var pop = document.createElement('div');
    pop.id = 'confirm-popover';
    pop.className = 'confirm-popover dropdown-popover';
    // 7 colunas (em vez de 6) + max-height maior que o padrão de .dropdown-popover
    // (260px) -- com todos os ~40 ícones, 6 colunas ficava alto o suficiente pra
    // precisar de scroll VERTICAL (bug relatado). Precisa sobrescrever max-width
    // também, não só width -- .confirm-popover tem max-width:240px, mais estreito que
    // as 7 colunas cabendo (248px de conteúdo + padding), e um max-width menor que o
    // width sempre vence, então sem isso sobrava um scroll HORIZONTAL escondido.
    pop.style.width = '264px';
    pop.style.maxWidth = '264px';
    pop.style.maxHeight = '340px';
    pop.innerHTML =
      '<div class="dropdown-option" data-icon-reset style="text-align:center;white-space:normal;margin-bottom:6px">Usar sugestão automática</div>' +
      '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">' +
        CATEGORY_ICON_ALL_KEYS_.map(function (key) {
          return '<button type="button" class="icon-picker-option' + (key === currentKey ? ' active' : '') + '" data-icon-key="' + key + '" title="' + escapeHtml(CATEGORY_ICON_LABELS_[key] || key) + '">' + categoryIconSvgBare_(key) + '</button>';
        }).join('') +
      '</div>';
    positionPopover(anchorEl, pop);
    var stopListening;
    function cleanup() { pop.remove(); stopListening(); activeConfirmPopoverCleanup_ = null; }
    stopListening = dismissOnOutsideClick(pop, cleanup);
    activeConfirmPopoverCleanup_ = cleanup;
    pop.querySelector('[data-icon-reset]').onclick = function () { cleanup(); onPick(null); };
    pop.querySelectorAll('.icon-picker-option').forEach(function (el) {
      el.onclick = function () { cleanup(); onPick(el.dataset.iconKey); };
    });
  }

  // ---------- ranking por uso recente (últimos 30 dias) ----------
  function byCountThenLabel(a, b) {
    if (b.count !== a.count) return b.count - a.count;
    return a.label.localeCompare(b.label, 'pt-BR');
  }
  function rankedAccountItems(filterFn) {
    var usage = STATE.usage.accounts || {};
    return STATE.accounts.filter(filterFn || function () { return true; }).map(function (a) {
      return { value: a.id, label: a.name, count: usage[a.id] || 0, colorIndex: a.colorIndex };
    }).sort(byCountThenLabel);
  }
  /**
   * Mesma lista de rankedAccountItems(), mas com toda conta de investimento jogada pro
   * FINAL (ainda ordenada por uso/nome dentro do próprio grupo) — só o filtro de conta do
   * Extrato usa isso: a maioria dos lançamentos nem pode estar numa conta de investimento
   * (createTransaction bloqueia — só transferência de depósito/resgate passa por lá), então
   * não faz sentido ela competir por espaço no topo da lista com as contas do dia a dia.
   */
  function rankedAccountItemsInvestmentsLast_() {
    var isInvestment = {};
    STATE.accounts.forEach(function (a) { if (a.type === 'investment') isInvestment[a.id] = true; });
    var items = rankedAccountItems();
    return items.filter(function (i) { return !isInvestment[i.value]; })
      .concat(items.filter(function (i) { return isInvestment[i.value]; }));
  }
  /**
   * Sempre em ordem alfabética: categoria de topo, seguida das suas subcategorias (também
   * alfabéticas), numa lista PLANA com todas — usado por todos os campos de categoria
   * (Previsão mensal, novo lançamento, edição, revisão de pendência e filtro do Extrato).
   * Carrega recentlyUsed (vem do servidor, ver listCategories em Categories.js) porque é
   * ele que decide o que fica escondido atrás do "+" quando a lista não cabe em
   * CAPSULE_MAX_ROW_INDEX_ linhas (ver collapseUnused/renderCollapsibleCapsules_).
   */
  /**
   * Tooltip de uma cápsula de categoria: a descrição escrita pelo usuário (ver o campo
   * Descrição em openCategoryModal) tem prioridade e sai em ITÁLICO, pra ficar claro que
   * é texto dele e não rótulo do app; sem descrição, uma subcategoria continua mostrando
   * de quem ela é filha.
   */
  function categoryTooltip_(cat, parentName) {
    if (cat.description) return { tooltip: cat.description, tooltipItalic: true };
    if (parentName) return { tooltip: 'Subcategoria de ' + parentName, tooltipItalic: false };
    return { tooltip: null, tooltipItalic: false };
  }
  function categoryItem_(cat, isSubcategory, parentName) {
    var tip = categoryTooltip_(cat, parentName);
    return {
      value: cat.id, label: cat.name, isSubcategory: isSubcategory,
      tooltip: tip.tooltip, tooltipItalic: tip.tooltipItalic,
      recentlyUsed: !!cat.recentlyUsed
    };
  }
  function rankedCategoryItems(kind) {
    var all = STATE.categories.filter(function (c) { return c.kind === kind; });
    var tops = all.filter(function (c) { return !c.parentId; }).sort(byNamePt_);
    var items = [];
    var usedIds = {};
    tops.forEach(function (top) {
      items.push(categoryItem_(top, false, null));
      usedIds[top.id] = true;
      all.filter(function (c) { return c.parentId === top.id; }).sort(byNamePt_).forEach(function (sub) {
        items.push(categoryItem_(sub, true, top.name));
        usedIds[sub.id] = true;
      });
    });
    // Subcategoria cuja categoria de topo foi arquivada não pode simplesmente sumir da lista.
    all.filter(function (c) { return !usedIds[c.id]; }).sort(byNamePt_).forEach(function (c) {
      items.push(categoryItem_(c, !!c.parentId, null));
    });
    return items;
  }
  function rankedParentCategoryItems(kind) {
    var usage = STATE.usage.categories || {};
    var tops = STATE.categories.filter(function (c) { return !c.parentId && c.kind === kind; });
    return tops.map(function (p) {
      var count = usage[p.id] || 0;
      STATE.categories.forEach(function (c) { if (c.parentId === p.id) count += usage[c.id] || 0; });
      return { value: p.id, label: p.name, count: count };
    }).sort(byCountThenLabel);
  }

  /** Nomes distintos já usados em "Recebido de"/"Pago a", pra sugerir enquanto o usuário digita. */
  function knownCounterpartyNames() {
    var seen = {};
    STATE.allTransactions.forEach(function (t) {
      if (t.counterparty) seen[t.counterparty] = true;
    });
    return Object.keys(seen).sort(function (a, b) { return a.localeCompare(b, 'pt-BR'); });
  }
  /**
   * Substitui o <input list>+<datalist> nativo (usado antes aqui): enquanto o popup de
   * sugestão NATIVO do navegador ficava aberto, ele intercepta o mouse no campo pra
   * navegar as opções, impedindo selecionar texto ou dar clique triplo (bug relatado) --
   * limitação do próprio navegador, não tinha ajuste pequeno que resolvesse. Reaproveita
   * o popover/posicionamento de openDropdownMenu_ (mesmo visual .dropdown-popover já
   * usado no app), só que ancorado no próprio <input> (não um botão) e refeito a cada
   * tecla -- mesmo comportamento do datalist nativo: mostra tudo ao focar sem nada
   * digitado ainda, filtra por substring (sem diferenciar maiúsculas) conforme digita.
   *
   * Clicar numa sugestão dispara um evento "input" de VERDADE (não só atribui .value),
   * pra continuar acionando os listeners que já existem em cada modal (sugestão de
   * categoria, "Lembrar nome?") do jeito que escolher uma opção do datalist nativo
   * também disparava sozinho -- nenhum desses listeners precisou mudar.
   *
   * Fechar só no mousedown fora (padrão já usado por dismissOnOutsideClick, mas com a
   * exceção extra de nunca fechar ao clicar no PRÓPRIO input) -- de propósito, não em
   * blur: blur dispara ANTES do click numa opção terminar (mousedown já tira o foco do
   * input), então fechar ali derrubaria a opção do DOM antes do clique nela ser
   * concluído, quebrando a seleção por mouse -- exatamente o tipo de bug que essa função
   * existe pra evitar.
   */
  function setupCounterpartySuggestions_(inputEl) {
    var pop = null;
    var nav = null;
    function close() {
      if (!pop) return;
      nav = null;
      pop.remove();
      document.removeEventListener('mousedown', onOutsideClick, true);
      pop = null;
    }
    function onOutsideClick(e) {
      if (pop && !pop.contains(e.target) && e.target !== inputEl) close();
    }
    function renderList() {
      var typed = inputEl.value.trim().toLowerCase();
      var matches = knownCounterpartyNames().filter(function (n) {
        return !typed || n.toLowerCase().indexOf(typed) !== -1;
      });
      if (!matches.length) { close(); return; }
      if (!pop) {
        pop = document.createElement('div');
        pop.className = 'confirm-popover dropdown-popover';
        document.addEventListener('mousedown', onOutsideClick, true);
      }
      pop.innerHTML = matches.map(function (n) {
        return '<div class="dropdown-option" data-value="' + escapeHtml(n) + '">' + escapeHtml(n) + '</div>';
      }).join('');
      pop.querySelectorAll('.dropdown-option').forEach(function (el) {
        el.onclick = function () {
          inputEl.value = el.dataset.value;
          close();
          // isTrusted:false (evento sintético, não veio de teclado de verdade) -- o
          // listener de 'input' abaixo ignora esse disparo específico pra não reabrir o
          // dropdown mostrando a opção recém-escolhida de volta pra si mesma. Sem
          // .focus() explícito depois: clicar numa div não-focável (a própria opção)
          // nunca tira o foco do input pra começo de conversa, então chamar de volta só
          // reabriria o dropdown via o listener de 'focus' abaixo.
          inputEl.dispatchEvent(new Event('input', { bubbles: true }));
        };
      });
      positionPopover(inputEl, pop);
      nav = createDropdownKeyNav_(pop);
    }
    inputEl.addEventListener('focus', renderList);
    inputEl.addEventListener('input', function (e) { if (e.isTrusted) renderList(); });
    inputEl.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { close(); return; }
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (!pop) renderList();
        if (nav) nav.move(e.key === 'ArrowDown' ? 1 : -1);
      } else if (e.key === 'Enter' && nav && nav.pick()) {
        // Escolheu a sugestão realçada: não deixa o Enter chegar no Salvar do modal.
        e.preventDefault(); e.stopPropagation();
      }
    });
  }

  // ---------- lançamento otimista ----------
  function topLevelCategoryName(categoryId) {
    var cat = STATE.categories.find(function (c) { return c.id === categoryId; });
    if (!cat) return 'Sem categoria';
    if (!cat.parentId) return cat.name;
    var parent = STATE.categories.find(function (c) { return c.id === cat.parentId; });
    return parent ? parent.name : cat.name;
  }

  /**
   * Aplica na hora, no STATE local, o efeito de um lançamento que acabou de ser
   * enviado ao servidor (mas ainda não confirmado) — saldo da conta, gráfico de
   * gastos do mês e lista de últimos lançamentos do dashboard, além de uma prévia
   * no extrato. É só uma prévia: refreshAll() logo depois substitui pelo dado real,
   * então pequenas imprecisões (ex: parcelamento vira 1 linha em vez de N) se
   * corrigem sozinhas em seguida.
   */
  function applyOptimisticEntry(entry) {
    var tempId = 'tmp-' + Math.random().toString(36).slice(2);
    var sign = (entry.kind === 'income' || entry.kind === 'transfer_in') ? 1 : -1;

    if (STATE.dashboard) {
      var acc = STATE.dashboard.accounts.find(function (a) { return a.id === entry.accountId; });
      if (acc) {
        acc.balance += sign * entry.amount;
        STATE.dashboard.totalBalance += sign * entry.amount;
      }
      var isCurrentMonth = entry.date && entry.date.indexOf(STATE.dashboard.month) === 0;
      // Lançamento criado já marcado "Não considerar em análises?" não entra na rosca/totais do
      // mês (mesma regra do servidor, ver getDashboardData) -- só no saldo e na lista.
      var countsInMonthAggregates = !entry.excludeFromAnalysis;
      if (isCurrentMonth && countsInMonthAggregates && entry.kind === 'expense') {
        var topName = topLevelCategoryName(entry.categoryId);
        var bucket = STATE.dashboard.expensesByCategory.find(function (e) { return e.category === topName; });
        if (bucket) bucket.amount += entry.amount;
        else STATE.dashboard.expensesByCategory.push({ category: topName, amount: entry.amount });
        STATE.dashboard.totalExpenseMonth += entry.amount;
      }
      if (isCurrentMonth && countsInMonthAggregates && entry.kind === 'income') {
        STATE.dashboard.totalIncomeMonth += entry.amount;
      }
      STATE.dashboard.recentTransactions.unshift({
        id: tempId, date: entry.date, time: entry.time || null, accountId: entry.accountId, categoryId: entry.categoryId,
        kind: entry.kind, amount: entry.amount, description: entry.description, counterparty: entry.counterparty || null,
        billMonth: null, installmentSeq: null, installmentTotal: null, transferGroupId: null,
        excludeFromAnalysis: !!entry.excludeFromAnalysis
      });
      STATE.dashboard.recentTransactions = STATE.dashboard.recentTransactions.slice(0, 15);
    }

    // counterparty separado de description (não colapsado num campo só) pra a prévia
    // renderizar EXATAMENTE igual à linha real que vai substituí-la — ver extratoRowHtml,
    // que imprime os dois; sem isso o texto da linha mudava na troca, um "piscar" que
    // parecia "o lançamento só apareceu agora".
    // editable: a prévia já pode abrir o modal de edição (ver extratoRowHtml/rowAttrs e
    // resolveRealId_ nos handlers de salvar/remover), sem esperar o servidor confirmar.
    // Fica FALSO em dois casos onde a prévia não corresponde 1:1 a uma linha real, e
    // editar "ela" não teria significado definido até o dado real chegar:
    //   - transferência: são 2 pernas amarradas por um transferGroupId que só o servidor
    //     cria, e é ele que o modal de transferência edita;
    //   - compra parcelada: 1 prévia representa N parcelas (a prévia é aproximada de
    //     propósito, ver comentário acima).
    var isTransfer = entry.kind === 'transfer_out' || entry.kind === 'transfer_in';
    var isInstallment = Number(entry.installmentTotal || 1) > 1;
    STATE.pendingTransactions.push({
      id: tempId, date: entry.date, time: entry.time || null, accountId: entry.accountId, categoryId: entry.categoryId,
      kind: entry.kind, amount: entry.amount, description: entry.description, counterparty: entry.counterparty || null,
      billMonth: null, installmentSeq: null, installmentTotal: null, transferGroupId: null,
      // forecastId explícito (não undefined): a prévia agora pode abrir o modal de
      // edição, que lê t.forecastId pra pré-selecionar o vínculo com Lançamento recorrente.
      forecastId: entry.forecastId || null,
      forecastCycleMonth: entry.forecastCycleMonth || null,
      // Sem a flag, a prévia de um lançamento criado já marcado "Não considerar em
      // análises?" contava no calendário/médias até o servidor confirmar (ver
      // OPTIMISTIC_TX_EDIT_KEYS_ -- mesma família de atraso).
      excludeFromAnalysis: !!entry.excludeFromAnalysis,
      pending: true, editable: !isTransfer && !isInstallment
    });
    return tempId;
  }

  // IDs de lançamento (já REAIS, não "tmp-") recém-criados via resolveCreatedTransactions_
  // — protege contra o refresh coalescido que vem em seguida enxergar uma leitura da
  // planilha ainda desatualizada (o appendRow_ que criou é imediato; essa leitura é
  // SEPARADA e pode atrasar por trás) e apagar o lançamento que JÁ estava aparecendo
  // certo. Ver uso em applyBootstrapData.
  var recentlyCreatedTxIds_ = {};
  /**
   * Assim que a PRÓPRIA criação confirma (createTransaction/createTransfer já devolvem
   * o lançamento mapeado, ver Transactions.js), troca a(s) prévia(s) otimista(s) pelos
   * dados de verdade NA HORA — sem esperar o refresh coalescido (que só dispara quando a
   * ÚLTIMA mutação em voo termina, e mesmo assim ainda dependeria de uma leitura separada
   * da planilha enxergar a escrita recém-feita). Isso é o que fazia criar um lançamento
   * parecer lento/instável (o card do dia inteiro sumindo por alguns segundos) enquanto
   * editar/remover já eram instantâneos — os dois mexem em STATE.allTransactions/
   * deletingIds direto, sem depender de mais nenhuma leitura.
   */
  function resolveCreatedTransactions_(tempIds, rows) {
    // Guarda o de-para temp -> real: se o usuário clicou na PRÉVIA e já está com o modal
    // de edição aberto, salvar/remover resolve o ID por aqui (ver resolveRealId_) em vez
    // de mandar "tmp-..." pro servidor. Só quando é 1:1 — uma prévia de compra parcelada
    // vira N linhas, e aí não existe "a" linha real correspondente (por isso essa prévia
    // nem fica clicável, ver editable em applyOptimisticEntry).
    if (tempIds.length === rows.length) {
      tempIds.forEach(function (tempId, i) {
        resolvedTempIds_[tempId] = rows[i].id;
        // Vínculos de reembolso otimistas da prévia (ver applyOptimisticRefundLinks_) passam
        // a apontar pro ID real -- senão a linha real, que acabou de substituir a prévia,
        // voltaria a mostrar o valor BRUTO até o servidor gravar os vínculos de verdade.
        var remapped = false;
        STATE.refundLinks.forEach(function (l) {
          if (l.activeTransactionId === tempId) { l.activeTransactionId = rows[i].id; remapped = true; }
        });
        // A prévia do "Últimos lançamentos" (Início) segue com o ID temporário até o próximo
        // refresh; acompanha o ID real pra continuar casando com esses vínculos.
        if (remapped && STATE.dashboard && STATE.dashboard.recentTransactions) {
          STATE.dashboard.recentTransactions.forEach(function (t) { if (t.id === tempId) t.id = rows[i].id; });
        }
      });
    }
    STATE.pendingTransactions = STATE.pendingTransactions.filter(function (t) { return tempIds.indexOf(t.id) === -1; });
    rows.forEach(function (row) {
      STATE.allTransactions.unshift(row);
      recentlyCreatedTxIds_[row.id] = true;
    });
    render();
  }

  /**
   * Receita criada já vinculada a reembolsos (popup "Vincular reembolso?"): os vínculos de
   * verdade só existem depois de DUAS chamadas ao servidor em série (criar o lançamento,
   * depois setRefundLinksForActiveTransaction), então o valor líquido (abatido) só
   * aparecia no Extrato alguns segundos depois. Aqui os vínculos entram em STATE.refund
   * Links na hora, ligados ao ID da PRÉVIA, com ID temporário ("tmp-", que
   * preserveOptimisticTempEntries_ mantém por cima de qualquer refresh no meio do
   * caminho). resolveCreatedTransactions_ religa ao ID real; replaceOptimisticRefundLinks_
   * troca pelos vínculos de verdade; discardOptimisticRefundLinks_ desfaz em caso de erro.
   */
  /** Os vínculos escolhidos no popup (stagedRefundLinks) passam do valor da receita? O popup
   *  já barra isso ao vincular, mas o valor da receita ainda pode ser REDUZIDO depois. */
  function stagedRefundLinksExceed_(links, amount) {
    var cents = links.reduce(function (sum, a) { return sum + Math.round(a.amount * 100); }, 0);
    return cents > Math.round(amount * 100);
  }
  function applyOptimisticRefundLinks_(activeTempId, allocations) {
    allocations.forEach(function (a) {
      STATE.refundLinks.push({ id: 'tmp-' + Math.random().toString(36).slice(2), shareId: a.shareId, activeTransactionId: activeTempId, allocatedAmount: a.amount });
    });
  }
  function dropOptimisticRefundLinks_(activeIds) {
    STATE.refundLinks = STATE.refundLinks.filter(function (l) {
      return !(String(l.id).indexOf('tmp-') === 0 && activeIds.indexOf(l.activeTransactionId) !== -1);
    });
  }
  function replaceOptimisticRefundLinks_(tempIds, activeId, createdLinks) {
    dropOptimisticRefundLinks_(tempIds.concat([activeId]));
    createdLinks.forEach(function (row) {
      STATE.refundLinks.push({ id: row.ID, shareId: row.ShareID, activeTransactionId: row.ActiveTransactionID, allocatedAmount: Number(row.AllocatedAmount) });
    });
  }
  function discardOptimisticRefundLinks_(tempIds) {
    dropOptimisticRefundLinks_(tempIds.concat(tempIds.map(function (id) { return resolvedTempIds_[id]; }).filter(Boolean)));
  }

  // Mesmo texto exato do servidor (ver ACCOUNT_OPENING_DESCRIPTION/ACCOUNT_CONSOLIDATION_
  // DESCRIPTION, Accounts.js) — a prévia precisa ficar IDÊNTICA à linha real que vai
  // substituí-la, senão o texto muda visivelmente na troca (mesmo motivo de counterparty
  // separado de description em applyOptimisticEntry).
  var ACCOUNT_OPENING_DESCRIPTION_ = 'Início da conta - Saldo inicial';
  var ACCOUNT_CONSOLIDATION_DESCRIPTION_ = 'Consolidação de saldo (edição manual da conta)';

  /**
   * Prévia otimista SÓ pro Extrato — usada pelos dois lançamentos que o próprio sistema
   * cria pra explicar mudança de saldo de conta (ver appendBalanceTransaction_/
   * Accounts.js): "Início da conta - Saldo inicial" e "Consolidação de saldo". Não usa
   * applyOptimisticEntry porque essa também ajusta STATE.dashboard (saldo da conta e
   * "Últimos lançamentos" via STATE.dashboard.accounts) — numa CRIAÇÃO de conta ela ainda
   * nem existe lá, e o efeito no saldo já é feito à parte (acc.balance, direto em
   * STATE.accounts, por quem chama). editable:false: não tem sentido abrir edição numa
   * prévia de lançamento que o sistema cria sozinho.
   */
  function applyBalanceTxPreview_(accountId, kind, amount, description) {
    var tempId = 'tmp-' + Math.random().toString(36).slice(2);
    STATE.pendingTransactions.push({
      id: tempId, date: todayYmd(), time: nowHm(), accountId: accountId, categoryId: null,
      kind: kind, amount: amount, description: description, counterparty: null,
      billMonth: null, installmentSeq: null, installmentTotal: null, transferGroupId: null,
      forecastId: null, pending: true, editable: false
    });
    return tempId;
  }

  /** Troca a prévia de applyBalanceTxPreview_ pelo dado real, ou a descarta se o servidor
   *  não tiver criado lançamento nenhum (não deveria acontecer — diffCents/openingBalance
   *  já foi checado antes de criar a prévia — mas evita uma prévia órfã presa na tela). */
  function resolveBalanceTxPreview_(tempId, transactionRow) {
    if (!tempId) return;
    if (transactionRow) resolveCreatedTransactions_([tempId], [transactionRow]);
    else STATE.pendingTransactions = STATE.pendingTransactions.filter(function (t) { return t.id !== tempId; });
  }

  /**
   * Registra a criação de um lançamento em pendingCreations_ pra que resolveRealId_
   * consiga esperar por ela: a prévia otimista do Extrato já é clicável (ver editable em
   * applyOptimisticEntry), então o usuário pode abrir a edição e clicar em Salvar/Remover
   * ANTES do servidor responder o create. Sem isso, o ID temporário ia como está e o
   * servidor respondia "Lançamento não encontrado".
   *
   * Resolve pro ID real via resolvedTempIds_, preenchido por resolveCreatedTransactions_
   * dentro da própria cadeia de `promise` — então quando essa linha roda o de-para já existe.
   */
  function registerTxCreation_(tempId, promise) {
    pendingCreations_[tempId] = promise.then(function () {
      return resolvedTempIds_[tempId] || tempId;
    });
    promise.catch(function () {}).then(function () { delete pendingCreations_[tempId]; });
  }

  // ---------- bootstrap ----------
  /**
   * Contas/categorias/orçamentos/previsões entram em STATE com um ID temporário
   * ("tmp-...") assim que criados, otimisticamente, e só trocam pro ID real quando o
   * próprio create confirma (ver os vários afterMutation_(run('create...'))). Criar
   * dois rápido gera uma corrida: o refresh disparado pela PRIMEIRA criação pode ter
   * sido buscado do servidor ANTES da segunda existir lá — sobrescrever STATE.xxx
   * direto com esse resultado faria a segunda sumir da tela até o refresh DELA
   * terminar. Preservando aqui qualquer item ainda com ID temporário (reanexando ele
   * de volta à lista fresca), nenhuma criação em voo desaparece nesse meio-tempo.
   */
  function preserveOptimisticTempEntries_(current, fresh) {
    var pending = (current || []).filter(function (item) { return String(item.id).indexOf('tmp-') === 0; });
    return (fresh || []).concat(pending);
  }

  /**
   * Protege um item recém-EDITADO (id real, não "tmp-") de ser revertido por um refresh
   * coalescido cuja leitura ainda não viu a edição — mesma classe de atraso do Sheets já
   * resolvida pra criação de lançamento (ver resolveCreatedTransactions_): um
   * updateRowById_ pode levar um instante pra aparecer numa leitura SEPARADA, e sem isso,
   * editar vários itens do mesmo tipo em sequência rápida fazia algumas edições
   * reverterem por alguns segundos até uma leitura mais tardia finalmente alcançar (a
   * 1ª edição sozinha nunca mostrava isso — só a leitura ISOLADA dela já tinha tempo de
   * se assentar; a partir da 2ª/3ª em sequência, o refresh compartilhado dispara rápido
   * demais pra TODAS terem se assentado ainda).
   *
   * pendingEdits: objeto { [id]: {campo: valorEsperado, ...} }, mutado in-place — uma
   * entrada some sozinha assim que o dado fresco já bater com o valor esperado (edição
   * definitivamente visível pra leitura), nunca fica presa pra sempre.
   */
  function reapplyPendingEdits_(freshList, pendingEdits) {
    return freshList.map(function (item) {
      var pending = pendingEdits[item.id];
      if (!pending) return item;
      var matches = Object.keys(pending).every(function (k) { return item[k] === pending[k]; });
      if (matches) { delete pendingEdits[item.id]; return item; }
      return Object.assign({}, item, pending);
    });
  }

  /**
   * IDs de PendingEntries removidos otimisticamente (confirmados/descartados, ver
   * openPendingReviewModal) cuja mutação ainda não terminou. Necessário porque, ao
   * contrário de accounts/categories/budgets/forecasts/plans, o catch de várias
   * mutações chama refreshAll() DIRETO (não passa por afterMutation_/inFlightMutations_),
   * então um refresh disparado por uma falha TOTALMENTE não relacionada pode chegar
   * enquanto essa confirmação/descarte ainda está em voo — sem isso, applyBootstrapData
   * reintroduzia a pendência de volta na lista (o dado fresco do servidor ainda a
   * inclui, já que a mutação de verdade não terminou) até a mutação em voo finalmente
   * responder e corrigir nesse meio-tempo, um "pisca e some" visível.
   */
  var pendingEntryRemovals_ = {};

  /** Chave de identidade de um descarte de sugestão de orçamento — upsert por categoryId
   *  pra sugestão de orçamento NOVO (ver dismissBudgetSuggestion, Budgets.js), upsert por
   *  budgetId pras sugestões de TROCA DE MODO (ver dismissBudgetModeSwitchSuggestion,
   *  Budgets.js/budgetModeSwitchSuggestion_) -- um orçamento pode cobrir várias
   *  categorias, categoryId sozinho não seria uma chave única nesse caso. */
  function dismissalKey_(d) {
    return d.type + ':' + (d.type === 'new' ? d.categoryId : d.budgetId);
  }
  /**
   * Mesma ideia de preserveOptimisticTempEntries_, mas pra descartes de sugestão de
   * orçamento (STATE.budgetSuggestionDismissals) — essas entradas não têm ID (são upsert
   * por chave, ver dismissalKey_ acima), então não dá pra usar a checagem de "tmp-"
   * acima. A chave de "ainda não confirmado pelo servidor" aqui é a própria
   * dismissalKey_: qualquer descarte local cuja chave o servidor ainda não devolveu fica
   * mantido — se a mutação falhar, quem chamou já remove essa entrada no catch de
   * sempre; se um descarte MAIS ANTIGO expirou de vez (>30 dias, purgado sozinho em
   * listBudgetSuggestionDismissals), ele simplesmente não está em `current` pra começo
   * de conversa, então não some por engano aqui.
   */
  function preserveOptimisticDismissals_(current, fresh) {
    var freshKeys = {};
    (fresh || []).forEach(function (d) { freshKeys[dismissalKey_(d)] = true; });
    var stillPendingLocal = (current || []).filter(function (d) { return !freshKeys[dismissalKey_(d)]; });
    return (fresh || []).concat(stillPendingLocal);
  }

  /** Mesma ideia de preserveOptimisticDismissals_ (chave própria, sem ID -- upsert por
   *  ForecastID+CycleStart), pros ciclos "ignorados" da linha de bolinhas de um
   *  recorrente (ver ignoreForecastCycleClient_/unignoreForecastCycleClient_). */
  function forecastCycleIgnoreKey_(x) { return x.forecastId + ':' + x.cycleStart; }
  function preserveOptimisticForecastCycleIgnores_(current, fresh) {
    var freshKeys = {};
    (fresh || []).forEach(function (x) { freshKeys[forecastCycleIgnoreKey_(x)] = true; });
    var stillPendingLocal = (current || []).filter(function (x) { return !freshKeys[forecastCycleIgnoreKey_(x)]; });
    return (fresh || []).concat(stillPendingLocal);
  }
  /** Mesma ideia, pro descarte da "Sugestão: R$X Aplicar" de um Lançamento recorrente
   *  (ver dismissForecastSuggestionClient_/forecastRowHtml) -- chave própria, sem ID,
   *  upsert por ForecastID só (não tem CycleStart aqui, é 1 descarte por previsão). */
  function preserveOptimisticForecastSuggestionDismissals_(current, fresh) {
    var freshKeys = {};
    (fresh || []).forEach(function (x) { freshKeys[x.forecastId] = true; });
    var stillPendingLocal = (current || []).filter(function (x) { return !freshKeys[x.forecastId]; });
    return (fresh || []).concat(stillPendingLocal);
  }

  // Um por tipo de item editável — ver reapplyPendingEdits_. Vazio a maior parte do
  // tempo (só ganha uma entrada entre uma edição confirmar no servidor e uma leitura
  // finalmente enxergá-la).
  var pendingAccountEdits_ = {};
  var pendingCategoryEdits_ = {};
  var pendingForecastEdits_ = {};
  var pendingBudgetEdits_ = {};
  var pendingPlanEdits_ = {};
  var pendingPersonEdits_ = {};
  // Idem, pra flag "Não considerar em análises?" de lançamentos editados (só ela -- os
  // outros campos de um lançamento passam por normalização no servidor, e uma entrada cujo
  // valor esperado nunca bate com o lido ficaria presa pra sempre; a flag é um booleano).
  var pendingTxEdits_ = {};

  /**
   * IDs de contas arquivadas otimisticamente cuja mutação ainda não apareceu numa leitura
   * do servidor. Sem isso, um refresh que já estava a caminho (ou lido antes do
   * archiveAccount assentar) trazia a conta de volta ao card "Contas" do Início e à lista
   * por alguns segundos. A entrada some sozinha assim que uma leitura já não traz a conta
   * (arquivamento definitivamente visível) ou quando a mutação falha (rollback).
   */
  var pendingAccountArchives_ = {};

  /** Aplica pendingArchives em data (mutando in-place, é o retorno fresco do servidor):
   *  tira as contas pendentes de data.accounts, do card do Início (dashboard.accounts +
   *  faturas) e subtrai o saldo delas de dashboard.totalBalance -- o servidor também só
   *  soma contas não arquivadas, então o total acompanha o card em vez de divergir dele. */
  function guardPendingAccountArchives_(data, pendingArchives) {
    var ids = Object.keys(pendingArchives);
    if (!ids.length) return data;
    var freshIds = {};
    (data.accounts || []).forEach(function (a) { freshIds[a.id] = true; });
    var dash = data.dashboard;
    if (dash && dash.accounts) {
      dash.accounts = dash.accounts.filter(function (a) {
        if (!pendingArchives[a.id]) return true;
        dash.totalBalance -= a.balance;
        return false;
      });
      dash.creditCardSummaries = (dash.creditCardSummaries || []).filter(function (c) { return !pendingArchives[c.accountId]; });
    }
    data.accounts = (data.accounts || []).filter(function (a) { return !pendingArchives[a.id]; });
    ids.forEach(function (id) { if (!freshIds[id]) delete pendingArchives[id]; });
    return data;
  }

  /** Tira a conta do card do Início na hora (conta + faturas + saldo total). Devolve o
   *  que precisa pro rollback (restoreAccountToDashboard_), ou null se não estava lá. */
  function removeAccountFromDashboard_(dash, id) {
    if (!dash || !dash.accounts) return null;
    var accIdx = dash.accounts.findIndex(function (a) { return a.id === id; });
    if (accIdx === -1) return null;
    var acc = dash.accounts.splice(accIdx, 1)[0];
    dash.totalBalance -= acc.balance;
    var snap = { acc: acc, accIdx: accIdx, cc: null, ccIdx: -1 };
    if (dash.creditCardSummaries) {
      snap.ccIdx = dash.creditCardSummaries.findIndex(function (c) { return c.accountId === id; });
      if (snap.ccIdx !== -1) snap.cc = dash.creditCardSummaries.splice(snap.ccIdx, 1)[0];
    }
    return snap;
  }
  function restoreAccountToDashboard_(dash, snap) {
    if (!dash || !snap) return;
    dash.accounts.splice(snap.accIdx, 0, snap.acc);
    dash.totalBalance += snap.acc.balance;
    if (snap.cc) dash.creditCardSummaries.splice(snap.ccIdx, 0, snap.cc);
  }

  function applyBootstrapData(data) {
    guardPendingAccountArchives_(data, pendingAccountArchives_);
    // Uma seção que falhou no servidor volta VAZIA (getBootstrapData engole por seção pra
    // uma falha não derrubar as outras). Avisar é essencial: quando a leitura de
    // lançamentos falha, os saldos passam a mostrar só o saldo inicial e o extrato fica
    // vazio — sem aviso, isso parece perda de dado em vez de uma leitura que deu erro.
    if (data.errors && data.errors.length) {
      showToast('Falha ao carregar: ' + data.errors.join(' · '), true);
    }
    STATE.accounts = reapplyPendingEdits_(preserveOptimisticTempEntries_(STATE.accounts, data.accounts), pendingAccountEdits_);
    STATE.categories = reapplyPendingEdits_(preserveOptimisticTempEntries_(STATE.categories, data.categories), pendingCategoryEdits_);
    STATE.dashboard = data.dashboard;
    STATE.budgetViewPreference = data.budgetViewPreference === 'current' ? 'current' : 'rolling'; // mostrado em Configurações
    // Filtro de abertura do card de Orçamentos: só na PRIMEIRA carga -- os refreshes que
    // vêm depois de cada mutação não podem desfazer o que o usuário escolheu no dropdown
    // desde então (ver budgetViewPeriodFromPreference_).
    if (!STATE.bootstrapped) {
      STATE.budgetViewPeriod = budgetViewPeriodFromPreference_(data.budgetViewPreference, data.dashboard && data.dashboard.month);
    }
    STATE.usage = data.usage || { accounts: {}, categories: {} };

    var freshTransactions = reapplyPendingEdits_(data.transactions || [], pendingTxEdits_);
    var freshTxIds = {};
    freshTransactions.forEach(function (t) { freshTxIds[t.id] = true; });
    // Um lançamento recém-criado (ver resolveCreatedTransactions_) que essa leitura ainda
    // não enxerga (mas que não está sendo removido agora mesmo, ver deletingIds abaixo)
    // é reanexado a partir do que já estava em STATE — sem isso, uma leitura atrasada
    // apagaria de volta um lançamento que já tinha aparecido certo pro usuário.
    Object.keys(recentlyCreatedTxIds_).forEach(function (id) {
      if (freshTxIds[id]) { delete recentlyCreatedTxIds_[id]; return; }
      if (STATE.deletingIds.indexOf(id) !== -1) return;
      var stillMissing = STATE.allTransactions.find(function (t) { return t.id === id; });
      if (stillMissing) freshTransactions.push(stillMissing);
    });
    STATE.allTransactions = freshTransactions;
    // Qualquer prévia otimista de lançamento (ver applyOptimisticEntry) fica obsoleta
    // assim que allTransactions é atualizado de verdade — o real já chegou (ou, se a
    // criação falhou, quem chamou já limpou a sua própria entrada no catch). Limpar
    // AQUI (não logo que a mutação responde) é o que faz confirmar várias pendências
    // em sequência não pisar na prévia uma da outra: afterMutation_ só dispara esse
    // refresh quando a ÚLTIMA mutação em voo termina, então até lá as prévias de TODAS
    // continuam visíveis sem buraco, em vez de sumir e reaparecer.
    STATE.pendingTransactions = [];
    // Mesmo raciocínio: um lançamento marcado pra remover (ver
    // removeTransactionOptimistically_) só some da tela pra valer quando allTransactions
    // (linha acima) já não tiver mais ele — até lá, removê-lo cedo demais de
    // deletingIds fazia o lançamento reaparecer por alguns segundos ao remover 2 em
    // sequência rápida.
    STATE.deletingIds = [];
    STATE.pendingEntries = sortPendingEntries_((data.pendingEntries || []).filter(function (p) { return !pendingEntryRemovals_[p.id]; }));
    STATE.forecasts = reapplyPendingEdits_(preserveOptimisticTempEntries_(STATE.forecasts, data.forecasts || []), pendingForecastEdits_);
    STATE.budgets = reapplyPendingEdits_(preserveOptimisticTempEntries_(STATE.budgets, data.budgets || []), pendingBudgetEdits_);
    STATE.counterpartyMappings = data.counterpartyMappings || [];
    STATE.counterpartyAliases = data.counterpartyAliases || [];
    STATE.budgetSuggestionDismissals = preserveOptimisticDismissals_(STATE.budgetSuggestionDismissals, data.budgetSuggestionDismissals);
    STATE.forecastCycleIgnores = preserveOptimisticForecastCycleIgnores_(STATE.forecastCycleIgnores, data.forecastCycleIgnores);
    STATE.forecastSuggestionDismissals = preserveOptimisticForecastSuggestionDismissals_(STATE.forecastSuggestionDismissals, data.forecastSuggestionDismissals);
    // Enquanto uma gravação da meta está em voo (ver saveBalanceGoalClient_), o valor
    // local otimista vence o do servidor -- um refresh que já estava a caminho antes da
    // gravação terminar devolveria o valor ANTIGO e faria a linha piscar de volta.
    STATE.balanceGoal = pendingBalanceGoal_ ? pendingBalanceGoal_.value : (data.balanceGoal || null);
    STATE.plans = reapplyPendingEdits_(preserveOptimisticTempEntries_(STATE.plans, data.plans || []), pendingPlanEdits_);
    STATE.people = reapplyPendingEdits_(preserveOptimisticTempEntries_(STATE.people, data.people || []), pendingPersonEdits_);
    STATE.refundShares = preserveOptimisticTempEntries_(STATE.refundShares, data.refundShares || []);
    STATE.refundLinks = preserveOptimisticTempEntries_(STATE.refundLinks, data.refundLinks || []);
  }

  // getBootstrapData é uma única chamada ao servidor — não dá pra saber em qual "etapa"
  // ela está no meio do caminho (google.script.run não tem como reportar progresso
  // parcial de uma chamada em andamento). O que dá pra mostrar honestamente é que o
  // app está vivo e há quanto tempo está esperando, pra distinguir "ainda carregando"
  // de "travou" — ver o uso de bootstrapStartedAt_ em renderDashboard.
  var bootstrapStartedAt_ = null;
  var bootstrapTicker_ = null;
  function bootstrap() {
    bootstrapStartedAt_ = Date.now();
    bootstrapTicker_ = setInterval(function () { if (!STATE.bootstrapped) render(); }, 1000);
    run('getBootstrapData').then(function (data) {
      clearInterval(bootstrapTicker_);
      applyBootstrapData(data);
      STATE.bootstrapped = true;
      render();
    }).catch(function (err) {
      clearInterval(bootstrapTicker_);
      STATE.bootstrapped = true;
      showToast('Erro ao carregar: ' + err.message, true);
      render();
    });
  }

  /**
   * getBootstrapData é chamado toda vez que uma mutação termina (ver afterMutation_
   * abaixo), e nada garante que essas chamadas voltem na mesma ordem em que foram
   * disparadas — o servidor lê a planilha na hora que CADA execução roda de verdade,
   * e duas execuções concorrentes podem responder fora de ordem (a mais rápida volta
   * primeiro mesmo tendo sido disparada depois). Sem proteção, uma resposta ANTIGA
   * (que tirou seu retrato da planilha antes de uma criação/exclusão mais recente)
   * podia chegar DEPOIS de uma resposta mais nova e sobrescrever STATE com dado
   * desatualizado — ex: criar duas contas rápido e uma sumir de novo, ou confirmar a
   * última pendência da fila e ela continuar aparecendo. refreshSeq_/latestAppliedRefreshSeq_
   * numeram cada chamada na ordem em que são DISPARADAS e descartam qualquer resposta
   * que chegue depois de uma mais nova já ter sido aplicada.
   */
  var refreshSeq_ = 0;
  var latestAppliedRefreshSeq_ = 0;
  function refreshAll() {
    var seq = ++refreshSeq_;
    return run('getBootstrapData').then(function (data) {
      if (seq <= latestAppliedRefreshSeq_) return; // uma resposta mais nova já foi aplicada; esta está obsoleta
      // O servidor devolve null quando o retorno não é serializável (ex: um Date perdido).
      // Mensagem clara em vez de um TypeError ao ler data.errors.
      if (!data) throw new Error('o servidor devolveu uma resposta vazia ao recarregar os dados.');
      latestAppliedRefreshSeq_ = seq;
      applyBootstrapData(data);
    });
  }

  /**
   * Substitui o padrão run(...).then(refreshAll).then(render) depois de uma mutação
   * otimista. Sem isso, arquivar/remover vários itens rápido faz cada um disparar seu
   * próprio refreshAll — o primeiro a terminar busca o servidor ANTES do segundo ter
   * sido salvo, fazendo o item recém-removido reaparecer por um instante (só pra sumir
   * de novo quando o segundo terminar). Aqui só a ÚLTIMA mutação ainda em voo dispara
   * o refreshAll+render de verdade; a essa altura todas as outras já terminaram no
   * servidor. Em erro, não atualiza nada — quem chamou faz o próprio rollback local.
   */
  var inFlightMutations_ = 0;
  function afterMutation_(mutationPromise) {
    inFlightMutations_++;
    return mutationPromise.then(function (result) {
      inFlightMutations_--;
      if (inFlightMutations_ === 0) return refreshAll().then(render).then(function () { return result; });
      return result;
    }, function (err) {
      inFlightMutations_--;
      throw err;
    });
  }

  /**
   * Contas/categorias entram em STATE com um ID temporário ("tmp-...") assim que
   * criadas, e só ganham o ID de verdade quando o próprio create confirma no servidor
   * (ver os vários afterMutation_(run('create...')) que fazem esse swap). Se o usuário
   * usar essa conta/categoria recém-criada como referência em OUTRA coisa (ex: uma
   * subcategoria cujo pai acabou de ser criado, ou um lançamento na conta que acabou de
   * criar) antes desse swap acontecer, mandar o ID temporário pro servidor sempre falha
   * com "não encontrada" — o servidor nunca ouviu falar desse ID.
   *
   * pendingCreations_ guarda, por ID temporário, a promise que resolve pro ID real;
   * resolveRealId_ deixa qualquer submit esperar por ela em vez de mandar o temporário
   * direto. Na prática isso é invisível (a criação original é rápida), mas evita o erro
   * de vez em vez de só torcer pra ninguém ser rápido demais.
   *
   * resolvedTempIds_ guarda o mapeamento tmp->real PRA SEMPRE (nunca é limpo — o custo
   * de memória de acumular algumas dezenas/centenas de strings numa sessão é irrelevante).
   * É necessário porque cada `afterMutation_(criação).catch(...).finally(() =>
   * delete pendingCreations_[tempId])` só limpa pendingCreations_ quando a PRÓPRIA
   * cadeia de afterMutation_ termina — e se outra mutação ainda estiver em voo ao mesmo
   * tempo, afterMutation_ não dispara o refreshAll compartilhado (só a ÚLTIMA mutação em
   * voo dispara), então esse .finally roda e apaga pendingCreations_[tempId] ANTES da
   * tela ter sido re-renderizada com o ID de verdade. Se o usuário clicar
   * Editar/Remover nesse meio-tempo (o DOM ainda mostra o ID temporário antigo),
   * resolveRealId_ caía no fallback `Promise.resolve(id)` — devolvendo o PRÓPRIO ID
   * temporário (já inválido) em vez do real, e o servidor respondia "não encontrado".
   * Consultar resolvedTempIds_ primeiro resolve isso não importa quando for chamado.
   */
  var pendingCreations_ = {};
  var resolvedTempIds_ = {};
  /**
   * Troca o ID temporário de um item recém-criado pelo ID real assim que o servidor
   * confirma ESSA criação (sem esperar o refresh coalescido).
   *
   * O render() no fim não é cosmético: os botões das listas guardam o ID no próprio DOM
   * (data-row-conta/categoria/etc, data-archive, data-remove), montados quando o ID ainda
   * era "tmp-". Sem
   * redesenhar, o dataset aponta pra um ID que já não existe em STATE, o find() devolve
   * undefined e o clique em Editar/Arquivar simplesmente não faz NADA até o próximo
   * refresh — parecia que o app estava "esperando a planilha registrar".
   */
  function adoptRealId_(list, tempId, realId) {
    var item = list.find(function (x) { return x.id === tempId; });
    if (item) item.id = realId;
    resolvedTempIds_[tempId] = realId;
    render();
    return realId;
  }
  function resolveRealId_(id) {
    if (!id || String(id).indexOf('tmp-') !== 0) return Promise.resolve(id);
    if (resolvedTempIds_[id]) return Promise.resolve(resolvedTempIds_[id]);
    return pendingCreations_[id] || Promise.resolve(id);
  }

  /**
   * Acha a(s) instância(s) ATUAIS (em memória) de um lançamento, dado o id que o usuário
   * tinha na mão quando abriu a edição — que pode estar desatualizado se
   * resolveCreatedTransactions_ já trocou a prévia otimista pelo dado real ENQUANTO o
   * modal ficou aberto (a prévia é clicável desde o round passado, então essa corrida é
   * legítima: criar, abrir a edição na hora, demorar um pouco preenchendo o formulário, e
   * só então salvar). Sem isso, applyOptimisticTxEdit_ mexia num objeto ÓRFÃO — a prévia
   * antiga, já removida de STATE — e a edição só aparecia no Extrato depois do refresh
   * coalescido (alguns segundos depois, não instantâneo, era o bug reportado).
   */
  function liveTxTargets_(id) {
    var liveId = resolvedTempIds_[id] || id;
    return [
      STATE.pendingTransactions.find(function (x) { return x.id === liveId; }),
      STATE.allTransactions.find(function (x) { return x.id === liveId; }),
      (STATE.dashboard && STATE.dashboard.recentTransactions) ?
        STATE.dashboard.recentTransactions.find(function (x) { return x.id === liveId; }) : null
    ].filter(Boolean);
  }
  function resolveRealIds_(obj, keys) {
    return Promise.all(keys.map(function (k) { return resolveRealId_(obj[k]); })).then(function (resolved) {
      var out = Object.assign({}, obj);
      keys.forEach(function (k, i) { out[k] = resolved[i]; });
      return out;
    });
  }

  // render() reconstrói #view-root inteiro toda vez — sem isso, o scroll da página cai
  // pra onde a nova altura permitir (ex: editar/remover um lançamento no Extrato disparava
  // vários renders seguidos e a página voltava pro topo no meio da rolagem). Só preserva
  // quando é um RE-render da MESMA aba (uma mutação); trocar de aba deve mesmo voltar ao
  // topo do conteúdo novo.
  var lastRenderedView_ = null;
  var scrollPositions_ = {};
  function render() {
    var sameView = STATE.currentView === lastRenderedView_;
    if (!sameView) resetFloatingUi_(); // aba mudando de verdade -- não em re-render da mesma aba (deixaria um dropdown em uso fechar sozinho)
    var scrollX = window.scrollX, scrollY = window.scrollY;
    if (!sameView && lastRenderedView_ !== null) {
      scrollPositions_[lastRenderedView_] = { x: scrollX, y: scrollY };
    }
    lastRenderedView_ = STATE.currentView;

    syncTabbar_(STATE.currentView);
    if (STATE.currentView === 'dashboard') renderDashboard();
    else if (STATE.currentView === 'transactions') renderTransactions();
    else if (STATE.currentView === 'accounts') renderAccounts();
    else if (STATE.currentView === 'categories') renderCategories();
    else if (STATE.currentView === 'budgets') renderBudgets();
    else if (STATE.currentView === 'refunds') renderRefunds();

    if (sameView) {
      window.scrollTo(scrollX, scrollY);
    } else {
      var restorePos = scrollPositions_[STATE.currentView] || { x: 0, y: 0 };
      window.scrollTo(restorePos.x, restorePos.y);
    }
    updateScrollToTopVisibility_();
    updateReviewButton_();
  }

  // ---------- botão "voltar ao topo" (só no Extrato, por ora) ----------
  /**
   * Aparece quando a página está rolada pelo menos 1 tela de distância do topo — só
   * reavaliar num evento de scroll não bastaria: trocar de aba não dispara "scroll"
   * nenhum mesmo que a posição na tela mude de sentido (Extrato rolado -> Início), por
   * isso render() (chamado em toda troca de aba) também chama isso.
   */
  function updateScrollToTopVisibility_() {
    var btn = document.getElementById('scroll-to-top-btn');
    if (!btn) return;
    var shouldShow = STATE.currentView === 'transactions' && window.scrollY >= window.innerHeight;
    btn.style.opacity = shouldShow ? '1' : '0';
    btn.style.pointerEvents = shouldShow ? 'auto' : 'none';
  }
  function setupScrollToTopButton_() {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.id = 'scroll-to-top-btn';
    btn.title = 'Voltar ao topo';
    btn.textContent = '↑';
    btn.style.cssText = 'position:fixed;bottom:calc(var(--dock-bottom) + 70px);width:44px;height:44px;border-radius:50%;' +
      'font-size:20px;line-height:1;box-shadow:0 4px 10px rgba(0,0,0,0.25);opacity:0;pointer-events:none;' +
      'transition:opacity .15s ease;z-index:40';
    document.body.appendChild(btn);
    btn.onclick = function () { window.scrollTo({ top: 0, behavior: 'smooth' }); };

  // ---------- dashboard ----------
  function renderDashboard() {
    var d = STATE.dashboard;
