  // ---------- caixa de pendências (MacroDroid) ----------
  /** Revisão uma pendência de cada vez; ao terminar todas, sincroniza tudo. */
  var pendingReviewSortOrder = 'asc'; // padrão: mais antigas primeiro

  /** O servidor sempre manda mais recente primeiro; inverte aqui se o padrão for 'asc'. */
  function sortPendingEntries_(entries) {
    var sorted = entries.slice();
    return pendingReviewSortOrder === 'asc' ? sorted.reverse() : sorted;
  }

  /**
   * queue: lista ESTÁVEL de IDs decidida no início da sessão de revisão (default: a
   * ordem atual de STATE.pendingEntries). Precisa ser estável porque um refresh
   * (afterMutation_) pode chegar NO MEIO da revisão e reatribuir STATE.pendingEntries
   * pra um array novo (applyBootstrapData) — indexar direto nesse array a cada chamada
   * fazia o "próximo" às vezes repetir a MESMA pendência que acabou de ser confirmada/
   * descartada (o splice local mexia num array já trocado, sem efeito no de verdade),
   * e confirmar de novo dava "Pendência não encontrada". Andar por ID na fila fixa,
   * pulando qualquer ID que já não exista mais, é imune a isso.
   */
  /**
   * Índice da pendência a mostrar a partir de `index`: a primeira que ainda existe daí
   * pra frente; se não sobrou nenhuma à frente (acabou de confirmar/descartar a ÚLTIMA),
   * volta pra mais próxima ANTERIOR que ainda existe. -1 só quando a fila esvaziou de verdade.
   */
  function resolvePendingReviewIndex_(queue, index, existsFn) {
    for (var i = index; i < queue.length; i++) {
      if (existsFn(queue[i])) return i;
    }
    for (var j = Math.min(index, queue.length) - 1; j >= 0; j--) {
      if (existsFn(queue[j])) return j;
    }
    return -1;
  }

  function openPendingReviewModal(index, queue) {
    if (!queue) queue = STATE.pendingEntries.map(function (e) { return e.id; });
    index = resolvePendingReviewIndex_(queue, index, function (id) {
      return STATE.pendingEntries.some(function (e) { return e.id === id; });
    });
    if (index === -1) {
      // Não precisa disparar refreshAll aqui: cada confirmar/descartar já chama
      // afterMutation_, que sozinho garante um refresh+render assim que ESSA mutação
      // (a única, ou a última de várias em voo) terminar no servidor.
      closeModal();
      return;
    }
    var entries = STATE.pendingEntries;
    var p = entries.find(function (e) { return e.id === queue[index]; });
    var kind = p.suggestedKind === 'income' ? 'income' : (p.suggestedKind === 'transfer' ? 'transfer' : 'expense');
    // Mesma ideia de stagedRefundShares/stagedRefundLinks do Novo lançamento (FAB) — a
    // pendência ainda não é um lançamento de verdade, então isso fica local até
    // confirmPendingEntry criar o lançamento e o setRefundSharesForPassiveTransaction/
    // setRefundLinksForActiveTransaction encadeado (ver o "Confirmar" mais abaixo) rodar
    // de verdade.
    var stagedRefundShares = [];
    var stagedRefundLinks = [];
    // Ver renderForecastToggleButton_/renderRememberCategoryButton_ (compartilhadas com
    // Novo lançamento e Editar lançamento). rememberCategoryForCounterparty começa
    // ligado quando a categoria já veio sugerida por uma associação existente (mesma
    // regra do antigo checkbox) -- ver reset ao trocar de tipo mais abaixo.
    var selectedForecastId = '';
    var rememberCategoryForCounterparty = !!p.suggestedCategoryId;
    // "Não considerar em análises?" -- ver renderOutlierToggleButton_/isLikelyOutlier_.
    // Sempre começa desligado (é um lançamento NOVO sendo confirmado) -- a checagem
    // reativa liga sozinho quando o valor parecer fora da curva pra essa categoria.
    var outlierFlagged = false;
    // "Lembrar nome?" -- substitui o antigo checkbox "Lembrar 'X' como Y" (ver
    // renderRememberEstablishmentButton_). Começa ligado quando já existe uma
    // associação em efeito pra esse texto cru (mesma regra do checkbox antigo).
    var rememberEstablishment = !!p.establishmentName;
    // Rastreia se "Pago a"/"Recebido de" diverge do texto cru sugerido -- usado só pra
    // detectar a TRANSIÇÃO de "igual" pra "diferente" no listener de input (ver
    // renderCounterpartyField), não recalculado a cada tecla igual ao de dentro de
    // renderRememberEstablishmentButton_ (senão um "desligar manual" nunca pegaria: a
    // próxima letra digitada religaria sozinho). Inicializado com a MESMA comparação
    // (contra o valor JÁ PREENCHIDO, que pode vir de establishmentName -- ver
    // renderCounterpartyField), não sempre false.
    var counterpartyDiverged_ = (function () {
      var raw = (p.counterparty || p.text || '').trim();
      var current = (p.establishmentName || p.counterparty || p.text || '').trim();
      return !!current && !!raw && current.toLowerCase() !== raw.toLowerCase();
    })();

    var sortLabel = pendingReviewSortOrder === 'desc' ? 'Mais recentes primeiro' : 'Mais antigas primeiro';
    var duplicateWarning = p.isDuplicate

      : '';

    openModal(
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap">' +
        '<h2 style="margin:0">Lançamentos a confirmar (' + (index + 1) + '/' + queue.length + ')</h2>' +
        '<div style="display:flex;gap:8px">' +
          '<button type="button" class="secondary" id="p-queue-toggle" style="padding:4px 10px;font-size:12px">Fila para confirmar</button>' +
          '<button type="button" class="secondary" id="p-sort-toggle" style="padding:4px 10px;font-size:12px">' + sortLabel + '</button>' +
        '</div>' +
      '</div>' +
      duplicateWarning +
      '<div class="muted" style="margin-bottom:12px">' + escapeHtml(p.app) +
        (p.title ? ' · ' + escapeHtml(p.title) : '') + '<br>' + escapeHtml(p.text) + '</div>' +
      '<div class="kind-toggle" id="p-kind-toggle">' +
        '<button type="button" data-k="expense">Despesa</button>' +
        '<button type="button" data-k="income">Receita</button>' +
        '<button type="button" data-k="transfer">Transferência</button>' +
      '</div>' +
      '<div class="field" style="display:flex;gap:8px">' +
        '<div style="flex:1"><label>Data</label><input type="date" id="p-date" value="' + p.date + '"></div>' +
        '<div style="flex:1"><label>Horário</label><input type="time" id="p-time" value="' + p.time + '"></div>' +
      '</div>' +
      '<div id="p-fields"></div>' +
      '<div class="field" style="display:flex;gap:8px">' +
        '<div style="flex:1">' +
          '<div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:2px 8px">' +
            '<label style="margin-bottom:0">Valor</label>' +
            // Um span-invólucro só (.field-action-group, ver Stylesheet.html), não três
            // filhos flex separados do container de fora: kind alterna qual dos dois de
            // reembolso fica de fato preenchido (o outro sempre "" — ver
            // renderRefundButtonP_/renderRefundLinkButtonP_), e um span VAZIO ainda
            // ocuparia espaço-de-item no space-between de fora, descentralizando o texto do
            // lado direito. O grupo separa "Reembolso?"/"Vincular reembolso?" do "Não

    );
    // openModal foca o 1º input/select/textarea do modal por padrão (Data, aqui) -- pedido
    // explícito do usuário pra essa tela em especial é focar "Referente a" (p-counterparty)

    setTimeout(function () {

    setupMoneyInput(document.getElementById('p-amount'), p.suggestedAmount || 0);

    var accountField, categoryField, fromField, toField;
    var categoryTouchedByUser = false;
    function updateInstallmentsField() {

    function renderRememberEstablishmentButton_() {

    function renderCounterpartyField() {

        // establishmentName vem na frente: se já existe uma associação "Comerciald" ->
        // "Planeta Doce" (ver Inbox.js), o campo já nasce preenchido com o nome de

        var counterpartyValue = p.establishmentName || p.counterparty || p.text || '';
        field.innerHTML =
          '<div class="field" style="display:flex;gap:8px">' +

              '<div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:nowrap;gap:2px 8px">' +

            '<div style="flex:1;min-width:0">' +

              '<input id="p-desc" value="">' +
            '</div>' +
          '</div>';
        setupCounterpartySuggestions_(document.getElementById('p-counterparty'));
        renderRememberEstablishmentButton_();
        // Mesma sugestão em tempo real do Novo lançamento (contraparte exata primeiro,

        // enquanto ele não tiver escolhido a categoria manualmente.
        document.getElementById('p-counterparty').addEventListener('input', function () {
          // Autoativa "Lembrar nome?" na hora em que o texto passa a divergir do
          // sugerido (pedido explícito do usuário) -- só na TRANSIÇÃO pra divergente,
          // não a cada tecla enquanto já diverge (ver counterpartyDiverged_ acima), e
          // desativa de volta se o usuário reverter pro texto sugerido (senão o botão
          // ficaria ligado por baixo dos panos com o campo já escondido -- ver
          // renderRememberEstablishmentButton_, que esconde quando current === raw).
          var raw = (p.counterparty || p.text || '').trim();
          var nowDiverged = !!this.value.trim() && !!raw && this.value.trim().toLowerCase() !== raw.toLowerCase();
          if (nowDiverged !== counterpartyDiverged_) rememberEstablishment = nowDiverged;
          counterpartyDiverged_ = nowDiverged;
          renderRememberEstablishmentButton_();
          if (!categoryTouchedByUser) {
            var matchId = findCategoryIdForCounterpartyClient_(this.value) || findCategoryIdByKeywordClient_(this.value, kind);
            if (matchId && categoryField && matchId !== categoryField.getValue()) {
              categoryField.setValue(matchId);
              updateForecastFieldP();
            }
          }
          maybeSuggestForecastLinkP_();
        });
      }
    }
    function renderFields() {
      var container = document.getElementById('p-fields');
      var installmentsWrapper = document.getElementById('p-installments-wrapper');
      if (kind === 'transfer') {
        container.innerHTML =
          '<div class="field"><label>De</label><div id="p-from-field" class="capsule-field"></div></div>' +
          '<div class="field"><label>Para</label><div id="p-to-field" class="capsule-field"></div></div>' +
          '<div id="p-bill-field"></div>';
        installmentsWrapper.innerHTML = '';
        var accountItems = rankedAccountItems();
        fromField = createCapsuleField(document.getElementById('p-from-field'), {
          items: accountItems, selectedValue: p.suggestedAccountId || undefined
        });
        toField = createCapsuleField(document.getElementById('p-to-field'), {
          items: accountItems, selectedValue: p.suggestedToAccountId || undefined,
          onChange: updateBillFieldP
        });
        updateBillFieldP();
      } else {
        container.innerHTML =
          '<div class="field"><label>Conta</label><div id="p-account-field" class="capsule-field"></div></div>' +
          '<div class="field">' +
            '<div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:2px 8px">' +
              '<label style="margin-bottom:0">Categoria</label>' +
              '<span id="p-remember-cat-field"></span>' +
            '</div>' +
            '<div id="p-category-field" class="capsule-field"></div>' +
          '</div>';
        installmentsWrapper.innerHTML = '<label>Parcelas</label><input type="number" id="p-installments" min="1" value="' + (p.suggestedInstallments || 1) + '">';
        var accItems = kind === 'expense'
          ? rankedAccountItems(function (a) { return a.type !== 'investment'; })
          : rankedAccountItems(function (a) { return a.type !== 'credit_card' && a.type !== 'investment'; });
        accountField = createCapsuleField(document.getElementById('p-account-field'), {
          allowDeselect: true, items: accItems,
          selectedValue: p.suggestedAccountId || (accItems[0] ? accItems[0].value : undefined),
          onChange: updateInstallmentsField
        });
        categoryTouchedByUser = false;
        categoryField = createCapsuleField(document.getElementById('p-category-field'), {
          allowDeselect: true, collapseUnused: true, items: rankedCategoryItems(kind),
          selectedValue: p.suggestedCategoryId || null, // null explícito: sem sugestão, nada pré-selecionado (mesma regra do Novo lançamento)
          onChange: function (v) { categoryTouchedByUser = true; updateForecastFieldP(v); maybeSuggestOutlierP_(); maybeSuggestForecastLinkP_(); }
        });
        updateInstallmentsField();
        updateRememberCategoryP_();
        updateOutlierFieldP_();
        document.getElementById('p-amount').addEventListener('input', function () { maybeSuggestOutlierP_(); maybeSuggestForecastLinkP_(); });
      }
      renderCounterpartyField();
      updateForecastFieldP();
      renderRefundButtonP_();
      renderRefundLinkButtonP_();
    }
    // Ver renderForecastToggleButton_/renderRememberCategoryButton_ (compartilhadas com
    // Novo lançamento e Editar lançamento).
    function updateForecastFieldP() {
      renderForecastToggleButton_({
        fieldId: 'p-forecast-toggle-field', hiddenInputId: 'p-forecast',
        getKind: function () { return kind; },
        getCategoryId: function () { return categoryField ? categoryField.getValue() : null; },
        getSelected: function () { return selectedForecastId; },
        setSelected: function (v) { selectedForecastId = v; },
        setCategoryId: function (v) { if (categoryField) { categoryTouchedByUser = true; categoryField.setValue(v); } }
      });
    }
    function updateRememberCategoryP_() {
      renderRememberCategoryButton_({
        fieldId: 'p-remember-cat-field',
        getKind: function () { return kind; },
        getRemember: function () { return rememberCategoryForCounterparty; },
        setRemember: function (v) { rememberCategoryForCounterparty = v; }
      });
    }
    function updateOutlierFieldP_() {
      renderOutlierToggleButton_({
        fieldId: 'p-outlier-field',
        getKind: function () { return kind; },
        getFlag: function () { return outlierFlagged; },
        setFlag: function (v) { outlierFlagged = v; }
      });
    }
    /** Checagem reativa (ver isLikelyOutlier_/maybeSuggestOutlierT_, mesma ideia) --
     *  só liga sozinho, nunca desliga um toggle que o usuário já tenha mexido na mão. */
    function maybeSuggestOutlierP_() {
      if (kind === 'transfer' || outlierFlagged) return;
      var categoryId = categoryField ? categoryField.getValue() : null;
      if (isLikelyOutlier_(currentAmountP_(), categoryId, kind)) {
        outlierFlagged = true;
        updateOutlierFieldP_();
      }
    }
    /** Checagem reativa (mesma ideia de maybeSuggestForecastLinkT_/Novo lançamento) --
     *  trava no primeiro toque, nunca reavalia depois. */
    function maybeSuggestForecastLinkP_() {
      if (kind === 'transfer' || selectedForecastId) return;
      var categoryId = categoryField ? categoryField.getValue() : null;
      var counterpartyEl = document.getElementById('p-counterparty');
      var counterpartyText = counterpartyEl ? counterpartyEl.value : '';
      var candidates = forecastLinkCandidates_(kind, categoryId, selectedForecastId);
      var match = findForecastLinkSuggestion_(candidates, currentAmountP_(), counterpartyText);
      if (!match) return;
      selectedForecastId = defaultForecastSelection_(match);
      if (!categoryId && categoryField) {
        var chosen = candidates.find(function (f) { return f.id === match; });
        if (chosen) { categoryTouchedByUser = true; categoryField.setValue(chosen.categoryId); }
      }
      updateForecastFieldP();
    }
    /** Espelham renderRefundButton_/renderRefundLinkButton_ do Novo lançamento (FAB) —
     *  mesmos popups (openRefundSharesPopup_/openRefundLinkPopup_), só os ids dos
     *  campos que mudam (p-* em vez de t-*), já que a pendência ainda não é um
     *  lançamento de verdade. */
    function currentAmountP_() {
      var amountEl = document.getElementById('p-amount');
      return amountEl && amountEl.getValue ? amountEl.getValue() : 0;
    }
    function renderRefundButtonP_() {
      var field = document.getElementById('p-refund-field');
      if (!field) return;
      if (kind !== 'expense') { field.innerHTML = ''; return; }
      var label = stagedRefundShares.length
        ? 'Reembolso: ' + stagedRefundShares.length + (stagedRefundShares.length === 1 ? ' pessoa' : ' pessoas')
        : 'Reembolso?';
      field.innerHTML = '<span class="field-action-link" id="p-refund-btn">' + escapeHtml(label) + '</span>';
      document.getElementById('p-refund-btn').onclick = function () {
        openRefundSharesPopup_(currentAmountP_, stagedRefundShares, function (staged) {
          stagedRefundShares = staged;
          renderRefundButtonP_();
        });
      };
    }
    function renderRefundLinkButtonP_() {
      var field = document.getElementById('p-refundlink-field');
      if (!field) return;
      if (kind !== 'income') { field.innerHTML = ''; return; }
      var label = stagedRefundLinks.length
        ? 'Vincular: ' + stagedRefundLinks.length + (stagedRefundLinks.length === 1 ? ' despesa' : ' despesas')
        : 'Vincular reembolso?';
      field.innerHTML = '<span class="field-action-link" id="p-refundlink-btn">' + escapeHtml(label) + '</span>';
      document.getElementById('p-refundlink-btn').onclick = function () {
        openRefundLinkPopup_(currentAmountP_, stagedRefundLinks, function (allocations) {
          stagedRefundLinks = allocations;
          renderRefundLinkButtonP_();
        });
      };
    }
    document.querySelectorAll('#p-kind-toggle button').forEach(function (b) {
      if (b.dataset.k === kind) b.classList.add('active');
      b.onclick = function () {
        if (b.dataset.k !== 'expense') stagedRefundShares = [];
        if (b.dataset.k !== 'income') stagedRefundLinks = [];
        // Mesma regra de sempre resetar ao trocar de modalidade que o Novo lançamento
        // usa (ver setKind) -- a categoria em si também reseta pra p.suggestedCategoryId
        // de novo (ver createCapsuleField em renderFields), então o vínculo/lembrete
        // amarrados a ela também deveriam.
        selectedForecastId = '';
        rememberCategoryForCounterparty = !!p.suggestedCategoryId;
        rememberEstablishment = !!p.establishmentName;
        kind = b.dataset.k;
        document.querySelectorAll('#p-kind-toggle button').forEach(function (x) { x.classList.toggle('active', x === b); });
        renderFields();
      };
    });
    renderFields();

    document.getElementById('p-discard').onclick = function () {
      // Acha p PELO ID na hora, não confia num índice/array capturado antes — um
      // refresh pode ter trocado STATE.pendingEntries por um array novo enquanto o
      // modal estava aberto (ver comentário grande no topo da função).
      var liveIdx = STATE.pendingEntries.findIndex(function (e) { return e.id === p.id; });
      var removedPending = liveIdx !== -1 ? STATE.pendingEntries.splice(liveIdx, 1)[0] : null;
      pendingEntryRemovals_[p.id] = true; // ver comentário grande em pendingEntryRemovals_
      render(); // mantém a linha do tempo de orçamento (por trás do modal) sempre com a data da pendência mais antiga atual
      afterMutation_(run('discardPendingEntry', p.id)).catch(function (err) {
        if (removedPending) STATE.pendingEntries.push(removedPending);
        showToast(err.message, true);
        render();
      }).finally(function () { delete pendingEntryRemovals_[p.id]; });
      openPendingReviewModal(index + 1, queue);
    };

    document.getElementById('m-submit').onclick = function () {
      var submitBtn = document.getElementById('m-submit');
      var amount = document.getElementById('p-amount').getValue();
      if (!amount || amount <= 0) { errorPopover(submitBtn, 'O valor precisa ser maior que zero.'); return; }
      if (kind === 'income' && stagedRefundLinksExceed_(stagedRefundLinks, amount)) {
        errorPopover(submitBtn, 'Os vínculos de reembolso passam do valor da receita. Reabra "Vincular" e ajuste.');
        return;
      }
      var description = capitalizeFirst_(document.getElementById('p-desc').value);

      var payload = {
        id: p.id, kind: kind, amount: amount, description: description,
        date: document.getElementById('p-date').value,
        time: document.getElementById('p-time').value,
        // Checkbox "Lembrar essa conta..." removido a pedido do usuário -- por ora fica
        // sempre ligado (hardcoded), sem UI pra desligar.
        rememberAccountForApp: true
      };
      if (kind === 'transfer') {
        var fromId = fromField.getValue();
        var toId = toField.getValue();
        if (fromId === toId) { errorPopover(submitBtn, 'Conta de origem e destino não podem ser a mesma.'); return; }
        payload.fromAccountId = fromId;
        payload.toAccountId = toId;
        var billEl = document.getElementById('p-bill');
        payload.billMonth = billEl ? billEl.value : '';
      } else {
        var accountId = accountField.getValue();
        if (!accountId) { errorPopover(submitBtn, 'Selecione uma conta.'); return; }
        var categoryId = categoryField.getValue();
        payload.accountId = accountId;
        payload.categoryId = categoryId;
        payload.counterparty = capitalizeFirst_(document.getElementById('p-counterparty').value);
        payload.rememberCategoryForCounterparty = rememberCategoryForCounterparty;
        payload.excludeFromAnalysis = outlierFlagged;
        if (rememberEstablishment) {
          payload.rememberCounterpartyAlias = { rawText: p.counterparty || p.text || '', establishmentName: payload.counterparty };
        }
        var installmentsEl = document.getElementById('p-installments');
        payload.installments = installmentsEl ? installmentsEl.value : 1;
      }

      // Lê o vínculo ANTES de qualquer .then() -- openPendingReviewModal(index+1, queue)
      // no fim deste mesmo handler (síncrono) substitui o #modal-root pelo PRÓXIMO item
      // da fila antes do resolveRealIds_ assíncrono terminar, então o hidden input de
      // vínculo lido depois seria o do item ERRADO (ou nenhum, se essa era a última
      // pendência) -- mesma causa raiz do bug em openTransactionModal (ver comentário
      // lá). resolveForecastSelection_ já devolve uma Promise RESOLVIDA na hora, então
      // chamar aqui captura o valor certo mesmo com o DOM trocando depois.
      var forecastSelectionP_ = payload.kind === 'transfer' ? Promise.resolve(undefined) : resolveForecastSelection_('p-forecast');

      // Acha p PELO ID na hora, não confia num índice/array capturado antes — ver
      // comentário grande no topo da função.
      var liveIdx = STATE.pendingEntries.findIndex(function (e) { return e.id === p.id; });
      var removedPending = liveIdx !== -1 ? STATE.pendingEntries.splice(liveIdx, 1)[0] : null;
      pendingEntryRemovals_[p.id] = true; // ver comentário grande em pendingEntryRemovals_
      // Prévia otimista (ver applyOptimisticEntry) pra aparecer na hora — optimisticIds
      // guarda o(s) ID(s) temporário(s) DESSA confirmação específica pra
      // resolveCreatedTransactions_ trocar pelo dado de verdade assim que o PRÓPRIO
      // confirmPendingEntry confirmar (ver comentário grande em resolveCreatedTransactions_
      // — não espera mais o refresh coalescido, que é uma leitura separada sujeita a
      // atraso). Em erro, o catch abaixo remove só esses IDs.
      var optimisticIds = payload.kind === 'transfer'
        ? [
            applyOptimisticEntry({ accountId: fromId, categoryId: null, kind: 'transfer_out', amount: amount, date: payload.date, time: payload.time, description: description }),
            applyOptimisticEntry({ accountId: toId, categoryId: null, kind: 'transfer_in', amount: amount, date: payload.date, time: payload.time, description: description })
          ]
        // forecastId explícito -- sem isso, a prévia otimista (antes do servidor
        // confirmar) não contava como "cumprida" no lançamento recorrente vinculado.
        : [applyOptimisticEntry({ accountId: accountId, categoryId: categoryId, kind: payload.kind, amount: amount, date: payload.date, time: payload.time, description: description, counterparty: payload.counterparty, installmentTotal: payload.installments, forecastId: forecastFieldsFromSelection_(selectedForecastId, payload.date).forecastId, forecastCycleMonth: forecastFieldsFromSelection_(selectedForecastId, payload.date).forecastCycleMonth, excludeFromAnalysis: outlierFlagged })];
      if (payload.kind === 'income' && stagedRefundLinks.length) applyOptimisticRefundLinks_(optimisticIds[0], stagedRefundLinks);
      render(); // mantém a linha do tempo de orçamento (por trás do modal) sempre com a data da pendência mais antiga atual
      // Se a conta/categoria escolhida acabou de ser criada (ID temporário), espera essa
      // criação terminar antes de mandar pro servidor — ver pendingCreations_/resolveRealIds_.
      var idKeys = payload.kind === 'transfer' ? ['fromAccountId', 'toAccountId'] : ['accountId', 'categoryId'];
      var confirmChain = resolveRealIds_(payload, idKeys).then(function (resolvedPayload) {
        payload = resolvedPayload;
        return forecastSelectionP_.then(function (forecastId) {
          Object.assign(payload, forecastFieldsFromSelection_(forecastId, payload.date));
          return afterMutation_(run('confirmPendingEntry', payload).then(function (createdRows) {
            resolveCreatedTransactions_(optimisticIds, createdRows);
            // Espelha o encadeamento do Novo lançamento (FAB) — pessoas nomeadas
            // (stagedRefundShares) ou despesas marcadas pra vincular
            // (stagedRefundLinks) só existiam como Shares/Links de verdade a partir
            // daqui, já que não existia nenhum ID de lançamento antes de confirmar.
            if (payload.kind === 'expense' && stagedRefundShares.length) {
              var passiveId = createdRows[0].id;
              return Promise.all(stagedRefundShares.map(function (s) {
                if (s.personId) return resolveRealId_(s.personId);
                return run('createPerson', { name: s.personName }).then(function (person) {
                  STATE.people.push({ id: person.ID, name: person.Name, archived: false });
                  return person.ID;
                });
              })).then(function (personIds) {
                return run('setRefundSharesForPassiveTransaction', {
                  passiveTransactionId: passiveId,
                  shares: stagedRefundShares.map(function (s, i) { return { personId: personIds[i], expectedAmount: s.expectedAmount }; })
                });
              }).then(function (createdShares) {
                createdShares.forEach(function (row) {
                  STATE.refundShares.push({ id: row.ID, passiveTransactionId: row.PassiveTransactionID, personId: row.PersonID, expectedAmount: Number(row.ExpectedAmount) });
                });
                render();
                return createdRows;
              });
            }
            if (payload.kind === 'income' && stagedRefundLinks.length) {
              var activeId = createdRows[0].id;
              return Promise.all(stagedRefundLinks.map(function (a) { return resolveRealId_(a.shareId); })).then(function (shareIds) {
                return run('setRefundLinksForActiveTransaction', {
                  activeTransactionId: activeId,
                  allocations: stagedRefundLinks.map(function (a, i) { return { shareId: shareIds[i], amount: a.amount }; })
                });
              }).then(function (createdLinks) {
                replaceOptimisticRefundLinks_(optimisticIds, activeId, createdLinks);
                render();
                return createdRows;
              });
            }
            return createdRows;
          }));
        });
      });
      // Prévia clicável: se o usuário abrir a edição dela antes do servidor responder,
      // salvar/remover precisa esperar esse ID temporário virar real (ver
      // registerTxCreation_). Transferência não entra: a prévia dela não é clicável.
      if (payload.kind !== 'transfer') registerTxCreation_(optimisticIds[0], confirmChain);
      confirmChain.catch(function (err) {
        STATE.pendingTransactions = STATE.pendingTransactions.filter(function (t) { return optimisticIds.indexOf(t.id) === -1; });
        discardOptimisticRefundLinks_(optimisticIds);
        if (removedPending) STATE.pendingEntries.push(removedPending);
        showToast(err.message, true);
        refreshAll().then(render);
      }).finally(function () { delete pendingEntryRemovals_[p.id]; });
      openPendingReviewModal(index + 1, queue);
    };
  }

  // ---------- motor genérico de "segure 0.5s pra revelar um mini-menu" ----------
  var HOLD_REVEAL_DELAY_MS = 500;
  var HOLD_REVEAL_LEAVE_GRACE_MS = 150;
  var HOLD_REVEAL_MOVE_TOLERANCE_PX = 10;
  // Handle do mini-menu hold-to-reveal aberto agora, se algum (ex: dropdown de uma
  // barra de orçamento) -- ver resetFloatingUi_. Só um por vez na prática (só um
  // grupo pode estar em hover/toque ativo), então um único ponteiro basta.
  var activeHoldReveal_ = null;
  // Handle cujo revealTimer está CONTANDO agora (hover/toque ainda não completou o
  // atraso -- o menu ainda não abriu de verdade, então NÃO está em activeHoldReveal_
  // ainda). Sem isso, trocar de aba enquanto esse timer ainda está pendente não tinha
  // como cancelá-lo -- ele disparava sozinho mais tarde, já noutra aba, abrindo um menu
  // "fantasma" ancorado num elemento (a barra antiga) que não existe mais no DOM;
  // getBoundingClientRect() de um elemento morto devolve tudo zero, e o cálculo de
  // posição caía no canto superior esquerdo da tela (bug relatado: dropdown de
  // orçamento reaparecendo "no topo da página" pouco depois de trocar de aba, e só
  // sumindo de vez na PRÓXIMA troca -- essa segunda troca via resetFloatingUi_ que
  // fechava o menu fantasma, já então em activeHoldReveal_ por ter aberto nesse meio
  // tempo). Ver resetFloatingUi_.
  var pendingHoldReveal_ = null;

  /**
   * Motor de "hover (desktop) ou toque longo (celular) por HOLD_REVEAL_DELAY_MS revela
   * um mini-menu; sair do grupo inteiro (ou tocar fora) esconde" — usado pelo menu do
   * "+" e pelo dropdown das barras de orçamento. Só cuida do GATILHO (quando abrir/
   * fechar); quem chama decide o que o menu É e onde ele fica — inclusive elementos
   * criados só depois de abrir (joinHoverGroup_), que não existiam ainda pra entrar
   * direto na lista de listeners.
   *
   * Celular: toque longo abre e FICA aberto — soltar o dedo não escolhe nada sozinho
   * (suppressNextClick faz o clique sintetizado que viria em seguida não abrir a ação
   * padrão do anchorEl); precisa de um toque separado numa opção (ou fora, pra fechar)
   * — mesmo padrão de segurar uma mensagem no WhatsApp/Telegram, evita escolha errada
   * por tremular o dedo durante o toque longo.
   */
  function setupHoldToReveal_(anchorEl, options) {
    options = options || {};
    // O toque longo fica em HOLD_REVEAL_DELAY_MS por padrão de propósito: com 200ms, um
    // toque normal no "+" (que deve abrir o Novo lançamento) já contaria como toque
    // longo e abriria o menu no lugar da ação. Só a barra lateral baixa isso
    // (touchDelayMs), porque lá o toque rápido só troca de aba.
    var hoverDelay = options.hoverDelayMs || HOLD_REVEAL_DELAY_MS;
    var touchDelay = options.touchDelayMs || HOLD_REVEAL_DELAY_MS;
    var leaveGrace = options.leaveGraceMs || HOLD_REVEAL_LEAVE_GRACE_MS;
    var isOpen = false;
    var revealTimer = null;
    var leaveTimer = null;
    var suppressNextClick = false;
    var touchStartX = 0, touchStartY = 0;
    var lastPointerX = null; // ver getPointerX() — de que lado horizontal do anchor o menu deve abrir
    var openCallback = null, closeCallback = null;
    var handle_; // atribuído só no fim (return) -- open_/close_ já capturam a variável pela closure, e só rodam de verdade depois (evento/timer), quando ela já está atribuída. Ver activeHoldReveal_.

    function cancelLeave_() { if (leaveTimer) { clearTimeout(leaveTimer); leaveTimer = null; } }
    function scheduleLeave_() { cancelLeave_(); leaveTimer = setTimeout(close_, leaveGrace); }

    // Cancela o revealTimer pendente (se algum) e limpa pendingHoldReveal_ se ele
    // apontar pra este handle -- chamada tanto de dentro (mouseleave/touchmove/touchend,
    // clique rápido via close_) quanto de fora (resetFloatingUi_, via pendingHoldReveal_).
    function cancelPendingReveal_() {
      if (revealTimer) { clearTimeout(revealTimer); revealTimer = null; }
      if (pendingHoldReveal_ === handle_) pendingHoldReveal_ = null;
    }

    function open_() {
      if (isOpen) return;
      isOpen = true;
      activeHoldReveal_ = handle_;
      if (openCallback) openCallback();
    }
    function close_() {
      // Um clique rápido (antes do hover-reveal dar tempo de disparar) não tinha isOpen
      // ainda, então esse early-return nunca cancelava o revealTimer pendente — ele
      // disparava sozinho mais tarde (já noutra view, por ex.), abrindo o menu "do nada"
      // (bug reportado: dropdown preso no canto depois de navegar por um clique rápido).
      cancelPendingReveal_();
      if (!isOpen) return;
      isOpen = false;
      if (activeHoldReveal_ === handle_) activeHoldReveal_ = null;
      if (closeCallback) closeCallback();
    }

    if (HOVER_CAPABLE_) {
      anchorEl.addEventListener('mouseenter', function (e) {
        lastPointerX = e.clientX;
        cancelLeave_();
        if (revealTimer || isOpen) return;
        pendingHoldReveal_ = handle_;
        revealTimer = setTimeout(function () { revealTimer = null; pendingHoldReveal_ = null; open_(); }, hoverDelay);
      });
      // Acompanha o mouse enquanto ele ainda está sobre o anchor — se o usuário entrar
      // de um lado e arrastar pro outro antes dos 500ms passarem, o menu deve abrir do
      // lado de onde o mouse ESTÁ agora, não de onde entrou.
      anchorEl.addEventListener('mousemove', function (e) { lastPointerX = e.clientX; });
      anchorEl.addEventListener('mouseleave', function () {
        cancelPendingReveal_();
        scheduleLeave_();
      });
    } else {
      anchorEl.addEventListener('touchstart', function (e) {
        var t = e.touches[0];
        touchStartX = t.clientX; touchStartY = t.clientY;
        lastPointerX = t.clientX;
        pendingHoldReveal_ = handle_;
        revealTimer = setTimeout(function () {
          revealTimer = null; pendingHoldReveal_ = null;
          // já aberto: o toque nem abriu nada agora, então o clique que vem depois é do usuário
          if (!isOpen) suppressNextClick = true;
          open_();
        }, touchDelay);
      }, { passive: true });
      anchorEl.addEventListener('touchmove', function (e) {
        if (!revealTimer) return;
        var t = e.touches[0];
        if (Math.hypot(t.clientX - touchStartX, t.clientY - touchStartY) > HOLD_REVEAL_MOVE_TOLERANCE_PX) {
          cancelPendingReveal_();
        }
      }, { passive: true });
      anchorEl.addEventListener('touchend', function (e) {
        cancelPendingReveal_();
        if (suppressNextClick) { e.preventDefault(); suppressNextClick = false; }
      }, { passive: false });
    }

    handle_ = {
      onOpen: function (fn) { openCallback = fn; },
      onClose: function (fn) { closeCallback = fn; },
      open: open_,
      close: close_,
      isOpen: function () { return isOpen; },
      /** Última posição X (clientX) conhecida do mouse/toque sobre o anchor — usado pra
       *  decidir de que lado horizontal um menu revelado deve abrir (ver
       *  setupBudgetBarMenus_). null se ainda não houve nenhum hover/toque. */
      getPointerX: function () { return lastPointerX; },
      /** Pro onclick PRÓPRIO do anchorEl checar antes de rodar sua ação padrão. */
      consumeSuppressedClick: function () {
        if (suppressNextClick) { suppressNextClick = false; return true; }
        return false;
      },
      /** Elemento(s) revelados DINAMICAMENTE (só existem depois de abrir) se juntam ao
       *  mesmo grupo de hover — sem isso, tirar o mouse do anchor pra cima do menu já
       *  fecharia ele antes de dar tempo de clicar numa opção. */
      joinHoverGroup: function (el) {
        if (!HOVER_CAPABLE_) return;
        el.addEventListener('mouseenter', cancelLeave_);
        el.addEventListener('mouseleave', scheduleLeave_);
      }
    };
    return handle_;
  }

  // ---------- menu de atalhos do "+" ----------
  /**
   * Segurar o "+" revela, colada à esquerda dele, a cápsula "Novo lançamento" (mesma
   * cor de cápsula selecionada — indica que essa é a ação padrão de um toque normal) e,
   * empilhada acima, uma cápsula pra cada OUTRA criação do app (conta, categoria,
   * orçamento, lançamento recorrente) — evita precisar navegar até a aba certa só pra
   * criar algo. "Novo plano" fica de fora de propósito: só dá pra criar um Plano
   * clicando no gráfico de projeção (ver openPlanModal/renderBalanceTrendChart_), não
   * tem mais um botão dedicado em lugar nenhum.
   */
  var SPEED_DIAL_ACTIONS_ = [
    { label: 'Nova conta', open: function () { openAccountModal(); } },
    { label: 'Nova categoria', open: function () { openCategoryModal(); } },
    { label: 'Novo orçamento', open: function () { openBudgetModal(); } },
    { label: 'Novo lançamento recorrente', open: function () { openForecastModal(); } }
  ];
  var HOLD_REVEAL_GAP_PX = 10;
  // Guardado pro atalho de teclado Space poder abrir o menu na hora (ver
  // handleGlobalShortcutKey_) sem precisar simular um mouseenter de verdade.
  var fabHold_ = null;

  function setupFabSpeedDial_() {
    var fab = document.getElementById('fab-add');
    // Menu do "+" abre e fecha bem mais rápido que o padrão (as barras de orçamento
    // seguem em 500ms): é um menu que o usuário abre de propósito e várias vezes ao dia,
    // não uma informação extra que aparece se ele parar por cima sem querer.
    var hold = setupHoldToReveal_(fab, { hoverDelayMs: 200, leaveGraceMs: 100 });
    fabHold_ = hold;

    var root = document.createElement('div');
    root.id = 'fab-speed-dial';

    // O "+" fica colado na barra lateral (na borda da tela), então o menu abre pro lado
    // de DENTRO da tela: uma coluna só, com as outras criações em cima e "Novo lançamento"
    // (a ação do toque normal, cápsula destacada) embaixo, na altura do "+". O padding do
    // lado do "+" cobre o vão até ele: sem isso, passar o mouse por ali fechava tudo
    // (bug antigo do menu) -- a ÁREA de hover cresce até encostar no botão.
    var stack = document.createElement('div');
    stack.style.cssText = 'position:fixed;display:flex;flex-direction:column;gap:8px;' +
      'opacity:0;transition:opacity .15s ease,transform .15s ease;pointer-events:none;z-index:45';
    SPEED_DIAL_ACTIONS_.forEach(function (action) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'capsule';
      btn.textContent = action.label;
      btn.onclick = function () { hold.close(); action.open(); };
      stack.appendChild(btn);
    });
    var indicator = document.createElement('button');
    indicator.type = 'button';
    indicator.className = 'capsule active';
    indicator.textContent = 'Novo lançamento';
    indicator.onclick = function () { hold.close(); openTransactionModal(); };
    stack.appendChild(indicator);

    root.appendChild(stack);
    document.body.appendChild(root);
    hold.joinHoverGroup(stack);

    var stopOutsideClick_ = null;
    hold.onOpen(function () {
      var fabRect = fab.getBoundingClientRect();
      var onLeft = navSide_() === 'left';
      var viewportW = document.documentElement.clientWidth;
      stack.style.alignItems = onLeft ? 'flex-start' : 'flex-end';
      stack.style.padding = '0';
      stack.style[onLeft ? 'paddingLeft' : 'paddingRight'] = HOLD_REVEAL_GAP_PX + 'px';
      stack.style.left = onLeft ? fabRect.right + 'px' : 'auto';
      stack.style.right = onLeft ? 'auto' : (viewportW - fabRect.left) + 'px';
      stack.style.bottom = (window.innerHeight - (fabRect.top + fabRect.height / 2) - indicator.offsetHeight / 2) + 'px';
      stack.style.transform = 'translateX(' + (onLeft ? -6 : 6) + 'px)';

      stack.style.pointerEvents = 'auto';
      requestAnimationFrame(function () {
        stack.style.opacity = '1';
        stack.style.transform = 'translateX(0)';
      });
      stopOutsideClick_ = dismissOnOutsideClick(root, hold.close);
    });
    hold.onClose(function () {
      stack.style.opacity = '0';
      stack.style.pointerEvents = 'none';
      if (stopOutsideClick_) { stopOutsideClick_(); stopOutsideClick_ = null; }
    });

    fab.onclick = function () {
      if (hold.consumeSuppressedClick()) return;
      hold.close();
      openTransactionModal();
    };
  }

  // ---------- novo lançamento (FAB) ----------
  /** opts (opcional) = { kind, categoryId, forecastId, date } -- pré-preenche o
   *  formulário ao abrir a partir de uma bolinha vermelha de Lançamento recorrente (ver
   *  openTransactionModalForForecastCycle_); sem opts, comportamento de sempre (Despesa
   *  em branco, hoje). Só afeta a PRIMEIRA renderização -- trocar Despesa/Receita/
   *  Transferência na mão continua resetando categoria/vínculo normalmente, mesmo
   *  padrão de sempre (ver setKind). */
  function openTransactionModal(opts) {
    opts = opts || {};
    var kind = opts.kind === 'income' ? 'income' : 'expense';
    var isFirstRender_ = true;
    // Sobrevive à Transferência (que não tem esse campo) — diferente de
    // Data/Horário/Valor/Referente a, não dá pra sempre reler do DOM antes de
    // reconstruir, porque o campo pode não existir na hora da troca (ex: Despesa com
    // "João" em Pago a -> Transferência -> Despesa de novo ainda deve mostrar "João").
    var preservedCounterparty = '';
    // Pessoas nomeadas no popup de reembolso (ver openRefundSharesPopup_) ANTES da
    // despesa existir de verdade — só vira RefundShares de verdade depois que o
    // createTransaction do Salvar confirma (ver setRefundSharesForPassiveTransaction
    // encadeado ali). Some ao sair de Despesa: reembolso só faz sentido nesse kind
    // (mesma ideia de conta/categoria resetarem ao trocar, diferente de data/valor/
    // descrição que sobrevivem).
    var stagedRefundShares = [];
    // Espelha stagedRefundShares, só que pro lado RECEITA: allocations escolhidas no
    // popup de vincular (ver openRefundLinkPopup_), viram RefundLinks de verdade só
    // depois que o createTransaction confirma. Cada abertura do popup SUBSTITUI a
    // lista inteira (não acumula) — reabrir é "refazer a escolha do zero".
    var stagedRefundLinks = [];
    // "" = nenhum lançamento recorrente vinculado ainda -- ver
    // renderForecastToggleButton_/resolveForecastSelection_. Pré-preenchido quando vem
    // de uma bolinha vermelha (ver opts acima).
    var selectedForecastId = opts.forecastId ? forecastSelectionForDate_(opts.forecastId, opts.date) : '';
    // Substitui o antigo checkbox "Lembrar essa categoria..." -- ver renderRememberCategoryButton_.
    var rememberCategoryForCounterparty = false;
    // "Não considerar em análises?" -- ver renderOutlierToggleButton_/isLikelyOutlier_.
    // Começa desligado; a checagem reativa liga sozinho quando o valor digitado parecer
    // fora da curva (só aqui e em "Revisar pendência" -- Editar lançamento não tem
    // checagem automática, só o toggle manual, ver grilling).
    var outlierFlagged = false;
    openModal(
      '<h2>Novo lançamento</h2>' +
      '<div class="kind-toggle">' +
        '<button data-k="expense" class="' + (kind === 'expense' ? 'active' : '') + '">Despesa</button>' +
        '<button data-k="income" class="' + (kind === 'income' ? 'active' : '') + '">Receita</button>' +
        '<button data-k="transfer">Transferência</button>' +
      '</div>' +
      '<div id="tx-form-fields"></div>' +
      '<button id="m-submit">Salvar</button>'
    );
    function setKind(k) {
      if (k !== 'expense') stagedRefundShares = [];
      if (k !== 'income') stagedRefundLinks = [];
      // Mesmo padrão de sempre resetar ao trocar de modalidade (a categoria em si também
      // reseta, ver createCapsuleField com selectedValue:null em renderFields) -- link de
      // Previsão e "lembrar categoria" não fariam sentido sobreviver a uma troca de tipo.
      selectedForecastId = '';
      rememberCategoryForCounterparty = false;
      outlierFlagged = false;
      kind = k;
      document.querySelectorAll('.kind-toggle button').forEach(function (b) { b.classList.toggle('active', b.dataset.k === k); });
      renderFields();
    }
    function currentAmount_() {
      var amountEl = document.getElementById('t-amount');
      return amountEl && amountEl.getValue ? amountEl.getValue() : 0;
    }
    function renderRefundButton_() {
      var field = document.getElementById('t-refund-field');
      if (!field) return;
      var label = stagedRefundShares.length
        ? 'Reembolso: ' + stagedRefundShares.length + (stagedRefundShares.length === 1 ? ' pessoa' : ' pessoas')
        : 'Reembolso?';
      field.innerHTML = '<span class="field-action-link" id="t-refund-btn">' + escapeHtml(label) + '</span>';
      document.getElementById('t-refund-btn').onclick = function () {
        openRefundSharesPopup_(currentAmount_, stagedRefundShares, function (staged) {
          stagedRefundShares = staged;
          renderRefundButton_();
        });
      };
    }
    function renderRefundLinkButton_() {
      var field = document.getElementById('t-refundlink-field');
      if (!field) return;
      var label = stagedRefundLinks.length
        ? 'Vincular: ' + stagedRefundLinks.length + (stagedRefundLinks.length === 1 ? ' despesa' : ' despesas')
        : 'Vincular reembolso?';
      field.innerHTML = '<span class="field-action-link" id="t-refundlink-btn">' + escapeHtml(label) + '</span>';
      document.getElementById('t-refundlink-btn').onclick = function () {
        // alreadySelected = stagedRefundLinks: reabrir o popup antes de salvar precisa
        // mostrar o que já foi escolhido na vez anterior, marcado (senão parecia que a
        // escolha tinha se perdido, mesmo com o botão já mostrando "Vincular: N despesas").
        openRefundLinkPopup_(currentAmount_, stagedRefundLinks, function (allocations) {
          stagedRefundLinks = allocations;
          renderRefundLinkButton_();
        });
      };
    }
    document.querySelectorAll('.kind-toggle button').forEach(function (b) { b.onclick = function () { setKind(b.dataset.k); }; });

    var fromField, toField, accountField, categoryField;

    function renderFields() {
      var container = document.getElementById('tx-form-fields');
      // Data/Horário/Valor/Descrição existem nas 3 modalidades com o mesmo sentido —
      // captura o que já estava preenchido ANTES de reconstruir o HTML (só os campos
      // exclusivos de cada modalidade, tipo conta/categoria/parcelas, fazem sentido
      // resetar ao trocar despesa/receita/transferência). Cai nos padrões de sempre
      // (hoje/vazio/zero/vazio) só na primeira renderização, quando os campos antigos
      // ainda não existem — horário fica vazio de propósito (diferente da revisão de
      // pendência, que já vem com horário detectado): aqui o mais comum é não saber/não
      // querer informar a hora exata.
      var prevAmountEl = document.getElementById('t-amount');
      var preservedDate = (document.getElementById('t-date') || {}).value || opts.date || todayYmd();
      var preservedTime = (document.getElementById('t-time') || {}).value || '';
      var preservedAmount = (prevAmountEl && prevAmountEl.getValue) ? prevAmountEl.getValue() : 0;
      var preservedDesc = (document.getElementById('t-desc') || {}).value || '';
      // Só sobrescreve se o campo existia (Transferência não tem) — ver comentário em
      // preservedCounterparty, no início de openTransactionModal.
      var prevCounterpartyEl = document.getElementById('t-counterparty');
      if (prevCounterpartyEl) preservedCounterparty = prevCounterpartyEl.value;
      if (kind === 'transfer') {
        container.innerHTML =
          '<div class="field" style="display:flex;gap:8px">' +
            '<div style="flex:1"><label>Data</label><input type="date" id="t-date" value="' + preservedDate + '"></div>' +
            '<div style="flex:1"><label>Horário</label><input type="time" id="t-time" value="' + preservedTime + '"></div>' +
          '</div>' +
          '<div class="field"><label>De</label><div id="t-from-field" class="capsule-field"></div></div>' +
          '<div class="field"><label>Para</label><div id="t-to-field" class="capsule-field"></div></div>' +
          '<div class="field"><label>Valor</label><input type="text" id="t-amount"></div>' +
          '<div class="field"><label>Descrição</label><input id="t-desc" value="' + escapeHtml(preservedDesc) + '"></div>' +
          '<div id="t-bill-field"></div>';
        setupMoneyInput(document.getElementById('t-amount'), preservedAmount);
        var accountItems = rankedAccountItems();
        fromField = createCapsuleField(document.getElementById('t-from-field'), { items: accountItems });
        toField = createCapsuleField(document.getElementById('t-to-field'), {
          items: accountItems,
          onChange: updateBillField
        });
        updateBillField();
      } else {
        var accItems = kind === 'expense'
          ? rankedAccountItems(function (a) { return a.type !== 'investment'; })
          : rankedAccountItems(function (a) { return a.type !== 'credit_card' && a.type !== 'investment'; });
        var counterpartyLabel = kind === 'income' ? 'Recebido de' : 'Pago a';
        container.innerHTML =
          '<div class="field" style="display:flex;gap:8px">' +
            '<div style="flex:1"><label>Data</label><input type="date" id="t-date" value="' + preservedDate + '"></div>' +
            '<div style="flex:1"><label>Horário</label><input type="time" id="t-time" value="' + preservedTime + '"></div>' +
          '</div>' +
          '<div class="field"><label>Conta</label><div id="t-account-field" class="capsule-field"></div></div>' +
          '<div class="field">' +
            '<div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:2px 8px">' +
              '<label style="margin-bottom:0">Categoria</label>' +
              '<span id="t-remember-cat-field"></span>' +
            '</div>' +
            '<div id="t-category-field" class="capsule-field"></div>' +
          '</div>' +
          '<div class="field" style="display:flex;gap:8px">' +
            '<div style="flex:1;min-width:0">' +
              '<div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:2px 8px">' +
                '<label style="margin-bottom:0">Valor</label>' +
                // .field-action-group: mesmo agrupador do modal de Editar lançamento (acima).
                '<span class="field-action-group">' +
                  (kind === 'expense' ? '<span id="t-refund-field"></span>' : '') +
                  (kind === 'income' ? '<span id="t-refundlink-field"></span>' : '') +
                  '<span id="t-outlier-field"></span>' +
                '</span>' +
              '</div>' +
              '<input type="text" id="t-amount">' +
            '</div>' +
            '<div style="flex:1;min-width:0"><label>Parcelas</label><input type="number" id="t-installments" min="1" value="1"></div>' +
          '</div>' +
          '<div class="field" style="display:flex;gap:8px">' +
            '<div style="flex:1;min-width:0">' +
              '<div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:nowrap;gap:2px 8px">' +
                '<label style="margin-bottom:0;white-space:nowrap;flex-shrink:0">' + counterpartyLabel + '</label>' +
                '<span id="t-forecast-toggle-field"></span>' +
              '</div>' +
              '<input id="t-counterparty" value="' + escapeHtml(preservedCounterparty) + '">' +
            '</div>' +
            '<div style="flex:1;min-width:0">' +
              '<div style="display:flex;align-items:baseline"><label style="margin-bottom:0">Referente a</label></div>' +
              '<input id="t-desc" value="' + escapeHtml(preservedDesc) + '">' +
            '</div>' +
          '</div>';
        setupCounterpartySuggestions_(document.getElementById('t-counterparty'));
        setupMoneyInput(document.getElementById('t-amount'), preservedAmount);
        document.getElementById('t-amount').addEventListener('input', function () { maybeSuggestOutlierT_(); maybeSuggestForecastLinkT_(); });
        if (kind === 'expense') renderRefundButton_();
        if (kind === 'income') renderRefundLinkButton_();
        updateRememberCategoryT_();
        updateOutlierFieldT_();
        var catItemsForKind = rankedCategoryItems(kind);
        var categoryTouchedByUser = false;
        categoryField = createCapsuleField(document.getElementById('t-category-field'), {
          allowDeselect: true, collapseUnused: true,
          items: catItemsForKind,
          // Pré-seleciona só na 1ª renderização (ver opts/isFirstRender_ no topo da
          // função) -- trocar Despesa/Receita/Transferência na mão depois continua
          // resetando a categoria normalmente (mesmo padrão de sempre, ver setKind).
          selectedValue: (isFirstRender_ && opts.categoryId) ? opts.categoryId : null,
          onChange: function (v) { categoryTouchedByUser = true; updateForecastToggleT_(); maybeSuggestOutlierT_(); maybeSuggestForecastLinkT_(); }
        });
        // Sugere categoria enquanto o usuário digita "Pago a"/"Recebido de" — contraparte
        // já lembrada (exata, ver findCategoryIdForCounterpartyClient_) tem prioridade
        // sobre palavra-chave (substring, ver findCategoryIdByKeywordClient_) — só enquanto
        // ele não tiver escolhido uma categoria manualmente, pra não atropelar escolha
        // intencional.
        document.getElementById('t-counterparty').addEventListener('input', function () {
          if (!categoryTouchedByUser) {
            var matchId = findCategoryIdForCounterpartyClient_(this.value) || findCategoryIdByKeywordClient_(this.value, kind);
            if (matchId && matchId !== categoryField.getValue()) {
              categoryField.setValue(matchId);
              updateForecastToggleT_();
            }
          }
          maybeSuggestForecastLinkT_();
        });
        accountField = createCapsuleField(document.getElementById('t-account-field'), {
          allowDeselect: true,
          items: accItems,
          selectedValue: null, // null explícito = começa sem nada selecionado (undefined cairia no padrão = items[0])
          onChange: updateInstallmentsField
        });
        updateInstallmentsField();
        updateForecastToggleT_();
      }
      isFirstRender_ = false;
    }

    // Ver renderForecastToggleButton_/renderRememberCategoryButton_ (compartilhadas com
    // Editar lançamento e Revisar pendência) -- só repassam o estado local (kind/
    // categoryField/selectedForecastId/rememberCategoryForCounterparty) no formato que
    // elas esperam.
    function updateForecastToggleT_() {
      renderForecastToggleButton_({
        fieldId: 't-forecast-toggle-field', hiddenInputId: 't-forecast',
        getKind: function () { return kind; },
        getCategoryId: function () { return categoryField.getValue(); },
        getSelected: function () { return selectedForecastId; },
        setSelected: function (v) { selectedForecastId = v; },
        setCategoryId: function (v) { categoryTouchedByUser = true; categoryField.setValue(v); }
      });
    }
    function updateRememberCategoryT_() {
      renderRememberCategoryButton_({
        fieldId: 't-remember-cat-field',
        getKind: function () { return kind; },
        getRemember: function () { return rememberCategoryForCounterparty; },
        setRemember: function (v) { rememberCategoryForCounterparty = v; }
      });
    }
    function updateOutlierFieldT_() {
      renderOutlierToggleButton_({
        fieldId: 't-outlier-field',
        getKind: function () { return kind; },
        getFlag: function () { return outlierFlagged; },
        setFlag: function (v) { outlierFlagged = v; }
      });
    }
    /** Checagem reativa (ver isLikelyOutlier_/grilling) -- só liga sozinho a sugestão
     *  (nunca desliga um toggle que o usuário já tenha marcado/desmarcado na mão), pra
     *  não atropelar uma escolha manual enquanto ele continua ajustando valor/categoria. */
    function maybeSuggestOutlierT_() {
      var amountEl = document.getElementById('t-amount');
      var amount = amountEl && amountEl.getValue ? amountEl.getValue() : 0;
      var categoryId = categoryField ? categoryField.getValue() : null;
      if (!outlierFlagged && amount && isLikelyOutlier_(amount, categoryId, kind)) {
        outlierFlagged = true;
        updateOutlierFieldT_();
      }
    }
    /** Checagem reativa (mesma ideia de maybeSuggestOutlierT_, grillado com o usuário)
     *  -- sugere vincular a um recorrente quando valor (±R$1) E nome de "Pago a"/
     *  "Recebido de" batem com um candidato (ver findForecastLinkSuggestion_). Só liga
     *  sozinho enquanto NADA tiver sido selecionado ainda (nem manual nem sugestão
     *  anterior) -- trava no primeiro toque, nunca reavalia depois disso. Se a categoria
     *  ainda não tiver sido escolhida, a sugestão também escolhe ela (mesmo
     *  comportamento de selecionar manualmente no dropdown amplo, ver
     *  renderForecastToggleButton_). */
    function maybeSuggestForecastLinkT_() {
      if (selectedForecastId) return;
      var amountEl = document.getElementById('t-amount');
      var amount = amountEl && amountEl.getValue ? amountEl.getValue() : 0;
      var categoryId = categoryField ? categoryField.getValue() : null;
      var counterpartyEl = document.getElementById('t-counterparty');
      var counterpartyText = counterpartyEl ? counterpartyEl.value : '';
      var candidates = forecastLinkCandidates_(kind, categoryId, selectedForecastId);
      var match = findForecastLinkSuggestion_(candidates, amount, counterpartyText);
      if (!match) return;
      selectedForecastId = defaultForecastSelection_(match);
      if (!categoryId) {
        var chosen = candidates.find(function (f) { return f.id === match; });
        if (chosen) { categoryTouchedByUser = true; categoryField.setValue(chosen.categoryId); }
      }
      updateForecastToggleT_();
    }

    function updateInstallmentsField() {
      var accId = accountField.getValue();
      var acc = STATE.accounts.find(function (a) { return a.id === accId; });
      var installmentsInput = document.getElementById('t-installments');
      if (!installmentsInput) return;
      var isCreditCard = !!(acc && acc.type === 'credit_card');
      installmentsInput.disabled = !isCreditCard;
      if (!isCreditCard) installmentsInput.value = 1;
    }

    /**
     * Usa o resumo de faturas já carregado no dashboard (STATE.dashboard.creditCardSummaries)
     * em vez de um round-trip ao servidor — evita o atraso/"pulo" no modal ao trocar de conta.
     */
    function updateBillField() {
      var toId = toField.getValue();
      var toAcc = STATE.accounts.find(function (a) { return a.id === toId; });
      var field = document.getElementById('t-bill-field');
      if (toAcc && toAcc.type === 'credit_card') {
        var cc = STATE.dashboard && STATE.dashboard.creditCardSummaries.find(function (c) { return c.accountId === toId; });
        var bills = cc ? cc.bills : [];
        var open = bills.filter(function (b) { return b.status === 'fechada' || b.status === 'atrasada'; });
        field.innerHTML = '<div class="field"><label>Fatura sendo paga</label><select id="t-bill">' +
          '<option value="">Não vincular a uma fatura específica</option>' +
          open.map(function (b) { return '<option value="' + b.billMonth + '">' + fmtMonthYear(b.billMonth) + ' · ' + fmtMoney(b.remaining) + ' (' + STATUS_LABELS[b.status] + ')</option>'; }).join('') +
          '</select></div>';
      } else {
        field.innerHTML = '';
      }
    }

    renderFields();

    document.getElementById('m-submit').onclick = function () {
      var submitBtn = document.getElementById('m-submit');
      var amount = document.getElementById('t-amount').getValue();
      if (!amount || amount <= 0) { errorPopover(submitBtn, 'O valor precisa ser maior que zero.'); return; }
      if (kind === 'income' && stagedRefundLinksExceed_(stagedRefundLinks, amount)) {
        errorPopover(submitBtn, 'Os vínculos de reembolso passam do valor da receita. Reabra "Vincular" e ajuste.');
        return;
      }

      var promise;
      var optimisticIds;
      if (kind === 'transfer') {
        var fromId = fromField.getValue();
        var toId = toField.getValue();
        if (fromId === toId) { errorPopover(submitBtn, 'Conta de origem e destino não podem ser a mesma.'); return; }
        var billField = document.getElementById('t-bill');
        var dateVal = document.getElementById('t-date').value;
        var timeVal = document.getElementById('t-time').value;
        var descVal = capitalizeFirst_(document.getElementById('t-desc').value);
        // Se a origem/destino for uma conta recém-criada (ID temporário, servidor ainda
        // não confirmou), espera essa criação terminar em vez de mandar o ID temporário —
        // ver pendingCreations_/resolveRealIds_. A prévia otimista abaixo usa o ID como
        // veio, sem esperar: é só local, não passa pelo servidor.
        promise = resolveRealIds_({ fromAccountId: fromId, toAccountId: toId }, ['fromAccountId', 'toAccountId']).then(function (resolved) {
          return run('createTransfer', {
            date: dateVal, time: timeVal, fromAccountId: resolved.fromAccountId, toAccountId: resolved.toAccountId,
            amount: amount, description: descVal, billMonth: billField ? billField.value : ''
          }).then(function (legs) {
            resolveCreatedTransactions_(optimisticIds, [legs.out, legs.in]);
            return legs;
          });
        });
        optimisticIds = [
          applyOptimisticEntry({ accountId: fromId, categoryId: null, kind: 'transfer_out', amount: amount, date: dateVal, time: timeVal, description: descVal }),
          applyOptimisticEntry({ accountId: toId, categoryId: null, kind: 'transfer_in', amount: amount, date: dateVal, time: timeVal, description: descVal })
        ];
      } else {
        var installmentsField = document.getElementById('t-installments');
        var dateVal2 = document.getElementById('t-date').value;
        var timeVal2 = document.getElementById('t-time').value;
        var descVal2 = capitalizeFirst_(document.getElementById('t-desc').value);
        var counterpartyVal2 = capitalizeFirst_(document.getElementById('t-counterparty').value);
        var accId2 = accountField.getValue();
        if (!accId2) { errorPopover(submitBtn, 'Selecione uma conta.'); return; }
        var catId2 = categoryField.getValue();
        // Lê o vínculo ANTES de qualquer .then() -- closeModal() (logo abaixo, síncrono)
        // esvazia #modal-root e removeria o hidden input de vínculo do DOM antes desse
        // resolveRealIds_ assíncrono terminar, fazendo resolveForecastSelection_ ler
        // undefined em vez do que o usuário escolheu (bug relatado: "vínculo aparece
        // certo no modal mas não registra" -- resolveForecastSelection_(select &&
        // select.value) já devolve uma Promise RESOLVIDA na hora, então chamar aqui
        // captura o valor certo mesmo que o elemento suma depois).
        var forecastSelectionT_ = resolveForecastSelection_('t-forecast');
        // Mesma espera pra conta/categoria recém-criada — ver comentário acima.
        promise = resolveRealIds_({ accountId: accId2, categoryId: catId2 }, ['accountId', 'categoryId']).then(function (resolved) {
          return forecastSelectionT_.then(function (forecastId) {
            return run('createTransaction', {
              kind: kind, date: dateVal2, time: timeVal2, accountId: resolved.accountId, categoryId: resolved.categoryId, amount: amount,
              description: descVal2, counterparty: counterpartyVal2, rememberCategoryForCounterparty: rememberCategoryForCounterparty,
              installments: installmentsField ? installmentsField.value : 1, forecastId: forecastFieldsFromSelection_(forecastId, dateVal2).forecastId, forecastCycleMonth: forecastFieldsFromSelection_(forecastId, dateVal2).forecastCycleMonth, excludeFromAnalysis: outlierFlagged
            }).then(function (createdRows) {
              resolveCreatedTransactions_(optimisticIds, createdRows);
              // Pessoas nomeadas no popup "Reembolso?" (ver stagedRefundShares) só viram
              // RefundShares de verdade agora, encadeado — não existia passiveTransactionId
              // nenhum antes da despesa em si ser criada.
              if (kind === 'expense' && stagedRefundShares.length) {
                var passiveId = createdRows[0].id;
                return Promise.all(stagedRefundShares.map(function (s) {
                  if (s.personId) return resolveRealId_(s.personId);
                  return run('createPerson', { name: s.personName }).then(function (p) {
                    STATE.people.push({ id: p.ID, name: p.Name, archived: false });
                    return p.ID;
                  });
                })).then(function (personIds) {
                  return run('setRefundSharesForPassiveTransaction', {
                    passiveTransactionId: passiveId,
                    shares: stagedRefundShares.map(function (s, i) { return { personId: personIds[i], expectedAmount: s.expectedAmount }; })
                  });
                }).then(function (createdShares) {
                  createdShares.forEach(function (row) {
                    STATE.refundShares.push({ id: row.ID, passiveTransactionId: row.PassiveTransactionID, personId: row.PersonID, expectedAmount: Number(row.ExpectedAmount) });
                  });
                  render();
                  return createdRows;
                });
              }
              // Espelha o bloco acima pro lado RECEITA: allocations escolhidas no popup
              // "Vincular reembolso?" (ver stagedRefundLinks) só viram RefundLinks de
              // verdade agora — não existia activeTransactionId nenhum antes da
              // receita em si ser criada. resolveRealId_ por via das dúvidas: uma
              // Share recém-criada noutro popup, na mesma sessão, ainda pode estar
              // com ID temporário.
              if (kind === 'income' && stagedRefundLinks.length) {
                var activeId = createdRows[0].id;
                return Promise.all(stagedRefundLinks.map(function (a) { return resolveRealId_(a.shareId); })).then(function (shareIds) {
                  return run('setRefundLinksForActiveTransaction', {
                    activeTransactionId: activeId,
                    allocations: stagedRefundLinks.map(function (a, i) { return { shareId: shareIds[i], amount: a.amount }; })
                  });
                }).then(function (createdLinks) {
                  replaceOptimisticRefundLinks_(optimisticIds, activeId, createdLinks);
                  render();
                  return createdRows;
                });
              }
              return createdRows;
            });
          });
        });
        optimisticIds = [applyOptimisticEntry({
          accountId: accId2, categoryId: catId2, kind: kind, amount: amount, date: dateVal2, time: timeVal2,
          description: descVal2, counterparty: counterpartyVal2,
          // Sem isso, a PRÉVIA (antes do servidor confirmar) não contava como "cumprida"
          // no lançamento recorrente vinculado -- Planejamento só mostrava o vínculo
          // certo depois que resolveCreatedTransactions_ trocasse a prévia pela linha
          // real (bug relatado: vínculo "não atualizava" -- na prática só demorava até a
          // resposta do servidor chegar, mas parecia nunca acontecer).
          forecastId: forecastFieldsFromSelection_(selectedForecastId, dateVal2).forecastId,
          forecastCycleMonth: forecastFieldsFromSelection_(selectedForecastId, dateVal2).forecastCycleMonth,
          excludeFromAnalysis: outlierFlagged,
          // Prévia de compra parcelada não fica clicável (1 prévia = N parcelas reais).
          installmentTotal: installmentsField ? installmentsField.value : 1
        })];
        registerTxCreation_(optimisticIds[0], promise);
        if (kind === 'income' && stagedRefundLinks.length) applyOptimisticRefundLinks_(optimisticIds[0], stagedRefundLinks);
      }
      closeModal();
      render(); // já dispara loadTxList() se a view atual for o Extrato (ver renderTransactions)
      // Sucesso não precisa limpar/re-renderizar aqui de novo: resolveCreatedTransactions_
      // (dentro de promise, acima) já troca a prévia otimista pelo lançamento de verdade
      // assim que a PRÓPRIA criação confirma, sem esperar o refresh coalescido abaixo.
      afterMutation_(promise).catch(function (err) {
        STATE.pendingTransactions = STATE.pendingTransactions.filter(function (t) { return optimisticIds.indexOf(t.id) === -1; });
        discardOptimisticRefundLinks_(optimisticIds);
        showToast(err.message, true);
        refreshAll().then(render);
      });
    };
  }

  // ---------- swipe horizontal entre abas ----------
  /**
   * Arrastar horizontalmente na área de conteúdo troca de aba com uma animação de
   * slide de verdade — a aba de destino entra acompanhando o dedo, deslizando desde a
   * borda, em vez de só aparecer "num flash" quando solta. Ordem de troca é a mesma
   * ordem visual da barra de abas (SWIPE_TAB_ORDER_); nas pontas (Início/Reembolsos)
   * não tem vizinho pra esse lado, e o gesto simplesmente não faz nada.
   *
   * Duas fontes de gesto, mesma animação: toque (celular) e scroll horizontal
   * (trackpad/mouse com roda lateral, ver onSwipeWheel_) — não mouse ARRASTANDO com o
   * botão apertado, que continuaria livre pra selecionar texto. swipe_.source marca
   * qual das duas está em andamento, pra cada handler ignorar eventos da OUTRA fonte.
   *
   * Mecânica: no momento em que o gesto é confirmado como horizontal, o #view-root
   * ATUAL (com tudo que já estava montado nele — gráficos, handlers, estado) é
   * literalmente MOVIDO (não clonado) pra um painel de "saída" dentro de um overlay
   * fixo; um #view-root NOVO nasce no lugar de verdade dentro de #app, e é nele que o
   * render() normal desenha a aba de destino — o bookkeeping de scroll/aba ativa da
   * barra já acontece certo ali (mesmo código de sempre), só que escondido atrás do
   * overlay por enquanto. Os dois painéis (saída/entrada) são arrastados em uníssono
   * seguindo o dedo/scroll; ao soltar, ou completa a troca (o #view-root novo volta pro
   * lugar de verdade, o antigo é descartado) ou desfaz (o antigo volta pro lugar, o novo
   * é descartado e STATE.currentView/scroll/destaque da barra voltam pra trás na mão,
   * sem precisar re-renderizar o que já estava certo).
   */
  var SWIPE_TAB_ORDER_ = ['dashboard', 'transactions', 'accounts', 'categories', 'budgets', 'refunds'];
  var SWIPE_DECIDE_THRESHOLD_PX_ = 8; // até aqui, ainda não decidiu se é gesto horizontal ou só rolagem vertical
  var SWIPE_COMMIT_FRACTION_ = 0.35; // arrastar mais que isso da largura do painel já troca de aba ao soltar
  var SWIPE_ANIMATION_MS_ = 220;
  // Sem nenhum wheel novo por esse tempo = gesto de trackpad "solto" (wheel não tem um
  // touchend próprio). Valor pedido explicitamente pelo usuário (0,5s) -- dá margem
  // real pra não confundir uma cauda de inércia ainda ativa com silêncio de verdade.
  var SWIPE_WHEEL_IDLE_MS_ = 500;

  var swipe_ = null; // não-null só enquanto um gesto horizontal está em andamento (touch OU wheel — ver .source)
  var swipeWheelIdleTimer_ = null;
  // true só enquanto o gesto de wheel ATUAL (desde o último silêncio de
  // SWIPE_WHEEL_IDLE_MS_) já foi decidido como rolagem vertical -- ver onSwipeWheel_.
  // Deliberadamente SEPARADO de swipe_/isSwipeBlocked_: rolar verticalmente não deve
  // impedir trocar de aba por OUTRO meio (atalho 1-9, botão de margem) enquanto isso.
  var wheelVerticalLock_ = false;
  // Acumulado enquanto o gesto de wheel ATUAL ainda não foi decidido nem horizontal nem
  // vertical (ver WHEEL_DECIDE_THRESHOLD_/onSwipeWheel_) -- zerado assim que uma decisão
  // é tomada (pra qualquer lado) ou o gesto fica ocioso de verdade.
  var wheelPendingDx_ = 0, wheelPendingDy_ = 0;
  // Mesmo princípio do SWIPE_DECIDE_THRESHOLD_PX_ do touch: um evento isolado ambíguo
  // (ex: os primeiros eventos de um flick de trackpad, antes dele "pegar tração") não
  // deve travar o gesto inteiro como vertical sozinho -- só decide depois de ACUMULAR
  // essa quantidade num sentido ou no outro. Sem isso, tentar iniciar um NOVO swipe
  // horizontal logo depois de rolar verticalmente virava esse exato problema: o
  // primeiro evento do novo gesto (fraco/ambíguo, típico de trackpad "ainda pegando
  // velocidade") travava tudo como vertical de novo, e como o usuário continuava
  // tentando (sem dar uma pausa REAL de SWIPE_WHEEL_IDLE_MS_), o travamento nunca
  // liberava -- só soltando o trackpad de vez por um tempo resolvia (bug relatado).
  var WHEEL_DECIDE_THRESHOLD_ = 6;
  // Acumulado só enquanto wheelVerticalLock_ já está travado -- ver onSwipeWheel_. Some
  // (zera) a cada evento que AINDA parece vertical (o travamento não é só "esqueça pra
  // sempre", é "continue vertical enquanto a evidência recente continuar sendo
  // vertical"); só cresce quando um evento parece horizontal. Cruzar
  // WHEEL_LOCK_OVERRIDE_THRESHOLD_ destrava e trata o acumulado como o início de um
  // gesto horizontal de verdade -- sem isso, o PRIMEIRO gesto de rolagem HORIZONTAL
  // depois de um já concluído (ou depois de uma rolagem vertical) só precisava de UM
  // evento com um pouquinho mais de componente vertical que horizontal (comum logo no
  // início de um gesto físico, o dedo raramente começa perfeitamente reto) pra travar
  // como vertical e IGNORAR todo o resto do gesto, por mais horizontal que ficasse dali
  // em diante -- só destravava com uma pausa real e completa (bug relatado: tentar
  // trocar de aba de novo logo em seguida, mesmo repetidamente, nunca funcionava; só
  // esperar ~3s parado resolvia).
  var wheelLockOverrideDx_ = 0, wheelLockOverrideDy_ = 0;
  // MUITO maior que WHEEL_DECIDE_THRESHOLD_ (que decide um gesto NOVO, sem nenhuma
  // suposição prévia) de propósito: aqui é preciso SUPERAR uma decisão vertical já
  // tomada, então não pode bastar UM evento isolado forte (um solavanco/blip no meio de
  // uma rolagem vertical de verdade também pode ter um pico ocasional de deltaX) --
  // precisa ser uma sequência de VÁRIOS eventos seguidos, todos com componente
  // horizontal maior que o vertical, até a soma passar disso. Uma rolagem vertical
  // contínua de verdade não deveria produzir essa sequência.
  var WHEEL_LOCK_OVERRIDE_THRESHOLD_ = 100;

  /** Não inicia gesto/troca de aba com um MODAL de verdade por cima (editar categoria,
   *  popup de reembolso...) -- esses são um fluxo que o usuário está ativamente no meio
   *  de fazer, então trocar de aba por baixo seria bem mais disruptivo que fechar um
   *  dropdown incidental; nem enquanto uma troca anterior ainda está no meio da
   *  animação de acomodação (#swipe-overlay ainda presente); nem enquanto JÁ existe um
   *  gesto em andamento de qualquer fonte (touch ou wheel — ver swipe_.source) — os dois
   *  só coexistem sem se atrapalhar porque cada handler ignora eventos que não são da
   *  própria fonte (ver onSwipeTouchMove_/onSwipeWheel_), mas começar um SEGUNDO gesto
   *  novo por cima do primeiro não faria sentido de qualquer forma.
   *
   *  NÃO bloqueia mais por #confirm-popover (dropdown/seletor de ícone) estar aberto --
   *  isso fazia trocar de aba (teclado/botão de margem/gesto) simplesmente não fazer
   *  NADA com um dropdown aberto, em vez de fechá-lo e trocar (bug relatado: "alternar
   *  abas, de qualquer forma, deve resetar tooltips e dropdowns"). Antes bloqueava pra
   *  evitar o dropdown ficar "flutuando" por cima do conteúdo deslizando durante um
   *  arrasto; agora render() (chamado já no início de beginSwipeTransition_, antes de
   *  qualquer coisa visualmente deslizar) fecha o dropdown pela resetFloatingUi_ na
   *  hora, então esse risco não existe mais. */
  function isSwipeBlocked_() {
    return !!(swipe_ || document.getElementById('modal-backdrop') || document.getElementById('refund-modal-root') ||
      document.getElementById('swipe-overlay'));
  }

  /** View do vizinho na direção do arrasto — dx<0 (arrasta pra esquerda) revela a
   *  PRÓXIMA aba à direita na barra; dx>0 revela a ANTERIOR. null se currentView já
   *  está na ponta e não tem vizinho pra esse lado. */
  function swipeTargetView_(currentView, dx) {
    var idx = SWIPE_TAB_ORDER_.indexOf(currentView);
    if (idx === -1) return null;
    var targetIdx = dx < 0 ? idx + 1 : idx - 1;
    if (targetIdx < 0 || targetIdx >= SWIPE_TAB_ORDER_.length) return null;
    return SWIPE_TAB_ORDER_[targetIdx];
  }

  function destroyChartsWithin_(container) {
    if (!container || !window.Chart) return;
    container.querySelectorAll('canvas').forEach(function (canvas) {
      var chart = Chart.getChart(canvas);
      if (chart) chart.destroy();
    });
  }

  function onSwipeTouchStart_(e) {
    // Bloqueado (inclusive por já existir ALGUM gesto em andamento, de qualquer fonte —
    // ver isSwipeBlocked_) só significa "não começa um NOVO" — não mexe em nada que já
    // esteja em andamento por outra fonte (ex: um wheel ainda se acomodando).
    if (e.touches.length !== 1 || isSwipeBlocked_()) return;
    if (e.target && e.target.closest && e.target.closest('nav.tabbar, .tabbar-more')) return; // a barra de abas tem os próprios gestos
    var t = e.touches[0];
    swipe_ = { source: 'touch', phase: 'undecided', startX: t.clientX, startY: t.clientY, dx: 0 };
  }

  function onSwipeTouchMove_(e) {
    if (!swipe_ || swipe_.source !== 'touch' || e.touches.length !== 1) return;
    var t = e.touches[0];
    var rawDx = t.clientX - swipe_.startX;
    var rawDy = t.clientY - swipe_.startY;

    if (swipe_.phase === 'undecided') {
      if (Math.abs(rawDx) < SWIPE_DECIDE_THRESHOLD_PX_ && Math.abs(rawDy) < SWIPE_DECIDE_THRESHOLD_PX_) return;
      if (Math.abs(rawDy) >= Math.abs(rawDx)) { swipe_.phase = 'vertical'; return; } // rolagem normal -- não mexe em nada
      var targetView = swipeTargetView_(STATE.currentView, rawDx);
      if (!targetView) { swipe_.phase = 'none'; return; } // já na ponta, sem vizinho pra esse lado
      swipe_.phase = 'horizontal';
      swipe_.direction = rawDx < 0 ? -1 : 1;
      swipe_.targetView = targetView;
      swipe_.originalView = STATE.currentView;
      hideTooltip_();
      beginSwipeTransition_(swipe_);
    }
    if (swipe_.phase !== 'horizontal') return;
