    var categoryId = opts.getCategoryId();
    var selectedForecastId = opts.getSelected();
    var candidates = forecastLinkCandidates_(opts.getKind(), categoryId, selectedForecastId);
    if (!candidates.length && selectedForecastId) { opts.setSelected(''); selectedForecastId = ''; }
    if (!candidates.length) { field.innerHTML = '<input type="hidden" id="' + opts.hiddenInputId + '" value="">'; return; }
    // Uma opção por (recorrente, mês em aberto) -- ver forecastLinkOptionsFor_. A seleção
    // (composta) é comparada por valor EXATO com a opção; uma pura ("f1") só sobra pra
    // recorrente não-mensal.
    var allOptions = [];
    candidates.forEach(function (f) { allOptions = allOptions.concat(forecastLinkOptionsFor_(f, selectedForecastId)); });
    var selectedOption = allOptions.find(function (o) { return o.value === selectedForecastId; })
      || allOptions.find(function (o) { return o.forecast.id === parseForecastSelection_(selectedForecastId).forecastId && !o.cycleMonth; })
      // Seleção PURA de um recorrente mensal (ex: vinda de fora): entende como o mês ATUAL.
      || allOptions.find(function (o) { return o.forecast.id === parseForecastSelection_(selectedForecastId).forecastId && o.cycleMonth === todayYmd().slice(0, 7); });
    var selected = selectedOption ? selectedOption.forecast : null;
    var recorrenteLabel = opts.getKind() === 'income' ? 'Receita recorrente?' : 'Despesa recorrente?';
    var currentYm = todayYmd().slice(0, 7);
    var monthSuffix = (selectedOption && selectedOption.cycleMonth && selectedOption.cycleMonth !== currentYm) ? ' (' + fmtMonthFullNoYear_(selectedOption.cycleMonth) + ')' : '';
    var label = selected ? 'Vinculado: ' + selected.label + monthSuffix : recorrenteLabel;
    var tooltip = 'Vincula este lançamento a uma ' + (opts.getKind() === 'income' ? 'receita recorrente' : 'despesa recorrente');
    var btnId = opts.hiddenInputId + '-btn';
    field.innerHTML = '<input type="hidden" id="' + opts.hiddenInputId + '" value="' + escapeHtml(selectedForecastId) + '">' +
      '<span class="field-action-link" id="' + btnId + '" data-tooltip="' + escapeHtml(tooltip) + '">' + escapeHtml(label) + '</span>';
    var btn = document.getElementById(btnId);
    wireTooltipTrigger_(btn);
    btn.onclick = function () {
      var options = allOptions.map(function (o) {
        return { value: o.value, label: o.label, selected: o === selectedOption };
      });
      openDropdownMenu_(btn, options, function (value) {
        // Clicar na MESMA opção já selecionada desmarca -- é assim que se desvincula um
        // lançamento de uma recorrente (pedido explícito do usuário).
        var isDeselecting = !!selectedOption && value === selectedOption.value;
        opts.setSelected(isDeselecting ? '' : value);
        // Selecionar (não desmarcar) uma recorrente também seleciona a categoria DELA --
        // pedido explícito do usuário: já se sabe a categoria certa, não faz sentido
        // deixar pro usuário escolher de novo manualmente.
        if (!isDeselecting && opts.setCategoryId) {
          var chosen = allOptions.find(function (o) { return o.value === value; });
          if (chosen) opts.setCategoryId(chosen.forecast.categoryId);
        }
        renderForecastToggleButton_(opts);
      });
    };
  }

  /**
   * Botão "Lembrar categoria?" (mesmo padrão visual, ver renderForecastToggleButton_) --
   * usado pelos 3 menus de lançamento, substitui o antigo checkbox "Lembrar essa
   * categoria...". Puro liga/desliga: clicar alterna o estado (guardado pelo chamador,
   * ver getRemember/setRemember) e o próprio texto/estilo refletem. opts = { fieldId,
   * getKind, getRemember, setRemember }.
   */
  function renderRememberCategoryButton_(opts) {
    var field = document.getElementById(opts.fieldId);
    if (!field) return;
    var remember = opts.getRemember();
    var tooltip = 'Usar esta mesma categoria no próximo lançamento dessa pessoa/estabelecimento';
    var btnId = opts.fieldId + '-btn';
    field.innerHTML = '<span class="field-action-link' + (remember ? ' active' : '') + '" id="' + btnId + '" data-tooltip="' + escapeHtml(tooltip) + '">Lembrar categoria?</span>';
    var btn = document.getElementById(btnId);
    wireTooltipTrigger_(btn);
    btn.onclick = function () {
      opts.setRemember(!opts.getRemember());
      renderRememberCategoryButton_(opts);
    };
  }

  /**
   * Botão "Não considerar em análises?" (mesmo padrão puro liga/desliga de
   * renderRememberCategoryButton_) -- usado pelos 3 menus de lançamento. Marca o
   * lançamento como "fora da curva" (ver ExcludeFromAnalysis, grillado com o usuário):
   * continua contando no saldo real (Extrato/contas/totais do Início), mas fica de fora das
   * análises -- calendário (dias e cabeçalho), TODOS os orçamentos (Manual e Automático),
   * gasto médio mensal (linhas de "X meses" e cores do gráfico de projeção), sugestão de
   * valor de recorrente. opts = { fieldId, getKind, getFlag, setFlag }.
   */
  function renderOutlierToggleButton_(opts) {
    var field = document.getElementById(opts.fieldId);
    if (!field) return;
    var flagged = opts.getFlag();
    var tooltip = 'Marque se esta ' + (opts.getKind() === 'income' ? 'receita' : 'despesa') +
      ' é pontual e não representa um padrão, para não afetar médias/tendências (ex: quitação de dívida, ajuste de saldo)';
    var btnId = opts.fieldId + '-btn';
    field.innerHTML = '<span class="field-action-link' + (flagged ? ' active' : '') + '" id="' + btnId + '" data-tooltip="' + escapeHtml(tooltip) + '">Não considerar em análises?</span>';
    var btn = document.getElementById(btnId);
    wireTooltipTrigger_(btn);
    btn.onclick = function () {
      opts.setFlag(!opts.getFlag());
      renderOutlierToggleButton_(opts);
    };
  }

  /**
   * Lê o valor escolhido (select OU hidden input, ver renderForecastToggleButton_) --
   * continua devolvendo Promise (embutido não tem mais nada assíncrono desde que
   * "criar novo lançamento recorrente" saiu daqui, ver renderForecastToggleButton_),
   * só pra não precisar mexer no .then(...) de quem já chama isso nos 3 menus.
   */
  function resolveForecastSelection_(selectId) {
    var select = document.getElementById(selectId);
    return Promise.resolve(select && select.value ? select.value : undefined);
  }

  /**
   * { daysUntil } pro dia-do-mês configurado desse lançamento recorrente (só existe pra
   * mensal com dia fixo, ver f.dayOfMonth) -- null se não se aplica (não é mensal, ou
   * não tem dia definido). Ancorado sempre no dia-do-mês do mês DE CALENDÁRIO atual
   * (clampado ao último dia dele, ex: dia 31 configurado num mês de 30 vira dia 30) --
   * não tenta reconstruir uma cadeia de ciclos atrasados de meses anteriores, só a
   * ocorrência mais próxima de hoje. O que fazer com esse número (quando virar
   * "atrasado"/"em breve"/"pendente") é decisão de quem chama, ver
   * forecastNextOccurrenceDaysUntil_/forecastRowHtml -- essa função só devolve o dado cru.
   */
  function forecastDueDateInfo_(f) {
    if (f.intervalUnit !== 'months' || f.intervalDays !== 1 || !f.dayOfMonth) return null;
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var ym = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0');
    var clampedDay = Math.min(f.dayOfMonth, daysInMonth_(ym));
    var dueDate = new Date(today.getFullYear(), today.getMonth(), clampedDay);
    var daysUntil = Math.round((dueDate - today) / (1000 * 60 * 60 * 24));
    return { daysUntil: daysUntil };
  }
  /** Lançamento real vinculado mais recente, em QUALQUER data (ao contrário de
   *  forecastLinkedTransactionInPeriod_, que só enxerga dentro da janela rolante atual)
   *  -- null se nunca houve nenhum. Usado pra tag "Pago/Recebido (data)" do ciclo
   *  ANTERIOR e como âncora da próxima ocorrência de um recorrente por intervalo de dias
   *  (ver forecastNextOccurrenceDaysUntil_/forecastRowHtml, grillado com o usuário). */
  function forecastMostRecentLinkedTransaction_(forecast) {
    var linked = STATE.allTransactions
      .filter(function (t) { return t.forecastId === forecast.id && STATE.deletingIds.indexOf(t.id) === -1; })
      .sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    return linked.length ? linked[0] : null;
  }
  /** Duração do ciclo em dias -- mês conta como 30 dias fixos, não o tamanho real do mês
   *  corrente (grillado com o usuário: "15 dias no caso de mensal/30 dias"). Base das 2
   *  referências novas de forecastRowHtml: metade do período (quando trocar a tag do
   *  ciclo anterior por "Pendente") e 1/6 dele (quando "Pendente" vira "Em breve"). */
  function forecastPeriodLengthDays_(forecast) {
    return forecast.intervalUnit === 'months' ? forecast.intervalDays * 30 : forecast.intervalDays;
  }
  /** Dias até a próxima ocorrência esperada -- null quando não dá pra calcular
   *  (recorrente a cada VÁRIOS meses, sem dia fixo simples pra ancorar; ou por intervalo
   *  de dias sem NENHUM lançamento vinculado ainda em qualquer data, ver
   *  mostRecentLinked). Mensal de dia fixo reaproveita forecastDueDateInfo_ (não depende
   *  de histórico nenhum, só do dia configurado); por intervalo de dias soma
   *  intervalDays a partir do lançamento vinculado mais recente (data CRUA, mesma
   *  convenção que o resto da vinculação de previsão já usa -- não é conceito de
   *  orçamento, não usa budgetEffectiveDate_). */
  function forecastNextOccurrenceDaysUntil_(forecast, mostRecentLinked) {
    if (forecast.intervalUnit === 'months' && forecast.intervalDays === 1 && forecast.dayOfMonth) {
      return forecastDueDateInfo_(forecast).daysUntil;
    }
    if (forecast.intervalUnit === 'days' && mostRecentLinked) {
      var next = parseYmdLocal_(mostRecentLinked.date);
      next.setDate(next.getDate() + forecast.intervalDays);
      return Math.round((next - parseYmdLocal_(todayYmd())) / 86400000);
    }
    return null;
  }
  /** "30/08" -- só dia/mês, sem ano (formato usado pelo tooltip de período de uma
   *  bolinha de status, ver forecastCycleTooltipLabel_). ymd já vem só de datas de
   *  verdade, sem precisar validar formato. */
  function fmtDateShort_(ymd) {
    return ymd.slice(8, 10) + '/' + ymd.slice(5, 7);
  }
  /** Info à esquerda de uma previsão (nome/categoria/status empilhados, como accountRowHtml). */
  function forecastIntervalLabel_(f) {
    if (f.intervalUnit === 'months') {
      var label = f.intervalDays === 1 ? 'Mensal' : 'a cada ' + f.intervalDays + ' meses';
      if (f.intervalDays === 1 && f.dayOfMonth) label += ' (dia ' + f.dayOfMonth + ')';
      return label;
    }
    return 'a cada ' + f.intervalDays + ' dias';
  }
  /** Valor de sugestão a MOSTRAR pra essa previsão (ver forecastRowHtml), ou null quando
   *  não há nada a mostrar -- sem sugestão calculável, sugestão igual ao já configurado
   *  (nada a fazer), ou descartada nos últimos 30 dias (ver dismissForecastSuggestion/
   *  Forecasts.js, pedido explícito do usuário: antes só tinha "Aplicar", sem jeito de
   *  dizer "não agora"). Função à parte (não inline em forecastRowHtml) só pra dar pra
   *  testar essa regra isolada, sem precisar da máquina de ícone de categoria junto. */
  function forecastSuggestionToShow_(f) {
    var suggestion = forecastSuggestedAmount(f);
    if (suggestion === null || Math.abs(suggestion - f.expectedAmount) < 1) return null;
    var dismissed = STATE.forecastSuggestionDismissals.some(function (d) { return d.forecastId === f.id; });
    if (dismissed) return null;
    return suggestion;
  }
  function forecastRowHtml(f) {
    // Sempre o valor CONFIGURADO (f.expectedAmount) -- mostrar o valor real do
    // lançamento já vinculado nesse ciclo (pedido explícito do usuário: antes usava o
    // valor real quando já cumprido) confundia com o que está de fato definido no menu
    // de editar. O valor real de cada ciclo já aparece ao clicar na bolinha
    // verde/amarela dele (ver viewForecastCycleTransactions_).
    var amount = f.expectedAmount;
    var amountCls = f.kind === 'income' ? 'amount-income' : 'amount-expense';
    var suggestion = forecastSuggestionToShow_(f);
    var suggestionHtml = suggestion !== null
      ? '<br><span class="muted" style="font-size:12px">Sugestão: ' + fmtMoney(suggestion) +
        ' <button type="button" class="secondary" data-apply-suggestion="' + f.id + '" data-suggestion="' + suggestion + '" style="padding:2px 8px;font-size:11px;margin-left:4px">Aplicar</button>' +
        // <button> IGUAL ao "Aplicar" (mesma classe/estilo, pedido explícito do usuário) --
        // e não um <span>: wireRowTooltip_ só ignora cliques vindos de dentro de um
        // <button>; um <span> deixava o clique borbulhar até a linha e abrir o editar.
        ' <button type="button" class="secondary" data-discard-forecast-suggestion="' + f.id + '" style="padding:2px 8px;font-size:11px;margin-left:4px">Descartar</button></span>'
      : '';
    // Sem tag de status aqui (Pago/Atrasado/etc) -- virou a linha de bolinhas ao lado
    // (ver forecastCycleDotsHtml_/renderBudgets), pedido explícito do usuário.
    return '<span>' + escapeHtml(f.label) + ' <span class="muted">(' + categoryIconHtml_(f.categoryId) + escapeHtml(f.categoryName) + ')</span>' +
      '<br><span class="' + amountCls + '">' + fmtMoney(amount) + '</span><span class="muted"> · ' + forecastIntervalLabel_(f) + '</span>' +
      suggestionHtml +
    '</span>';
  }

  // ---------- linha de bolinhas de status de um Lançamento recorrente (ver grilling) ----------
  var FORECAST_CYCLE_MAX_DOTS_ = 12;
  /** true quando o ciclo (forecastId+cycleStart) foi marcado "Ignorar mês" (ver
   *  ignoreForecastCycleClient_) -- cycleStart é sempre w.fromYmd de uma janela de
   *  forecastCycleWindows_, mesma chave usada pro servidor (ForecastCycleIgnores). */
  function isForecastCycleIgnored_(forecastId, cycleStart) {
    return STATE.forecastCycleIgnores.some(function (x) { return x.forecastId === forecastId && x.cycleStart === cycleStart; });
  }
  /**
   * Até FORECAST_CYCLE_MAX_DOTS_ janelas de ciclo pra linha de bolinhas, da mais ANTIGA
   * pra mais RECENTE (a última = a atual, ver w.isCurrent) -- ordem de exibição
   * esquerda->direita (grillado com o usuário). Mensal de dia fixo (intervalUnit=
   * 'months' && intervalDays===1) usa MÊS DE CALENDÁRIO cheio (dia 1 ao último dia) pra
   * cada bolinha -- é o caso comum que o usuário descreveu ("a última bolinha da
   * direita é o mês atual"). Qualquer outro caso (vários meses, ou intervalo em dias)
   * usa uma janela ROLANTE de intervalDays (meses de verdade ou dias) terminando hoje
   * pra bolinha atual, e voltando um ciclo inteiro por vez pras anteriores -- não tem
   * "mês de calendário" fazendo sentido nesses casos (ver w.isStrictMonthly, usado pelo
   * tooltip/data-alvo de "abrir novo lançamento").
   *
   * Limitada pelo que vier DEPOIS entre "início do engajamento" (Y, mesmo conceito do
   * orçamento Automático) e a própria data de criação do recorrente -- sem isso, um
   * recorrente novo mostraria meses "Atrasado" de antes de ele sequer existir, e
   * qualquer recorrente mostraria isso de antes do usuário sequer começar a usar o app.
   * Esse limite só vale pra ciclos PASSADOS -- a bolinha do ciclo ATUAL sempre aparece
   * (é só "agora", não precisa de histórico pra existir), mesmo sem Y determinado ainda
   * ou o recorrente tendo acabado de ser criado.
   */
  function forecastCycleWindows_(f, maxDots) {
    var isStrictMonthly = f.intervalUnit === 'months' && f.intervalDays === 1;
    var earliestYmd = computeEngagementStartDate_(distinctActiveTransactionDates_());
    if (f.createdAt) {
      var createdYmd = f.createdAt.slice(0, 10);
      if (!earliestYmd || createdYmd > earliestYmd) earliestYmd = createdYmd;
    }
    var todayD = parseYmdLocal_(todayYmd());
    var windows = [];
    for (var i = 0; i < maxDots; i++) {
      var fromYmd, toYmd;
      if (isStrictMonthly) {
        var monthDate = subtractMonths_(todayD, i);
        var ym = monthDate.getFullYear() + '-' + String(monthDate.getMonth() + 1).padStart(2, '0');
        fromYmd = ym + '-01';
        toYmd = ym + '-' + String(daysInMonth_(ym)).padStart(2, '0');
      } else if (f.intervalUnit === 'months') {
        var toDate = subtractMonths_(todayD, f.intervalDays * i);
        var fromDate = subtractMonths_(todayD, f.intervalDays * (i + 1));
        fromDate.setDate(fromDate.getDate() + 1);
        toYmd = ymdFromDate_(toDate);
        fromYmd = ymdFromDate_(fromDate);
      } else {
        var toDate2 = new Date(todayD); toDate2.setDate(toDate2.getDate() - f.intervalDays * i);
        var fromDate2 = new Date(toDate2); fromDate2.setDate(fromDate2.getDate() - (f.intervalDays - 1));
        toYmd = ymdFromDate_(toDate2);
        fromYmd = ymdFromDate_(fromDate2);
      }
      if (i > 0 && (!earliestYmd || toYmd < earliestYmd)) break;
      windows.push({ fromYmd: fromYmd, toYmd: toYmd, isCurrent: i === 0, isStrictMonthly: isStrictMonthly });
    }
    windows.reverse();
    return windows;
  }
  /** "Setembro 2026" (mês de calendário cheio) ou "12/09 a 19/09" (período -- qualquer
   *  outro caso), pro tooltip/cabeçalho do menu "Ignorar mês" de uma bolinha. */
  function forecastCycleTooltipLabel_(w) {
    return w.isStrictMonthly ? fmtMonthYear(w.fromYmd.slice(0, 7)) : fmtDateShort_(w.fromYmd) + ' a ' + fmtDateShort_(w.toYmd);
  }
  /** Lançamento vinculado a esse recorrente dentro da janela w (qualquer ciclo, não só o
   *  atual -- ao contrário de forecastLinkedTransactionInPeriod_, que só enxerga "agora"). */
  function forecastCycleLinkedTransaction_(f, w) {
    return STATE.allTransactions.find(function (t) {
      if (t.forecastId !== f.id || !t.date || STATE.deletingIds.indexOf(t.id) !== -1) return false;
      // Mês do ciclo EXPLÍCITO (pagamento atrasado de um mês passado, ver
      // forecastFieldsFromSelection_): vale só pro ciclo desse mês -- a data do lançamento
      // (que cai em outro mês) não conta. Só pra ciclo mensal de calendário (w.isStrictMonthly);
      // nos demais o campo não se aplica e vale sempre a data.
      if (w.isStrictMonthly && t.forecastCycleMonth) return t.forecastCycleMonth === w.fromYmd.slice(0, 7);
      return t.date >= w.fromYmd && t.date <= w.toYmd;
    }) || null;
  }
  /** Data de vencimento (YYYY-MM-DD) dentro do ciclo w -- só existe pra mensal de dia
   *  fixo (mesma condição de forecastDueDateInfo_/isStrictMonthly), null nos demais
   *  casos (sem dia fixo pra comparar, ver computeForecastCycleStatus_). */
  function forecastCycleDueYmd_(f, w) {
    if (!w.isStrictMonthly || !f.dayOfMonth) return null;
    var ym = w.fromYmd.slice(0, 7);
    var clampedDay = Math.min(f.dayOfMonth, daysInMonth_(ym));
    return ym + '-' + String(clampedDay).padStart(2, '0');
  }
  /**
   * Status de UM ciclo (uma bolinha) -- grillado com o usuário. { state, label }:
   *  - 'ontime'/'late' (verde/amarelo): cumprido dentro da janela; 'late' só quando dá
   *    pra comparar contra um dia de vencimento fixo (forecastCycleDueYmd_ não-null) E
   *    a data do lançamento é DEPOIS dele -- sem dia fixo pra comparar (vários meses,
   *    ou intervalo em dias), sempre 'ontime' se pago (grillado: não arrisca marcar
   *    atrasado sem uma referência confiável).
   *  - 'unpaid' (vermelho): ciclo FECHADO (passado) sem nenhum vínculo, OU o ciclo
   *    ATUAL já vencido (daysUntil<0) sem vínculo -- os 2 casos podem ser "Ignorados"
   *    (grillado: qualquer bolinha vermelha, não só ciclo já fechado).
   *  - 'ignored' (cinza, quase cor de fundo): 'unpaid' que o usuário marcou "Ignorar
   *    mês" -- reversível.
   *  - 'upcoming' (branco piscando): ciclo ATUAL, ainda não vencido, faltam ATÉ 7 dias.
   *  - 'neutral' (cinza clara/contorno vazio): ciclo ATUAL, ainda não vencido, faltam
   *    MAIS de 7 dias (ou não dá pra calcular quantos faltam).
   */
  function computeForecastCycleStatus_(f, w) {
    var linkedTx = forecastCycleLinkedTransaction_(f, w);
    var paidLabel = f.kind === 'income' ? 'Recebido' : 'Pago';
    if (linkedTx) {
      var dueYmd = forecastCycleDueYmd_(f, w);
      var late = dueYmd !== null && linkedTx.date > dueYmd;
      return { state: late ? 'late' : 'ontime', label: paidLabel };
    }
    var unpaidOrIgnored_ = function () {
      // Ignorado (não "Pendente"): o rótulo ao lado das bolinhas mostra o status do ciclo
      // ATUAL -- se o usuário já descartou esse mês, "Pendente" sugeria que ainda faltava
      // fazer algo (pedido explícito do usuário).
      return isForecastCycleIgnored_(f.id, w.fromYmd) ? { state: 'ignored', label: 'Ignorado' } : { state: 'unpaid', label: 'Atrasado' };
    };
    if (!w.isCurrent) return unpaidOrIgnored_();
    var mostRecentLinked = forecastMostRecentLinkedTransaction_(f);
    var daysUntil = forecastNextOccurrenceDaysUntil_(f, mostRecentLinked);
    if (daysUntil !== null && daysUntil < 0) return unpaidOrIgnored_();
    if (daysUntil !== null && daysUntil <= 7) return { state: 'upcoming', label: 'Em breve' };
    return { state: 'neutral', label: 'Pendente' };
  }
  var FORECAST_DOT_LABEL_COLOR_VAR_ = { ontime: '--income', late: '--warning', unpaid: '--expense', neutral: '--text-muted', ignored: '--text-muted' };
  /**
   * HTML da linha de bolinhas + o nome do status atual ao lado, em negrito, na mesma
   * cor (pedido explícito do usuário) -- embutida DENTRO de <div class="row"> (ver
   * renderBudgets), como um irmão flex do <span> de forecastRowHtml, não um <br> a mais
   * nele -- é o que deixa a linha de bolinhas centralizada verticalmente com o resto da
   * linha de graça (mesmo align-items:center que .row já usa). Wiring (tooltip/menu de
   * ignorar/clique) fica à parte, ver setupForecastCycleDots_ -- essa função só monta o
   * HTML estático (mesmo padrão de 2 fases de toda barra/linha deste app).
   *
   * maxDots = maior número de janelas entre TODOS os recorrentes da lista sendo
   * renderizada (ver renderBudgets) -- cada linha com histórico mais curto que isso
   * recebe bolinhas-fantasma INVISÍVEIS (.forecast-dot-placeholder, não-clicáveis) à
   * ESQUERDA das reais, completando o total até maxDots. Isso faz a bolinha ATUAL (a
   * última, de verdade) cair sempre na mesma posição horizontal em toda linha da lista
   * -- "use a bolinha do mês atual como referência" (pedido explícito do usuário, as
   * bolinhas ainda não ficavam alinhadas entre lançamentos recorrentes com históricos de
   * tamanhos diferentes). Track (bolinhas) e o texto do status ficam em containers flex
   * SEPARADOS (.forecast-dots-track / <strong> irmão dela em .forecast-cycle-dots) só
   * pra poder usar um gap MENOR entre a última bolinha e o texto do que o gap entre as
   * bolinhas em si -- "o texto ao lado da bolinha deve ficar mais próximo dela" (pedido
   * explícito do usuário).
   */
  function forecastCycleDotsHtml_(f, maxDots) {
    var windows = forecastCycleWindows_(f, FORECAST_CYCLE_MAX_DOTS_);
    if (!windows.length) return '';
    var placeholderCount = Math.max(0, (maxDots || windows.length) - windows.length);
    var placeholdersHtml = '';
    for (var p = 0; p < placeholderCount; p++) placeholdersHtml += '<span class="forecast-dot-placeholder" aria-hidden="true"></span>';
    var dotsHtml = windows.map(function (w, idx) {
      var status = computeForecastCycleStatus_(f, w);
      var tooltip = forecastCycleTooltipLabel_(w);
      // <button> só como alvo de clique/hover, SEM tamanho/forma próprios
      // (.forecast-dot-btn) -- a bolinha em si é um <span> à parte dentro dele
      // (.forecast-dot), imune a qualquer estilo nativo de <button> que o navegador
      // aplique (padding/line-height/etc. variam entre navegadores mesmo com
      // appearance:none, o que já causou desalinhamento antes -- um <span> sem
      // NENHUMA semântica de controle de formulário não tem esse risco).
      return '<button type="button" class="forecast-dot-btn forecast-dot-btn-' + status.state + '" data-dot-idx="' + idx + '" data-tooltip="' + escapeHtml(tooltip) + '" aria-label="' + escapeHtml(tooltip) + '">' +
        '<span class="forecast-dot forecast-dot-' + status.state + '"></span>' +
      '</button>';
    }).join('');
    var current = windows[windows.length - 1];
    var currentStatus = computeForecastCycleStatus_(f, current);
    var labelColorVar = currentStatus.state === 'upcoming' ? '--text' : (FORECAST_DOT_LABEL_COLOR_VAR_[currentStatus.state] || '--text');
    // line-height:1 -- a altura de linha padrão do navegador é maior que o texto em si,
    // empurrando ele pra baixo do centro real da bolinha.
    // .forecast-cycle-label (min-width fixo, ver Stylesheet.html) -- sem isso, "Pago"
    // (curto) vs "Atrasado"/"Em breve"/"Pendente"/"Recebido" (mais longos) resultariam em
    // LARGURAS TOTAIS diferentes pro grupo bolinhas+texto; como .row-name é quem absorve
    // o espaço sobrando (flex:1) e o grupo fica encostado no botão de remover à direita,
    // o texto mais largo empurraria o TRACK de bolinhas (a bolinha atual incluída) mais
    // pra ESQUERDA nessa linha -- desalinhando de novo as bolinhas entre lançamentos com
    // status atual diferente, mesmo já com as bolinhas-fantasma. Único jeito de garantir
    // a bolinha atual numa posição fixa em toda a lista é fixar as 2 larguras que contam
    // pro grupo: a do track (via bolinha-fantasma) E a do texto (via min-width aqui).
    var labelHtml = '<strong class="forecast-cycle-label" style="color:var(' + labelColorVar + ');font-size:12px;line-height:1;white-space:nowrap">' + escapeHtml(currentStatus.label) + '</strong>';
    return '<span class="forecast-cycle-dots" data-forecast-dots="' + escapeHtml(f.id) + '">' +
      '<span class="forecast-dots-track">' + placeholdersHtml + dotsHtml + '</span>' +
      labelHtml +
    '</span>';
  }
  /** "Ver lançamentos" de uma bolinha verde/amarela: Extrato filtrado na categoria do
   *  recorrente + o período daquele CICLO específico (não o atual -- pode ser qualquer
   *  bolinha), rolando até o dia do lançamento vinculado (mesma animação de clicar num
   *  dia do calendário, ver scrollToTxDay_). */
  function viewForecastCycleTransactions_(f, w, linkedTx) {
    // Pagamento atrasado (ciclo de agosto, lançamento de setembro): a faixa cresce o mínimo
    // pra incluir a data do lançamento -- senão o Extrato do mês daquele ciclo não mostraria
    // o lançamento que a bolinha verde representa.
    var dateFrom = w.fromYmd, dateTo = w.toYmd;
    if (linkedTx && linkedTx.date) {
      if (linkedTx.date < dateFrom) dateFrom = linkedTx.date;
      if (linkedTx.date > dateTo) dateTo = linkedTx.date;
    }
    STATE.txFilters = { categoryIds: [f.categoryId], dateFrom: dateFrom, dateTo: dateTo };
    STATE.currentView = 'transactions';
    delete scrollPositions_.transactions;
    render();
    if (linkedTx) scrollToTxDay_(linkedTx.date);
  }
  /** Clique numa bolinha vermelha: abre "Novo lançamento" já com categoria + vínculo do
   *  recorrente, na data do dia 1 do mês daquele ciclo (mensal de dia fixo) ou do início
   *  do período (demais casos) -- pedido explícito do usuário. */
  function openTransactionModalForForecastCycle_(f, w) {
    openTransactionModal({
      kind: f.kind, categoryId: f.categoryId, forecastId: f.id,
      date: w.isStrictMonthly ? (w.fromYmd.slice(0, 7) + '-01') : w.fromYmd
    });
  }
  function ignoreForecastCycleClient_(forecastId, cycleStart) {
    var entry = { forecastId: forecastId, cycleStart: cycleStart };
    STATE.forecastCycleIgnores.push(entry);
    render();
    afterMutation_(run('ignoreForecastCycle', entry)).catch(function (err) {
      STATE.forecastCycleIgnores = STATE.forecastCycleIgnores.filter(function (x) { return forecastCycleIgnoreKey_(x) !== forecastCycleIgnoreKey_(entry); });
      render();
      showToast(err.message, true);
    });
  }
  function unignoreForecastCycleClient_(forecastId, cycleStart) {
    var idx = STATE.forecastCycleIgnores.findIndex(function (x) { return x.forecastId === forecastId && x.cycleStart === cycleStart; });
    var removed = idx !== -1 ? STATE.forecastCycleIgnores.splice(idx, 1)[0] : null;
    render();
    afterMutation_(run('unignoreForecastCycle', { forecastId: forecastId, cycleStart: cycleStart })).catch(function (err) {
      if (removed) STATE.forecastCycleIgnores.push(removed);
      render();
      showToast(err.message, true);
    });
  }
  /** Segurar (200ms, mesmo valor de setupBudgetBarMenus_) uma bolinha vermelha OU
   *  ignorada revela um mini-card (ver buildBudgetMenuSummaryCard_, reaproveitado tal e
   *  qual: título = período, 1 linha clicável = "Ignorar mês"/"Não ignorar mais") -- o
   *  "dropdown de opção única" pedido pelo usuário. As demais bolinhas usam só um
   *  tooltip de texto puro (ver setupForecastCycleDots_), não fazem sentido oferecer
   *  ignorar algo que não falhou (ainda não venceu) ou que já foi pago. */
  function wireForecastDotIgnoreMenu_(dotEl, f, w, isIgnored) {
    var hold = setupHoldToReveal_(dotEl, { hoverDelayMs: 200 });
    var menuEl = null, stopOutsideClick_ = null;
    hold.onOpen(function () {
      menuEl = document.createElement('div');
      menuEl.style.cssText = 'position:fixed;opacity:0;transform:translateY(6px);' +
        'transition:opacity .15s ease,transform .15s ease;pointer-events:none;z-index:45';
      var card = buildBudgetMenuSummaryCard_(forecastCycleTooltipLabel_(w), [
        { text: isIgnored ? 'Não ignorar mais' : 'Ignorar mês', onClick: function () {
          hold.close();
          if (isIgnored) unignoreForecastCycleClient_(f.id, w.fromYmd); else ignoreForecastCycleClient_(f.id, w.fromYmd);
        } }
      ]);
      menuEl.appendChild(card);
      document.body.appendChild(menuEl);
      hold.joinHoverGroup(menuEl);
      var dotRect = dotEl.getBoundingClientRect();
      var desiredTop = dotRect.top - menuEl.offsetHeight - HOLD_REVEAL_GAP_PX;
      if (desiredTop < 8) desiredTop = dotRect.bottom + HOLD_REVEAL_GAP_PX;
      var clamped = clampToViewport_(dotRect.left, desiredTop, menuEl.offsetWidth, menuEl.offsetHeight);
      menuEl.style.left = clamped.left + 'px';
      menuEl.style.top = clamped.top + 'px';
      menuEl.style.pointerEvents = 'auto';
      requestAnimationFrame(function () { menuEl.style.opacity = '1'; menuEl.style.transform = 'translateY(0)'; });
      stopOutsideClick_ = dismissOnOutsideClick(menuEl, hold.close);
    });
    hold.onClose(function () {
      if (menuEl) { menuEl.remove(); menuEl = null; }
      if (stopOutsideClick_) { stopOutsideClick_(); stopOutsideClick_ = null; }
    });
  }
  /** Religa cada bolinha (tooltip simples, OU o menu de ignorar pras vermelhas/
   *  ignoradas, ver wireForecastDotIgnoreMenu_) + clique -- chamada de novo a cada
   *  renderBudgets() (mesmo padrão de setupBudgetBarMenus_). Recalcula windows/status
   *  do zero (não confia em nada computado na hora do HTML -- pode ter passado tempo/
   *  mudado STATE.allTransactions desde então). */
  function setupForecastCycleDots_(root) {
    root.querySelectorAll('[data-forecast-dots]').forEach(function (wrapEl) {
      var f = STATE.forecasts.find(function (x) { return x.id === wrapEl.dataset.forecastDots; });
      if (!f) return;
      var windows = forecastCycleWindows_(f, FORECAST_CYCLE_MAX_DOTS_);
      wrapEl.querySelectorAll('.forecast-dot-btn').forEach(function (dotEl) {
        var w = windows[Number(dotEl.dataset.dotIdx)];
        if (!w) return;
        var status = computeForecastCycleStatus_(f, w);
        if (status.state === 'unpaid' || status.state === 'ignored') {
          wireForecastDotIgnoreMenu_(dotEl, f, w, status.state === 'ignored');
        } else {
          wireTooltipTrigger_(dotEl);
        }
        dotEl.onclick = function () {
          if (status.state === 'ontime' || status.state === 'late') {
            viewForecastCycleTransactions_(f, w, forecastCycleLinkedTransaction_(f, w));
          } else if (status.state === 'unpaid') {
            openTransactionModalForForecastCycle_(f, w);
          }
        };
      });
    });
  }

  function openForecastModal(existing) {
    var isEdit = !!existing;
    var kind = isEdit ? existing.kind : 'expense';
    var categoryField;

    // Nome/Valor esperado existem nas 2 modalidades com o mesmo sentido — preserva ao
    // trocar Despesa/Receita (só a Categoria reresetando faz sentido, já que categorias
    // de despesa/receita são conjuntos diferentes) — mesmo padrão de openTransactionModal.
    // Categoria é editável nos dois modos (kind em si continua fixo após criar — só a
    // categoria DENTRO desse kind pode mudar, evita órfão tipo despesa virando receita).
    function fieldsHtml(preservedLabel) {
      return '<div class="field"><label>Categoria</label><div id="f-category-field" class="capsule-field"></div></div>' +
      '<div class="field"><label>Nome</label><input id="f-label" value="' + escapeHtml(preservedLabel) + '"></div>' +
      '<div class="field"><label>Valor esperado</label><input id="f-amount" type="text"></div>';
    }

    function wireFields(preservedAmount) {
      setupMoneyInput(document.getElementById('f-amount'), preservedAmount);
      var catItems = rankedCategoryItems(kind);
      function prefillLabelFromCategory() {
        var cat = STATE.categories.find(function (c) { return c.id === categoryField.getValue(); });
        var labelInput = document.getElementById('f-label');
        if (cat && !labelInput.value) labelInput.value = cat.name;
      }
      categoryField = createCapsuleField(document.getElementById('f-category-field'), {
        items: catItems,
        selectedValue: isEdit ? existing.categoryId : undefined,
        onChange: prefillLabelFromCategory
      });
      prefillLabelFromCategory();
    }

    /** Só faz sentido junto de "Mensal" (ver forecastIntervalLabel_) — pros outros
     *  períodos (a cada N dias, ou a cada N meses corridos sem dia fixo), "dia do mês"
     *  não tem o que informar. */
    function updateDayOfMonthFieldVisibility_(unit) {
      var field = document.getElementById('f-day-of-month-field');
      if (field) field.style.display = unit === 'months' ? 'flex' : 'none';
    }

    openModal(
      '<h2>' + (isEdit ? 'Editar lançamento recorrente' : 'Novo lançamento recorrente') + '</h2>' +
      (isEdit ? '' :
        '<div class="kind-toggle" id="f-kind-toggle">' +
          '<button type="button" data-k="expense" class="active">Despesa</button>' +
          '<button type="button" data-k="income">Receita</button>' +
        '</div>') +
      '<div id="f-fields">' + fieldsHtml(isEdit ? existing.label : '') + '</div>' +
      // Período fica FORA de #f-fields de propósito: não depende do kind, então não
      // precisa (e não deveria) resetar quando o toggle Despesa/Receita reconstrói o
      // resto dos campos. Dia do mês fica ao lado das cápsulas (mesma linha, quebra se
      // não couber) em vez de um campo próprio embaixo -- só faz sentido junto de
      // "Mensal" mesmo, então visualmente é um complemento do Período, não um campo
      // novo e independente.
      '<div class="field">' +
        '<label>Período</label>' +
        '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">' +
          '<div id="f-interval-field" class="capsule-field" style="margin-bottom:0"></div>' +
          '<div id="f-day-of-month-field" class="muted" style="display:none;align-items:center;gap:6px">' +
            '<span>no dia</span>' +
            '<input id="f-day-of-month" type="text" inputmode="numeric" value="' + (isEdit && existing.dayOfMonth ? existing.dayOfMonth : '') + '" placeholder="Ex: 5" style="width:44px;text-align:center;margin:0;padding:6px 8px">' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<button id="m-submit">Salvar</button>'
    );
    wireFields(isEdit ? existing.expectedAmount : 0);
    var dayOfMonthInput_ = document.getElementById('f-day-of-month');
    // Máscara em tempo real: só dígitos, nunca mais que 31 (maior dia possível). Não
    // barra um "0" isolado -- ainda pode virar um "0X" válido (05, 09) com mais um
    // dígito; dia=0 sozinho já é barrado na validação de Salvar.
    dayOfMonthInput_.oninput = function () {
      var v = dayOfMonthInput_.value.replace(/\D/g, '').slice(0, 2);
      if (v !== '' && Number(v) > 31) v = '31';
      dayOfMonthInput_.value = v;
    };
    var intervalField = createIntervalDaysField(document.getElementById('f-interval-field'), {
      monthlyLabel: true,
      unitAware: true,
      selectedDays: isEdit ? existing.intervalDays : 1,
      selectedUnit: isEdit ? existing.intervalUnit : 'months',
      onChange: function (interval) { updateDayOfMonthFieldVisibility_(interval.unit); }
    });
    updateDayOfMonthFieldVisibility_(isEdit ? existing.intervalUnit : 'months');

    if (!isEdit) {
      document.querySelectorAll('#f-kind-toggle button').forEach(function (b) {
        b.onclick = function () {
          kind = b.dataset.k;
          document.querySelectorAll('#f-kind-toggle button').forEach(function (x) { x.classList.toggle('active', x === b); });
          var prevAmountEl = document.getElementById('f-amount');
          var preservedLabel = (document.getElementById('f-label') || {}).value || '';
          var preservedAmount = (prevAmountEl && prevAmountEl.getValue) ? prevAmountEl.getValue() : 0;
          document.getElementById('f-fields').innerHTML = fieldsHtml(preservedLabel);
          wireFields(preservedAmount);
        };
      });
    }

    document.getElementById('m-submit').onclick = function () {
      var submitBtn = document.getElementById('m-submit');
      var amount = document.getElementById('f-amount').getValue();
      if (!amount || amount <= 0) { errorPopover(submitBtn, 'Valor esperado precisa ser maior que zero.'); return; }
      var label = document.getElementById('f-label').value.trim();
      if (!label) { errorPopover(submitBtn, 'Nome é obrigatório.'); return; }
      var categoryId = categoryField ? categoryField.getValue() : null;
      if (!categoryId) { errorPopover(submitBtn, 'Escolha uma categoria.'); return; }
      var interval = intervalField.getValue(); // { value, unit }
      var dayOfMonthEl = document.getElementById('f-day-of-month');
      var dayOfMonthRaw = (interval.unit === 'months' && dayOfMonthEl) ? dayOfMonthEl.value.trim() : '';
      var dayOfMonth = dayOfMonthRaw ? Number(dayOfMonthRaw) : null;
      if (dayOfMonth !== null && (!Number.isInteger(dayOfMonth) || dayOfMonth < 1 || dayOfMonth > 31)) {
        errorPopover(submitBtn, 'Dia do mês precisa ser um número inteiro entre 1 e 31.');
        return;
      }
      var category = STATE.categories.find(function (c) { return c.id === categoryId; });

      if (isEdit) {
        closeModal();
        var f = STATE.forecasts.find(function (x) { return x.id === existing.id; });
        var prev = f ? {
          label: f.label, expectedAmount: f.expectedAmount, intervalDays: f.intervalDays, intervalUnit: f.intervalUnit,
          categoryId: f.categoryId, categoryName: f.categoryName, dayOfMonth: f.dayOfMonth
        } : null;
        if (f) {
          f.label = label; f.expectedAmount = amount; f.intervalDays = interval.value; f.intervalUnit = interval.unit;
          f.categoryId = categoryId; f.categoryName = category ? category.name : f.categoryName; f.dayOfMonth = dayOfMonth;
        }
        render();
        // Mesmo motivo do Editar de orçamento/plano: o PRÓPRIO lançamento recorrente
        // pode ainda estar com ID temporário se acabou de ser criado — e agora a
        // CATEGORIA escolhida aqui também pode (ver resolveRealId_ nos dois abaixo).
        afterMutation_(Promise.all([resolveRealId_(existing.id), resolveRealId_(categoryId)]).then(function (resolved) {
          var realId = resolved[0], realCategoryId = resolved[1];
          return run('updateForecast', {
            id: realId, categoryId: realCategoryId, label: label, expectedAmount: amount,
            intervalDays: interval.value, intervalUnit: interval.unit, dayOfMonth: dayOfMonth
          }).then(function (updated) {
            // Protege contra o refresh coalescido revertendo essa edição por trás se a
            // leitura dele ainda não alcançou (ver reapplyPendingEdits_) — sem isso,
            // editar vários lançamentos recorrentes em sequência rápida fazia alguns
            // reverterem por alguns segundos até uma leitura mais tardia se assentar.
            pendingForecastEdits_[realId] = {
              label: label, expectedAmount: amount, intervalDays: interval.value, intervalUnit: interval.unit,
              categoryId: realCategoryId, dayOfMonth: dayOfMonth
            };
            return updated;
          });
        })).catch(function (err) {
          if (f && prev) {
            f.label = prev.label; f.expectedAmount = prev.expectedAmount; f.intervalDays = prev.intervalDays; f.intervalUnit = prev.intervalUnit;
            f.categoryId = prev.categoryId; f.categoryName = prev.categoryName; f.dayOfMonth = prev.dayOfMonth;
          }
          render();
          showToast(err.message, true);
        });
      } else {
        closeModal();
        var tempId = 'tmp-' + Math.random().toString(36).slice(2);
        STATE.forecasts.push({
          id: tempId, kind: kind, categoryId: categoryId, categoryName: category ? category.name : '',
          label: label, expectedAmount: amount, intervalDays: interval.value, intervalUnit: interval.unit, dayOfMonth: dayOfMonth, archived: false
        });
        render();
        // Espera a categoria terminar de ser criada de verdade se ainda for um ID
        // temporário — ver pendingCreations_/resolveRealId_. pendingCreations_
        // registrado — mesmo motivo do createBudget/createPlan: sem isso,
        // Remover/Editar nesse lançamento recorrente recém-criado antes do servidor
        // confirmar mandava o ID temporário pro servidor ("não encontrado").
        var forecastCreation_ = resolveRealId_(categoryId).then(function (realCategoryId) {
          return run('createForecast', {
            kind: kind, categoryId: realCategoryId, label: label, expectedAmount: amount,
            intervalDays: interval.value, intervalUnit: interval.unit, dayOfMonth: dayOfMonth
          });
        }).then(function (created) {
          return adoptRealId_(STATE.forecasts, tempId, created.ID);
        });
        pendingCreations_[tempId] = forecastCreation_;
        afterMutation_(forecastCreation_).catch(function (err) {
          var idx = STATE.forecasts.findIndex(function (x) { return x.id === tempId; });
          if (idx !== -1) STATE.forecasts.splice(idx, 1);
          render();
          showToast(err.message, true);
        }).finally(function () { delete pendingCreations_[tempId]; });
      }
    };
  }

  /**
   * Valor MENSAL de um orçamento pro mês ym (ver scaledLimitForMonth_: b.amount projetado
   * pro tamanho do mês). Orçamento Automático não tem b.amount/b.intervalDays reais pra
   * escalar (viram só placeholders enquanto periodMode for 'auto', ver openBudgetModal) --
   * usa o teto Automático DERIVADO (mesmo cálculo da barra, ver computeBudgetAutoProgress_)
   * já escalado pro tamanho do mês, do mesmo jeito que scaledLimitForMonth_ faz pros
   * manuais. Sem histórico suficiente ainda (autoWindowDays null), conta 0 -- não dá pra
   * estimar nada. Base do "R$ X / mês" do cabeçalho de Orçamentos E da ordem da lista.
   */
  function budgetMonthlyAmount_(b, ym, autoWindowDays) {
    if (b.periodMode === 'auto') {
      if (!autoWindowDays) return 0;
      return computeBudgetAutoProgress_(b.categoryIds, autoWindowDays).shimBudget.amount * (daysInMonth_(ym) / autoWindowDays);
    }
    return scaledLimitForMonth_(b, ym);
  }
  /** Ordem da lista de Orçamentos: maior valor mensal primeiro (monthlyById = { id:
   *  valor mensal }, ver budgetMonthlyAmount_ -- pré-calculado porque o de um Automático é
   *  caro e o sort compararia o mesmo item várias vezes); empate pelo nome da categoria
   *  (mesma ordem de antes), o que também mantém estável a fileira de Automáticos ainda
   *  sem histórico (todos 0). */
  function sortBudgetsByMonthlyDesc_(budgets, monthlyById) {
    return budgets.slice().sort(function (a, b) {
      var diff = monthlyById[b.id] - monthlyById[a.id];
      return diff !== 0 ? diff : byBudgetCategoryNamePt_(a, b);
    });
  }
  /** Ordem da lista de Lançamentos recorrentes: receitas primeiro, despesas depois (como
   *  sempre), e dentro de cada grupo o maior valor MENSAL primeiro -- não o valor
   *  configurado cru (ver forecastMonthlyAverage_: R$ 100 a cada 7 dias vale ~R$ 430/mês,
   *  mais que um R$ 300 mensal); empate pelo nome. */
  function sortForecastsByMonthlyDesc_(forecasts, ym) {
    return forecasts.slice().sort(function (a, b) {
      if (a.kind !== b.kind) return a.kind === 'income' ? -1 : 1;
      var diff = forecastMonthlyAverage_(b, ym) - forecastMonthlyAverage_(a, ym);
      return diff !== 0 ? diff : String(a.label).localeCompare(String(b.label), 'pt-BR');
    });
  }

  function renderBudgets() {
    var root = document.getElementById('view-root');
    var d = STATE.dashboard;
    if (!d) {
      root.innerHTML = STATE.bootstrapped
        ? '<div class="card"><div class="empty-state">Não foi possível carregar o orçamento.</div>' +
          '<div style="text-align:center"><button id="retry-budgets">Tentar novamente</button></div></div>'
        : '<div class="empty-state">Carregando…</div>';
      var retryBtn = document.getElementById('retry-budgets');
      if (retryBtn) retryBtn.onclick = function () { refreshAll().then(render).catch(function (err) { showToast(err.message, true); render(); }); };
      return;
    }

    // isUnbudgetedCatchAll fica de fora da lista -- ela só existe como barra no
    // Dashboard (ver buildBudgetTimelineHtml), não tem categoria/valor pra mostrar aqui
    // e não deveria poder ser removida por essa lista (ver wireRowRemoveButtons_ abaixo).
    var autoWindowDaysForList_ = budgetAutoWindowDays_();
    // Maior valor mensal (proporcional ao mês de referência) primeiro -- pedido explícito
    // do usuário; o mesmo número alimenta o "R$ X / mês" do título, logo abaixo.
    var budgetMonthlyById_ = {};
    var activeBudgets = STATE.budgets.filter(function (b) { return !b.archived && !b.isUnbudgetedCatchAll; });
    activeBudgets.forEach(function (b) { budgetMonthlyById_[b.id] = budgetMonthlyAmount_(b, d.month, autoWindowDaysForList_); });
    var budgets = sortBudgetsByMonthlyDesc_(activeBudgets, budgetMonthlyById_);
    var budgetsHtml = budgets.map(function (b) {
      // Modo + Valor (o que está REALMENTE valendo, mesmo em Automático -- pedido
      // explícito do usuário, antes só mostrava o período nesse caso) + Período, sempre
      // nessa ordem, pros 2 modos.
      var subtitle;
      if (b.periodMode === 'auto') {
        subtitle = autoWindowDaysForList_
          ? 'Automático · ' + fmtMoneyNoCents_(computeBudgetAutoProgress_(b.categoryIds, autoWindowDaysForList_).shimBudget.amount) + ' · ' + autoWindowDaysForList_ + ' dias'
          : 'Automático · histórico insuficiente';
      } else {
        subtitle = 'Manual · ' + fmtMoneyNoCents_(b.amount) + ' · ' + b.intervalDays + ' dias';
      }
      // Sugestão de trocar Manual<->Automático (ver budgetModeSwitchSuggestion_) --
      // inline, dentro da PRÓPRIA linha do orçamento (pedido explícito do usuário), não
      // como uma sugestão separada no fim da lista (essa é só pra orçamento NOVO, ver
      // suggestionsHtml logo abaixo).
      var modeSwitch = budgetModeSwitchSuggestion_(b);
      // Botões (mesmo visual/tamanho de "Aplicar"/"Descartar" da sugestão de valor de
      // recorrente), não <span>: wireRowTooltip_ só ignora cliques vindos de dentro de um
      // <button> -- um <span> deixava o clique borbulhar até a linha e abrir o editar.
      var modeSwitchHtml = modeSwitch
        ? '<br><span style="font-size:12px">' + escapeHtml(budgetModeSwitchMessage_(modeSwitch)) + ' ' +
            '<button type="button" class="secondary" data-confirm-mode-switch="' + escapeHtml(b.id) + '" style="padding:2px 8px;font-size:11px;margin-left:4px">Mudar</button>' +
            '<button type="button" class="secondary" data-discard-mode-switch="' + escapeHtml(b.id) + '" data-mode-switch-direction="' + modeSwitch.direction + '" style="padding:2px 8px;font-size:11px;margin-left:4px">Ignorar</button>' +
          '</span>'
        : '';
      return '<div class="row" data-row-budget="' + escapeHtml(b.id) + '"><span>' + budgetIconHtml_(b) + escapeHtml(b.categoryName) + '<br><span class="muted">' + subtitle + '</span>' + modeSwitchHtml + '</span>' +
        '<span class="row-actions">' + rowRemoveButtonHtml_('data-remove', b.id, 'Remover') + '</span></div>';
    }).join('');

    // Sugestões de novo orçamento (ver computeBudgetSuggestions_) — no final da lista,
    // com um visual diferente (fundo tintado + selo "Sugestão") pros orçamentos de
    // verdade não se confundirem com elas.
    var suggestions = computeBudgetSuggestions_();
    var suggestionsHtml = suggestions.map(function (s) {
      return '<div class="row" style="background:var(--bg);border-radius:8px;padding:8px">' +
          '<span><span class="badge">Sugestão</span> ' + categoryIconHtml_(s.categoryId) + escapeHtml(s.categoryName) +
            '<br><span class="muted">' + fmtMoneyNoCents_(s.suggestedAmount) + ' · a cada 30 dias · ' + s.count +
            (s.count === 1 ? ' lançamento recente' : ' lançamentos recentes') + '</span></span>' +
          '<span class="row-actions">' +
            '<button data-confirm-suggestion="' + s.categoryId + '">Confirmar</button>' +
            '<button class="secondary" data-discard-suggestion="' + s.categoryId + '">Descartar</button>' +
          '</span></div>';
    }).join('');

    var listHtml = (budgetsHtml || '<div class="empty-state">Nenhum orçamento definido ainda.</div>') + suggestionsHtml;

    // Proporcional de todos os orçamentos ativos pro mês de referência (mesma escala de
    // scaledLimitForMonth_, já usada pra projetar um orçamento de N dias num mês --
    // pedido explícito do usuário, na mesma linha do título do card). Some vazio (sem
    // subtítulo) quando não há nenhum orçamento -- "R$ 0 / mês" ao lado de "Nenhum
    // orçamento definido ainda" só repetiria a mesma informação. Só o "R$ X" fica
    // colorido (amount-expense -- orçamento só existe pra categoria de despesa), não o
    // "/ mês" (pedido explícito do usuário).
    // Automático sem histórico conta 0, Automático com histórico usa o teto derivado
    // escalado pro mês -- ver budgetMonthlyAmount_.
    var budgetsMonthlyTotal = budgets.reduce(function (sum, b) { return sum + budgetMonthlyById_[b.id]; }, 0);
    var budgetsSubtitleHtml = !budgets.length ? '' :
      '<div style="font-size:13px;color:var(--text-muted)"><span class="amount-expense">' + escapeHtml(fmtMoneyNoCents_(budgetsMonthlyTotal)) + '</span> / mês</div>';

    // Receitas primeiro, despesas depois, cada grupo do maior pro menor valor MENSAL
    // (proporcional ao período de cada recorrência, pedido explícito do usuário) -- ver
    // sortForecastsByMonthlyDesc_.
    var forecasts = sortForecastsByMonthlyDesc_(STATE.forecasts.filter(function (f) { return !f.archived; }), d.month);
    // Maior nº de janelas entre todos os recorrentes da lista -- repassado pra
    // forecastCycleDotsHtml_ preencher com bolinhas-fantasma as linhas com histórico mais
    // curto, alinhando a bolinha ATUAL (a última) na mesma posição em toda a lista.
    var forecastCycleMaxDotsInList_ = forecasts.reduce(function (max, f) {
      return Math.max(max, forecastCycleWindows_(f, FORECAST_CYCLE_MAX_DOTS_).length);
    }, 1);
    // .forecast-row-right agrupa bolinhas+botão de remover num ÚNICO filho flex de
    // .row -- fundamental pro alinhamento das bolinhas: .row usa justify-content:
    // space-between com os filhos correndo soltos (sem flex-grow em nenhum), então SEM
    // esse agrupador o nome do lançamento (1º filho, comprimento variável de linha pra
    // linha) reparte o espaço livre com as bolinhas (2º filho) nos 2 gaps do
    // space-between -- ou seja, a POSIÇÃO das bolinhas dependia do tamanho do NOME de
    // CADA lançamento, não só do conteúdo das próprias bolinhas (bug real por trás do
    // desalinhamento -- as correções de bolinha-fantasma/largura fixa do texto, sozinhas,
    // não bastavam). Com bolinhas+botão como um único filho, .row só tem 2 filhos: o
    // agrupador fica coladinho na borda direita da linha (2 filhos + space-between = 1º
    // encosta na esquerda, 2º na direita, sempre, não importa o tamanho do 1º) -- e a
    // partir daí só o layout INTERNO do agrupador (que já é todo largura fixa) decide
    // onde a bolinha atual cai.
    var forecastListHtml = forecasts.map(function (f) {
      return '<div class="row" data-row-forecast="' + escapeHtml(f.id) + '">' + forecastRowHtml(f) +
        '<span class="forecast-row-right">' +
          forecastCycleDotsHtml_(f, forecastCycleMaxDotsInList_) +
          '<span class="row-actions">' + rowRemoveButtonHtml_('data-remove-forecast', f.id, 'Remover') + '</span>' +
        '</span>' +
      '</div>';
    }).join('') || '<div class="empty-state">Nenhum lançamento recorrente cadastrado ainda.</div>';

    // Mesmo proporcional mensal (forecastMonthlyAverage_, já usado por
    // recurringMonthlyDeltaForMonth_ na projeção de saldo), separado por receita/despesa,
    // na mesma linha do título do card. Só o "R$ X" de cada um fica colorido (igual toda
    // quantia do app, ver .amount-income/.amount-expense), não o "/ mês" (pedido
    // explícito do usuário).
    var forecastsIncomeMonthly = forecasts.filter(function (f) { return f.kind === 'income'; })
      .reduce(function (sum, f) { return sum + forecastMonthlyAverage_(f, d.month); }, 0);
    var forecastsExpenseMonthly = forecasts.filter(function (f) { return f.kind === 'expense'; })
      .reduce(function (sum, f) { return sum + forecastMonthlyAverage_(f, d.month); }, 0);
    // line-height:16px explícito (o do subtítulo de Orçamentos, logo abaixo, dá 16px sozinho
    // com "normal"): a fonte Utendo NÃO tem o glifo "·" -- ele cai numa fonte reserva de
    // métrica maior, que esticava a linha de 16px pra 19px e empurrava o texto ~1px pra
    // baixo do título (medido num navegador de verdade). Sem "·" (caso de Orçamentos) não
    // acontece; com line-height fixo, não acontece de jeito nenhum.
    var forecastsSubtitleHtml = !forecasts.length ? '' :
      '<div style="font-size:13px;line-height:16px;color:var(--text-muted)">Receitas ' +
        '<span class="amount-income">' + escapeHtml(fmtMoneyNoCents_(forecastsIncomeMonthly)) + '</span> / mês · Despesas ' +
        '<span class="amount-expense">' + escapeHtml(fmtMoneyNoCents_(forecastsExpenseMonthly)) + '</span> / mês' +
      '</div>';

    var plans = STATE.plans.slice().sort(function (a, b) { return a.month.localeCompare(b.month); });
    var plansHtml = plans.map(function (p) {
      var cls = p.kind === 'expense' ? 'amount-expense' : 'amount-income';
      var sign = p.kind === 'expense' ? '-' : '+';
      return '<div class="row" data-row-plan="' + escapeHtml(p.id) + '"><span>' + escapeHtml(p.label) + '<br><span class="muted">' + fmtMonthYear(p.month) + '</span></span>' +
        '<span class="row-actions">' +
          '<span class="' + cls + '">' + sign + ' ' + fmtMoney(p.amount) + '</span>' +
          rowRemoveButtonHtml_('data-remove-plan', p.id, 'Remover') +
        '</span></div>';
    }).join('') || '<div class="empty-state">Nenhum plano cadastrado ainda.</div>';

    root.innerHTML =
      buildBalanceTrendHtml_() +
      '<div class="card"><h2>Planos</h2>' + plansHtml + '</div>' +
      '<div class="card"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px"><h2 style="margin:0">Lançamentos recorrentes</h2>' + forecastsSubtitleHtml + '</div>' + forecastListHtml + '</div>' +
      '<div style="text-align:left;margin-bottom:16px"><button id="add-forecast">Novo lançamento recorrente</button></div>' +
      '<div class="card"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px"><h2 style="margin:0">Orçamentos</h2>' + budgetsSubtitleHtml + '</div>' + listHtml + '</div>' +
      '<div style="text-align:left;margin-bottom:16px"><button id="add-budget">Novo orçamento</button></div>';

    renderBalanceTrendChart_();

    root.querySelectorAll('[data-row-budget]').forEach(function (rowEl) {
      wireRowTooltip_(rowEl, 'orçamento', function () {
        var b = STATE.budgets.find(function (x) { return x.id === rowEl.dataset.rowBudget; });
        if (b) openBudgetModal(b);
      });
    });
    wireRowRemoveButtons_(root, '[data-remove]', 'Remover este orçamento?', function (btn) {
      var rawId = btn.dataset.remove;
      var idx = STATE.budgets.findIndex(function (x) { return x.id === rawId; });
      var removed = idx !== -1 ? STATE.budgets.splice(idx, 1)[0] : null;
      render();
      // Espera a criação DESSE orçamento terminar se ele ainda tiver ID temporário
      // (acabou de ser criado e o usuário já clicou em Remover antes do servidor
      // confirmar) — sem isso, mandava o ID temporário pro servidor, que respondia
      // "Orçamento não encontrado" (ele existe, só que com outro ID).
      afterMutation_(resolveRealId_(rawId).then(function (realId) {
        return run('removeBudget', realId);
      })).catch(function (err) {
        if (removed) STATE.budgets.splice(idx, 0, removed);
        render();
        showToast(err.message, true);
      });
    });
    document.getElementById('add-budget').onclick = function () { openBudgetModal(); };
    // Confirmar abre o modal pra revisar/ajustar antes de salvar (pedido explícito do
    // usuário -- mesmo caminho que uma sugestão clicada nas barras do Dashboard usa, ver
    // buildBudgetTimelineHtml), não cria mais direto num clique só.
    root.querySelectorAll('[data-confirm-suggestion]').forEach(function (btn) {
      btn.onclick = function () {
        var categoryId = btn.dataset.confirmSuggestion;
        var s = suggestions.find(function (x) { return x.categoryId === categoryId; });
        if (!s) return;
        openBudgetModal(null, {
          suggestion: { type: 'new', categoryId: s.categoryId, categoryIds: [s.categoryId], suggestedIntervalDays: BUDGET_SUGGESTION_WINDOW_DAYS, suggestedAmount: s.suggestedAmount }
        });
      };
    });
    root.querySelectorAll('[data-discard-suggestion]').forEach(function (btn) {
      btn.onclick = function () {
        var categoryId = btn.dataset.discardSuggestion;
        var entry = { type: 'new', categoryId: categoryId, dismissedAt: new Date().toISOString() };
        STATE.budgetSuggestionDismissals.push(entry);
        render();
        afterMutation_(run('dismissBudgetSuggestion', categoryId)).catch(function (err) {
          STATE.budgetSuggestionDismissals = STATE.budgetSuggestionDismissals.filter(function (d) { return dismissalKey_(d) !== dismissalKey_(entry); });
          render();
          showToast(err.message, true);
        });
      };
    });
    // Sugestão de trocar Manual<->Automático (ver budgetModeSwitchSuggestion_) -- "Mudar"
    // abre o modal pra revisar/ajustar antes de salvar, mesmo princípio de toda sugestão
    // deste arquivo; recalcula na hora do clique (não guarda o objeto do momento do
    // render) pra nunca agir sobre um sinal desatualizado.
    root.querySelectorAll('[data-confirm-mode-switch]').forEach(function (btn) {
      btn.onclick = function () {
        var budgetId = btn.dataset.confirmModeSwitch;
        var b = STATE.budgets.find(function (x) { return x.id === budgetId; });
        var modeSwitch = b ? budgetModeSwitchSuggestion_(b) : null;
        if (!b || !modeSwitch) return;
        openBudgetModal(b, { suggestion: modeSwitch });
      };
    });
    root.querySelectorAll('[data-discard-mode-switch]').forEach(function (btn) {
      btn.onclick = function () {
        dismissBudgetModeSwitchClient_(btn.dataset.discardModeSwitch, btn.dataset.modeSwitchDirection);
      };
    });

    setupForecastCycleDots_(root);
    root.querySelectorAll('[data-row-forecast]').forEach(function (rowEl) {
      wireRowTooltip_(rowEl, 'lançamento recorrente', function () {
        var f = STATE.forecasts.find(function (x) { return x.id === rowEl.dataset.rowForecast; });
        if (f) openForecastModal(f);
      });
    });
    wireRowRemoveButtons_(root, '[data-remove-forecast]', 'Remover este lançamento recorrente?', function (btn) {
      var rawId = btn.dataset.removeForecast;
      var idx = STATE.forecasts.findIndex(function (x) { return x.id === rawId; });
      var removed = idx !== -1 ? STATE.forecasts.splice(idx, 1)[0] : null;
      render();
      // Mesmo motivo do Remover de orçamento/plano: espera o ID temporário
      // resolver se acabou de ser criado e o servidor ainda não confirmou.
      afterMutation_(resolveRealId_(rawId).then(function (realId) {
        return run('removeForecast', realId);
      })).catch(function (err) {
        if (removed) STATE.forecasts.splice(idx, 0, removed);
        render();
        showToast(err.message, true);
      });
    });
    root.querySelectorAll('[data-apply-suggestion]').forEach(function (btn) {
      btn.onclick = function () {
        var id = btn.dataset.applySuggestion;
        var newAmount = Number(btn.dataset.suggestion);
        var f = STATE.forecasts.find(function (x) { return x.id === id; });
        var prevAmount = f ? f.expectedAmount : null;
        if (f) f.expectedAmount = newAmount;
        render();
        afterMutation_(run('updateForecast', { id: id, expectedAmount: newAmount }).then(function (updated) {
          pendingForecastEdits_[id] = { expectedAmount: newAmount };
          return updated;
        })).catch(function (err) {
          if (f && prevAmount !== null) f.expectedAmount = prevAmount;
          render();
          showToast(err.message, true);
        });
      };
    });
    root.querySelectorAll('[data-discard-forecast-suggestion]').forEach(function (btn) {
      btn.onclick = function () {
        var forecastId = btn.dataset.discardForecastSuggestion;
        var entry = { forecastId: forecastId, dismissedAt: new Date().toISOString() };
        STATE.forecastSuggestionDismissals.push(entry);
        render();
        afterMutation_(run('dismissForecastSuggestion', forecastId)).catch(function (err) {
          STATE.forecastSuggestionDismissals = STATE.forecastSuggestionDismissals.filter(function (d) { return d.forecastId !== forecastId; });
          render();
          showToast(err.message, true);
        });
      };
    });
    document.getElementById('add-forecast').onclick = function () { openForecastModal(); };

    root.querySelectorAll('[data-row-plan]').forEach(function (rowEl) {
      wireRowTooltip_(rowEl, 'plano', function () {
        var p = STATE.plans.find(function (x) { return x.id === rowEl.dataset.rowPlan; });
        if (p) openPlanModal(p);
      });
    });
    wireRowRemoveButtons_(root, '[data-remove-plan]', 'Remover este plano?', function (btn) {
      var rawId = btn.dataset.removePlan;
      var idx = STATE.plans.findIndex(function (x) { return x.id === rawId; });
      var removed = idx !== -1 ? STATE.plans.splice(idx, 1)[0] : null;
      render();
      // Mesmo motivo do Remover de orçamento: espera o ID temporário resolver se o
      // plano acabou de ser criado e o servidor ainda não confirmou.
      afterMutation_(resolveRealId_(rawId).then(function (realId) {
        return run('removePlan', realId);
      })).catch(function (err) {
        if (removed) STATE.plans.splice(idx, 0, removed);
        render();
        showToast(err.message, true);
      });
    });
  }

  /** "Alimentação, Padaria" -> "Alimentação / Padaria", alfabético — mesma regra do servidor (ver listBudgets, Budgets.js). */
  /**
   * "Alimentação, Padaria" -> "Alimentação / Padaria" (regra de sempre), ou os 2 casos
   * especiais de nome que o servidor também aplica (ver classifyBudgetCategorySelection_,
   * Budgets.js) — reproduzido aqui só pra prévia otimista já nascer com o nome certo,
   * sem esperar o servidor confirmar pra corrigir.
   */
  function joinBudgetCategoryNames_(categoryIds) {
    var topLevelSelected = categoryIds.filter(function (id) {
      var c = STATE.categories.find(function (x) { return x.id === id; });
      return c && !c.parentId;
    });
    if (topLevelSelected.length === 1) {
      var parent = STATE.categories.find(function (c) { return c.id === topLevelSelected[0]; });
      var otherSelectedIds = categoryIds.filter(function (id) { return id !== parent.id; });
      if (otherSelectedIds.length === 0) return parent.name + ' (sem subcategorias)';
      var currentChildrenIds = STATE.categories.filter(function (c) { return c.parentId === parent.id && !c.archived; }).map(function (c) { return c.id; });
      var otherSelectedSet = {};
      otherSelectedIds.forEach(function (id) { otherSelectedSet[id] = true; });
      var matchesAllChildren = currentChildrenIds.length > 0 && currentChildrenIds.length === otherSelectedIds.length &&
        currentChildrenIds.every(function (id) { return otherSelectedSet[id]; });
      if (matchesAllChildren) return parent.name;
    }
    return categoryIds.map(function (id) {
      var c = STATE.categories.find(function (x) { return x.id === id; });
      return c ? c.name : '';
    }).filter(function (n) { return n; }).sort(function (a, b) { return a.localeCompare(b, 'pt-BR'); }).join(' / ');
  }

  /**
   * opts.suggestion (só quando aberto a partir de uma sugestão de NOVO orçamento -- ver
   * computeBudgetSuggestions_): { type: 'new', categoryId, categoryIds,
   * suggestedIntervalDays, suggestedAmount }. Nasce com categoria/período/valor já
   * preenchidos com os valores sugeridos (sempre em modo MANUAL, nunca Automático -- a
   * sugestão já vem de um período/valor concreto calculado a partir do histórico real
   * dessa categoria, então não faz sentido oferecer Automático por cima). Botão de
   * salvar vira "Confirmar sugestão", e aparece "Descartar sugestão" (marca a categoria
   * como descartada por 30 dias e fecha sem salvar).
   *
   * Período "Automático" (ver createIntervalDaysField/budgetAutoWindowDays_) é o padrão
   * pra orçamento NOVO (pedido explícito do usuário) -- período/valor passam a ser
   * derivados de Y, e o campo Valor vira só um texto "Automático" (sem editar nada).
   * Trocar de volta pra um período manual restaura o ÚLTIMO valor/período manual (dessa
   * MESMA sessão do modal, ou o gravado no banco se ainda não foi trocado nesta sessão)
   * -- nunca escreve amount/intervalDays no servidor enquanto o modo for 'auto'
   * (updateBudget simplesmente não recebe esses campos nesse caso), então o valor
   * anterior fica intacto na planilha sozinho.
   */
  function openBudgetModal(existing, opts) {
    opts = opts || {};
    var suggestion = opts.suggestion || null;
    var isEdit = !!existing;
    // Categorias/subs já usadas em QUALQUER OUTRO orçamento ativo — lista estática, sem
    // rollup automático de subcategoria (ver spentForBudgetInRange_): uma subcategoria
    // só sai da oferta se ela mesma (não só a categoria-mãe) já estiver noutro orçamento.
    // Ao editar, as categorias do PRÓPRIO orçamento não contam como "já usadas" (senão
    // sumiriam da oferta e não daria pra mantê-las selecionadas).
    var budgetedCategoryIds = [];
    STATE.budgets.filter(function (b) { return !b.archived && (!isEdit || b.id !== existing.id); })
      .forEach(function (b) { budgetedCategoryIds = budgetedCategoryIds.concat(b.categoryIds); });

    openModal(
      '<h2>' + (isEdit ? 'Editar orçamento' : 'Novo orçamento') + '</h2>' +
      '<div class="field"><label>Categoria (pode escolher mais de uma)</label><div id="b-category-field" class="capsule-field"></div></div>' +
      '<div class="field"><label>Período</label><div id="b-interval-field" class="capsule-field"></div></div>' +
      '<div class="field"><label>Valor</label><div id="b-amount-field"></div></div>' +
      (suggestion
        ? '<div style="display:flex;gap:8px"><button id="m-submit" style="flex:1">Confirmar sugestão</button>' +
          '<button type="button" class="secondary" id="m-discard-suggestion" style="flex:1">Descartar sugestão</button></div>'
        : '<button id="m-submit">Salvar</button>')
    );

    // forcesManual: sugestão de orçamento NOVO (type 'new') sempre força manual (nunca
    // seta o campo, então undefined !== false vira true); sugestão de TROCA DE MODO (type
    // 'switch', ver budgetModeSwitchSuggestion_) seta explicitamente -- só ela pode
    // sugerir Automático (forcesManual:false), inclusive EDITANDO um orçamento que já
    // existe (a sugestão manda nesse caso, não o modo atual do orçamento).
    var suggestionForcesManual = !!suggestion && suggestion.forcesManual !== false;
    var periodMode = suggestion
      ? (suggestionForcesManual ? 'manual' : 'auto')
      : (isEdit ? (existing.periodMode || 'manual') : 'auto');
    var manualAmount = (suggestion && suggestion.suggestedAmount != null) ? suggestion.suggestedAmount : (isEdit ? existing.amount : 0);
    var manualIntervalDays = (suggestion && suggestion.suggestedIntervalDays != null) ? suggestion.suggestedIntervalDays : (isEdit ? existing.intervalDays : 30);
    // X (dias) do orçamento Automático -- não depende da categoria escolhida (é global,
    // ver budgetAutoWindowDays_), calculado uma vez só. O TETO em si (que depende da
    // categoria) é recalculado a cada mudança de categoria, ver computeAutoPreviewAmount_.
    var autoWindowDaysForModal_ = budgetAutoWindowDays_();
    /** Teto que o Automático estaria usando AGORA pras categorias escolhidas -- pedido
     *  explícito do usuário, pra mostrar "Automático (R$X)" no campo Valor em vez de só
     *  "Automático" (que não dizia qual valor está de fato valendo). null sem categoria
     *  escolhida ainda ou sem X determinável (histórico insuficiente). */
    function computeAutoPreviewAmount_() {
      if (!autoWindowDaysForModal_ || !selectedCategoryIds.length) return null;
      return computeBudgetAutoProgress_(selectedCategoryIds, autoWindowDaysForModal_).shimBudget.amount;
    }

    function renderAmountField_() {
      var field = document.getElementById('b-amount-field');
      if (periodMode === 'auto') {
        // Continua um <input> de verdade (mesma forma/tamanho de sempre, só bloqueado)
        // em vez de sumir com o campo -- pedido explícito do usuário, pra deixar claro
        // que normalmente seria editável, só que nesse modo o valor vem do cálculo
        // automático (ver computeBudgetAutoProgress_), não de digitação. Valor real entre
        // parênteses quando dá pra calcular (mesmo padrão do período, ver
        // createIntervalDaysField/autoResolvedDays).
        var preview = computeAutoPreviewAmount_();
        var autoLabel = 'Automático' + (preview !== null ? ' (' + fmtMoneyNoCents_(preview) + ')' : '');
        field.innerHTML = '<input id="b-amount" type="text" value="' + escapeHtml(autoLabel) + '" disabled>';
      } else {
        field.innerHTML = '<input id="b-amount" type="text">';
        setupMoneyInput(document.getElementById('b-amount'), manualAmount);
      }
    }

    var selectedCategoryIds = isEdit ? existing.categoryIds.slice() : ((suggestion && suggestion.categoryIds) ? suggestion.categoryIds.slice() : []);
    buildCategoryFilterField_(document.getElementById('b-category-field'), selectedCategoryIds, function () {
      // Só re-renderiza em modo Automático (o campo ali é só um placeholder bloqueado,
      // nada a perder) -- em modo Manual re-renderizar aqui apagaria o que o usuário já
      // tinha digitado no meio da troca de categoria.
      if (periodMode === 'auto') renderAmountField_();
    }, {
      kinds: ['expense'], excludeIds: budgetedCategoryIds
    });
    createIntervalDaysField(document.getElementById('b-interval-field'), {
      showAuto: !suggestionForcesManual,
      autoResolvedDays: autoWindowDaysForModal_,
      selectedDays: periodMode === 'auto' ? 'auto' : manualIntervalDays,
      onChange: function (value) {
        if (value === 'auto') {
          periodMode = 'auto';
        } else {
          periodMode = 'manual';
          manualIntervalDays = value;
        }
        renderAmountField_();
      }
    });
    renderAmountField_();

    if (suggestion) {
      document.getElementById('m-discard-suggestion').onclick = function () {
        closeModal();
        if (suggestion.type === 'switch') {
          dismissBudgetModeSwitchClient_(suggestion.budgetId, suggestion.direction);
          return;
        }
        var dismissKey = suggestion.categoryId;
        var entry = { type: 'new', categoryId: dismissKey, dismissedAt: new Date().toISOString() };
        STATE.budgetSuggestionDismissals.push(entry);
        render();
        afterMutation_(run('dismissBudgetSuggestion', dismissKey)).catch(function (err) {
          STATE.budgetSuggestionDismissals = STATE.budgetSuggestionDismissals.filter(function (d) { return dismissalKey_(d) !== dismissalKey_(entry); });
          render();
          showToast(err.message, true);
        });
      };
    }

    document.getElementById('m-submit').onclick = function () {
      var submitBtn = document.getElementById('m-submit');
      var categoryIds = selectedCategoryIds.slice();
      if (!categoryIds.length) { errorPopover(submitBtn, 'Escolha pelo menos uma categoria.'); return; }
      var amount, intervalDays;
      if (periodMode === 'auto') {
        // Nunca lido de verdade enquanto periodMode for 'auto' (ver
        // computeBudgetAutoProgress_) -- placeholder inerte, só pra satisfazer o schema;
        // editando um orçamento que JÁ tinha um valor manual, updateBudget nem recebe
        // esses campos (ver abaixo), então o valor antigo continua intacto no banco.
        amount = isEdit ? existing.amount : 1;
        intervalDays = isEdit ? existing.intervalDays : 30;
      } else {
        amount = document.getElementById('b-amount').getValue();
        if (!amount || amount <= 0) { errorPopover(submitBtn, 'Valor precisa ser maior que zero.'); return; }
        intervalDays = manualIntervalDays;
      }

      if (isEdit) {
        closeModal();
        var b = STATE.budgets.find(function (x) { return x.id === existing.id; });
        var prev = b ? { amount: b.amount, intervalDays: b.intervalDays, categoryIds: b.categoryIds, categoryName: b.categoryName, periodMode: b.periodMode } : null;
        if (b) {
          b.categoryIds = categoryIds; b.categoryName = joinBudgetCategoryNames_(categoryIds); b.periodMode = periodMode;
          if (periodMode !== 'auto') { b.amount = amount; b.intervalDays = intervalDays; }
        }
        render();
        // Espera qualquer categoria recém-criada (ID temporário) resolver antes de
        // mandar — mesmo motivo do createBudget abaixo. resolveRealId_(existing.id):
        // esse PRÓPRIO orçamento também pode ainda estar com ID temporário (acabou de
        // ser criado e o usuário já clicou em editar antes do servidor confirmar) — ver
        // comentário grande logo abaixo, no handler de "Remover".
        afterMutation_(Promise.all([resolveRealId_(existing.id)].concat(categoryIds.map(resolveRealId_))).then(function (resolved) {
          var updates = { id: resolved[0], categoryIds: resolved.slice(1), periodMode: periodMode };
          // Só manda amount/intervalDays quando o modo for manual -- trocar PRA
          // Automático não deve sobrescrever o valor/período que já estava gravado (ver
          // comentário grande no topo da função e updateBudget, Budgets.js).
          if (periodMode !== 'auto') { updates.amount = amount; updates.intervalDays = intervalDays; }
          return run('updateBudget', updates);
        })).catch(function (err) {
          if (b && prev) { b.amount = prev.amount; b.intervalDays = prev.intervalDays; b.categoryIds = prev.categoryIds; b.categoryName = prev.categoryName; b.periodMode = prev.periodMode; }
          render();
          showToast(err.message, true);
        });
      } else {
        closeModal();
        var tempId = 'tmp-' + Math.random().toString(36).slice(2);
        STATE.budgets.push({
          id: tempId, categoryIds: categoryIds, categoryName: joinBudgetCategoryNames_(categoryIds),
          amount: amount, intervalDays: intervalDays, archived: false, periodMode: periodMode
        });
        render();
        // Espera qualquer categoria recém-criada (ID temporário) terminar de ser criada
        // de verdade antes de mandar pro servidor — ver pendingCreations_/resolveRealId_.
        // pendingCreations_[tempId] registra ESSA criação (do orçamento em si, não das
        // categorias) — sem isso, clicar em Remover/Editar nesse orçamento recém-criado
        // antes do servidor confirmar mandava o ID TEMPORÁRIO pro servidor (que não
        // reconhece — "Orçamento não encontrado").
        var budgetCreation_ = Promise.all(categoryIds.map(resolveRealId_)).then(function (resolvedIds) {
          return run('createBudget', { categoryIds: resolvedIds, amount: amount, intervalDays: intervalDays, periodMode: periodMode });
        }).then(function (created) {
          return adoptRealId_(STATE.budgets, tempId, created.ID);
        });
        pendingCreations_[tempId] = budgetCreation_;
        afterMutation_(budgetCreation_).catch(function (err) {
          var idx = STATE.budgets.findIndex(function (x) { return x.id === tempId; });
          if (idx !== -1) STATE.budgets.splice(idx, 1);
          render();
          showToast(err.message, true);
        }).finally(function () { delete pendingCreations_[tempId]; });
      }
    };
  }

  function openPlanModal(existing, opts) {

        var planCreation_ = run('createPlan', { label: label, amount: amount, kind: kind, month: selectedMonth }).then(function (created) {
