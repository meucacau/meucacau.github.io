    return (a || '').trim().toLowerCase() === (b || '').trim().toLowerCase();
  }

  /**
   * Espelha findCategoryIdByKeyword_ (Categories.js) do lado do cliente, pra sugerir
   * categoria em tempo real enquanto o usuário digita "Pago a"/"Recebido de" num
   * lançamento novo ou numa pendência — sem round-trip ao servidor. Mesma regra:
   * primeira categoria (do kind certo) cuja palavra-chave aparece como substring do
   * texto, case-insensitive.
   */
  function findCategoryIdByKeywordClient_(text, kind) {
    if (!text) return null;
    var lower = text.toLowerCase();
    var match = STATE.categories.find(function (c) {
      if (c.kind !== kind || !c.keywords) return false;
      return c.keywords.split(',').map(function (k) { return k.trim().toLowerCase(); }).filter(function (k) { return k; })
        .some(function (kw) { return lower.indexOf(kw) !== -1; });
    });
    return match ? match.id : null;
  }

  /**
   * Espelha findCategoryIdForCounterparty_ (Inbox.js): categoria lembrada pra essa
   * contraparte EXATA (trim+case-insensitive, não substring como a palavra-chave) —
   * sinal mais forte que a palavra-chave, já que veio de uma confirmação anterior de
   * verdade pra esse mesmo nome. Usado junto com findCategoryIdByKeywordClient_ nos
   * mesmos listeners de "Pago a"/"Recebido de".
   */
  function findCategoryIdForCounterpartyClient_(text) {
    if (!text) return null;
    var key = text.trim().toLowerCase();
    var match = STATE.counterpartyMappings.find(function (m) { return (m.counterparty || '').trim().toLowerCase() === key; });
    return match ? match.categoryId : null;
  }

  function showToast(msg, isError) {
    var el = document.createElement('div');
    el.className = 'toast' + (isError ? ' error' : '');
    el.textContent = msg;
    document.getElementById('toast-container').appendChild(el);
    setTimeout(function () {
      el.classList.add('toast-fade-out');
      setTimeout(function () { el.remove(); }, 300); // bate com a duração da transição no CSS
    }, 3500);
  }
  /** Aviso pequeno e passageiro ancorado ACIMA de um elemento específico (ex: "Cópia
   *  salva!" logo acima do botão "Salvar cópia") — diferente de showToast, que é fixo
   *  num canto da tela sem relação com nenhum elemento. Mesmo padrão de posicionamento
   *  de showTooltip_ (mede depois de inserir, prefere acima, cai pra baixo se não couber,
   *  sempre clampado dentro da tela). */
  function showInlineConfirmation_(anchorEl, message) {
    var el = document.createElement('div');
    el.style.cssText = 'position:fixed;background:var(--text);color:var(--bg);padding:6px 12px;' +
      'border-radius:8px;font-size:13px;white-space:nowrap;z-index:300;pointer-events:none;' +
      'opacity:1;transition:opacity .3s ease';
    el.textContent = message;
    document.body.appendChild(el);
    var rect = anchorEl.getBoundingClientRect();
    var elRect = el.getBoundingClientRect();
    var top = rect.top - elRect.height - 8;
    if (top < 8) top = rect.bottom + 8;
    var clamped = clampToViewport_(rect.left + rect.width / 2 - elRect.width / 2, top, elRect.width, elRect.height);
    el.style.left = clamped.left + 'px';
    el.style.top = clamped.top + 'px';
    setTimeout(function () {
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 300);
    }, 2200);
  }
  function accountName(id) {
    if (!id) return 'Sem conta';
    var a = STATE.accounts.find(function (x) { return x.id === id; });
    return a ? a.name : 'Sem conta';
  }

  // ---------- cor por conta (paleta fixa de 10 tons já prontos) ----------
  // Cada entrada já vem pronta (não mais calculada de um matiz — depois de tentar 2x
  // achar uma fórmula que desse o MESMO contraste e cor vívida ao mesmo tempo pra
  // QUALQUER matiz, sem sucesso: o lado amarelo/verde/ciano do círculo, pra bater a
  // mesma luminância-alvo de tons como azul/vermelho com saturação alta, precisava de
  // uma claridade tão baixa que virava quase preto — indistinguível no claro, exatamente
  // o problema reportado). Mais confiável usar direto tons já testados de um design
  // system real: os mesmos do Tailwind CSS nos tons 600 (contra fundo branco) e 400
  // (contra fundo quase-preto), pensados exatamente pra esse uso.
  var ACCOUNT_COLOR_PALETTE_ = [
    { light: '#dc2626', dark: '#f87171' }, // vermelho
    { light: '#c2410c', dark: '#fb923c' }, // laranja
    // Dourado: no claro é o tom mais difícil da paleta — pra LER como amarelo (matiz ~42°,
    // claridade alta) o contraste contra o branco cai; pra ter contraste alto ele escurece
    // e vira marrom (era o caso do #a16207 anterior, 92% de saturação e mesmo assim
    // "apagado"). Escolhido o lado dourado de propósito, já que o nome da conta é texto
    // curto e em negrito.
    { light: '#bf8700', dark: '#fbbf24' }, // dourado
    { light: '#16a34a', dark: '#4ade80' }, // verde
    { light: '#0d9488', dark: '#2dd4bf' }, // esmeralda
    { light: '#0e7490', dark: '#22d3ee' }, // ciano
    { light: '#2563eb', dark: '#60a5fa' }, // azul
    { light: '#7c3aed', dark: '#a78bfa' }, // violeta
    { light: '#a21caf', dark: '#e879f9' }, // magenta
    { light: '#e11d48', dark: '#fb7185' }  // rosa
  ];
  /**
   * HTML pronto pra embutir: nome em negrito, na cor da paleta pro índice (clara/escura
   * já resolvidas — a troca conforme o tema atual fica por conta do .acc-color-name no
   * Stylesheet, mesma técnica de --bg/--income/etc). index null/undefined ou fora da
   * paleta (conta legada, ainda não migrada no servidor) cai pro texto plano.
   */
  function accountNameHtml_(name, index) {
    var c = ACCOUNT_COLOR_PALETTE_[index];
    if (!c) return escapeHtml(name);
    return '<span class="acc-color-name" style="--acc-color-light:' + c.light + ';--acc-color-dark:' + c.dark + '">' + escapeHtml(name) + '</span>';
  }
  /** Versão de accountName(id) já pronta em HTML colorido — usar em qualquer lugar que
   *  vá injetar o resultado via innerHTML (accountName continua só texto puro). */
  function accountNameHtml(id) {
    if (!id) return 'Sem conta';
    var a = STATE.accounts.find(function (x) { return x.id === id; });
    return a ? accountNameHtml_(a.name, a.colorIndex) : 'Sem conta';
  }

  // ---------- popover anexado ao botão (sem window.confirm/alert) ----------
  /**
   * Garante que um elemento posicionado (left/top em coordenadas de VIEWPORT) fique
   * inteiro dentro da tela nos dois eixos — usado por todo tooltip/popover do app
   * (positionPopover, showTooltip_, gráfico de projeção) pra nunca cortar, nem numa
   * tela pequena nem perto de uma borda. O Math.max no limite superior evita um range
   * invertido no caso raro de o elemento ser mais largo/alto que a tela toda.
   */
  function clampToViewport_(left, top, width, height, margin) {
    margin = margin === undefined ? 8 : margin;
    var vw = document.documentElement.clientWidth;
    var vh = document.documentElement.clientHeight;
    return {
      left: Math.min(Math.max(left, margin), Math.max(margin, vw - width - margin)),
      top: Math.min(Math.max(top, margin), Math.max(margin, vh - height - margin))
    };
  }

  function positionPopover(anchorEl, pop) {
    document.body.appendChild(pop);
    var rect = anchorEl.getBoundingClientRect();
    var popRect = pop.getBoundingClientRect();
    var vh = document.documentElement.clientHeight;
    var top = rect.bottom + 6;
    if (top + popRect.height > vh - 8) top = rect.top - popRect.height - 6;
    var clamped = clampToViewport_(rect.left, top, popRect.width, popRect.height);
    pop.style.left = clamped.left + 'px';
    pop.style.top = clamped.top + 'px';
  }

  // ---------- tooltip de cápsula (fora do modal, nunca cortado pela borda dele) ----------
  /**
   * opts (todos opcionais):
   *   italic — mostra o texto em itálico (usado pela descrição de categoria, que é uma
   *            frase do usuário e não um rótulo do app).
   *   html — HTML pronto (montado pelo app, já escapado) no lugar do texto puro, pra tooltips com
   *          linhas rótulo/valor (ver buildDayBarsHtml_); o texto puro segue como alternativa.
   *   pointer — { x, y } da posição do mouse: centraliza o tooltip nela em vez de no meio
   *             do elemento. Numa LINHA de lista inteira (ver wireRowTooltip_) o centro do
   *             elemento fica longe do cursor; ao lado do mouse é onde o olho já está.
   */
  function showTooltip_(anchorEl, text, opts) {
    opts = opts || {};
    hideTooltip_();
    var tip = document.createElement('div');
    tip.id = 'shared-tooltip';
    tip.className = 'shared-tooltip' + (opts.italic ? ' shared-tooltip-italic' : '') + (opts.html ? ' shared-tooltip-rich' : '');
    if (opts.html) tip.innerHTML = opts.html; else tip.textContent = text;
    document.body.appendChild(tip);
    var rect = anchorEl.getBoundingClientRect();
    var tipRect = tip.getBoundingClientRect();
    var centerX = opts.pointer && opts.pointer.x !== null && opts.pointer.x !== undefined
      ? opts.pointer.x
      : rect.left + rect.width / 2;
    var anchorTop = opts.pointer && opts.pointer.y !== null && opts.pointer.y !== undefined
      ? opts.pointer.y
      : rect.top;
    var anchorBottom = opts.pointer && opts.pointer.y !== null && opts.pointer.y !== undefined
      ? opts.pointer.y
      : rect.bottom;
    var top = anchorTop - tipRect.height - 12;
    if (top < 8) top = anchorBottom + 12;
    var clamped = clampToViewport_(centerX - tipRect.width / 2, top, tipRect.width, tipRect.height);
    tip.style.left = clamped.left + 'px';
    tip.style.top = clamped.top + 'px';
  }
  function hideTooltip_() {
    var existing = document.getElementById('shared-tooltip');
    if (existing) existing.remove();
  }
  // position:fixed é relativo à VIEWPORT, então por si só já não deveria se mover com o
  // scroll — mas como a posição é calculada só UMA VEZ (na hora de abrir, ver
  // showTooltip_) e nunca recalculada depois, rolar a página faz o alvo original (ex: o
  // cabeçalho "Hoje" de um card do Extrato) sair de baixo do tooltip enquanto ele mesmo
  // fica plantado ali, parecendo "grudado" no conteúdo rolando por trás. Mais simples
  // esconder no primeiro scroll do que ficar reposicionando a cada pixel rolado.
  window.addEventListener('scroll', hideTooltip_, true);
  function dismissOnOutsideClick(pop, cleanup) {
    function outsideClick(e) {
      if (!pop.contains(e.target)) cleanup(e);
    }
    setTimeout(function () { document.addEventListener('mousedown', outsideClick, true); }, 0);
    return function () { document.removeEventListener('mousedown', outsideClick, true); };
  }

  /** #confirm-popover é compartilhado por openDropdownMenu_/openCategoryIconPicker_ (e
   *  qualquer outro popover futuro que reaproveite o padrão) -- guarda a função de
   *  limpeza de QUALQUER UM deles que esteja aberto agora, pra dar pra fechar de fora
   *  (ver render_, ao trocar de aba) sem vazar o listener de "clique fora" que
   *  dismissOnOutsideClick registra (só remover o elemento com .remove() deixaria esse
   *  listener grudado no document pra sempre). */
  var activeConfirmPopoverCleanup_ = null;
  function closeActiveConfirmPopover_() {
    if (!activeConfirmPopoverCleanup_) return;
    var fn = activeConfirmPopoverCleanup_;
    activeConfirmPopoverCleanup_ = null;
    fn();
  }

  /**
   * Liga um elemento com atributo data-tooltip a showTooltip_/hideTooltip_: hover no
   * desktop (como .time-pin já fazia), toque no celular (que .time-pin ainda não tinha
   * — só existia mouseenter, então tocar um pino não mostrava nada). Um toque mostra;
   * outro toque em qualquer lugar (ou de novo no mesmo elemento) esconde — reaproveita
   * dismissOnOutsideClick, guardando só UM listener de cada vez (stopTooltipOutsideClick_)
   * pra não empilhar um novo a cada toque.
   */
  var stopTooltipOutsideClick_ = null;
  /** delayMs (opcional, 0 = imediato como sempre foi): usado pelo "×" das listas, que
   *  espera o mesmo tempo do tooltip da linha pra não piscar ao passar o mouse por cima. */
  function wireTooltipTrigger_(el, delayMs, lazy) {
    // lazy: o texto é lido na hora do evento (a barra de abas tira o data-tooltip da aba ativa).
    var text = el.getAttribute('data-tooltip');
    if (!text && !lazy) return;
    var rich = { html: el.getAttribute('data-tooltip-html') || '' };
    function tipText_() { return lazy ? (el.getAttribute('data-tooltip') || '') : text; }
    if (HOVER_CAPABLE_) {
      var hoverTimer = null;
      el.addEventListener('mouseenter', function () {
        if (!tipText_()) return;
        if (!delayMs) { showTooltip_(el, tipText_(), rich); return; }
        hoverTimer = setTimeout(function () { hoverTimer = null; showTooltip_(el, tipText_(), rich); }, delayMs);
      });
      el.addEventListener('mouseleave', function () {
        if (hoverTimer) { clearTimeout(hoverTimer); hoverTimer = null; }
        hideTooltip_();
      });
    } else {
      el.addEventListener('click', function () {
        if (!tipText_()) return;
        if (stopTooltipOutsideClick_) stopTooltipOutsideClick_();
        showTooltip_(el, tipText_(), rich);
        stopTooltipOutsideClick_ = dismissOnOutsideClick(el, function () {
          hideTooltip_();
          stopTooltipOutsideClick_ = null;
        });
      });
    }
  }

  /**
   * Dia do Resumo/calendário: toque curto (ou clique) leva ao card do dia no Extrato
   * (onTap); no celular, TOQUE LONGO só mostra o tooltip -- não rola a tela (antes o toque
   * longo também disparava o clique ao soltar, a página rolava e o tooltip sumia junto).
   * Com mouse, hover mostra o tooltip e o clique rola, como sempre.
   */
  var DAY_LONG_PRESS_MS_ = 350;
  function wireDayCell_(el, onTap, lazy) {
    if (HOVER_CAPABLE_) {
      el.addEventListener('click', onTap);
      wireTooltipTrigger_(el, 200, lazy);
      return;
    }
    var text = el.getAttribute('data-tooltip') || '';
    var rich = { html: el.getAttribute('data-tooltip-html') || '' };
    var timer = null, startX = 0, startY = 0, longPressed = false;
    function cancel() { if (timer) { clearTimeout(timer); timer = null; } }
    el.addEventListener('touchstart', function (e) {
      longPressed = false;
      var t = e.touches[0];
      startX = t.clientX; startY = t.clientY;
      cancel();
      timer = setTimeout(function () {
        timer = null;
        var tip = lazy ? (el.getAttribute('data-tooltip') || '') : text;
        if (!tip) return;
        longPressed = true;
        showTooltip_(el, tip, rich);
        // O próximo toque em qualquer lugar fecha (registrado depois do gesto atual, então
        // não pega o próprio toque longo).
        var close = function () { hideTooltip_(); document.removeEventListener('touchstart', close, true); };
        document.addEventListener('touchstart', close, true);
      }, DAY_LONG_PRESS_MS_);
    }, { passive: true });
    el.addEventListener('touchmove', function (e) {
      var t = e.touches[0];
      if (Math.abs(t.clientX - startX) > 10 || Math.abs(t.clientY - startY) > 10) cancel(); // virou rolagem
    }, { passive: true });
    el.addEventListener('touchcancel', cancel, { passive: true });
    el.addEventListener('touchend', function (e) {
      cancel();
      if (longPressed && e.cancelable) e.preventDefault(); // sem o clique emulado ao soltar
    });
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    el.addEventListener('click', function () {
      if (longPressed) { longPressed = false; return; }
      onTap();
    });
  }

  /** Fecha qualquer tooltip/popover/menu flutuante (document.body-level, fora de
   *  #view-root) que possa ter sobrado de uma aba anterior -- ver render(), chamado ao
   *  trocar de aba de qualquer jeito (nav bar, swipe, atalho, botão de margem). Sem
   *  isso, um dropdown aberto na hora da troca (ex: o menu de uma barra de orçamento)
   *  continuava aberto, flutuando por cima da aba nova, ancorado em um elemento que já
   *  nem existe mais (bug relatado, inclusive pelo atalho 1-9 especificamente --
   *  activeHoldReveal_ cobre o menu hold-to-reveal da barra de orçamento, que é um
   *  mecanismo à parte do confirm-popover/dropdown comum). NÃO mexe no botão redondo de
   *  trocar aba (#margin-switch-btn) -- esse tem sua própria regra deliberada de
   *  permanência (só some se o mouse se afastar dele), que a própria troca de aba não
   *  deve interromper.
   */
  function resetFloatingUi_() {
    if (stopTooltipOutsideClick_) { stopTooltipOutsideClick_(); stopTooltipOutsideClick_ = null; }
    hideTooltip_();
    closeActiveConfirmPopover_();
    // pendingHoldReveal_ ANTES de activeHoldReveal_: cancela um revealTimer ainda
    // contando (menu ainda não abriu) antes de fechar um que já tinha aberto de
    // verdade -- ver setupHoldToReveal_, os dois são independentes (nunca o mesmo
    // handle ao mesmo tempo, mas nada garante que só um dos dois esteja setado).
    if (pendingHoldReveal_) pendingHoldReveal_.close();
    if (activeHoldReveal_) activeHoldReveal_.close();
  }

  /**
   * Cada linha de lista (conta, categoria, plano, lançamento recorrente, orçamento) É o
   * botão de editar: clicar em qualquer ponto dela abre a edição e o hover mostra
   * "Editar <coisa>" ao lado do CURSOR (a linha é larga; centralizar no meio dela
   * deixaria a dica longe de onde o olho está). Isso substituiu os botões "Editar" e
   * "Arquivar"/"Remover" que apareciam em toda linha — só sobrou o "×" da direita
   * (rowRemoveButtonHtml_), com o nome da ação antiga no tooltip.
   *
   * O clique é ignorado quando sai de dentro do "×" (ou de qualquer outro botão da
   * linha): sem isso, arquivar/remover abriria a edição ao mesmo tempo.
   */
  var ROW_TOOLTIP_DELAY_MS = 500;
  function wireRowTooltip_(rowEl, whatLabel, onEdit) {
    rowEl.classList.add('row-clickable');
    if (HOVER_CAPABLE_) {
      var timer = null;
      var lastX = null, lastY = null;
      function cancel() { if (timer) { clearTimeout(timer); timer = null; } }
      function onMove(e) {
        // Em cima de um botão da linha (o "×") quem manda é o tooltip DELE
        // ("Arquivar"/"Remover"). Sem esse desvio, o mousemove da linha continuava
        // disparando (mousemove do filho borbulha) e reescrevia o tooltip com
        // "Editar ...", então o do "×" nunca aparecia.
        if (e.target.closest('button')) { cancel(); hideTooltip_(); return; }
        lastX = e.clientX; lastY = e.clientY;
        if (timer) return; // já está contando — não reinicia a cada pixel de movimento
        timer = setTimeout(function () {
          timer = null;
          showTooltip_(rowEl, 'Editar ' + whatLabel, { pointer: { x: lastX, y: lastY } });
        }, ROW_TOOLTIP_DELAY_MS);
      }
      rowEl.addEventListener('mousemove', onMove);
      rowEl.addEventListener('mouseleave', function () { cancel(); hideTooltip_(); });
    }
    rowEl.addEventListener('click', function (e) {
      if (e.target.closest('button')) return;
      hideTooltip_();
      onEdit();
    });
  }

  /** "×" da direita da linha. actionLabel é o nome do botão que ele substituiu
   *  ("Arquivar"/"Remover"), mostrado como tooltip. */
  function rowRemoveButtonHtml_(attr, id, actionLabel) {
    return '<button type="button" class="row-x" ' + attr + '="' + escapeHtml(id) + '" ' +
      'aria-label="' + actionLabel + '" data-tooltip="' + actionLabel + '">×</button>';
  }

  /**
   * Liga os "×" de uma lista: tooltip com o nome da ação, cor vermelha travada enquanto a
   * confirmação está aberta (row-x-armed — sem isso o × voltava ao cinza assim que o mouse
   * saía dele pra clicar em "Confirmar") e a confirmação em si.
   */
  function wireRowRemoveButtons_(root, selector, message, onConfirm) {
    root.querySelectorAll(selector).forEach(function (btn) {
      wireTooltipTrigger_(btn, ROW_TOOLTIP_DELAY_MS);
      btn.onclick = function (e) {
        e.stopPropagation();
        hideTooltip_();
        btn.classList.add('row-x-armed');
        confirmPopover(btn, message, function () { onConfirm(btn); }, function () {
          btn.classList.remove('row-x-armed');
        });
      };
    });
  }

  /** onDismiss (opcional): chamado quando a confirmação fecha SEM confirmar (Cancelar ou
   *  clique fora) — usado pelo "×" das listas pra soltar o vermelho travado. */
  function confirmPopover(anchorEl, message, onConfirm, onDismiss) {
    var existing = document.getElementById('confirm-popover');
    if (existing) existing.remove();
    var pop = document.createElement('div');
    pop.id = 'confirm-popover';
    pop.className = 'confirm-popover';
    pop.innerHTML = '<div>' + escapeHtml(message) + '</div>' +
      '<div class="confirm-popover-actions">' +
        '<button type="button" class="secondary" data-act="cancel">Cancelar</button>' +
        '<button type="button" data-act="ok">Confirmar</button>' +
      '</div>';
    positionPopover(anchorEl, pop);
    var stopListening;
    function cleanup() { pop.remove(); stopListening(); }
    function dismiss() { cleanup(); if (onDismiss) onDismiss(); }
    stopListening = dismissOnOutsideClick(pop, dismiss);
    pop.querySelector('[data-act="cancel"]').onclick = dismiss;
    pop.querySelector('[data-act="ok"]').onclick = function () { cleanup(); onConfirm(); };
  }

  /** Popover de erro de validação (substitui o toast vermelho pra erros de "clicar em Salvar"). */
  function errorPopover(anchorEl, message) {
    var existing = document.getElementById('confirm-popover');
    if (existing) existing.remove();
    var pop = document.createElement('div');
    pop.id = 'confirm-popover';
    pop.className = 'confirm-popover';
    pop.innerHTML = '<div>' + escapeHtml(message) + '</div>' +
      '<div class="confirm-popover-actions"><button type="button" data-act="ok">OK</button></div>';
    positionPopover(anchorEl, pop);
    var stopListening;
    function cleanup() { pop.remove(); stopListening(); }
    stopListening = dismissOnOutsideClick(pop, cleanup);
    pop.querySelector('[data-act="ok"]').onclick = cleanup;
  }

  /**
   * Popover com a grade de 10 cores fixas + "sem cor" (ver ACCOUNT_COLOR_PALETTE_) — o
   * usuário só escolhe entre elas, nada de matiz livre. Cada pastilha usa
   * .acc-color-swatch (mesma técnica de variável CSS de .acc-color-name) pra já mostrar
   * a cor certa pro tema atual, igual ao que vai aparecer de verdade no nome da conta.
   * onChange dispara a cada clique (prévia ao vivo).
   */
  function openColorPickerPopover_(anchorEl, initialIndex, currentName, onChange) {
    var existing = document.getElementById('confirm-popover');
    if (existing) existing.remove();
    var pop = document.createElement('div');
    pop.id = 'confirm-popover';
    pop.className = 'confirm-popover';
    // 10 cores fixas (o flex-wrap quebra em 2 fileiras de 5 sozinho, já que o popover é
    // estreito) + "sem cor" por último, com visual propositalmente diferente (tracejado).
    var swatchesHtml = ACCOUNT_COLOR_PALETTE_.map(function (c, index) {
      return '<button type="button" class="color-swatch-btn acc-color-swatch' + (index === initialIndex ? ' active' : '') +
        '" data-index="' + index + '" style="--acc-color-light:' + c.light + ';--acc-color-dark:' + c.dark + '"></button>';
    }).join('') +
      '<button type="button" class="color-swatch-btn color-swatch-none' + (initialIndex === null ? ' active' : '') + '" data-index="">×</button>';
    pop.innerHTML =
      '<div style="width:180px">' +
        '<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center">' + swatchesHtml + '</div>' +
        '<div style="text-align:center;margin-top:10px" id="color-preview"></div>' +
      '</div>';
    positionPopover(anchorEl, pop);
    var preview = pop.querySelector('#color-preview');
    function updatePreview(index) { preview.innerHTML = accountNameHtml_(currentName || 'Nome da conta', index); }
    updatePreview(initialIndex);
    pop.querySelectorAll('.color-swatch-btn').forEach(function (btn) {
      btn.onclick = function () {
        var index = btn.dataset.index === '' ? null : Number(btn.dataset.index);
        pop.querySelectorAll('.color-swatch-btn').forEach(function (b) { b.classList.toggle('active', b === btn); });
        updatePreview(index);
        onChange(index);
      };
    });
    var stopListening = dismissOnOutsideClick(pop, function () { pop.remove(); stopListening(); });
  }

  /**
   * Navegação por teclado (setas ↑/↓) pra qualquer popover .dropdown-popover: mantém uma
   * opção "realçada" (classe .kb-active), rolando a lista pra ela ficar visível. Devolve
   * { move(delta), pick(), reset() } -- pick() clica na realçada e devolve true se havia
   * uma; quem chama decide onde ligar (keydown do input, ou do document pros menus
   * ancorados em botão).
   */
  function createDropdownKeyNav_(pop) {
    var idx = -1;
    function opts() { return pop.querySelectorAll('.dropdown-option'); }
    function paint() {
      var list = opts();
      for (var i = 0; i < list.length; i++) list[i].classList.toggle('kb-active', i === idx);
      if (list[idx] && list[idx].scrollIntoView) list[idx].scrollIntoView({ block: 'nearest' });
    }
    return {
      move: function (delta) {
        var n = opts().length;
        if (!n) return;
        if (idx < 0) {
          var act = -1;
          for (var i = 0; i < n; i++) if (opts()[i].classList.contains('active')) act = i;
          idx = act >= 0 ? act : (delta > 0 ? 0 : n - 1);
        } else {
          idx = (idx + delta + n) % n;
        }
        paint();
      },
      pick: function () {
        var list = opts();
        if (idx < 0 || !list[idx]) return false;
        list[idx].click();
        return true;
      },
      reset: function () { idx = -1; }
    };
  }

  /**
   * Menu suspenso com o visual do app (cápsula + popover), no lugar de um <select>
   * nativo — reaproveita o mesmo popover de confirmPopover/errorPopover.
   * options: [{ value, label, selected }].
   */
  // Clicar no botão que abriu o menu, com o menu já aberto, deve FECHAR (não reabrir): o
  // mousedown fora do popover já fecha (dismissOnOutsideClick), mas o click que vem em
  // seguida chamaria openDropdownMenu_ de novo -- esse marcador (válido só até o click
  // terminar, ou 1,5 s) faz essa chamada ser ignorada.
  var dropdownClosedByAnchor_ = null;
  function openDropdownMenu_(anchorEl, options, onSelect) {
    if (dropdownClosedByAnchor_ === anchorEl) { dropdownClosedByAnchor_ = null; return; }
    closeActiveConfirmPopover_();
    var pop = document.createElement('div');
    pop.id = 'confirm-popover';
    pop.className = 'confirm-popover dropdown-popover';
    pop.innerHTML = options.map(function (opt) {
      return '<div class="dropdown-option' + (opt.selected ? ' active' : '') + '" data-value="' + escapeHtml(opt.value) + '">' + escapeHtml(opt.label) + '</div>';
    }).join('');
    positionPopover(anchorEl, pop);
    var stopListening;
    var nav = createDropdownKeyNav_(pop);
    // Captura (antes do listener global de Enter/Esc do modal): ↑/↓ trocam a opção
    // realçada e Enter confirma a realçada, sem acionar o Salvar do modal por baixo.
    function onKey(e) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault(); e.stopPropagation();
        nav.move(e.key === 'ArrowDown' ? 1 : -1);
      } else if (e.key === 'Enter' && nav.pick()) {
        e.preventDefault(); e.stopPropagation();
      }
    }
    function cleanup() {
      pop.remove(); stopListening();
      document.removeEventListener('keydown', onKey, true);
      activeConfirmPopoverCleanup_ = null;
    }
    stopListening = dismissOnOutsideClick(pop, function (e) {
      if (e && anchorEl && anchorEl.contains(e.target)) {
        dropdownClosedByAnchor_ = anchorEl;
        var release = function () { dropdownClosedByAnchor_ = null; };
        document.addEventListener('click', release, { once: true });
        setTimeout(release, 1500);
      }
      cleanup();
    });
    document.addEventListener('keydown', onKey, true);
    activeConfirmPopoverCleanup_ = cleanup;
    pop.querySelectorAll('.dropdown-option').forEach(function (el) {
      el.onclick = function () { cleanup(); onSelect(el.dataset.value); };
    });
  }

  // ---------- input mascarado de dinheiro (R$ 0,00, preenchendo da direita) ----------
  /**
   * Input mascarado de dinheiro (R$ 0,00) que edita na posição do CURSOR (não sempre no
   * final) — digitar/apagar no meio do valor insere/remove ali, deslocando o resto, em vez
   * de sempre mexer no dígito menos significativo. cents continua sendo a fonte de
   * verdade; a posição do cursor é reconciliada em DÍGITOS (não em caracteres), já que
   * "R$"/pontos/vírgula mudam de lugar quando o número cresce ou encolhe.
   */
  function setupMoneyInput(inputEl, initialValue) {
    var cents = Math.round((Number(initialValue) || 0) * 100);
    // Quando um Backspace/Delete zera o valor mas ainda "sobravam" dígitos (zerados)
    // depois do cursor, String(cents) vira só "0" e perde tanto esses dígitos quanto a
    // posição — guarda a string bruta de verdade (com os zeros) e quantos dígitos
    // ficavam depois do cursor, pra próxima tecla (dígito OU outro backspace/delete)
    // continuar exatamente dali (ex: apagar o "5" de "500,00" e digitar "3" deve dar
    // "300,00", não "0,03" nem mandar o cursor pro fim).
    var rawOverride = null;
    var afterOverride = null;
    function clearOverride_() { rawOverride = null; afterOverride = null; }
    function render_() {
      inputEl.value = (cents / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }
    function countDigits(str) { return (str.match(/\d/g) || []).length; }
    function digitsAfter(value, pos) { return countDigits(value.slice(pos)); }
    function digitsBefore(value, pos) { return countDigits(value.slice(0, pos)); }
    // O "R$" (e o espaço depois) nunca é editável — o cursor não pode ficar antes do
    // primeiro dígito de verdade.
    function firstDigitIndex(value) {
      for (var i = 0; i < value.length; i++) { if (value[i] >= '0' && value[i] <= '9') return i; }
      return value.length;
    }
    // Dígitos de verdade de `cents`, preenchido à esquerda até o mínimo de 3 que "X,XX"
    // sempre mostra — sem isso, cents=5 vira raw="5" (1 char) mas o formatado "0,05" tem
    // 3 posições de dígito, e before/after (contados no formatado) referenciam posições
    // que não existem na raw curta, cortando/preservando o dígito errado ao apagar.
    function rawDigits() { return String(cents).padStart(3, '0'); }
    // Acha a posição no texto (já reformatado) que deixa exatamente `after` dígitos
    // depois dela — é como o cursor "acompanha" o mesmo dígito relativo depois que
    // render_() reformata tudo (o número de separadores pode mudar).
    function positionWithDigitsAfter(value, after) {
      var before = Math.max(0, countDigits(value) - after);
      if (before === 0) return firstDigitIndex(value);
      var seen = 0;
      for (var i = 0; i < value.length; i++) {
        if (value[i] >= '0' && value[i] <= '9') {
          seen++;
          if (seen === before) return i + 1;
        }
      }
      return value.length;
    }
    function setCursorAfter(after) {
      var pos = positionWithDigitsAfter(inputEl.value, after);
      inputEl.setSelectionRange(pos, pos);
    }
    function clampCursor() {
      var pos = inputEl.selectionStart;
      var minPos = firstDigitIndex(inputEl.value);
      if (pos < minPos) inputEl.setSelectionRange(minPos, minPos);
    }

    inputEl.setAttribute('inputmode', 'numeric');
    inputEl.classList.add('input-money');
    inputEl.addEventListener('keydown', function (e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      // Selecionar o campo inteiro (Ctrl+A, triplo clique) e digitar/apagar deve
      // substituir/zerar tudo, não só mexer no dígito da posição do cursor.
      var isFullySelected = inputEl.value.length > 0 &&
        inputEl.selectionStart === 0 && inputEl.selectionEnd === inputEl.value.length;

      if (e.key >= '0' && e.key <= '9') {
        e.preventDefault();
        if (isFullySelected) {
          clearOverride_();
          cents = Number(e.key);
          render_();
          inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);
          return;
        }
        var raw = rawOverride !== null ? rawOverride : rawDigits();
        var after = afterOverride !== null ? afterOverride : digitsAfter(inputEl.value, inputEl.selectionEnd);
        var before = digitsBefore(inputEl.value, inputEl.selectionStart);
        clearOverride_();
        var newRaw = raw.slice(0, before) + e.key + raw.slice(raw.length - after);
        cents = Math.min(Number(newRaw), 999999999999);
        render_();
        setCursorAfter(after);
      } else if (e.key === 'Backspace' || e.key === 'Delete') {
        e.preventDefault();
        if (isFullySelected) {
          clearOverride_();
          cents = 0;
          render_();
          inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);
          return;
        }
        var rawBD = rawOverride !== null ? rawOverride : rawDigits();
        var afterBD = afterOverride !== null ? afterOverride : digitsAfter(inputEl.value, inputEl.selectionEnd);
        var beforeBD = digitsBefore(inputEl.value, inputEl.selectionStart);
        clearOverride_();
        // Sem seleção (cursor só, sem intervalo marcado): Backspace tira 1 dígito ANTES
        // do cursor, Delete tira 1 dígito DEPOIS — com um intervalo selecionado, os dois
        // só removem o que já está marcado (nem before nem after precisam de ajuste).
        if (inputEl.selectionStart === inputEl.selectionEnd) {
          if (e.key === 'Backspace') { if (beforeBD > 0) beforeBD--; }
          else { if (afterBD > 0) afterBD--; }
        }
        var newRawBD = rawBD.slice(0, beforeBD) + rawBD.slice(rawBD.length - afterBD);
        cents = newRawBD ? Math.min(Number(newRawBD), 999999999999) : 0;
        render_();
        if (cents === 0 && afterBD > 0) {
          // Zerou mas ainda "sobravam" afterBD dígitos (zerados) depois do cursor —
          // formatado, zero sempre vira só "0,00" (3 dígitos), então não dá pra
          // posicionar o cursor de um jeito que, relido, dê de volta afterBD (se afterBD

          // Guarda em rawOverride/afterOverride pra próxima tecla usar direto, sem
          // depender de reconstruir isso a partir da posição do cursor.
          rawOverride = newRawBD;
          afterOverride = afterBD;
          var startPos = firstDigitIndex(inputEl.value);
          inputEl.setSelectionRange(startPos, startPos);
        } else if (cents === 0) {
          inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);
        } else {
          setCursorAfter(afterBD);
        }
      } else if (e.key.length === 1) {
        e.preventDefault();
      }
    });
    // Avisa quem quiser reagir a uma digitação ('moneychange') — registrado DEPOIS do
    // keydown acima, então `cents` já está atualizado quando o evento dispara.
    inputEl.addEventListener('keydown', function () { inputEl.dispatchEvent(new CustomEvent('moneychange')); });
    inputEl.addEventListener('keyup', clampCursor);
    inputEl.addEventListener('paste', function (e) {
      e.preventDefault();

      if (digits) cents = Math.min(Number(digits), 999999999999);
      render_();
      inputEl.dispatchEvent(new CustomEvent('moneychange'));
    });
    inputEl.addEventListener('focus', function () {
      // Foco por teclado (Tab) não tem uma posição de clique pra preservar — manda pro
      // fim, como sempre foi.
      clearOverride_();
      setTimeout(function () { inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length); }, 0);
    });
    inputEl.addEventListener('click', function () { clearOverride_(); setTimeout(clampCursor, 0); });

    // Usado só pra aplicar um valor sugerido de fora (ver createIntervalDaysField/
    // openBudgetModal, cápsula de período sugerido) -- reatribui `cents` e redesenha,
    // sem precisar rechamar setupMoneyInput (que empilharia um 2º addEventListener em
    // cima do 1º -- não existe removeEventListener pra desfazer o de antes aqui).
    inputEl.setValue = function (v) { cents = Math.round((Number(v) || 0) * 100); render_(); };
    render_();

  // (hover: hover) é o teste padrão pra "o dispositivo principal tem cursor de verdade" —
  // mais confiável que checar 'ontouchstart' (que existe em muito notebook com tela touch).
  var HOVER_CAPABLE_ = !!(window.matchMedia && window.matchMedia('(hover: hover)').matches);

  var CAPSULE_MAX_ROW_INDEX_ = 3; // até 4 linhas (índices 0-3)

  /** Em qual LINHA visual cada filho do container caiu (medido de verdade pelo offsetTop,
   *  já que o wrap depende da largura da tela e do tamanho de cada rótulo). */
  function capsuleRowIndexes_(container) {
    var kids = Array.prototype.slice.call(container.children);
    var tops = [];
    return kids.map(function (el) {
      var top = el.offsetTop;
      var idx = tops.indexOf(top);
      if (idx === -1) { tops.push(top); idx = tops.length - 1; }
      return idx;
    });
  }

  /**
   * Renderiza TODAS as cápsulas de `items`; só quando passam de 4 linhas esconde atrás de
   * uma cápsula "+" as que não foram usadas nos últimos 30 dias (item.recentlyUsed — ver
   * recentlyUsedCategoryIds_/Categories.js), mantendo a ordem alfabética de quem sobra. O
   * que está selecionado nunca some, mesmo obsoleto. "−" volta a esconder.
   *
   * Preenche o máximo que couber (não só o mínimo "usado recentemente"): remove uma de cada
   * vez, sempre a ÚLTIMA não-protegida, até caber.
   *
   * O estado expandido mora no PRÓPRIO container (_capsulesExpanded) em vez de numa
   * variável local porque o filtro do Extrato se reconstrói inteiro a cada clique (cascata
   * de subcategorias) — uma variável local voltaria pro colapsado no meio do uso.
   */
  function renderCollapsibleCapsules_(container, items, makeCapsule, isProtected) {
    function makeToggle(isCollapsed) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'capsule capsule-toggle-more';
      b.textContent = isCollapsed ? '+' : '−';
      var tooltip = isCollapsed ? 'Mostrar todas' : 'Ocultar menos usadas';
      b.addEventListener('mouseenter', function () { showTooltip_(b, tooltip); });
      b.addEventListener('mouseleave', hideTooltip_);
      b.onclick = function () {
        hideTooltip_(); // o botão some no rebuild e não dispararia mouseleave sozinho
        container._capsulesExpanded = !container._capsulesExpanded;
        build();
      };
      return b;
    }

    function build() {
      container.innerHTML = '';
      items.forEach(function (item) { container.appendChild(makeCapsule(item)); });

      var rows = capsuleRowIndexes_(container);
      if (!rows.length || Math.max.apply(null, rows) <= CAPSULE_MAX_ROW_INDEX_) return; // cabe tudo

      if (container._capsulesExpanded) {
        container.appendChild(makeToggle(false));
        return;
      }

      var candidates = items.slice();
      while (candidates.length) {
        container.innerHTML = '';
        candidates.forEach(function (item) { container.appendChild(makeCapsule(item)); });
        container.appendChild(makeToggle(true));
        var rows2 = capsuleRowIndexes_(container);
        if (rows2[rows2.length - 1] <= CAPSULE_MAX_ROW_INDEX_) return;
        var idx = -1;
        for (var i = candidates.length - 1; i >= 0; i--) { if (!isProtected(candidates[i])) { idx = i; break; } }
        if (idx === -1) idx = candidates.length - 1; // só sobraram protegidas e ainda não coube
        candidates.splice(idx, 1);
      }
      container.innerHTML = '';
      container.appendChild(makeToggle(true));
    }

    build();
  }

  /**
   * Campo de seleção em "cápsulas" no lugar de um <select>.
   *
   * Modo padrão: mostra até 4 linhas de opções (medidas de verdade no DOM, não um número
   * fixo de itens), ordenadas por quem chamou (normalmente por uso recente). O que não
   * couber fica acessível pela cápsula "Outro...", que abre um <select> nativo em ordem
   * alfabética; ao escolher algo lá, uma cápsula temporária é criada pra aquela escolha —
   * sem substituir a cápsula "Outro...", que continua disponível pra escolher outra coisa.
   *
   * (Ver renderCollapsibleCapsules_ logo acima pro "+"/"−" de 30 dias.)
   *
   * Modo collapseUnused (todos os campos de categoria — ver rankedCategoryItems): lista
   * PLANA com todas as categorias e subcategorias inline, alfabéticas; passando de 4
   * linhas, as que não foram usadas nos últimos 30 dias ficam atrás de um "+" (ver
   * renderCollapsibleCapsules_). Substitui inteiramente a cápsula "Outro...", que não faz
   * sentido aqui (já mostra tudo por padrão). Houve no meio do caminho uma variante em que
   * a categoria de topo abria as subcategorias num dropdown por hover; foi aposentada em
   * favor da lista plana — está nos commits a12e7c1/dbc7f11 se algum dia precisar voltar.
   *
   * config: { container, pinned: {value,label}|null,
   *   items: [{value,label,isSubcategory,tooltip,recentlyUsed}],
   *   selectedValue, onChange, allowDeselect, disabled, collapseUnused }
   * allowDeselect: clicar na cápsula já ativa desmarca (getValue vira null) em vez de manter selecionada.
   * item.isSubcategory/tooltip: estilo de borda dupla + tooltip instantâneo ao passar o mouse.
   * item.recentlyUsed: só relevante com collapseUnused — ver acima.
   * retorna { getValue, setValue }
   */
  function createCapsuleField(container, config) {
    var items = config.items || [];
    // undefined = "sem preferência" (usa o padrão); null explícito = "começa sem nada selecionado".
    var selectedValue = config.selectedValue !== undefined
      ? config.selectedValue
      : (config.pinned ? config.pinned.value : (items[0] ? items[0].value : null));
    var tempExtra = null; // { value, label } escolhido via "Outro..." (modo padrão só)

    function mainList() {
      var list = [];
      if (config.pinned) list.push({ value: config.pinned.value, label: config.pinned.label });
      items.forEach(function (i) { list.push(i); });
      if (tempExtra && !list.some(function (i) { return i.value === tempExtra.value; })) {
        list.push(tempExtra);
      }
      return list;
    }

    function makeCapsule(item) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'capsule' + (item.value === selectedValue ? ' active' : '') +
        (config.disabled ? ' capsule-disabled' : '') + (item.isSubcategory === false ? ' capsule-category' : '');
      if (item.colorIndex !== undefined && item.colorIndex !== null) b.innerHTML = accountNameHtml_(item.label, item.colorIndex);
      else b.textContent = item.label;
      if (item.tooltip) {
        b.addEventListener('mouseenter', function () { showTooltip_(b, item.tooltip, { italic: item.tooltipItalic }); });
        b.addEventListener('mouseleave', hideTooltip_);
      }
      if (config.disabled) {
        b.disabled = true;
      } else {
        b.onclick = function () {
          // Sem isso, um clique que REMOVE a cápsula (ex: desmarcar a cápsula solta de
          // subcategoria) não dispara mouseleave — o navegador só dispara isso em
          // movimento de mouse de verdade, não quando o elemento é removido por baixo do
          // cursor — e o tooltip ficava preso na tela mesmo depois da cápsula sumir.
          hideTooltip_();
          if (config.allowDeselect && selectedValue === item.value) {
            selectedValue = null;
          } else {
            selectedValue = item.value;
          }
          build();
          if (config.onChange) config.onChange(selectedValue);
        };
      }
      return b;
    }

    function trimToMaxRows(container, outroBtn) {
      var rows = capsuleRowIndexes_(container);
      if (Math.max.apply(null, rows) <= CAPSULE_MAX_ROW_INDEX_) {
        outroBtn.remove();
        return;
      }
      var mainEls = Array.prototype.slice.call(container.children).filter(function (el) { return el !== outroBtn; });
      while (mainEls.length) {
        container.innerHTML = '';
        mainEls.forEach(function (el) { container.appendChild(el); });
        container.appendChild(outroBtn);
        var rows2 = capsuleRowIndexes_(container);
        if (rows2[rows2.length - 1] <= CAPSULE_MAX_ROW_INDEX_) return;
        mainEls.pop();
      }
      container.innerHTML = '';
      container.appendChild(outroBtn);
    }

    function openOutroSelect() {
      var select = document.createElement('select');
      var sorted = items.slice().sort(function (a, b) { return a.label.localeCompare(b.label, 'pt-BR'); });
      select.innerHTML = '<option value="">Selecione…</option>' + sorted.map(function (i) {
        return '<option value="' + i.value + '"' + (i.value === selectedValue ? ' selected' : '') + '>' + escapeHtml(i.label) + '</option>';
      }).join('');
      container.appendChild(select);
      select.focus();
      if (select.showPicker) { try { select.showPicker(); } catch (e) { /* not supported everywhere */ } }
      select.onchange = function () {
        if (select.value) {
          var chosen = sorted.find(function (i) { return i.value === select.value; });
          tempExtra = chosen;
          selectedValue = chosen.value;
          if (config.onChange) config.onChange(selectedValue);
        }
        build();
      };
      select.onblur = function () { build(); };
    }

    function build() {
      container.innerHTML = '';
      if (!mainList().length) {
        container.innerHTML = '<div class="muted">Nenhuma opção disponível.</div>';
        return;
      }

      if (config.collapseUnused) {
        renderCollapsibleCapsules_(container, mainList(), makeCapsule, function (item) {
          return item.recentlyUsed || item.value === selectedValue;
        });
        return;
      }

      mainList().forEach(function (item) { container.appendChild(makeCapsule(item)); });
      if (config.disabled) return;

      var outroBtn = document.createElement('button');
      outroBtn.type = 'button';
      outroBtn.className = 'capsule capsule-outro';
      outroBtn.textContent = 'Outro...';
      outroBtn.onclick = openOutroSelect;
      container.appendChild(outroBtn);
      trimToMaxRows(container, outroBtn);
    }

    build();
    return {
      getValue: function () { return selectedValue; },
      setValue: function (v) { selectedValue = v; build(); }
    };
  }

  /**
   * Cápsulas de intervalo de dias (7/15/30/60/Outro) pro orçamento. "Outro" não abre
   * um <select> como o "Outro..." de createCapsuleField (que é pra escolher de uma
   * lista existente) — aqui vira um número digitado direto dentro da própria cápsula,
   * com "dias" fixo ao lado, já que o valor é livre (1 a 999) e não uma opção da lista.
   *
   * showAuto (só orçamento, nunca lançamento recorrente): acrescenta "Automático" como
   * 1ª cápsula -- período/teto passam a ser derivados de Y (ver budgetAutoWindowDays_/
   * openBudgetModal), as cápsulas normais/Outro ficam inertes enquanto ela estiver
   * selecionada. getValue() devolve o literal 'auto' nesse estado (em vez do número/
   * {value,unit} de sempre) -- é assim que openBudgetModal distingue os 2 modos.
   */
  function createIntervalDaysField(container, opts) {

    // "Mensal"/ciclar dias<->meses só existem pro lançamento recorrente (unitAware) — pra
    // Orçamento, tudo continua puro-dias como sempre foi. unitAware muda o que getValue()
    // devolve ({value,unit} em vez de só um número) e o que "Mensal"/"Outro..." significam
    // de verdade: 1 mês NÃO é mais um apelido de 30 dias, é uma unidade própria (ver
    // validateForecastInterval_/Forecasts.js — a lógica por trás não multiplica por 30).
    var monthlyLabel = !!opts.monthlyLabel;
    var unitAware = !!opts.unitAware;
    var showAuto = !!opts.showAuto;
    var isAuto = showAuto && opts.selectedDays === 'auto';
    var selected = (typeof opts.selectedDays === 'number') ? opts.selectedDays : 30;
    var selectedUnit = (unitAware && opts.selectedUnit === 'months') ? 'months' : 'days';
    var editing = false;
    var editingUnit = 'days'; // 'days' | 'months' — só existe enquanto editing=true

    function isCustom() {
      if (selectedUnit === 'months') return selected !== 1; // 1 mês É o preset "Mensal"
      return presets.indexOf(selected) === -1;
    }
    function fireChange_() {
      if (!opts.onChange) return;
      opts.onChange(isAuto ? 'auto' : (unitAware ? { value: selected, unit: selectedUnit } : selected));
    }
    function commitAuto() {
      isAuto = true;
      editing = false;
      build();
      fireChange_();
    }
    function commitDays(value) {
      isAuto = false;
      selected = Math.min(999, Math.max(1, Math.round(value) || 30));
      selectedUnit = 'days';
      editing = false;
      build();
      fireChange_();
    }
    function commitMonths(value) {
      isAuto = false;
      selected = Math.min(60, Math.max(1, Math.round(value) || 1));
      selectedUnit = 'months';
      editing = false;
      build();
      fireChange_();
    }

    function build() {
      container.innerHTML = '';
      if (showAuto) {
        var autoBtn = document.createElement('button');
        autoBtn.type = 'button';
        autoBtn.className = 'capsule' + (isAuto ? ' active' : '');
        // (X dias) só quando dá pra calcular -- pedido explícito do usuário, pra deixar
        // claro o que "Automático" está usando de verdade sem precisar abrir outro lugar.
        autoBtn.textContent = 'Automático' + (opts.autoResolvedDays ? ' (' + opts.autoResolvedDays + ' dias)' : '');
        autoBtn.onclick = commitAuto;
        container.appendChild(autoBtn);
      }
      presets.forEach(function (days) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'capsule' + (!isAuto && selectedUnit === 'days' && selected === days ? ' active' : '');
        b.textContent = days + ' dias';
        b.onclick = function () { commitDays(days); };
        container.appendChild(b);
      });
      if (monthlyLabel) {
        var mb = document.createElement('button');
        mb.type = 'button';
        mb.className = 'capsule' + (!isAuto && selectedUnit === 'months' && selected === 1 ? ' active' : '');
        mb.textContent = 'Mensal';
        mb.onclick = function () { commitMonths(1); };
        container.appendChild(mb);
      }

      if (editing) {

        // de bastante contraste com o texto pra dar pra ler o que tá sendo digitado.
        var wrap = document.createElement('span');
        wrap.className = 'capsule';
        wrap.style.cssText = 'display:inline-flex;align-items:center;background:var(--surface);border:1px solid var(--primary);color:var(--text)';
        var input = document.createElement('input');
        input.type = 'text';
        input.inputMode = 'numeric';
        input.value = isCustom() ? String(selected) : '';
        input.style.cssText = 'border:none;background:transparent;padding:0;margin:0;width:36px;text-align:center;font:inherit;font-size:inherit;color:var(--text);outline:none;';

          // vira ~3 meses) em vez de só trocar o rótulo — só existe em modo unitAware,
          // já que pra Orçamento "meses" nunca foi uma unidade de verdade. preventDefault
          // no mousedown evita que o clique tire o foco do input (disparando onblur/
          // commit antes da hora).
          var unitBtn = document.createElement('button');
          unitBtn.type = 'button';
          unitBtn.style.cssText = 'border:none;background:transparent;padding:0;margin-left:4px;font:inherit;font-size:inherit;color:inherit;cursor:pointer;text-decoration:underline dotted';
          unitBtn.textContent = editingUnit === 'months' ? 'meses' : 'dias';
          unitBtn.onmousedown = function (e) { e.preventDefault(); };
          unitBtn.onclick = function () {
            var typed = Number(input.value) || 0;
            if (editingUnit === 'days') { editingUnit = 'months'; input.value = String(Math.max(1, Math.round(typed / 30))); }
            else { editingUnit = 'days'; input.value = String(Math.max(1, typed * 30)); }
            unitBtn.textContent = editingUnit === 'months' ? 'meses' : 'dias';
            input.focus();
          };
          wrap.appendChild(unitBtn);
        } else {
          wrap.appendChild(document.createTextNode(' dias'));
        }
        container.appendChild(wrap);
        setTimeout(function () { input.focus(); }, 0);
      } else if (!isAuto && isCustom()) {
        var outroBtn = document.createElement('button');
        outroBtn.type = 'button';
        outroBtn.className = 'capsule active';
        outroBtn.textContent = selected + ' ' + (selectedUnit === 'months' ? 'meses' : 'dias');
        outroBtn.onclick = function () { editing = true; editingUnit = selectedUnit; build(); };
        container.appendChild(outroBtn);
      } else {
        // Aparece mesmo com Automático selecionado (pedido explícito do usuário) -- dá
        // pra pular direto pra um período manual customizado sem precisar clicar antes
        // numa cápsula fixa (7/15/30/60 dias) só pra "sair" do Automático.
        var newBtn = document.createElement('button');
        newBtn.type = 'button';
        newBtn.className = 'capsule capsule-outro';
        newBtn.textContent = 'Outro...';
        newBtn.onclick = function () { editing = true; editingUnit = 'days'; build(); };
        container.appendChild(newBtn);
      }
    }

    build();
    return { getValue: function () { return isAuto ? 'auto' : (unitAware ? { value: selected, unit: selectedUnit } : selected); } };
  }

  // ---------- ícones de categoria ----------
  /**
