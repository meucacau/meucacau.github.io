  // ---------- botão "Revisar pendências" (abaixo do "+") ----------
  /** Mostra/esconde o botão e atualiza contagem e texto: em qualquer aba, desde que haja
   *  pendência. Chamada por render(). */
  function updateReviewButton_() {
    var btn = document.getElementById('review-pending');
    if (!btn) return;
    var n = STATE.pendingEntries.length;
    var show = n > 0;
    btn.hidden = !show;
    document.documentElement.classList.toggle('has-review-fab', show);
    if (!show) return;
    var label = n + ' para confirmar';
    btn.querySelector('.review-badge').textContent = n > 99 ? '99+' : String(n);
    btn.querySelector('.tab-label').textContent = label;
    btn.setAttribute('aria-label', label);
  }
  function setupReviewButton_() {
    var btn = document.getElementById('review-pending');
    if (!btn) return;
    var hold = setupHoldToReveal_(btn, { hoverDelayMs: SIDEBAR_HOLD_MS_, touchDelayMs: SIDEBAR_HOLD_MS_, leaveGraceMs: 150 });
    var stopOutsideClick_ = null;
    hold.onOpen(function () {
      // Largura natural: 13px de borda + ícone (22) + vão (10) + nome + 13px de borda.
      var labelW = btn.querySelector('.tab-label').scrollWidth;
      btn.style.width = (13 + 22 + 10 + labelW + 13) + 'px';
      btn.classList.add('expanded');
      stopOutsideClick_ = dismissOnOutsideClick(btn, hold.close);
    });
    hold.onClose(function () {
      btn.style.width = '';
      btn.classList.remove('expanded');
      if (stopOutsideClick_) { stopOutsideClick_(); stopOutsideClick_ = null; }
    });
    // Sem refreshAll() antes de abrir: getBootstrapData relê TODA a planilha (inclusive
    // a lista inteira de lançamentos, só pra jogar fora em seguida) e por isso demorava
    // vários segundos. É redundante — toda mutação (ex: salvar uma palavra-chave em
    // Categorias) já dispara um refreshAll() sozinha via afterMutation_, então STATE já
    // chega aqui atualizado; e listPendingEntries recalcula a sugestão de cada pendência
    // na hora que é chamada, nunca confiando num valor gravado na criação.
    btn.onclick = function () {
      if (hold.consumeSuppressedClick()) return;
      hold.close();
      openPendingReviewModal(0);
    };
  }

  // Lucide "eye-off" -- marca discreta de um lançamento "Não considerar em análises?" (pedido
  // explícito do usuário), com o tooltip "Fora das análises".
  var TX_FLAG_ICON_ = '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/>' +
    '<path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/>' +
    '<path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/>' +
    '<path d="m2 2 20 20"/></svg>';
  /** '' se o lançamento conta nas análises; senão o ícone (ligado por wireTooltipTrigger_ nos
   *  mesmos 3 lugares que ligam o tooltip do valor, ver .tx-flag-icon). */
  function txFlagIconHtml_(t) {
    if (!t.excludeFromAnalysis) return '';
    return '<span class="tx-flag-icon muted" data-tooltip="Fora das análises" style="margin-right:6px;font-size:12px;vertical-align:-0.1em;display:inline-block;line-height:1">' + TX_FLAG_ICON_ + '</span>';
  }
  /** Só pro card "Últimos lançamentos" do Início — sem agrupamento por data, então
   *  precisa mostrar a data por extenso. Extrato usa extratoRowHtml (ver abaixo): já
   *  agrupado em cards por dia, a data ali seria redundante. */
  function txRowHtml(t) {
    var isTransfer = t.kind === 'transfer_out' || t.kind === 'transfer_in';
    var isExpense = t.kind === 'expense' || t.kind === 'transfer_out';
    var sign = isExpense ? '-' : '+';
    var cls = isExpense ? 'amount-expense' : 'amount-income';
    var mainLabel = '<strong>' + (isTransfer ? 'Transferência' : categoryLabelHtml(t.categoryId)) + '</strong>';
    if (t.description) mainLabel += ' · ' + escapeHtml(t.description);
    if (t.counterparty) mainLabel += ' · ' + escapeHtml(t.counterparty);
    var sub = accountNameHtml(t.accountId); // já vem em HTML (nome colorido/negrito) — números do sufixo não precisam escapar
    if (t.installmentSeq) sub += ' · parcela ' + t.installmentSeq + '/' + t.installmentTotal;
    var whenLabel = fmtDate(t.date) + (t.time ? ' ' + t.time : '');
    var rowAttrs = (t.pending && !t.editable) ? ' class="row"' : ' class="row row-clickable" data-tx="' + escapeHtml(t.id) + '"';
    return '<div' + rowAttrs + '>' +
      '<span style="font-size:13px">' + mainLabel + '<br><span class="muted">' + whenLabel + ' · ' + sub + '</span></span>' +
      // Marca "Fora das análises" junto do VALOR (no fim do texto ela podia cair sozinha numa
      // linha quando o texto quebrava); nowrap mantém ícone e valor sempre lado a lado.
      '<span style="white-space:nowrap">' + txFlagIconHtml_(t) + netAmountSpanHtml_(t, cls, sign) + '</span>' +
    '</div>';
  }

  // ---------- reembolsos ----------
  /**
   * Reembolso de despesa compartilhada (ver Refunds.js, servidor): um lançamento
   * "passivo" (despesa) tem uma ou mais RefundShares (quem te deve uma parte); um
   * lançamento "ativo" (receita) vira um RefundLink cobrindo uma ou mais Shares. Tudo
   * aqui é DERIVADO de STATE.refundShares/refundLinks (crus, vindos do bootstrap) +
   * STATE.allTransactions — nada de "completo"/"líquido" é armazenado, é sempre
   * calculado na hora.
   *
   * Botão "Reembolso?" abre um POPUP empilhado por CIMA do modal de lançamento (não um
   * campo fixo nele — só uma minoria dos lançamentos usa isso, não vale o espaço
   * permanente na tela) via openRefundModal_, que usa uma raiz PRÓPRIA (não
   * #modal-root) pra não destruir/perder o que já estava preenchido no formulário por
   * baixo (ver openRefundModal_/closeRefundModal_ abaixo).
   */
  function personName_(personId) {
    var p = STATE.people.find(function (x) { return x.id === personId; });
    return p ? p.name : '(pessoa removida)';
  }
  function sharesOfPassive_(passiveTxId) {
    return STATE.refundShares.filter(function (s) { return s.passiveTransactionId === passiveTxId; });
  }
  function linksOfShare_(shareId) {
    return STATE.refundLinks.filter(function (l) { return l.shareId === shareId; });
  }
  function allocatedForShare_(shareId) {
    return linksOfShare_(shareId).reduce(function (sum, l) { return sum + l.allocatedAmount; }, 0);
  }
  function isShareComplete_(share) {
    return Math.round(allocatedForShare_(share.id) * 100) >= Math.round(share.expectedAmount * 100);
  }
  /** Valor líquido de uma despesa passiva: o que já foi de fato vinculado (não a meta
   *  inteira) sai do total — nomear pessoas sozinho não muda nada até um reembolso de
   *  verdade ser associado. Usada pro Extrato/Início (netDisplayAmount_), pro
   *  "Gastos por categoria" do Dashboard (netExpensesByCategory_) e pra mediana de
   *  fora-da-curva (categoryRecentMedian_) -- em todos esses o saldo/valor mostrado
   *  precisa refletir o dinheiro que JÁ voltou de verdade pra conta, não uma promessa. */
  function netAmountOfPassive_(tx) {
    var shares = sharesOfPassive_(tx.id);
    if (!shares.length) return tx.amount;
    var allocated = shares.reduce(function (sum, s) { return sum + allocatedForShare_(s.id); }, 0);
    return tx.amount - allocated;
  }
  /** Valor líquido de uma despesa passiva PRA ORÇAMENTO -- diferente de
   *  netAmountOfPassive_ (grillado com o usuário): desconta o MAIOR entre o já alocado
   *  de verdade e o ESPERADO (soma de RefundShares.expectedAmount) das partes dessa
   *  despesa, não só o já alocado. Um reembolso combinado mas ainda não pago já reduz o
   *  gasto do orçamento (é dinheiro que o usuário não considera "seu" de verdade, mesmo
   *  antes de voltar) -- nunca desconta MENOS que o já recebido de verdade (se o
   *  reembolso real superar o esperado, o real vence) nem mais que o esperado enquanto
   *  ele não for atingido. Só usada nos 3 cálculos de orçamento (spentForBudgetInRange_/
   *  medianTransactionAmountForBudget_/computeBudgetAdvisory_) -- Extrato/Início/
   *  Dashboard/mediana de fora-da-curva continuam usando netAmountOfPassive_ (valor
   *  real), já que ali o dinheiro esperado ainda não voltou de verdade pra conta. */
  function netAmountOfPassiveForBudget_(tx) {
    var shares = sharesOfPassive_(tx.id);
    if (!shares.length) return tx.amount;
    var allocated = shares.reduce(function (sum, s) { return sum + allocatedForShare_(s.id); }, 0);
    var expected = shares.reduce(function (sum, s) { return sum + s.expectedAmount; }, 0);
    return tx.amount - Math.max(allocated, expected);
  }
  function linksOfActive_(activeTxId) {
    return STATE.refundLinks.filter(function (l) { return l.activeTransactionId === activeTxId; });
  }
  function allocatedFromActive_(activeTxId) {
    return linksOfActive_(activeTxId).reduce(function (sum, l) { return sum + l.allocatedAmount; }, 0);
  }
  /** Só a parcela NÃO alocada de uma receita conta como receita de verdade — o resto já
   *  é a outra metade de uma despesa que já foi contada, não dinheiro novo. */
  function netContributionOfActive_(tx) {
    return tx.amount - allocatedFromActive_(tx.id);
  }
  /**
   * Líquido de um lançamento (netAmountOfPassive_/netContributionOfActive_) + se ele tem
   * algum reembolso de fato vinculado (isNet). Mesma regra pros dois lados (despesa
   * passiva/receita ativa). Usada por netAmountSpanHtml_, no Extrato (extratoRowHtml) e no
   * card "Últimos lançamentos" do Início (txRowHtml): a lista mostra o valor ORIGINAL com
   * "*" quando isNet, e o líquido (info.amount) aparece só no tooltip.
   */
  function netDisplayAmount_(t) {
    var net = null;
    if (t.kind === 'expense' && sharesOfPassive_(t.id).length) net = netAmountOfPassive_(t);
    else if (t.kind === 'income' && linksOfActive_(t.id).length) net = netContributionOfActive_(t);
    if (net === null || Math.round(net * 100) === Math.round(t.amount * 100)) {
      return { amount: t.amount, isNet: false };
    }
    return { amount: net, isNet: true };
  }
  /** HTML pronto do valor (com sinal, cor e "*"+tooltip quando líquido) — o único trecho
   *  que extratoRowHtml/txRowHtml precisam variar é o resto da linha ao redor disso. */
  function netAmountSpanHtml_(t, cls, sign) {
    var info = netDisplayAmount_(t);
    // Mostra o valor ORIGINAL do lançamento (com "*"); o líquido de reembolso -- que é o que
    // vale nas análises e cálculos -- vai só no tooltip. Exibir o líquido virava "+ R$ 0,00*"
    // numa receita que quita tudo (pedido explícito do usuário).
    var tooltipAttr = info.isNet ? ' data-tooltip="Valor líquido de reembolso: ' + escapeHtml(fmtMoney(info.amount)) + '"' : '';
    return '<span class="' + cls + '"' + tooltipAttr + '>' + sign + ' ' + fmtMoney(t.amount) + (info.isNet ? '*' : '') + '</span>';
  }
  /**
   * "Gastos por categoria" do Início já vem do servidor agrupado por categoria de TOPO
   * (getDashboardData, Dashboard.js) — bruto, sem saber de reembolso nenhum (o servidor
   * nunca sabe de líquido, ver topo deste arquivo). Recalcula aqui, por CIMA desse
   * agregado, quanto de cada categoria já foi de fato COBERTO por reembolso esse mês
   * (não a meta esperada inteira — nomear gente sozinho não reduz nada) e subtrai. Uma
   * categoria 100% reembolsada some do gráfico (nada sobrou de gasto real nela).
   */
  function netExpensesByCategory_(d) {
    var reduction = {};
    STATE.allTransactions.forEach(function (t) {
      // Marcado "Não considerar em análises?" já está FORA do agregado do servidor
      // (d.expensesByCategory, ver getDashboardData) -- descontar o reembolso dele aqui
      // subtrairia de um valor que nunca entrou.
      if (t.kind !== 'expense' || t.excludeFromAnalysis || !t.date || t.date.indexOf(d.month) !== 0) return;
      if (!sharesOfPassive_(t.id).length) return;
      var allocated = t.amount - netAmountOfPassive_(t);
      if (allocated <= 0) return;
      var name = topLevelCategoryName(t.categoryId);
      reduction[name] = (reduction[name] || 0) + allocated;
    });
    return d.expensesByCategory
      .map(function (e) { return { category: e.category, amount: e.amount - (reduction[e.category] || 0) }; })
      .filter(function (e) { return e.amount > 0.01; });
  }
  /** Todas as Shares em aberto (ainda incompletas) de qualquer despesa — usado pelo
   *  seletor de vínculo no lançamento de receita. */
  function openRefundShares_() {
    return STATE.refundShares.filter(function (s) { return !isShareComplete_(s); });
  }
  /** A despesa (lançamento passivo) de uma Share, se ainda existir em memória. */
  function passiveTransactionOf_(share) {
    return STATE.allTransactions.find(function (t) { return t.id === share.passiveTransactionId; }) || null;
  }
  /** Quanto ainda falta pra completar uma Share (nunca negativo — já vinculado além da
   *  meta não "vira crédito", só fica completo). */
  function remainingForShare_(share) {
    return Math.max(0, share.expectedAmount - allocatedForShare_(share.id));
  }
  function peopleDatalistHtml(id) {
    return '<datalist id="' + id + '">' +
      STATE.people.map(function (p) { return '<option value="' + escapeHtml(p.name) + '">'; }).join('') +
      '</datalist>';
  }
  /** Divisão sugerida entre os nomeados + você mesmo (a "+1") — sua própria parte fica
   *  implícita, nunca vira uma Share (não faz sentido "eu te devo a mim mesmo"). */
  function suggestedShareAmount_(totalAmount, namedCount) {
    return Math.round((totalAmount / (namedCount + 1)) * 100) / 100;
  }

  /**
   * Popup de reembolso: raiz PRÓPRIA (#refund-modal-root), separada de #modal-root, pra
   * empilhar por CIMA do modal de lançamento já aberto sem destruí-lo (fechar o popup
   * revela o modal de baixo exatamente como estava, com tudo que já tinha sido
   * preenchido — nada precisa ser recapturado/restaurado). z-index fica entre o
   * .modal-backdrop comum (50) e o .confirm-popover (200), pra uma confirmação
   * ("remover essa pessoa?") ainda aparecer por cima do popup quando precisar.
   */
  /**
   * Registrado UMA vez em document (não dentro do popup) — o popup não implementa um
   * "focus trap": Tab pode escapar dele e devolver o foco pra um campo/botão do modal
   * de lançamento por baixo (continua focável, só fica coberto visualmente pelo
   * backdrop). Um listener no próprio popup nunca veria essas teclas nesse caso —
   * Enter/Esc precisam funcionar não importa o que estiver focado, só checando se
   * #refund-modal-root existe agora (era exatamente por isso que Enter, escapando o
   * foco, acabava clicando o "Salvar" do lançamento por baixo, e Esc não fazia nada).
   *
   * Esc sempre fecha (cancela, volta pro lançamento por baixo). Enter aciona a ação
   * PRINCIPAL do popup — o que #refund-done fizer (Concluído nos popups de nomear
   * pessoas; Vincular no de ligar reembolso — cada um liga o próprio onclick nesse
   * mesmo id) — em qualquer lugar do popup, EXCETO dentro do campo de nome, onde
   * Enter adiciona uma pessoa em vez de disparar a ação principal (ver
   * wireRefundAddPersonRow_). Antes, tira o foco de quem estiver com ele (blur é o que
   * de fato salva um valor de dinheiro em edição, ver setupMoneyInput) — Enter não pode
   * simplesmente descartar uma edição em andamento.
   */
  document.addEventListener('keydown', function (e) {
    var refundRoot = document.getElementById('refund-modal-root');
    if (!refundRoot) return;
    if (e.key === 'Escape') {
      closeRefundModal_();
    } else if (e.key === 'Enter' && e.target.id !== 'refund-new-name') {
      e.preventDefault();
      if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
      var doneBtn = document.getElementById('refund-done');
      if (doneBtn) doneBtn.click(); else closeRefundModal_();
    }
  });

  function openRefundModal_(innerHtml) {
    closeRefundModal_();
    var root = document.createElement('div');
    root.id = 'refund-modal-root';
    document.body.appendChild(root);
    root.innerHTML = '<div class="modal-backdrop refund-modal-backdrop" id="refund-modal-backdrop"><div class="modal">' + innerHtml + '</div></div>';
    document.getElementById('refund-modal-backdrop').onclick = function (e) {
      if (e.target.id === 'refund-modal-backdrop') closeRefundModal_();
    };
    setTimeout(function () {
      var field = root.querySelector('input, select, textarea');
      if (field) field.focus();
    }, 0);
  }
  function closeRefundModal_() {
    var existing = document.getElementById('refund-modal-root');
    if (existing) existing.remove();
  }

  /** HTML de uma linha de pessoa dentro do popup de reembolso (ver
   *  openRefundSharesPopup_ abaixo) — nasce com o valor esperado ATUAL (sugestão ou já
   *  editado) e, se já for uma Share de verdade com algum reembolso já vinculado, um
   *  rótulo de progresso ("Completo · X de Y"). */
  function refundShareRowHtml_(rowId, personLabel, expectedAmount, progressLabel) {
    return '<div class="row" data-refund-row="' + escapeHtml(rowId) + '">' +
      '<span>' + escapeHtml(personLabel) + (progressLabel ? '<br><span class="muted" style="font-size:12px">' + progressLabel + '</span>' : '') + '</span>' +
      '<span class="row-actions">' +
        '<input type="text" class="input-money" data-refund-amount="' + escapeHtml(rowId) + '" style="width:90px;margin-bottom:0">' +
        '<button type="button" class="row-x" data-refund-remove="' + escapeHtml(rowId) + '" aria-label="Remover" data-tooltip="Remover">×</button>' +
      '</span></div>';
  }
  /** Bloco "Nome + Adicionar", compartilhado pelos dois popups. As duas tentativas
   *  anteriores (label invisível acima do botão; depois flex-column com
   *  justify-content:flex-end) continuaram desalinhadas — abandonado o approach de
   *  tentar CASAR a altura do botão com uma coluna "label+input". Agora não tem label
   *  nenhum (o "Nome" vira placeholder DENTRO do próprio campo) — input e botão são
   *  os dois únicos filhos de UMA linha só com align-items:center, então ficam
   *  centralizados um em relação ao outro não importa a altura exata de cada um.
   */
  function refundAddPersonRowHtml_() {
    return '<div class="field" style="display:flex;gap:8px;align-items:center;margin-top:12px">' +
        '<input id="refund-new-name" list="refund-people-list" placeholder="Nome" style="flex:1;margin-bottom:0">' +
        '<button type="button" id="refund-add-person">Adicionar</button>' +
      '</div>' +
      peopleDatalistHtml('refund-people-list');
  }
  /** Liga o botão "Adicionar" e o Enter dentro do campo de nome (recriados a cada
   *  build()) à mesma função doAdd — Enter não pode borbulhar pro keydown do popup
   *  inteiro (que trataria Enter como "Concluído", ver openRefundModal_). */
  function wireRefundAddPersonRow_(doAdd) {
    document.getElementById('refund-add-person').onclick = doAdd;
    document.getElementById('refund-new-name').addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      e.stopPropagation();
      doAdd();
    });
  }
  /** Refoca o campo de nome depois de adicionar alguém — precisa esperar o próximo
   *  tick (setTimeout 0) pra rodar DEPOIS do auto-foco padrão de openRefundModal_
   *  (que focaria o primeiro campo do popup reconstruído, não necessariamente este). */
  function focusRefundNameInput_() {
    setTimeout(function () {
      var el = document.getElementById('refund-new-name');
      if (el) el.focus();
    }, 0);
  }

  /**
   * Popup de nomear pessoas de uma despesa compartilhada — SEMPRE staged até
   * confirmar, igual ao popup de vincular (ver openRefundLinkPopup_ abaixo): nada
   * toca o servidor enquanto o popup está aberto, só o clique em "Concluído" manda a
   * lista FINAL pro chamador via onConfirm(staged), que decide o que fazer com ela —
   * serve tanto pra despesa nova (fica staged até o Salvar do lançamento) quanto pra
   * despesa já existente (o chamador chama setRefundSharesForPassiveTransaction na
   * hora, otimista, ver renderRefundButtonE_). Chegou a existir uma versão "ao vivo"
   * só pra despesa já existente, com cada ação salvando sozinha — abandonada de
   * propósito (era a fonte da maioria dos bugs de corrida das primeiras rodadas de
   * teste: edição de valor não salvava de verdade, Enter/Esc brigavam com o modal por
   * baixo, criar uma pessoa nova piscava "(pessoa removida)" por alguns segundos).
   *
   * getTotalAmount: função (lida de novo a cada abertura, valor pode ter mudado).
   * initialShares: [{shareId (ausente se a Share em si ainda não existe de verdade),
   * personId (ausente se a PESSOA ainda não existe de verdade), personName,
   * expectedAmount}] — o que já está nomeado antes de abrir. Nunca mutado direto: o
   * popup clona pra um array local (staged), e só onConfirm recebe o resultado final
   * — Cancelar/Esc simplesmente descarta esse local sem chamar onConfirm. Toda linha
   * vinda de initialShares nasce "touched" (a divisão igual — ver
   * rescaleUntouchedStagedShares_ — nunca reescreve um valor que já existia antes de
   * abrir o popup, só as pessoas adicionadas NESTA sessão dele).
   */
  function openRefundSharesPopup_(getTotalAmount, initialShares, onConfirm) {
    var staged = initialShares.map(function (s) {
      return { shareId: s.shareId || null, personId: s.personId || null, personName: s.personName, expectedAmount: s.expectedAmount, touched: true };
    });

    function build() {
      var total = getTotalAmount();
      var rowsHtml = staged.map(function (s, i) {
        var progress = s.shareId
          ? (isShareComplete_({ id: s.shareId, expectedAmount: s.expectedAmount }) ? 'Completo · ' : '') + fmtMoney(allocatedForShare_(s.shareId)) + ' de ' + fmtMoney(s.expectedAmount)
          : null;
        return refundShareRowHtml_('row-' + i, s.personName, s.expectedAmount, progress);
      }).join('');
      openRefundModal_(
        '<h2>Reembolso desta despesa</h2>' +
        '<div class="muted" style="margin-bottom:12px">Total: ' + fmtMoney(total) + '. Quem mais está dividindo essa despesa com você?</div>' +
        '<div id="refund-rows">' + (rowsHtml || '<div class="empty-state">Ninguém adicionado ainda.</div>') + '</div>' +
        refundAddPersonRowHtml_() +
        '<button type="button" class="secondary" id="refund-done" style="width:100%;margin-top:8px">Concluído</button>'
      );
      staged.forEach(function (s, i) {
        var input = document.querySelector('[data-refund-amount="row-' + i + '"]');
        setupMoneyInput(input, s.expectedAmount);
        // 'blur', não 'change': setupMoneyInput intercepta TODO keydown com
        // preventDefault() e só troca o valor via script (render_) — o navegador nunca
        // considera isso uma edição "de verdade" (a que dispararia 'change' nativo ao
        // sair do campo). 'blur' funciona sempre, não importa como o valor mudou.
        input.addEventListener('blur', function () {
          var newAmount = input.getValue();
          if (newAmount === s.expectedAmount) return;
          s.expectedAmount = newAmount;
          s.touched = true;
          build();
        });
      });
      document.querySelectorAll('[data-refund-remove]').forEach(function (btn) {
        btn.onclick = function () {
          var idx = Number(btn.dataset.refundRemove.replace('row-', ''));
          staged.splice(idx, 1);
          rescaleUntouchedStagedShares_(staged, getTotalAmount());
          build();
        };
      });
      wireRefundAddPersonRow_(function () {
        var nameInput = document.getElementById('refund-new-name');
        var name = nameInput.value.trim();
        if (!name) { errorPopover(nameInput, 'Informe um nome.'); return; }
        if (staged.some(function (s) { return s.personName.toLowerCase() === name.toLowerCase(); })) {
          errorPopover(nameInput, 'Essa pessoa já está na lista.');
          return;
        }
        var existingPerson = STATE.people.find(function (p) { return p.name.trim().toLowerCase() === name.toLowerCase(); });
        staged.push({
          shareId: null,
          personId: existingPerson ? existingPerson.id : null,
          personName: existingPerson ? existingPerson.name : name,
          expectedAmount: 0,
          touched: false
        });
        rescaleUntouchedStagedShares_(staged, getTotalAmount());
        build();
        focusRefundNameInput_();
      });
      document.getElementById('refund-done').onclick = function () {
        var doneBtn = document.getElementById('refund-done');
        var sum = staged.reduce(function (acc, s) { return acc + s.expectedAmount; }, 0);
        if (Math.round(sum * 100) > Math.round(total * 100)) {
          errorPopover(doneBtn, 'A soma dos valores esperados (' + fmtMoney(sum) + ') não pode passar do valor da despesa (' + fmtMoney(total) + ').');
          return;
        }
        closeRefundModal_();
        onConfirm(staged);
      };
    }
    build();
  }
  /** Recalcula a divisão igual (total ÷ nomeados+1) só pras linhas que o usuário ainda
   *  não editou manualmente — uma edição manual (touched) nunca é sobrescrita sozinha. */
  function rescaleUntouchedStagedShares_(staged, total) {
    var suggestion = suggestedShareAmount_(total, staged.length);
    staged.forEach(function (s) { if (!s.touched) s.expectedAmount = suggestion; });
  }
  /**
   * Primeira fase (síncrona) de resolver o staged final de openRefundSharesPopup_ pra
   * IDs de pessoa reais: quem já tinha personId (existente OU um id temporário de
   * outra criação em voo) simplesmente segue; quem só foi digitado no popup (personId
   * ainda null) ganha uma Pessoa otimista/temporária JÁ (createPerson disparado na
   * hora), do mesmo jeito que toda criação de entidade no app aparece na tela antes do
   * servidor confirmar — sem isso, uma pessoa nova ficava "(pessoa removida)" por
   * alguns segundos até o createPerson responder.
   *
   * Devolve { shares, ready }: shares (com ALGUM personId, real ou temporário — já dá
   * pra desenhar/otimista com ele) é o que usar de imediato; ready é a promise que só
   * resolve quando toda pessoa (nova ou não) já tem um ID real — o que
   * setRefundSharesForPassiveTransaction precisa esperar antes de mandar pro servidor.
   */
  function beginResolvingStagedSharePeople_(staged) {
    var shares = staged.map(function (s) {
      var personId = s.personId;
      if (!personId) {
        personId = 'tmp-' + Math.random().toString(36).slice(2);
        STATE.people.push({ id: personId, name: s.personName, archived: false });
        var creation = run('createPerson', { name: s.personName }).then(function (created) {
          return adoptRealId_(STATE.people, personId, created.ID);
        });
        pendingCreations_[personId] = creation;
        creation.catch(function (err) {
          var idx = STATE.people.findIndex(function (x) { return x.id === personId; });
          if (idx !== -1) STATE.people.splice(idx, 1);
          render();
        }).finally(function () { delete pendingCreations_[personId]; });
      }
      return { shareId: s.shareId, personId: personId, expectedAmount: s.expectedAmount };
    });
    var ready = Promise.all(shares.map(function (s) { return resolveRealId_(s.personId); })).then(function (personIds) {
      return shares.map(function (s, i) { return { shareId: s.shareId, personId: personIds[i], expectedAmount: s.expectedAmount }; });
    });
    return { shares: shares, ready: ready };
  }

  /** Saldo (em centavos) de uma receita no popup de vincular: valor menos o já alocado às
   *  partes marcadas. Pode ficar negativo se o usuário digitar mais que o saldo à mão. */
  function refundLinkSaldoCents_(totalCents, allocatedCents) {
    return totalCents - allocatedCents;
  }
  /** Quanto preencher ao marcar uma parte: o que falta dela, ou só a diferença (o saldo) se
   *  a receita não der pra pagar a parte inteira. Nunca negativo. */
  function refundLinkFillCents_(remainingCents, availableCents) {
    return Math.max(0, Math.min(remainingCents, availableCents));
  }

  /** Uma linha de Share em aberto no popup de VINCULAR reembolso — some com o "×" das
   *  outras listas (aqui é seleção múltipla via checkbox, não uma linha por si só). */
  /** checked: já vem marcada (essa Share já está selecionada/vinculada por quem abriu
   *  o popup — ver openRefundLinkPopup_/alreadySelected) — nasce com o checkbox
   *  marcado e o campo de valor habilitado, em vez de vazio/desabilitado. */
  function refundLinkRowHtml_(share, checked) {
    var passiveTx = passiveTransactionOf_(share);
    // categoryLabelHtml já vem escapado (e com ícone) -- só a descrição livre e o nome
    // da pessoa precisam passar por escapeHtml aqui.
    var categoryOrDescription = passiveTx ? (passiveTx.description ? escapeHtml(passiveTx.description) : categoryLabelHtml(passiveTx.categoryId)) : '(despesa)';
    var labelHtml = escapeHtml(personName_(share.personId) + ' · ') + categoryOrDescription;
    var remaining = remainingForShare_(share);
    return '<div class="row" data-refundlink-row="' + escapeHtml(share.id) + '">' +
      '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;flex:1">' +
        '<input type="checkbox" data-refundlink-check="' + escapeHtml(share.id) + '" style="width:auto;margin:0;flex:0 0 auto"' + (checked ? ' checked' : '') + '>' +
        '<span>' + labelHtml + '<br><span class="muted" style="font-size:12px">Falta ' + fmtMoney(remaining) + ' de ' + fmtMoney(share.expectedAmount) + '</span></span>' +
      '</label>' +
      '<span class="row-actions"><input type="text" class="input-money" data-refundlink-amount="' + escapeHtml(share.id) + '" style="width:90px;margin-bottom:0"' + (checked ? '' : ' disabled') + '></span>' +
    '</div>';
  }

  /**
   * Popup de VINCULAR reembolso — sempre "staged até confirmar": marcar/desmarcar e
   * editar o valor alocado nunca chama o servidor sozinho; só o clique em "Vincular"
   * decide o que fazer com a lista final de alocações, via onConfirm(allocations) — o
   * CHAMADOR decide se isso é encadeado depois do lançamento salvar (receita nova) ou
   * mandado pro servidor na hora (receita já existente), a mesma lógica serve pros
   * dois casos.
   *
   * getTotalAmount: função (lida de novo a cada abertura, valor pode ter mudado).
   * alreadySelected: [{shareId, amount}] do que JÁ está escolhido antes de abrir —
   * tanto vínculos de verdade (editando uma receita já salva) quanto uma seleção ainda
   * só local (reabrindo o popup antes de salvar uma receita nova, ver
   * stagedRefundLinks) — pro popup, as duas coisas são a mesma pergunta ("o que já
   * está marcado"), então um parâmetro só cobre os dois casos. Nasce marcado, com o
   * valor ATUAL (não a sugestão), e aparece mesmo se a Share já estiver completa por
   * causa desse mesmo vínculo (senão a Share sumiria da lista ao reabrir).
   */
  function openRefundLinkPopup_(getTotalAmount, alreadySelected, onConfirm) {
    alreadySelected = alreadySelected || [];
    function selectedAmountFor_(shareId) {
      var found = alreadySelected.find(function (a) { return a.shareId === shareId; });
      return found ? found.amount : null;
    }
    // União de "toda Share em aberto" com "Share(s) que essa alocação já cobre" (pode
    // incluir uma Share já COMPLETA — completa por causa desse mesmo vínculo — que
    // openRefundShares_ sozinho excluiria).
    var byId = {};
    openRefundShares_().forEach(function (s) { byId[s.id] = s; });
    alreadySelected.forEach(function (a) {
      if (!byId[a.shareId]) {
        var s = STATE.refundShares.find(function (x) { return x.id === a.shareId; });
        if (s) byId[a.shareId] = s;
      }
    });
    // Já selecionada vem primeiro (é o que o usuário veio revisar), depois ordem
    // alfabética por pessoa.
    var shares = Object.keys(byId).map(function (id) { return byId[id]; }).sort(function (a, b) {
      var aSel = selectedAmountFor_(a.id) !== null ? 0 : 1;
      var bSel = selectedAmountFor_(b.id) !== null ? 0 : 1;
      if (aSel !== bSel) return aSel - bSel;
      return personName_(a.personId).localeCompare(personName_(b.personId));
    });

    function checkedShares() {
      return shares.filter(function (s) { return document.querySelector('[data-refundlink-check="' + s.id + '"]').checked; });
    }
    // Soma (em centavos) dos valores das partes marcadas, exceto `exceptShare` (opcional).
    function allocatedCentsOfChecked_(exceptShare) {
      return checkedShares().reduce(function (sum, x) {
        if (exceptShare && x.id === exceptShare.id) return sum;
        return sum + Math.round(document.querySelector('[data-refundlink-amount="' + x.id + '"]').getValue() * 100);
      }, 0);
    }
    /** Linha "Receita: X · Saldo: Y" (Y vermelho se negativo) e, sem saldo, trava as partes
     *  ainda desmarcadas (não dá pra marcar mais uma sem reduzir/desmarcar outra antes). */
    function updateSummary_() {
      var totalCents = Math.round(getTotalAmount() * 100);
      var saldoCents = refundLinkSaldoCents_(totalCents, allocatedCentsOfChecked_());
      var summary = document.getElementById('refundlink-summary');
      if (summary) {
        summary.innerHTML = '<span class="muted">Receita: ' + escapeHtml(fmtMoney(totalCents / 100)) + ' · Saldo: </span>' +
          '<span class="' + (saldoCents < 0 ? 'amount-expense' : '') + '">' + escapeHtml(fmtMoney(saldoCents / 100)) + '</span>';
      }
      shares.forEach(function (s) {
        var check = document.querySelector('[data-refundlink-check="' + s.id + '"]');
        var row = check.closest('[data-refundlink-row]');
        var blocked = saldoCents <= 0 && !check.checked;
        check.disabled = blocked;
        check.title = blocked ? 'Sem saldo na receita' : '';
        if (row) row.style.opacity = blocked ? '0.5' : '';
      });
    }

    var rowsHtml = shares.map(function (s) { return refundLinkRowHtml_(s, selectedAmountFor_(s.id) !== null); }).join('');
    openRefundModal_(
      '<h2>Vincular reembolso</h2>' +
      '<div id="refundlink-summary" style="margin-bottom:4px"></div>' +
      '<div class="muted" style="margin-bottom:12px">Marque a(s) parte(s) que esse valor cobre.</div>' +
      '<div id="refundlink-rows">' + (rowsHtml || '<div class="empty-state">Nenhuma despesa aguardando reembolso no momento.</div>') + '</div>' +
      '<div style="display:flex;gap:8px;margin-top:12px">' +
        '<button type="button" class="secondary" id="refund-cancel" style="flex:1">Cancelar</button>' +
        '<button type="button" id="refund-done" style="flex:1">Vincular</button>' +
      '</div>'
    );
    shares.forEach(function (s) {
      var check = document.querySelector('[data-refundlink-check="' + s.id + '"]');
      var amountInput = document.querySelector('[data-refundlink-amount="' + s.id + '"]');
      var selected = selectedAmountFor_(s.id);
      // setupMoneyInput UMA vez só, com o valor já certo (o já-selecionado, ou a
      // sugestão) — chamar de novo (ex: ao marcar o checkbox) empilharia um SEGUNDO
      // listener de keydown por cima do primeiro (setupMoneyInput usa
      // addEventListener, não substitui), e os dois ficariam brigando pelo mesmo
      // dígito digitado. disabled sozinho já impede interação enquanto desmarcado;
      // marcar só precisa reabilitar o campo.
      setupMoneyInput(amountInput, selected !== null ? selected : Math.min(remainingForShare_(s), getTotalAmount()));
      check.addEventListener('change', function () {
        if (check.checked) {
          // Preenche com o que a receita ainda cobre: o que falta da parte, ou só a
          // diferença (saldo) se a receita não der pra pagar a parte inteira. O saldo aqui
          // ainda NÃO conta esta parte (ela só entra em checkedShares() a partir do change).
          var available = refundLinkSaldoCents_(Math.round(getTotalAmount() * 100), allocatedCentsOfChecked_(s));
          amountInput.setValue(refundLinkFillCents_(Math.round(remainingForShare_(s) * 100), available) / 100);
        }
        amountInput.disabled = !check.checked;
        updateSummary_();
      });
      // Editar o valor à mão também mexe no saldo (evento do setupMoneyInput).
      amountInput.addEventListener('moneychange', updateSummary_);
    });
    updateSummary_();
    document.getElementById('refund-cancel').onclick = closeRefundModal_;
    document.getElementById('refund-done').onclick = function () {
      var confirmBtn = document.getElementById('refund-done');
      var checked = checkedShares();
      if (!checked.length) { errorPopover(confirmBtn, 'Marque ao menos uma parte.'); return; }
      var allocations = checked.map(function (s) {
        var amountInput = document.querySelector('[data-refundlink-amount="' + s.id + '"]');
        return { shareId: s.id, amount: amountInput.getValue() };
      });
      if (allocations.some(function (a) { return !(a.amount > 0); })) {
        errorPopover(confirmBtn, 'O valor alocado precisa ser maior que zero.');
        return;
      }
      // Mesma regra do servidor (allocationsExceedAmount_, Refunds.js): vincular mais que o
      // valor da receita deixava o líquido dela negativo no Extrato.
      var allocatedCents = allocations.reduce(function (sum, a) { return sum + Math.round(a.amount * 100); }, 0);
      if (allocatedCents > Math.round(getTotalAmount() * 100)) {
        errorPopover(confirmBtn, 'A soma (' + fmtMoney(allocatedCents / 100) + ') não pode passar do valor da receita (' + fmtMoney(getTotalAmount()) + '). Se a pessoa pagou menos que o combinado, ajuste o valor devido dela na despesa.');
        return;
      }
      closeRefundModal_();
      onConfirm(allocations);
    };
  }

  /**
   * Aba "Reembolsos" — agrupado por despesa (passivo), filtrável por pessoa. Cada
   * despesa aparece como um card com a própria linha (extratoRowHtml — mesmo clique pra
   * editar, mesmo "*" de líquido de quem já tem parte coberta) seguida das Shares dela,
   * completas ou não (a aba é pra acompanhar os dois estados, não só o que falta pagar).
   *
   * Remover uma pessoa aqui manda a lista de Shares RESTANTES da despesa pra
   * setRefundSharesForPassiveTransaction — a mesma função que os dois popups usam, sem
   * um endpoint separado só pra remover uma (uma única forma de mexer nas Shares de uma
   * despesa, ver Refunds.js).
   */
  /**
   * Quanto cada pessoa ainda deve (soma do que FALTA -- remainingForShare_ -- em todas as
   * Shares dela, de qualquer despesa) e o total geral, pro cabeçalho da aba Reembolsos.
   * Só entra quem deve pelo menos 1 centavo (Share completa não soma nada); ordenado do
   * maior devedor pro menor, empate por nome. Pessoa arquivada com Share em aberto AINDA
   * conta -- arquivar não perdoa a dívida. Independe do filtro de pessoa da aba (é o
   * resumo geral, o filtro só recorta a lista de despesas logo abaixo).
   */
  function computeRefundDebtors_(shares) {
    var byPerson = {};
    shares.forEach(function (s) {
      var remaining = remainingForShare_(s);
      if (Math.round(remaining * 100) < 1) return;
      byPerson[s.personId] = (byPerson[s.personId] || 0) + remaining;
    });
    var ranking = Object.keys(byPerson).map(function (personId) {
      return { personId: personId, name: personName_(personId), amount: Math.round(byPerson[personId] * 100) / 100 };
    }).sort(function (a, b) { return (b.amount - a.amount) || a.name.localeCompare(b.name, 'pt-BR'); });
    var total = ranking.reduce(function (sum, r) { return sum + r.amount; }, 0);
    return { total: Math.round(total * 100) / 100, ranking: ranking };
  }
  /** Shares cuja despesa AINDA existe (não sumiu numa corrida rara com a cascata, nem está
   *  sendo removida agora -- STATE.deletingIds): a Share de uma despesa já apagada não é
   *  mais uma dívida, mesmo que ela demore alguns segundos pra sair de STATE.refundShares. */
  function liveRefundShares_() {
    var liveTxIds = {};
    STATE.allTransactions.forEach(function (t) { if (STATE.deletingIds.indexOf(t.id) === -1) liveTxIds[t.id] = true; });
    return STATE.refundShares.filter(function (s) { return liveTxIds[s.passiveTransactionId]; });
  }
  var REFUNDS_TOP_N_ = 3;
  /** Texto do cabeçalho de Reembolsos, NA MESMA LINHA do título (pedido explícito do
   *  usuário; mesmo padrão dos cabeçalhos de Orçamentos/Lançamentos recorrentes):
   *  "R$ X a receber · Fulano R$ Y · Ciclano R$ Z · ..." -- o total e depois as
   *  REFUNDS_TOP_N_ pessoas com mais a receber (sem rótulo nenhum pro ranking -- a palavra
   *  "devedor" não aparece no app, também por pedido do usuário; a ordem já diz). Cor
   *  NEUTRA nos valores (mesma razão do "a receber de reembolsos" do cabeçalho do
   *  calendário: não é dinheiro já ganho nem gasto ainda, só uma expectativa de
   *  recebimento). line-height:16px explícito: a fonte Utendo não tem o glifo "·", que cai
   *  numa fonte reserva de métrica maior e esticaria a linha (ver forecastsSubtitleHtml em
   *  renderBudgets). */
  function refundsHeaderTextHtml_(debtors) {
    var style = 'font-size:13px;line-height:16px;color:var(--text-muted)';
    if (!debtors.ranking.length) return '<div style="' + style + '">Nada a receber</div>';
    var sep = '<span style="margin:0 6px">·</span>';
    var top = debtors.ranking.slice(0, REFUNDS_TOP_N_).map(function (r) {
      return escapeHtml(r.name) + ' <span style="color:var(--text)">' + escapeHtml(fmtMoneyNoCents_(r.amount)) + '</span>';
    });
    return '<div style="' + style + '"><span style="color:var(--text)">' + escapeHtml(fmtMoneyNoCents_(debtors.total)) + '</span> a receber' +
      sep + top.join(sep) + '</div>';
  }

  function renderRefunds() {
    var root = document.getElementById('view-root');
    var filterId = STATE.refundsFilterPersonId || '';

    var people = STATE.people.filter(function (p) { return !p.archived; });
    // A pessoa filtrada pode ter sido arquivada DEPOIS de já ter Shares — sem isso ela
    // sumiria da lista de opções do dropdown assim que arquivada, e reabrir o filtro não
    // mostraria mais a própria opção selecionada.
    if (filterId && !people.some(function (p) { return p.id === filterId; })) {
      var archivedSelected = STATE.people.find(function (p) { return p.id === filterId; });
      if (archivedSelected) people = people.concat([archivedSelected]);
    }
    people = people.slice().sort(function (a, b) { return a.name.localeCompare(b.name, 'pt-BR'); });
    var filterLabel = filterId ? personName_(filterId) : 'Todas';

    var byTx = {};
    STATE.refundShares.forEach(function (s) {
      if (filterId && s.personId !== filterId) return;
      (byTx[s.passiveTransactionId] = byTx[s.passiveTransactionId] || []).push(s);
    });
    var groups = Object.keys(byTx).map(function (txId) {
      return { tx: STATE.allTransactions.find(function (t) { return t.id === txId; }), shares: byTx[txId] };
    }).filter(function (g) { return !!g.tx; }); // despesa pode ter sumido do STATE numa corrida rara com a cascata — não quebra, só não mostra

    groups.sort(function (a, b) {
      if (a.tx.date !== b.tx.date) return a.tx.date < b.tx.date ? 1 : -1;
      return (b.tx.time || '').localeCompare(a.tx.time || '');
    });

    var groupsHtml = groups.map(function (g) {
      var sharesHtml = g.shares.slice()
        .sort(function (a, b) { return personName_(a.personId).localeCompare(personName_(b.personId), 'pt-BR'); })
        .map(refundTabShareRowHtml_).join('');
      return '<div class="card">' + extratoRowHtml(g.tx) + sharesHtml + '</div>';
    }).join('') || '<div class="card"><div class="empty-state">Nenhuma despesa com reembolso' +
      (filterId ? ' de ' + escapeHtml(filterLabel) : '') + ' ainda.</div></div>';

    root.innerHTML =
      '<div class="card">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">' +
          '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0">' +
            '<h2 style="margin:0">Reembolsos</h2>' + refundsHeaderTextHtml_(computeRefundDebtors_(liveRefundShares_())) +
          '</div>' +
          '<button type="button" class="capsule" id="refunds-person-btn" style="flex-shrink:0">' + escapeHtml(filterLabel) + ' ▾</button>' +
        '</div>' +
      '</div>' +
      groupsHtml;

    var personBtn = document.getElementById('refunds-person-btn');
    personBtn.onclick = function () {
      var options = [{ value: '', label: 'Todas', selected: !filterId }].concat(
        people.map(function (p) { return { value: p.id, label: p.name, selected: p.id === filterId }; })
      );
      openDropdownMenu_(personBtn, options, function (value) {
        STATE.refundsFilterPersonId = value;
        render();
      });
    };

    root.querySelectorAll('.amount-expense[data-tooltip], .amount-income[data-tooltip], .tx-flag-icon[data-tooltip]').forEach(wireTooltipTrigger_);
    root.querySelectorAll('[data-tx]').forEach(function (el) {
      el.onclick = function () {
        var t = STATE.allTransactions.find(function (x) { return x.id === el.dataset.tx; });
        if (t) openTransactionDetailModal(t);
      };
    });
    wireRowRemoveButtons_(root, '[data-refund-tab-remove]', 'Remover essa pessoa deste reembolso?', function (btn) {
      var shareId = btn.dataset.refundTabRemove;
      var share = STATE.refundShares.find(function (s) { return s.id === shareId; });
      if (!share) return;
      var passiveTransactionId = share.passiveTransactionId;
      var idx = STATE.refundShares.indexOf(share);
      STATE.refundShares.splice(idx, 1);
      var removedLinks = STATE.refundLinks.filter(function (l) { return l.shareId === shareId; });
      STATE.refundLinks = STATE.refundLinks.filter(function (l) { return l.shareId !== shareId; });
      render();
      // Manda a lista de Shares RESTANTES (já sem a removida) — o diff do servidor
      // cuida de cascatear os links dela, mesma lógica de setRefundSharesForPassive
      // Transaction usada pelos dois popups (ver Refunds.js).
      var remainingShares = sharesOfPassive_(passiveTransactionId)
        .map(function (s) { return { shareId: s.id, personId: s.personId, expectedAmount: s.expectedAmount }; });
      afterMutation_(run('setRefundSharesForPassiveTransaction', { passiveTransactionId: passiveTransactionId, shares: remainingShares }))
        .catch(function (err) {
          STATE.refundShares.splice(idx, 0, share);
          STATE.refundLinks = STATE.refundLinks.concat(removedLinks);
          render();
          showToast(err.message, true);
        });
    });
  }

  /** Uma linha de Share dentro do card de uma despesa na aba Reembolsos — mesmo "×" de
   *  qualquer outra lista do app (ver rowRemoveButtonHtml_/wireRowRemoveButtons_). */
  function refundTabShareRowHtml_(s) {
    var allocated = allocatedForShare_(s.id);
    var progress = (isShareComplete_(s) ? 'Completo · ' : 'Falta ' + fmtMoney(remainingForShare_(s)) + ' · ') +
      fmtMoney(allocated) + ' de ' + fmtMoney(s.expectedAmount);

      '<span style="padding-left:16px">' + escapeHtml(personName_(s.personId)) +
        '<br><span class="muted" style="font-size:12px">' + progress + '</span></span>' +
      '<span class="row-actions">' + rowRemoveButtonHtml_('data-refund-tab-remove', s.id, 'Remover') + '</span>' +
    '</div>' + refundPaymentRowsHtml_(s);

  /** Os lançamentos de receita (pagamentos) vinculados a uma Share, logo abaixo da linha da
   *  pessoa no card: data, categoria/descrição e o valor ALOCADO a essa Share (não o valor
   *  inteiro da receita, que pode cobrir várias partes). Mais recente primeiro; clicar abre
   *  o lançamento (mesmo [data-tx] do resto do card). */
  function refundPaymentRowsHtml_(s) {
    return linksOfShare_(s.id).map(function (l) {
      return { link: l, tx: STATE.allTransactions.find(function (t) { return t.id === l.activeTransactionId; }) };
    }).filter(function (x) { return !!x.tx; }).sort(function (a, b) {
      if (a.tx.date !== b.tx.date) return a.tx.date < b.tx.date ? 1 : -1;
      return (b.tx.time || '').localeCompare(a.tx.time || '');
    }).map(function (x) {
      var label = x.tx.description ? escapeHtml(x.tx.description) : categoryLabelHtml(x.tx.categoryId);
      return '<div class="row row-clickable" data-tx="' + escapeHtml(x.tx.id) + '">' +
        '<span style="padding-left:32px;font-size:13px">' + escapeHtml(fmtDateShort_(x.tx.date)) + ' · ' + label + '</span>' +
        '<span class="amount-income" style="font-size:13px">+ ' + fmtMoney(x.link.allocatedAmount) + '</span>' +
      '</div>';
    }).join('');

  // ---------- transactions (extrato) ----------
  /**
   * Linha de lançamento no Extrato: horário primeiro (a data já está no card do dia — ver
   * fmtCardDate_/renderTxList), depois categoria/referente a/pago a. A conta vai embaixo
   * do valor, na coluna da direita, em vez de embaixo do texto principal.
   */
  function extratoRowHtml(t) {
    var isTransfer = t.kind === 'transfer_out' || t.kind === 'transfer_in';
    var isExpense = t.kind === 'expense' || t.kind === 'transfer_out';
    var sign = isExpense ? '-' : '+';
    var cls = isExpense ? 'amount-expense' : 'amount-income';
    var mainLabel = '<strong>' + (isTransfer ? 'Transferência' : categoryLabelHtml(t.categoryId)) + '</strong>';
    if (t.description) mainLabel += ' · ' + escapeHtml(t.description);
    if (t.counterparty) mainLabel += ' · ' + escapeHtml(t.counterparty);
    var sub = accountNameHtml(t.accountId); // já vem em HTML (nome colorido/negrito) — números do sufixo não precisam escapar
    if (t.installmentSeq) sub += ' · parcela ' + t.installmentSeq + '/' + t.installmentTotal;
    var rowAttrs = (t.pending && !t.editable) ? ' class="row"' : ' class="row row-clickable" data-tx="' + escapeHtml(t.id) + '"';
    // Horário numa coluna própria (largura fixa, sempre presente mesmo vazio) — assim ele
    // fica centralizado verticalmente na linha toda (via align-items:center do .row) e não
    // desloca quando falta horário ou quando o texto principal quebra em mais de uma linha.
    // Valor original com "*" (líquido de reembolso no tooltip) via netAmountSpanHtml_ — cobre
    // despesa passiva E receita ativa, ver netDisplayAmount_.
    return '<div' + rowAttrs + '>' +
      '<span style="flex:0 0 38px;font-size:13px">' + (t.time ? escapeHtml(t.time) : '') + '</span>' +
      '<span style="flex:1;font-size:13px">' + mainLabel + '</span>' +
      // Marca "Fora das análises" ao lado do VALOR (não do texto, que quebra linha e deixava o
      // ícone sozinho numa linha); nowrap mantém ícone e valor juntos.
      '<span style="text-align:right"><span style="white-space:nowrap">' + txFlagIconHtml_(t) + netAmountSpanHtml_(t, cls, sign) + '</span>' +
        '<br><span class="muted" style="white-space:normal">' + sub + '</span></span>' +
    '</div>';
  }
  /**
   * Cápsulas de categoria do filtro do Extrato — seleção MÚLTIPLA (ao contrário de
   * createCapsuleField, que é sempre uma escolha só), numa lista PLANA: categoria de topo
   * seguida das subcategorias dela, alfabética, com o "+"/"−" de 30 dias quando passa de 4
   * linhas (ver renderCollapsibleCapsules_) — mesma estrutura dos outros campos de
   * categoria. Clicar numa cápsula de topo é em CASCATA (ela + todas as subs dela);
   * clicar numa subcategoria marca só ela. selectedIds é mutado in-place (push/splice),
   * não substituído, pra quem chamou continuar enxergando o estado atual sem precisar de
   * um getValue().
   *
   * options (opcional): { kinds: ['expense','income'], excludeIds: [] }. kinds restringe
   * quais categorias aparecem (Orçamentos usa só ['expense'], já que orçamento não se
   * aplica a receita); excludeIds tira IDs específicos da lista — usado pelo modal de
   * "Novo orçamento" pra não deixar escolher uma categoria/sub que já está noutro
   * orçamento.
   */
  function buildCategoryFilterField_(container, selectedIds, onChange, options) {
    options = options || {};
    var kinds = options.kinds || ['expense', 'income'];
    var excludeIds = options.excludeIds || [];

    var items = [];
    kinds.forEach(function (k) { items = items.concat(rankedCategoryItems(k)); });
    items = items.filter(function (i) { return excludeIds.indexOf(i.value) === -1; });

    // "Todas" (só quando options.allOption): marca todas as categorias/subcategorias de uma
    // vez -- pra filtrar tudo EXCETO algumas (marca Todas, desmarca as que não quer). Não tem
    // estado próprio: fica ativa enquanto TODAS estiverem marcadas, então desmarcar qualquer
    // uma a apaga sozinha; clicar nela com tudo marcado limpa a seleção.
    var allValues = items.map(function (i) { return i.value; });
    function allSelected_() {
      return allValues.length > 0 && allValues.every(function (v) { return selectedIds.indexOf(v) !== -1; });
    }
    if (options.allOption && items.length) {
      items = [{ isAll: true, value: '__all__', label: 'Todas', isSubcategory: false }].concat(items);
    }

    function makeFilterCapsule_(item) {
      var b = document.createElement('button');
      b.type = 'button';
      if (item.isAll) {
        b.className = 'capsule capsule-category' + (allSelected_() ? ' active' : '');
        b.textContent = item.label;
        b.onclick = function () {
          if (allSelected_()) {
            allValues.forEach(function (v) { selectedIds.splice(selectedIds.indexOf(v), 1); });
          } else {
            allValues.forEach(function (v) { if (selectedIds.indexOf(v) === -1) selectedIds.push(v); });
          }
          buildCategoryFilterField_(container, selectedIds, onChange, options);
          onChange();
        };
        return b;
      }
      b.className = 'capsule' + (selectedIds.indexOf(item.value) !== -1 ? ' active' : '') +
        (item.isSubcategory === false ? ' capsule-category' : '');
      b.textContent = item.label;
      if (item.tooltip) {
        b.addEventListener('mouseenter', function () { showTooltip_(b, item.tooltip, { italic: item.tooltipItalic }); });
        b.addEventListener('mouseleave', hideTooltip_);
      }
      b.onclick = function () {
        hideTooltip_(); // a cápsula é refeita no rebuild e não dispararia mouseleave sozinha
        var turningOn = selectedIds.indexOf(item.value) === -1;
        if (turningOn) selectedIds.push(item.value); else selectedIds.splice(selectedIds.indexOf(item.value), 1);
        // Marcar uma categoria de TOPO já liga/desliga todas as subcategorias dela junto —
        // o usuário ainda pode desmarcar uma sub depois pra ver só os lançamentos lançados
        // direto na categoria.
        if (item.isSubcategory === false) {
          STATE.categories.filter(function (c) { return c.parentId === item.value; }).forEach(function (c) {
            if (excludeIds.indexOf(c.id) !== -1) return;
            var has = selectedIds.indexOf(c.id) !== -1;
            if (turningOn && !has) selectedIds.push(c.id);
            if (!turningOn && has) selectedIds.splice(selectedIds.indexOf(c.id), 1);
          });
        }
        buildCategoryFilterField_(container, selectedIds, onChange, options); // refaz pra refletir a cascata
        onChange();
      };
      return b;
    }

    renderCollapsibleCapsules_(container, items, makeFilterCapsule_, function (item) {
      return item.isAll || item.recentlyUsed || selectedIds.indexOf(item.value) !== -1;
    });
  }

    root.innerHTML =
      '<div class="card">' +
        // A área inteira (não só um ícone) abre/fecha — "em toda a horizontal", ver

        // anima uma altura que nem precisa ser medida em JS, e não deixa o conteúdo

        // overflow:hidden logo abaixo).
        '<div id="tx-filters-header" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:8px">' +

            '<h2 style="margin:0;flex-shrink:0">Filtrar lançamentos</h2>' +

        '</div>' +

          '<div style="overflow:hidden;min-height:0">' +
            '<div style="padding-top:12px">' +

              '<div style="position:relative;margin-bottom:12px">' +

              '</div>' +

      '</div>' +
      buildTxCalendarHtml_() +
      '<div id="tx-list"><div class="empty-state">Carregando…</div></div>';

    document.getElementById('tx-filters-header').onclick = function () {
      STATE.txFiltersExpanded = !STATE.txFiltersExpanded;
      document.getElementById('tx-filters-collapse').style.gridTemplateRows = STATE.txFiltersExpanded ? '1fr' : '0fr';
      document.getElementById('tx-filters-chevron').style.transform = 'rotate(' + (STATE.txFiltersExpanded ? '180deg' : '0deg') + ')';
      renderTxFilterChips_(); // só aparecem colapsado -- expandir já mostra o estado nos próprios campos
      if (STATE.txFiltersExpanded) document.getElementById('f-text').focus();
    };
    renderTxFilterChips_();

      STATE.txCalendarExpanded = !STATE.txCalendarExpanded;
      document.getElementById('tx-calendar-collapse').style.gridTemplateRows = STATE.txCalendarExpanded ? '1fr' : '0fr';
      document.getElementById('tx-calendar-chevron').style.transform = 'rotate(' + (STATE.txCalendarExpanded ? '180deg' : '0deg') + ')';
    };
    // 1 vez só aqui (não em renderTxCalendarWeeks_, chamada a cada filtro) -- o

    document.getElementById('f-to').addEventListener('change', applyTxFilters_);

      STATE.txFilters = {};

    };

    if (importDocBtn) importDocBtn.onclick = openDocumentImportModal;
